<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odyssey to Olympus - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #1a0b2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 20px 0;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(255, 215, 0, 0.3), transparent),
                radial-gradient(2px 2px at 60% 70%, rgba(255, 215, 0, 0.2), transparent),
                radial-gradient(1px 1px at 50% 50%, rgba(255, 255, 255, 0.2), transparent);
            background-size: 200px 200px;
            animation: sparkle 60s linear infinite;
        }

        @keyframes sparkle {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50%, -50%); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(20, 10, 40, 0.85);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 60px 50px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 
                        0 0 100px rgba(138, 43, 226, 0.2),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo h1 {
            font-family: 'Cinzel', serif;
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #c9a0dc;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        .tab {
            flex: 1;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 12px;
            color: #c9a0dc;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 15px;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .tab.active {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(138, 43, 226, 0.2));
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .form-container {
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #c9a0dc;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            border: none;
            border-radius: 12px;
            color: #1a0b2e;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background: rgba(220, 38, 38, 0.2);
            border: 2px solid rgba(220, 38, 38, 0.5);
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            animation: shake 0.5s;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }

        .hidden {
            display: none;
        }

        /* Loading state */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .loading button::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 3px solid #1a0b2e;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .mode-description {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>⚡ ODYSSEY ⚡</h1>
            <p>TO OLYMPUS</p>
        </div>

        <div class="tabs">
            <div class="tab active" data-type="teacher">🎓 Teacher</div>
            <div class="tab" data-type="student">📚 Student</div>
        </div>

        <div class="form-container">
            <div id="error-message" class="error hidden"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" placeholder="Enter your password" required style="padding-right: 50px;">
                        <button type="button" id="toggle-password" onclick="togglePasswordVisibility()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255,215,0,0.7); cursor: pointer; font-size: 14px; padding: 5px;">👁️</button>
                    </div>
                </div>

                <div class="form-group hidden" id="name-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name">
                </div>

                <div class="form-group hidden" id="period-group">
                    <label for="class-period">Class Period</label>
                    <select id="class-period" style="width: 100%; padding: 15px 18px; background: #2d1b4e; border: 2px solid rgba(255, 215, 0, 0.4); border-radius: 12px; color: #ffffff; font-size: 15px; font-family: 'Inter', sans-serif; cursor: pointer;">
                        <option value="" style="background: #2d1b4e; color: #ffffff;">Select your class period...</option>
                        <option value="1st" style="background: #2d1b4e; color: #ffffff;">1st Period</option>
                        <option value="2nd" style="background: #2d1b4e; color: #ffffff;">2nd Period</option>
                        <option value="3rd" style="background: #2d1b4e; color: #ffffff;">3rd Period</option>
                        <option value="4th" style="background: #2d1b4e; color: #ffffff;">4th Period</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn">Login</button>

                <p class="mode-description">
                    Don't have an account? <a href="#" id="toggle-mode" style="color: #ffd700; text-decoration: none; font-weight: 600;">Register here</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let isRegisterMode = false;
        let userType = 'teacher'; // 'teacher' or 'student'
        
        // Toggle password visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('toggle-password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                userType = tab.dataset.type;
                
                // For students: check if they've registered before
                if (userType === 'student') {
                    const hasRegistered = localStorage.getItem('studentHasRegistered');
                    if (hasRegistered) {
                        // Returning student - show login
                        setLoginMode();
                    } else {
                        // New student - show register
                        setRegisterMode();
                    }
                } else {
                    // Teacher - default to login
                    setLoginMode();
                }
                
                // Show/hide class period based on user type and mode
                updateClassPeriodVisibility();
            });
        });

        function setRegisterMode() {
            isRegisterMode = true;
            document.getElementById('name-group').classList.remove('hidden');
            document.getElementById('submit-btn').textContent = 'Register';
            document.getElementById('toggle-mode').textContent = 'Already registered? Login instead';
            updateClassPeriodVisibility();
        }

        function setLoginMode() {
            isRegisterMode = false;
            document.getElementById('name-group').classList.add('hidden');
            document.getElementById('period-group').classList.add('hidden');
            document.getElementById('submit-btn').textContent = 'Login';
            document.getElementById('toggle-mode').textContent = 'Register here';
        }

        function updateClassPeriodVisibility() {
            const periodGroup = document.getElementById('period-group');
            if (userType === 'student' && isRegisterMode) {
                periodGroup.classList.remove('hidden');
            } else {
                periodGroup.classList.add('hidden');
            }
        }

        // Toggle between login and register
        document.getElementById('toggle-mode').addEventListener('click', (e) => {
            e.preventDefault();
            if (isRegisterMode) {
                setLoginMode();
            } else {
                setRegisterMode();
            }
            hideError();
        });

        // Form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const classPeriod = document.getElementById('class-period').value;

            // Validate class period for student registration
            if (isRegisterMode && userType === 'student' && !classPeriod) {
                showError('Please select your class period');
                return;
            }
            
            // Validate name for registration
            if (isRegisterMode && !name) {
                showError('Please enter your full name');
                return;
            }

            const container = document.querySelector('.form-container');
            container.classList.add('loading');

            try {
                const endpoint = isRegisterMode 
                    ? `${API_URL}/auth/${userType}/register` 
                    : `${API_URL}/auth/${userType}/login`;

                const body = isRegisterMode 
                    ? { name, email, password, class_period: classPeriod }
                    : { email, password };

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Authentication failed');
                }

                // Store token and user info
                localStorage.setItem('token', data.token);
                localStorage.setItem('userType', userType);
                localStorage.setItem('user', JSON.stringify(data[userType]));

                // Mark that this student has registered (for future visits)
                if (userType === 'student') {
                    localStorage.setItem('studentHasRegistered', 'true');
                }

                // Redirect to appropriate dashboard
                window.location.href = userType === 'teacher' ? '/teacher.html' : '/student.html';

            } catch (err) {
                showError(err.message);
                container.classList.remove('loading');
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function hideError() {
            const errorDiv = document.getElementById('error-message');
            errorDiv.classList.add('hidden');
        }

        // Check if already logged in
        if (localStorage.getItem('token')) {
            const userType = localStorage.getItem('userType');
            window.location.href = userType === 'teacher' ? '/teacher.html' : '/student.html';
        }
    </script>
</body>
</html>
