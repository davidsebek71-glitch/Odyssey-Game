function buildDFGrid() {
  const grid = document.getElementById('df-grid');
  if (!grid) return;
  grid.innerHTML = '';

  for (let i = 0; i < DF.total; i++) {
    const cell = document.createElement('div');
    const step = DF.order[i] + 1;  // 1-based step for this cell
    const isSown     = DF.sown.has(i);
    const isSkeleton = DF.skeletons.has(i);
    const isHint     = i === DF.hintFlashCell && DF.hintFlashTimer > 0;
    const isNextCell = DF.order[i] === DF.nextStep - 1; // this is the next correct cell
    const isNoviceHint = DF.loreScore < 6 && isNextCell && !isSown && !isSkeleton;

    cell.style.cssText = [
      'height:' + (DF.size <= 3 ? 90 : DF.size <= 4 ? 75 : 60) + 'px',
      'border-radius:4px',
      'display:flex',
      'align-items:center',
      'justify-content:center',
      'font-size:' + (DF.size <= 3 ? 24 : 20) + 'px',
      'transition:all .12s',
      'border:2px solid',
      'cursor:' + (isSown || isSkeleton ? 'default' : 'pointer'),
      'position:relative',
      isSown     ? 'background:#1a3a1a;border-color:#40c060;'
        : isSkeleton ? 'background:#2a0a0a;border-color:#e04040;'
        : isHint     ? 'background:rgba(128,64,192,.35);border-color:#c084fc;box-shadow:0 0 12px rgba(128,64,192,.5);'
        : isNoviceHint ? 'background:rgba(240,192,64,.12);border-color:rgba(240,192,64,.5);'
        : isNextCell   ? 'background:rgba(240,192,64,.07);border-color:rgba(240,192,64,.25);'
        : 'background:var(--bg2);border-color:var(--bg3);'
    ].join(';');

    // Content — ALL cells show their step number (the challenge is clicking in order,
    // not guessing blind). Eternal gets bright reveal; Novice highlights the next cell;
    // everyone else sees all numbers equally and must find/click them 1→N in sequence.
    if (isSown) {
      cell.innerHTML = '&#127807;';   // sown tooth (plant emoji)
    } else if (isSkeleton) {
      cell.innerHTML = '&#9760;';     // skull
    } else if (isHint) {
      cell.innerHTML = '<span style="color:#c084fc;font-family:var(--px);font-size:11px;font-weight:700;">NEXT</span>';
    } else {
      // Show step number — color varies by tier/state
      const numColor = DF.revealed
        ? 'var(--gold)'                          // Eternal: bright gold
        : isNoviceHint
        ? 'var(--gold)'                          // Novice: next step gold
        : isNextCell
        ? 'rgba(240,192,64,.55)'                 // standard: next cell slightly brighter
        : 'rgba(160,144,128,.55)';               // standard: other cells dimmer
      const numSize = DF.size <= 3 ? 20 : DF.size <= 4 ? 16 : 13;
      cell.innerHTML = '<span style="font-family:var(--px);font-size:' + numSize + 'px;' +
        'font-weight:700;color:' + numColor + ';">' + step + '</span>';
    }

    if (!isSown && !isSkeleton) {
      cell.addEventListener('click', () => onDFClick(i));
      cell.addEventListener('mouseenter', () => {
        if (!DF.sown.has(i) && !DF.skeletons.has(i)) cell.style.background = 'var(--bg3)';
      });
      cell.addEventListener('mouseleave', () => {
        if (!DF.sown.has(i) && !DF.skeletons.has(i)) cell.style.background = 'var(--bg2)';
      });
    }
    grid.appendChild(cell);
  }
  syncDFHUD();
}

function onDFClick(cellIdx) {
  if (!DF || DF.done) return;
  if (DF.sown.has(cellIdx) || DF.skeletons.has(cellIdx)) return;

  const expectedStep = DF.nextStep - 1; // 0-based index into order array
  const isCorrect    = DF.order[cellIdx] === expectedStep;

  if (isCorrect) {
    DF.sown.add(cellIdx);
    DF.nextStep++;
    DF.hintFlashCell = -1;
    buildDFGrid();
    if (DF.sown.size === DF.total) dfSuccess();
  } else {
    // Wrong — Seeker gets one free
    if (isAv('seeker') && !DF.seekerFreeUsed) {
      DF.seekerFreeUsed = true;
      dfFlashCell(cellIdx, 'orange');
      return;
    }
    DF.mistakes++;
    DF.skeletons.add(cellIdx);
    dfFlashCell(cellIdx, 'red');
    buildDFGrid();
    // If skeletons fill too many cells, reset
    if (DF.skeletons.size >= Math.floor(DF.total * 0.4)) dfSkeletonOverrun();
  }
}

function dfFlashCell(idx, color) {
  const grid = document.getElementById('df-grid');
  if (!grid) return;
  const cell = grid.children[idx];
  if (!cell) return;
  const orig = cell.style.background;
  cell.style.background = color === 'red' ? 'rgba(224,64,64,.5)' : 'rgba(249,115,22,.5)';
  setTimeout(() => { if (cell) cell.style.background = orig; }, 400);
}

function syncDFHUD() {
  const stepEl  = document.getElementById('df-step');
  const skelEl  = document.getElementById('df-skel-count');
  if (stepEl) stepEl.textContent = DF.nextStep;
  if (skelEl) skelEl.textContent = DF.skeletons.size;
}

// ── Medea hint (spec: another –1 Honor, running total tracked) ──
function dfMedeaHint() {
  if (!DF || DF.done) return;
  if (G.honor <= 0) return;

  G.honor = Math.max(0, G.honor - 1);
  G.medeaHelpCount++;
  DF.medeaHintUsed = true;
  recordChoice('medea_dragons_field', 'hint_used');
  updateHeader();

  // Find the next correct cell and flash it
  const targetStep = DF.nextStep - 1;
  const targetCell = DF.order.indexOf(targetStep);
  DF.hintFlashCell  = targetCell;
  DF.hintFlashTimer = 3; // show for 3 seconds
  buildDFGrid();

  // Disable medea button after use until next step
  const btn = document.getElementById('df-medea-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Medea showed you...'; }

  // Clear flash after 3s
  setTimeout(() => {
    if (DF) { DF.hintFlashCell = -1; DF.hintFlashTimer = 0; buildDFGrid(); }
    const b = document.getElementById('df-medea-btn');
    if (b) { b.disabled = false; b.innerHTML = '&#128065; Ask Medea (&ndash;1 Honor)'; }
  }, 3000);
}

// ── Timer: skeleton activation countdown ──────────────────────
function startDFTimer() {
  if (DF.tickInterval) clearInterval(DF.tickInterval);
  DF.tickInterval = setInterval(() => {
    if (!DF || DF.done) { clearInterval(DF.tickInterval); return; }

    if (!DF.skeletonActivated) {
      DF.skeletonTimer--;
      const timerEl = document.getElementById('df-skel-timer');
      if (timerEl) {
        timerEl.textContent = DF.skeletonTimer;
        timerEl.style.color = DF.skeletonTimer <= 5 ? 'var(--red)' : '#f97316';
      }
      if (DF.skeletonTimer <= 0) {
        DF.skeletonActivated = true;
        const wrap = document.getElementById('df-skel-wrap');
        if (wrap) { wrap.style.color = 'var(--red)'; wrap.innerHTML = '&#9760; <strong>SKELETONS ACTIVE</strong>'; }
        dfActivateSkeletons();
      }
    }
  }, 1000);
}

function stopDFTimer() {
  if (DF && DF.tickInterval) { clearInterval(DF.tickInterval); DF.tickInterval = null; }
}

function dfActivateSkeletons() {
  // Skeletons spread to one adjacent empty cell every 4 seconds
  if (DF.skeletonInterval) clearInterval(DF.skeletonInterval);
  DF.skeletonInterval = setInterval(() => {
    if (!DF || DF.done) { clearInterval(DF.skeletonInterval); return; }
    if (DF.skeletons.size === 0) return;

    // Each skeleton tries to spread to one adjacent cell
    const newSkeletons = new Set();
    DF.skeletons.forEach(idx => {
      const r = Math.floor(idx / DF.size);
      const c = idx % DF.size;
      const neighbors = [
        [r-1,c],[r+1,c],[r,c-1],[r,c+1]
      ].filter(([nr,nc]) => nr>=0 && nr<DF.size && nc>=0 && nc<DF.size)
       .map(([nr,nc]) => nr*DF.size+nc)
       .filter(ni => !DF.sown.has(ni) && !DF.skeletons.has(ni));
      if (neighbors.length > 0) {
        newSkeletons.add(neighbors[Math.floor(Math.random() * neighbors.length)]);
      }
    });
    newSkeletons.forEach(i => DF.skeletons.add(i));
    buildDFGrid();

    // If skeletons overrun the field
    const available = DF.total - DF.sown.size - DF.skeletons.size;
    if (available <= 0) dfSkeletonOverrun();
  }, 4000);

  if (DF) DF._skeletonInterval = DF.skeletonInterval;
}

// ── Outcomes ─────────────────────────────────────────────────
function dfSuccess() {
  DF.done = true;
  stopDFTimer();
  if (DF.skeletonInterval) clearInterval(DF.skeletonInterval);
  if (DF._skeletonInterval) clearInterval(DF._skeletonInterval);

  G.choices.dragons_field = DF.medeaHintUsed ? 'success_medea' : 'success_solo';
  recordChoice('dragons_field', G.choices.dragons_field);
  saveCheckpoint('DRAGONS_FIELD');
  renderDFOutcome(G.choices.dragons_field);
}

function dfSkeletonOverrun() {
  DF.done = true;
  stopDFTimer();
  if (DF.skeletonInterval) clearInterval(DF.skeletonInterval);
  if (DF._skeletonInterval) clearInterval(DF._skeletonInterval);

  // Spec: no checkpoint rollback — skill puzzle. Lose provisions, retry.
  G.provisions = Math.max(0, G.provisions - 8);
  updateHeader();

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#128013; Dragon\'s Field &mdash; Overrun</div>',
    '<div class="wp-title">The Skeletons Rose</div></div>',
    '<div class="outcome oc-danger">',

      '<div class="eff-row">' + pip('&ndash;8 Provisions','neg') + pip('Puzzle resets','neu') + '</div>',
    '</div>',
    '<div style="text-align:center;"><button class="btn-go" onclick="startDragonsField()">Try Again &#9654;</button></div>',
  ].join(''));
}

// THE GOLDEN FLEECE — The Sleepless Dragon (spec section 5.2)
// Rhythm/sequence mini-game: match the beat pattern before dragon wakes.
// Orpheus companion = 4-beat sequence. Without = 7-beat solo.
// Devoted + Orpheus = auto-success on first try.
// Failure = provision loss + retry. Fleece obtained on success regardless.
// ============================================================

let GF = null;  // Golden Fleece game state

const GF_NOTES = ['🥁','🎵','🎶','⚡'];  // visual beat symbols
const GF_KEYS  = ['j','k','l',';'];        // keyboard shortcuts

function gfHasOrpheus() { return G.companions.includes('orpheus'); }

function gfSequenceLength() { return gfHasOrpheus() ? 4 : 7; }

function gfGenerateSequence(len) {
  return Array.from({length: len}, () => Math.floor(Math.random() * 4));
}

function initGF() {
  const len = gfSequenceLength();
  const seq = gfGenerateSequence(len);
  return {
    sequence:    seq,       // pattern to match [0-3] indices
    playerInput: [],        // what player has entered so far
    phase:       'show',    // show | input | result | retry
    showStep:    0,         // which step of sequence is being shown
    showTimer:   null,
    dragonWake:  100,       // dragon wakefulness 0-100; hitting 100 = failure
    dragonTimer: null,
    attempts:    0,
    done:        false,
    hasOrpheus:  gfHasOrpheus(),
    seqLen:      len,
    autoWin:     isAv('devoted') && gfHasOrpheus() // Devoted + Orpheus = auto-success
  };
}

// ── Entry point ──────────────────────────────────────────────
function renderGoldenFleece() {
  if (G.choices.golden_fleece) { renderGFOutcome(G.choices.golden_fleece); return; }

  if (hasOrph)
    notices.push('<div class="banner b-craft">&#127925; <strong>Orpheus is with you:</strong> His lyre lulls the dragon. Match a 4-beat sequence &mdash; shorter and easier.</div>');
  else
    notices.push('<div class="banner b-hera">&#9888; <strong>No musician:</strong> Without Orpheus you must solve a 7-beat sequence alone. Harder, but possible.</div>');

    notices.push('<div class="banner b-avatar">&#127925; <strong>The Devoted + Orpheus:</strong> Your unwavering loyalty means Orpheus performs the full lullaby perfectly. The dragon will sleep.</div>');

    '<div class="wp-sub">The Sleepless Dragon &mdash; It Has Not Rested in a Thousand Years</div></div>',
    notices.join(''),
    '<div class="narr">',
      '<p>The oak tree stands at the center of the grove, its branches black with shadow. The <em>Golden Fleece</em> hangs from the highest bough, catching moonlight like a second sun. Around the trunk, coiled in endless loops, the Serpent of Ares watches you with eyes that never close.</p>',

        'style="width:64px;height:64px;font-size:28px;border-color:var(--gold3);border-radius:6px;" ' +
        'onclick="gfPlayerPress(' + i + ')">' + note + '</button>'
      ).join(''),
    '</div>',

    // Progress dots
    '<div id="gf-progress" style="display:flex;justify-content:center;gap:8px;margin-bottom:12px;">',
      Array.from({length: len}, (_, i) =>
        '<div id="gf-dot-' + i + '" style="width:14px;height:14px;border-radius:50%;' +
        'background:var(--bg3);border:2px solid var(--bg3);transition:all .2s;"></div>'
      ).join(''),
    '</div>',

    '<div id="gf-status" style="font-family:var(--px);font-size:13px;color:var(--teal);text-align:center;min-height:24px;letter-spacing:2px;"></div>',
    '<div style="font-family:var(--px);font-size:11px;color:var(--text2);text-align:center;margin-top:8px;">',
      'Keyboard: J K L ; &nbsp;&middot;&nbsp; Watch the pattern, then repeat it',
    '</div>',
  ].join(''));

  // Keyboard listener
  GF._keyHandler = e => {
    const idx = GF_KEYS.indexOf(e.key.toLowerCase());
    if (idx !== -1 && GF.phase === 'input') { e.preventDefault(); gfPlayerPress(idx); }
  };
  document.addEventListener('keydown', GF._keyHandler);

  // Start dragon wakefulness ticker
  startDragonTicker();

  // Show the pattern after a brief pause
  setTimeout(() => showGFPattern(), 600);
}

// ── Show sequence to player ──────────────────────────────────
function showGFPattern() {
  if (!GF) return;
  GF.phase    = 'show';
  GF.showStep = 0;
  setGFStatus('Watch the pattern...');
  disableGFButtons(true);
  showNextGFBeat();
}

function showNextGFBeat() {
  if (!GF || GF.showStep >= GF.seqLen) {
    // Pattern complete — player's turn
    setTimeout(() => {
      if (!GF) return;
      GF.phase = 'input';
      GF.playerInput = [];
      setGFStatus('Your turn — repeat the pattern');
      disableGFButtons(false);
      // Reset seq display to ?
      for (let i = 0; i < GF.seqLen; i++) {
        const cell = document.getElementById('gf-seq-' + i);
        if (cell) { cell.textContent = '?'; cell.style.background = 'var(--bg2)'; cell.style.borderColor = 'var(--bg3)'; }
      }
    }, 400);
    return;
  }

  const beatIdx = GF.sequence[GF.showStep];
  const cell    = document.getElementById('gf-seq-' + GF.showStep);
  if (cell) {
    cell.textContent  = GF_NOTES[beatIdx];
    cell.style.background    = 'rgba(240,192,64,.2)';
    cell.style.borderColor   = 'var(--gold)';
    cell.style.boxShadow     = '0 0 10px rgba(240,192,64,.4)';
  }

  // Flash the button too
  flashGFButton(beatIdx);

  GF.showStep++;
  GF.showTimer = setTimeout(() => {
    if (cell) { cell.style.background = 'var(--bg2)'; cell.style.borderColor = 'var(--bg3)'; cell.style.boxShadow = 'none'; }
    GF.showTimer = setTimeout(showNextGFBeat, 200);
  }, 500);
}

function flashGFButton(idx) {
  const btn = document.getElementById('gf-btn-' + idx);
  if (!btn) return;
  btn.style.background    = 'rgba(240,192,64,.3)';
  btn.style.borderColor   = 'var(--gold)';
  btn.style.transform     = 'scale(1.15)';
  setTimeout(() => {
    btn.style.background  = '';
    btn.style.borderColor = 'var(--gold3)';
    btn.style.transform   = '';
  }, 400);
}

// ── Player input ─────────────────────────────────────────────
window.gfPlayerPress = function(idx) {
  if (!GF || GF.phase !== 'input' || GF.done) return;

  flashGFButton(idx);
  const pos      = GF.playerInput.length;
  const expected = GF.sequence[pos];

  // Update progress dot
  const dot = document.getElementById('gf-dot-' + pos);

  if (idx === expected) {
    GF.playerInput.push(idx);
    if (dot) { dot.style.background = 'var(--green)'; dot.style.borderColor = 'var(--green)'; }

    // Update sequence display with correct symbol
    const cell = document.getElementById('gf-seq-' + pos);
    if (cell) {
      cell.textContent = GF_NOTES[idx];
      cell.style.background  = 'rgba(64,192,96,.15)';
      cell.style.borderColor = 'var(--green)';
    }

    if (GF.playerInput.length === GF.seqLen) {
      // Success!
      gfSuccess();
    }
  } else {
    // Wrong beat — dragon stirs
    if (dot) { dot.style.background = 'var(--red)'; dot.style.borderColor = 'var(--red)'; }
    GF.dragonWake = Math.min(100, GF.dragonWake + (GF.hasOrpheus ? 30 : 20));
    updateWakeBar();
    setGFStatus('Wrong beat! The dragon stirs...');

    if (GF.dragonWake >= 100) {
      gfFailure();
    } else {
      // Reset input, replay pattern
      GF.phase = 'show';
      disableGFButtons(true);
      setTimeout(() => {
        setGFStatus('The dragon settles... watch again');
        // Reset dots and seq display
        for (let i = 0; i < GF.seqLen; i++) {
          const d = document.getElementById('gf-dot-' + i);
          const c = document.getElementById('gf-seq-' + i);
          if (d) { d.style.background = 'var(--bg3)'; d.style.borderColor = 'var(--bg3)'; }
          if (c) { c.textContent = '?'; c.style.background = 'var(--bg2)'; c.style.borderColor = 'var(--bg3)'; }
        }
        GF.playerInput = [];
        setTimeout(showGFPattern, 800);
      }, 1000);
    }
  }
};

// ── Dragon wakefulness ticker ─────────────────────────────────
function startDragonTicker() {
  if (GF.dragonTimer) clearInterval(GF.dragonTimer);
  // Dragon slowly wakes on its own — penalty for taking too long
  // Ticks every 8s, adds 8% wakefulness
  GF.dragonTimer = setInterval(() => {
    if (!GF || GF.done) { clearInterval(GF.dragonTimer); return; }
    if (GF.phase === 'show') return; // don't tick during pattern display
    GF.dragonWake = Math.min(100, GF.dragonWake + 8);
    updateWakeBar();
    if (GF.dragonWake >= 100) gfFailure();
  }, 8000);
}

function stopDragonTicker() {
  if (GF && GF.dragonTimer) { clearInterval(GF.dragonTimer); GF.dragonTimer = null; }
}

function updateWakeBar() {
  const bar = document.getElementById('gf-wake-bar');
  const pct = document.getElementById('gf-wake-pct');
  if (bar) bar.style.width = GF.dragonWake + '%';
  if (pct) pct.textContent = GF.dragonWake + '%';
}

// ── Helpers ───────────────────────────────────────────────────
function setGFStatus(msg) {
  const s = document.getElementById('gf-status');
  if (s) s.textContent = msg;
}

function disableGFButtons(disabled) {
  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById('gf-btn-' + i);
    if (btn) btn.disabled = disabled;
  }
}

function cleanupGF() {
  stopDragonTicker();
  if (GF && GF.showTimer) clearTimeout(GF.showTimer);
  if (GF && GF._keyHandler) document.removeEventListener('keydown', GF._keyHandler);
}

// ── Outcomes ─────────────────────────────────────────────────
function gfSuccess() {
  GF.done = true;
  cleanupGF();

  G.choices.golden_fleece = GF.hasOrpheus ? 'success_orpheus' : 'success_solo';
  recordChoice('golden_fleece', G.choices.golden_fleece);
  saveCheckpoint('GOLDEN_FLEECE');

  // Brief triumph flash
  setGFStatus('&#127942; THE DRAGON SLEEPS &#127942;');
  disableGFButtons(true);
  setTimeout(() => renderGFOutcome(G.choices.golden_fleece), 1500);
}

function gfFailure() {
  if (GF.done) return;
  GF.done = true;
  cleanupGF();

  // Spec: provision loss + forced retry. Fleece obtained on success regardless.
  G.provisions = Math.max(0, G.provisions - 6);
  updateHeader();

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#127942; The Sleepless Dragon &mdash; Setback</div>',
    '<div class="wp-title">The Dragon Woke</div></div>',
    '<div class="outcome oc-danger">',
      '<div class="oc-title">The Serpent\'s Eyes Opened</div>',
      '<div class="oc-body">The dragon\'s eyes snapped open &mdash; vast, golden, furious. You ran. It did not chase you &mdash; it never leaves the tree &mdash; but the lullaby is broken and you must start again. The pattern has not changed. You know it better now than before.</div>',
      '<div class="eff-row">' + pip('&ndash;6 Provisions','neg') + pip('Retry &mdash; pattern unchanged','neu') + '</div>',
    '</div>',
    '<div style="text-align:center;"><button class="btn-go" onclick="retryGoldenFleece()">Try Again &#9654;</button></div>',
  ].join(''));
}

function retryGoldenFleece() {
  GF = initGF();
  // Keep autoWin false on retry — Devoted already used their bonus
  GF.autoWin = false;
  renderGFGame();
}

function renderGFOutcome(choice) {
  const usedOrpheus = choice && choice.includes('orpheus');
  const isDevoted   = choice && choice.includes('devoted');

  const effs = [];
  if (isDevoted)     effs.push(pip('Orpheus performed perfectly','pos'), pip('The Devoted\'s loyalty rewarded','pos'));
  else if (usedOrpheus) effs.push(pip('Orpheus guided the lullaby','pos'));
  else               effs.push(pip('Solved alone &mdash; no musician','pos'), pip('Honor intact','pos'));
  effs.push(pip('&#127942; Golden Fleece obtained','pos'));

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#127942; The Fleece &mdash; Obtained</div>',
    '<div class="wp-title">The Dragon Sleeps</div></div>',
    '<div class="outcome oc-success">',
      '<div class="oc-title">The Golden Fleece Is Yours</div>',
      '<div class="oc-body">' + (isDevoted
        ? 'Orpheus played a lullaby that seemed to come from the beginning of the world. The serpent\'s great head sank. Its eyes closed, slowly, like a sunset. You walked to the tree in the silence that followed and lifted the Fleece from the branch. It was warm.'
        : usedOrpheus
        ? 'The lullaby rose and fell in careful sequence. Orpheus played each note as if his life depended on it &mdash; because yours did. The dragon\'s eyes closed. The grove went utterly still. You lifted the Fleece from the branch. It was heavier than you expected. And warmer.'
        : 'You have no lyre. No musician. Just the pattern you studied in the serpent\'s breathing, and the sounds you could make with what you had. Note by note, imperfect but true, the dragon\'s eyes grew heavy. Then still. The Fleece came free in your hands.') +
      '</div>',
      '<div class="eff-row">' + effs.join('') + '</div>',
    '</div>',
    '<div class="narr">',
      '<p>The Fleece hangs from your shoulders like captured sunlight. The Argo is anchored in the river. The crew is ready. There is only one thing left between you and the voyage home.</p>',
      '<p><em>Medea is waiting at the river\'s edge.</em> She has a boat. She knows the river passages Aeetes does not. She is looking at you with an expression you cannot quite read.</p>',
      '<p><i>She has already decided something. She is waiting to see if you have too.</i></p>',
    '</div>',
    '<div style="text-align:center;">',
      '<button class="btn-go" onclick="advanceTo(\'BETRAYAL_FORK\')" style="background:linear-gradient(135deg,#5a1a1a,#8b0000);border-color:#e04040;color:#fca5a5;letter-spacing:4px;">',
        '&#9876; Face the Betrayal Fork',
      '</button>',
    '</div>',
  ].join(''));
  updateHeader();
}


// ============================================================
// THE BETRAYAL FORK — Medea (spec section 5.2)
// Major permanent moral decision. No retry. First-run locked after this.
// Cunning 12+ reveals a third path that is INVISIBLE below threshold.
// Written justification required (50-word min) — stored for Zeus test.
// ============================================================

function renderBetrayalFork() {
  // Already chose — show the outcome (locked, no re-entry)
  if (G.choices.betrayal_fork) {
    renderBetrayalOutcome(G.choices.betrayal_fork);
    return;
  }

  const c = cun();
  const canNegotiate = c >= 12;
  const medeaDebtNote = G.medeaHelpCount > 0
    ? '<div class="banner b-hera">&#9888; You have accepted Medea\'s help ' + G.medeaHelpCount +
      ' time' + (G.medeaHelpCount > 1 ? 's' : '') +
      ' across these trials. She has been keeping count too.</div>'
    : '';

  // Build choices — Negotiate is INVISIBLE below Cunning 12 (spec: "literally invisible")
  const choices = [];

  choices.push(
    '<div class="c-btn" style="border-color:#8b0000;" onclick="showBetrayalJustification(\'accept\')">' +
      '<div class="c-tag" style="background:rgba(139,0,0,.3);color:#fca5a5;border:1px solid #8b0000;">&ndash;3 HONOR</div>' +
      '<div class="c-title" style="color:#fca5a5;">Accept</div>' +
      '<div class="c-desc">Guaranteed safe return. Medea ensures your escape &mdash; and does something terrible to make it certain. You receive a gift from her. Hera will be hostile when you reach home.</div>' +
    '</div>'
  );

  choices.push(
    '<div class="c-btn" onclick="showBetrayalJustification(\'refuse\')">' +
      '<div class="c-tag tag-honor">HONOR INTACT</div>' +
      '<div class="c-title">Refuse</div>' +
      '<div class="c-desc">Honor intact. The return will be harder &mdash; you lose one crew member on the voyage home. Hera remains neutral. Your refusal will be remembered at the Tribunal as a mark of character.</div>' +
    '</div>'
  );

  // Cunning 12+ ONLY — literally invisible otherwise (spec)
  if (canNegotiate) {
    choices.push(
      '<div class="c-btn hidden" onclick="showBetrayalJustification(\'negotiate\')">' +
        '<div class="c-tag tag-hid">CUNNING ' + c + '</div>' +
        '<div class="c-title">Negotiate a Different Path</div>' +
        '<div class="c-desc">You see what others cannot &mdash; a way for Medea to help without the terrible act. No Honor lost. Hera is impressed. This path exists only because you did the work to find it.</div>' +
      '</div>'
    );
  }

  // Full-page dark atmosphere (spec: "UI should pause, prompt should linger")
  render([
    // Override the normal background for this screen — inject a style
    '<style>',
      '#screen-game { background: radial-gradient(ellipse at center, #1a0a0a 0%, #08080f 70%); }',
      '.bf-pulse { animation: bfpulse 3s ease-in-out infinite; }',
      '@keyframes bfpulse { 0%,100%{opacity:.7} 50%{opacity:1} }',
    '</style>',

    '<div class="wp-hdr">',
      '<div class="wp-loc" style="color:#e04040;letter-spacing:6px;">&#9876; The Betrayal Fork</div>',
      '<div class="wp-title" style="color:#fca5a5;text-shadow:0 0 30px rgba(224,64,64,.5);">Medea</div>',
      '<div class="wp-sub" style="color:rgba(252,165,165,.5);">This choice cannot be undone</div>',
    '</div>',

    medeaDebtNote,

    // The prompt — slow, atmospheric, weighty
    '<div class="narr" style="border-color:#8b0000;background:linear-gradient(160deg,#1a0808,#0f0505);">',
      '<p>She is waiting at the river\'s edge with a small boat and no explanation for why she is here at this hour, in the dark, with her father\'s soldiers certainly coming.</p>',
      '<p>She looks at you and says it plainly. No theater. No pleading.</p>',
      '<p style="font-size:19px;font-weight:700;color:#fca5a5;line-height:2.2;text-align:center;padding:8px 0;">',
        '&ldquo;I love you. I will come with you. I will ensure your escape &mdash;<br>',
        'and I will do something <em style="color:#e04040;">terrible</em> to guarantee it.<br>',
        'Do you accept?&rdquo;',
      '</p>',
      '<p>Behind her, torchlight is moving through the trees. Aeetes has found out. You have perhaps three minutes.</p>',
      '<p><i>The Fleece is in your hands. Everything you came for is already won. This is the price of the exit.</i></p>',
    '</div>',

    // Hera meter — show current disposition as context
    '<div style="background:var(--bg2);border:1px solid #8b0000;border-radius:4px;padding:12px 18px;',
         'font-family:var(--px);font-size:12px;display:flex;justify-content:space-between;width:100%;">',
      '<span style="color:var(--text2);">Current Honor: <strong style="color:' +
        (G.honor >= 10 ? 'var(--green)' : G.honor >= 5 ? 'var(--gold)' : 'var(--red)') +
        ';">' + G.honor + '</strong></span>',
      '<span style="color:var(--text2);">Hera: <strong>' + heraInfo().label + '</strong></span>',
      '<span style="color:var(--text2);">Medea help: <strong style="color:' +

    '</div>',

    '<div class="choice-panel">',
      '<div class="choice-prompt" style="color:#fca5a5;letter-spacing:4px;">Choose. You have three minutes.</div>',
      '<div class="choice-grid">' + choices.join('') + '</div>',

  ].join(''));
}

// ── Justification screen ─────────────────────────────────────
// Spec (session handoff): 50-word minimum, stored in heroic_choices.text_response
// Zeus reads it at the Tribunal.
function showBetrayalJustification(choice) {
  const labels = {
    accept:    { title:'You Accept',    sub:'Justify this to Zeus.',    color:'#fca5a5' },
    refuse:    { title:'You Refuse',    sub:'Justify this to Zeus.',    color:'var(--green)' },
    negotiate: { title:'You Negotiate', sub:'Justify this to Zeus.',    color:'#c084fc' }
  };
  const lbl = labels[choice];

  render([
    '<style>#screen-game { background: radial-gradient(ellipse at center, #1a0a0a 0%, #08080f 70%); }</style>',
    '<div class="wp-hdr">',
      '<div class="wp-loc" style="color:#e04040;">&#9878; Zeus Is Watching</div>',
      '<div class="wp-title" style="color:' + lbl.color + ';">' + lbl.title + '</div>',
      '<div class="wp-sub">This justification will be read aloud at your Tribunal</div>',
    '</div>',

    '<div class="narr" style="border-color:#8b0000;background:linear-gradient(160deg,#1a0808,#0f0505);">',
      '<p>Zeus sees everything. He does not judge you for what you chose &mdash; he judges you for whether you understood why you chose it.</p>',
      '<p><em>In your own words: why did you make this choice?</em> What did it cost you? What did it protect? This answer will be read at your Tribunal. Write it as if a god will read it. Because one will.</p>',
    '</div>',

    '<div style="width:100%;">',
      '<textarea id="bf-justification" placeholder="Write at least 50 words explaining your choice. Why did you choose this path? What matters to you more — the mission, your honor, the crew, Medea herself? What kind of leader are you?" ',
        'style="width:100%;min-height:160px;background:var(--bg2);border:2px solid #8b0000;border-radius:4px;',
        'color:var(--text1);font-family:\'Cinzel\',serif;font-size:15px;line-height:1.8;padding:16px;resize:vertical;',
        'outline:none;" oninput="updateBFWordCount()"></textarea>',
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;',
           'font-family:var(--px);font-size:12px;">',
        '<span id="bf-wordcount" style="color:var(--text2);">0 words</span>',
        '<span style="color:rgba(252,165,165,.5);">Minimum: 50 words</span>',
      '</div>',
    '</div>',

    '<div style="display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;">',
      '<button id="bf-confirm-btn" class="btn-go" disabled onclick="confirmBetrayalChoice(\'' + choice + '\')" ',
        'style="background:linear-gradient(135deg,#5a1a1a,#8b0000);border-color:#e04040;color:#fca5a5;">',
        'Seal This Choice &mdash; No Going Back',
      '</button>',
      '<button class="btn-back" onclick="renderBetrayalFork()">&#8592; Reconsider</button>',
    '</div>',
  ].join(''));
}

window.updateBFWordCount = function() {
  const ta  = document.getElementById('bf-justification');
  const wc  = document.getElementById('bf-wordcount');
  const btn = document.getElementById('bf-confirm-btn');
  if (!ta || !wc || !btn) return;
  const words = ta.value.trim().split(/\s+/).filter(w => w.length > 0).length;
  wc.textContent = words + ' word' + (words !== 1 ? 's' : '');
  wc.style.color  = words >= 50 ? 'var(--green)' : 'var(--red)';
  btn.disabled    = words < 50;
};

function confirmBetrayalChoice(choice) {
  const ta   = document.getElementById('bf-justification');
  const text = ta ? ta.value.trim() : '';
  const words = text.split(/\s+/).filter(w => w.length > 0).length;
  if (words < 50) return;

  // Apply consequences immediately
  if (choice === 'accept') {
    G.honor = Math.max(0, G.honor - 3);
    G.heraDisposition = 'hostile';      // carries to Ch. 2
    G.medeaPresent    = true;
    // +2 Craft item (Medea's gift) — recorded as inventory bonus
    G.inventory.medeas_gift = (G.inventory.medeas_gift || 0) + 1;
  } else if (choice === 'refuse') {
    G.heraDisposition = 'neutral';
    G.medeaPresent    = false;
    // Lose one crew member on return
    G.crewLost = (G.crewLost || 0) + 1;
  } else if (choice === 'negotiate') {
    G.heraDisposition = 'impressed';   // Hera impressed (spec)
    G.medeaPresent    = true;
    // No Honor loss
  }

  G.choices.betrayal_fork = choice;

  // Record choice with written justification (spec: stored for Zeus test)
  recordChoice('betrayal_fork', choice, text);
  saveCheckpoint('BETRAYAL_FORK');
  updateHeader();

  renderBetrayalOutcome(choice);
}

function renderBetrayalOutcome(choice) {
  const effs = [];
  let outcomeBody = '';
  let outcomeTitle = '';

  switch(choice) {
    case 'accept':
      outcomeTitle = 'You Accepted';
      outcomeBody  = 'Medea stepped into the boat. She took you south through river channels Aeetes did not know existed. And somewhere along the way she did the terrible thing &mdash; the thing that ensured Aeetes could not follow. You did not ask her to stop. You had accepted. The Argo found the sea by dawn.';
      effs.push(pip('&ndash;3 Honor','neg'), pip('Medea joins the voyage','neu'), pip('Medea\'s gift (+2 Craft item)','pos'), pip('Hera: Hostile in Ch. 2','neg'));
      break;
    case 'refuse':
      outcomeTitle = 'You Refused';
      outcomeBody  = 'You told her no. Her expression did not change &mdash; she had perhaps expected this. She gave you the river passage anyway, because she chose to, not because you agreed to her terms. The escape was harder. One of your crew did not make it back to the Argo. You carry that.';
      effs.push(pip('Honor intact','pos'), pip('One crew member lost','neg'), pip('Hera: Neutral in Ch. 2','pos'), pip('Tribunal: mark of character','pos'));
      break;
    case 'negotiate':
      outcomeTitle = 'You Found a Third Way';
      outcomeBody  = 'You saw what others could not &mdash; a path that did not require the terrible act. Medea stared at you for a long moment. Then she said: &ldquo;You are not what I expected.&rdquo; She helped you. No price. No blood. Hera, watching from Olympus, was the only witness. She said nothing. But she was impressed.';
      effs.push(pip('Honor intact','pos'), pip('Medea joins the voyage','pos'), pip('Hera: Impressed in Ch. 2','pos'), pip('Cunning 12 path claimed','pos'));
      break;
  }

  render([
    '<style>#screen-game { background: radial-gradient(ellipse at center, #1a0a0a 0%, #08080f 70%); }</style>',
    '<div class="wp-hdr">',
      '<div class="wp-loc" style="color:#e04040;">&#9876; The Betrayal Fork &mdash; Sealed</div>',
      '<div class="wp-title" style="color:var(--gold);">' + outcomeTitle + '</div>',
      '<div class="wp-sub" style="color:rgba(252,165,165,.5);">This is now part of your record</div>',
    '</div>',

    '<div class="outcome oc-' + (choice === 'accept' ? 'warning' : 'success') + '" style="border-color:#8b0000;">',
      '<div class="oc-title">' + outcomeTitle + '</div>',
      '<div class="oc-body">' + outcomeBody + '</div>',
      '<div class="eff-row">' + effs.join('') + '</div>',
    '</div>',

    '<div class="narr">',
      '<p>The Argo finds the sea. The <em>Golden Fleece</em> is lashed to the mast where it catches the first light of morning. The crew is alive &mdash; mostly. The voyage home begins.</p>',
      '<p><i>You do not know yet what Pelias will say when you arrive.</i></p>',
    '</div>',

    '<div style="text-align:center;">',
      '<button class="btn-go" onclick="advanceTo(\'RETURN\')">Sail for Home &#9654;</button>',
    '</div>',
  ].join(''));
  updateHeader();
}

// ============================================================
// RETURN TO IOLCOS — Chapter End (spec section 5.2)
// Summary, badges, epilogue, chapter lock.
// ============================================================

function renderReturn() {
  if (G.choices.return_complete) { renderComplete({honor_score: G.honor, drachma_balance: G.drachma}); return; }

  const hera  = heraInfo();
  const heraChLabel = G.heraDisposition === 'hostile'   ? 'Hostile (Ch. 2)'
                    : G.heraDisposition === 'impressed' ? 'Impressed (Ch. 2)'
                    : 'Neutral (Ch. 2)';
  const betrayal = G.choices.betrayal_fork || 'unknown';
  const medea    = betrayal === 'accept' ? 'With you (accepted)'
                 : betrayal === 'refuse' ? 'Stayed behind (refused)'
                 : 'With you (negotiated)';

  // Summary stats
  const stats = [
    { label:'Final Honor',      value: G.honor,      color: G.honor >= 10 ? 'var(--green)' : G.honor >= 5 ? 'var(--gold)' : 'var(--red)' },
    { label:'Drachma',          value: G.drachma,    color: 'var(--gold)' },
    { label:'Provisions',       value: G.provisions, color: G.provisions >= 10 ? 'var(--green)' : 'var(--red)' },
    { label:'Equipment',        value: EQUIP[G.equipment] || '?', color: 'var(--teal)' },
    { label:'Hera (Ch. 2)',     value: heraChLabel,  color: G.heraDisposition === 'hostile' ? 'var(--red)' : G.heraDisposition === 'impressed' ? '#c084fc' : 'var(--text2)' },
    { label:'Medea',            value: medea,        color: 'var(--text2)' },
    { label:'Betrayal Fork',    value: betrayal.charAt(0).toUpperCase() + betrayal.slice(1), color: betrayal === 'refuse' ? 'var(--green)' : betrayal === 'negotiate' ? '#c084fc' : '#fca5a5' },
    { label:'Rollbacks',        value: G.checkpoint_rollbacks, color: G.checkpoint_rollbacks === 0 ? 'var(--green)' : 'var(--red)' },
  ];

  const statsHtml = stats.map(s =>
    '<div style="background:var(--bg2);border:1px solid var(--gold3);border-radius:4px;padding:14px 12px;text-align:center;">' +
      '<div style="font-family:var(--px);font-size:11px;color:var(--text2);letter-spacing:2px;margin-bottom:6px;">' + s.label + '</div>' +
      '<div style="font-size:16px;font-weight:700;color:' + s.color + ';">' + s.value + '</div>' +
    '</div>'
  ).join('');

  render([
    '<div class="wp-hdr">',
      '<div class="wp-loc">&#127963; Return to Iolcos</div>',
      '<div class="wp-title">The Voyage Ends</div>',
      '<div class="wp-sub">Chapter 1 &mdash; Complete</div>',
    '</div>',

    '<div class="narr">',
      '<p>The Argo enters the harbor of Iolcos at dawn. The <em>Golden Fleece</em> gleams at the masthead. Word spreads through the city like fire &mdash; Jason has returned. He did the impossible.</p>',
      '<p><em>Pelias</em> meets you on the dock. He looks at the Fleece. He looks at you. And then he says what tyrants always say when their impossible conditions are met: that the deal has changed. The throne is not yours. He has arranged other things. He smiles.</p>',
      '<p>You did everything right. You got the Fleece. And it changed nothing.</p>',
      '<p><i>That is the first lesson of the Heroic Age: winning is not the same as being right. And being right is not always enough.</i></p>',
    '</div>',

    '<div style="font-family:var(--px);font-size:12px;color:var(--teal);letter-spacing:4px;text-align:center;margin-bottom:12px;">CHAPTER 1 SUMMARY</div>',
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;width:100%;margin-bottom:20px;">',
      statsHtml,
    '</div>',

    '<div style="text-align:center;">',
      '<button class="btn-go" onclick="completeChapter1()">Claim Your Badges &amp; Seal the Chapter &#9654;</button>',
    '</div>',
  ].join(''));
}

async function completeChapter1() {
  G.choices.return_complete = true;

  // Build final state for completion endpoint
  const finalState = {
    companions:    G.companions,
    honor:         G.honor,
    drachma:       G.drachma,
    provisions:    G.provisions,
    equipment:     G.equipment,
    inventory:     G.inventory,
    choices:       G.choices,
    medeaHelpCount:    G.medeaHelpCount,
    medeaPresent:      G.medeaPresent    || false,
    heraDisposition:   G.heraDisposition || 'neutral',
    crewLost:          G.crewLost        || 0,
    checkpoint_rollbacks: G.checkpoint_rollbacks
  };

  // Call the /api/heroic/complete endpoint (locks chapter, awards badges)
  let badges = [];
  try {
    const res = await fetch('/api/heroic/complete', {
      method: 'POST', headers: H,
      body: JSON.stringify({
        chapter: 1, final_state: finalState,
        honor_score: G.honor, drachma_balance: G.drachma, equipment_tier: G.equipment
      })
    });
    if (res.ok) {
      const data = await res.json();
      badges = data.badges_awarded || [];
    }
  } catch(e) { console.warn('Complete call failed:', e); }

  renderChapterComplete(badges);
}

function renderChapterComplete(badges) {
  const badgeMap = {
    heroic_argonaut:      { name:'The Argonaut',    icon:'&#9875;', desc:'Complete Chapter 1' },
    heroic_captains_oath: { name:"Captain's Oath",  icon:'&#9878;', desc:'Complete Ch. 1 with Honor \u2265 10' },
    heroic_negotiator:    { name:'The Negotiator',  icon:'&#128065;', desc:'Use the Cunning 12+ path at the Betrayal Fork' },
    heroic_golden_fleece: { name:'Golden Fleece',   icon:'&#127942;', desc:'Complete all waypoints without a checkpoint rollback' },
  };

  const badgeHtml = badges.length
    ? badges.map(id => {
        const b = badgeMap[id] || { name: id, icon:'&#127942;', desc:'' };
        return '<div style="background:var(--bg2);border:2px solid var(--gold);border-radius:6px;' +
          'padding:16px 12px;text-align:center;box-shadow:0 0 16px rgba(240,192,64,.2);">' +
          '<div style="font-size:36px;margin-bottom:8px;">' + b.icon + '</div>' +
          '<div style="font-family:var(--px);font-size:12px;color:var(--gold);letter-spacing:2px;margin-bottom:4px;">' + b.name + '</div>' +
          '<div style="font-family:var(--px);font-size:10px;color:var(--text2);line-height:1.6;">' + b.desc + '</div>' +
          '</div>';
      }).join('')
    : '<div style="font-family:var(--px);font-size:12px;color:var(--text2);padding:20px;text-align:center;">No new badges this chapter &mdash; keep pushing forward.</div>';

  render([
    '<div class="wp-hdr">',
      '<div class="wp-loc" style="color:var(--green);">&#10003; Chapter 1 Sealed</div>',
      '<div class="wp-title">The Legend of the Argonauts</div>',
      '<div class="wp-sub">Your choices are recorded. The Tribunal will remember.</div>',
    '</div>',

    badges.length
      ? '<div style="font-family:var(--px);font-size:12px;color:var(--teal);letter-spacing:4px;text-align:center;margin-bottom:12px;">BADGES EARNED</div>'
      : '',
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;width:100%;margin-bottom:20px;">',
      badgeHtml,
    '</div>',

    '<div class="narr">',
      '<p>Chapter 1 is complete and sealed. Your Honor score, your Drachma, your equipment tier, your Medea decision &mdash; all of it carries into Chapter 2.</p>',
      '<p><em>Hera is still watching.</em> She has been watching since Lemnos. She will be watching in Chapter 2 when Heracles begins his Labors. What she does next depends on what you did here.</p>',
    '</div>',

    '<div style="text-align:center;">',
      '<button class="btn-go" onclick="goDashboard()">&#8592; Return to Dashboard</button>',
    '</div>',
  ].join(''));
}


// ============================================================
// COMPLETION SCREEN
// ============================================================
function renderComplete(progress) {
  showScreen('screen-game');
  updateTrail('RETURN');
  updateHeader();
  render([
    '<div class="wp-hdr"><div class="wp-loc">&#10003; Chapter 1 Complete</div><div class="wp-title">The Fleece Is Won</div><div class="wp-sub">Your legend is recorded. Zeus has read your choices.</div></div>',
    '<div class="narr">',
      '<p><em>Pelias</em> refused the deal. You brought him the Golden Fleece and he laughed. You won&mdash;and it changed nothing. That is the first lesson of the Heroic Age: winning is not the same as being right.</p>',
      '<p>Final Honor: <em>' + (progress.honor_score||0) + '</em> &nbsp;&middot;&nbsp; Drachma remaining: <em>' + (progress.drachma_balance||0) + '</em></p>',
    '</div>',
    '<div style="text-align:center;"><button class="btn-go" onclick="window.location.href=\'/student.html?view=heroic\'">&#8592; Return to Dashboard</button></div>'
  ].join(''));
}

// ============================================================
// NAVIGATION HELPERS
// ============================================================
function goDashboard() { window.location.href = '/student.html?view=heroic'; }

// ============================================================
// RESET — clears chapter 1 progress and restarts
// ============================================================
async function resetChapter1() {
  if (!confirm('Restart Chapter 1 from the beginning? Your current progress will be lost.')) return;
  try {
    await fetch(API + '/heroic/checkpoint', {
      method:'POST', headers:H,
      body: JSON.stringify({
        chapter:1, waypoint:'IOLCOS',
        state_json:{companions:[],skepticalCompanion:null,honor:10,
          drachma:G.student ? (G.student.drachma||0) : 0,
          provisions:20,equipment:1,inventory:{},choices:{},
          medeaHelpCount:0,checkpoint_rollbacks:0},
        honor_score:10, drachma_balance:G.student ? (G.student.drachma||0) : 0, equipment_tier:1
      })
    });
  } catch(e) { console.warn('Reset save failed:', e); }
  // Reset local state
  G.honor=10; G.drachma=G.student?(G.student.drachma||0):0; G.provisions=20;
  G.equipment=1; G.inventory={}; G.companions=[]; G.skepticalCompanion=null;
  G.choices={}; G.medeaHelpCount=0; G.checkpoint_rollbacks=0;
  if (G.stats && craft() >= 10) G.equipment = 2;
  routeTo('IOLCOS');
}

function showDevBar(showReset) {
  const btn = el('dev-reset-btn');
  if (btn) btn.style.display = showReset ? 'inline-block' : 'none';
}

// ============================================================
// BOOT
// ============================================================
init();
</script>
