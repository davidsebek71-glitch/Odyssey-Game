// IOLCOS — Departure (spec section 5.2)
// ============================================================
function renderIolcos() {
  if (G.companions.length === 2 && G.choices.companions) { renderIolcosMarket(); return; }

  const av = avType();
  const prof = AV_PROFILE[av] || {};

  // Avatar-specific opening flavor
  const FLAVOR = {
    fallen:  'Word of your wealth and recklessness spread through the harbor before you arrived. Heroes follow boldness&mdash;and coin.',
    devoted: 'Orpheus was waiting at the dock before dawn, lyre already packed. He did not ask if there was danger. That is loyalty.',
    builder: 'Argus pressed a toolkit into your hands before you reached the gangplank. &ldquo;Build through it,&rdquo; he said.',
    seeker:  'You arrived first. You studied the old charts no one else thought to find. Whatever lies east, you have already started thinking about it.',
    mirror:  'You have already mapped the crew&rsquo;s ambitions. Castor trusts too easily. Atalanta wants glory more than she admits. Good to know.',
    tested:  'You prayed at Hera&rsquo;s shrine before dawn. The incense rose clean and straight. She is watching. You will not give her cause to look away.',
    eternal: 'Three times last night you dreamed of stars rearranging into a path. You recorded everything. The pattern will matter&mdash;you know it will.'
  };
  const flavor = FLAVOR[av] || 'The call has gone across all of Greece. The greatest crew ever assembled waits at the dock.';

  // Stat card items with avatar strong/weak annotation
  const statItems = [
    {n:'LORE',    v:lore(),    hint:'Oracle hints, puzzle clues, myth bonuses'},
    {n:'CRAFT',   v:craft(),   hint:'Equipment, Forge discounts, puzzle tiles'},
    {n:'CUNNING', v:cun(),     hint:'Extra paths, negotiation, shortcuts'},
    {n:'HONOR',   v:clsH(),    hint:'God NPCs, divine gear, Tribunal weight'}
  ].map(s => {
    const isStr = prof.strong?.some(k => k.toLowerCase().startsWith(s.n.toLowerCase().slice(0,4)));
    const isWk  = prof.weak?.some(k  => k.toLowerCase().startsWith(s.n.toLowerCase().slice(0,4)));
    return '<div class="stat-it' + (isStr?' strong':isWk?' weak':'') + '">' +
      '<div class="stat-n">' + s.n + '</div>' +
      '<div class="stat-v">' + s.v + '</div>' +
      '<div class="stat-l">' + (isStr ? '&#9733; STRONG VIRTUE' : isWk ? '&#9651; WEAK VIRTUE' : s.hint) + '</div>' +
      '</div>';
  }).join('');

  // Notices
  const notices = [];
  if (av === 'fallen')
    notices.push('<div class="banner b-avatar">&#9889; <strong>The Fallen:</strong> You begin with extra Drachma&mdash;but one companion will start skeptical of your leadership. This matters at Lemnos.</div>');
  if (av === 'devoted')
    notices.push('<div class="banner b-avatar">&#127925; <strong>The Devoted:</strong> Full crew loyalty from the start. All companions trust you immediately.</div>');
  if (av === 'builder')
    notices.push('<div class="banner b-avatar">&#128296; <strong>The Builder:</strong> One companion begins with upgraded equipment. Forge discounts apply throughout this chapter.</div>');
  if (craft() >= 10)
    notices.push('<div class="banner b-craft">&#128296; <strong>Craft ' + craft() + ':</strong> Your engineering skill unlocks Bronze (Tier 2) equipment at chapter start.</div>');
  const passLabels = Object.values(G.passives);
  if (passLabels.length)
    notices.push('<div class="banner b-passive">&#129309; <strong>Alliance Bonuses Active:</strong> ' + passLabels.join(' &nbsp;&middot;&nbsp; ') + '</div>');

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#9875; Waypoint I</div><div class="wp-title">Iolcos</div><div class="wp-sub">The Departure &mdash; Where Legends Begin</div></div>',
    notices.join(''),
    '<div class="narr">',
      '<p>King <em>Pelias</em> stands before you on the palace steps, his smile thin as a blade. The deal is simple: bring him the <em>Golden Fleece</em> from the kingdom of Colchis and the throne of Iolcos will be yours. He expects you to fail. The goddess <em>Hera</em>&mdash;watching from the shadow of the colonnade&mdash;expects otherwise.</p>',
      '<p>The <em>Argo</em> waits in the harbor. Over fifty heroes have answered your call. But you cannot sail with all of them. Your ship. Your choices. Your voyage.</p>',
      '<p><i>' + flavor + '</i></p>',
    '</div>',
    '<div class="stat-card"><div class="stat-card-ttl">Your Heroic Stats &mdash; These Shape Every Encounter</div><div class="stat-row">' + statItems + '</div></div>',
    '<div class="divider"></div>',
    '<div class="choice-panel">',
      '<div class="choice-prompt">Choose 2 companions for your inner crew</div>',
      '<div class="sel-count" id="comp-count">Selected: 0 / 2</div>',
      '<div style="height:12px;"></div>',
      '<div class="comp-grid" id="comp-grid">',
        Object.entries(COMPANIONS).map(([key, c]) =>
          '<div class="comp-card" data-key="' + key + '">' +
          '<div class="comp-chk">&#10003;</div>' +
          '<div class="comp-icon">' + c.icon + '</div>' +
          '<div class="comp-name">' + c.name + '</div>' +
          '<div class="comp-virt">' + c.virtue + '</div>' +
          '<div class="comp-desc">' + c.desc + '</div>' +
          '</div>'
        ).join(''),
      '</div>',
    '</div>',
    '<div style="text-align:center;"><button id="btn-sail" class="btn-go" disabled onclick="confirmCompanions()">Set Sail &#9654;</button></div>',
    '<button class="btn-back" onclick="window.location.href=\'/student.html?view=heroic\'">&#8592; Dashboard</button>'
  ].join(''));

  // Wire companion selection
  document.querySelectorAll('.comp-card').forEach(card => {
    card.addEventListener('click', function() {
      const key = this.dataset.key;
      if (this.classList.contains('locked')) return;
      if (this.classList.contains('sel')) {
        this.classList.remove('sel');
        G.companions = G.companions.filter(k => k !== key);
      } else {
        if (G.companions.length >= 2) return;
        this.classList.add('sel');
        G.companions.push(key);
      }
      el('comp-count').textContent = 'Selected: ' + G.companions.length + ' / 2';
      document.querySelectorAll('.comp-card:not(.sel)').forEach(c => {
        c.classList.toggle('locked', G.companions.length >= 2);
      });
      el('btn-sail').disabled = G.companions.length < 2;
    });
  });
}

function confirmCompanions() {
  if (G.companions.length < 2) return;
  // Fallen: randomly assign one companion as skeptical
  if (isAv('fallen')) {
    G.skepticalCompanion = G.companions[Math.floor(Math.random() * G.companions.length)];
  }
  G.choices.companions = G.companions.join(',');
  recordChoice('companions', G.choices.companions);
  saveCheckpoint('IOLCOS');
  renderIolcosMarket();
}

// ── IOLCOS MARKET ──────────────────────────────────────────
function renderIolcosMarket() {
  const av = avType();

  // SPEC 3.4: Agora — Craft stat gives discount; Builder stacks
  let disc = 0;
  if (craft() >= 10) disc += 0.10;   // Craft 10+ base
  if (isAv('builder')) disc += 0.10; // Builder stacks
  disc = Math.min(disc, 0.40);       // cap at 40% off

  const discNotes = [];
  if (craft() >= 10)
    discNotes.push('<div class="banner b-craft">&#128296; <strong>Craft ' + craft() + ':</strong> Your engineering expertise gives you a ' + (disc*100|0) + '% discount at this market.</div>');
  if (isAv('builder') && craft() < 10)
    discNotes.push('<div class="banner b-avatar">&#128296; <strong>The Builder:</strong> Forge expertise gives you a 10% discount here.</div>');
  if (isAv('builder') && craft() >= 10)
    discNotes.push('<div class="banner b-avatar">&#128296; <strong>The Builder</strong> stacks with your Craft bonus. Total discount: ' + (disc*100|0) + '%.</div>');

  const skeptWarn = G.skepticalCompanion
    ? '<div class="banner b-hera">&#9888; <strong>' + cap(G.skepticalCompanion) + ' is skeptical</strong> of your leadership. This will come up at Lemnos.</div>'
    : '';

  const crewSummary = G.companions.map(k => COMPANIONS[k]?.icon + ' ' + (COMPANIONS[k]?.name || k)).join(' &amp; ');

  const itemsHtml = MARKET.map(item => {
    const price = Math.round(item.price * (1 - disc));
    const owned = G.inventory[item.key] || 0;
    const afford = G.drachma >= price;
    return '<div class="mkt-item">' +
      '<div style="font-size:30px;margin-bottom:8px;">' + item.icon + '</div>' +
      '<div class="mkt-name">' + item.name + '</div>' +
      '<div class="mkt-desc">' + item.desc + '</div>' +
      '<div class="mkt-price">&#128176; ' + price + ' Drachma' +
        (disc > 0 ? ' <span style="color:var(--text2);text-decoration:line-through;font-size:11px;">' + item.price + '</span>' : '') +
      '</div>' +
      (owned > 0
        ? '<div class="mkt-owned">&#10003; Owned &times;' + owned + '</div>'
        : '<button class="btn-buy"' + (afford ? '' : ' disabled') + ' onclick="buyItem(\'' + item.key + '\',' + price + ')">Buy</button>'
      ) +
      '</div>';
  }).join('');

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#9875; Iolcos &mdash; Harbor Market</div><div class="wp-title">Outfit the Argo</div><div class="wp-sub">Wood &amp; Leather Tier &mdash; Next market stop: Colchis</div></div>',
    discNotes.join(''),
    skeptWarn,
    '<div class="narr"><p>Your inner crew: <em>' + crewSummary + '</em>. The harbor market is open. You will not see another supply stop until the coast of Colchis. Spend wisely&mdash;but arriving unprepared costs more than Drachma.</p></div>',
    '<div class="drachma-bar" id="mkt-dr">&#128176; ' + G.drachma + ' Drachma remaining</div>',
    '<div style="height:8px;"></div>',
    '<div class="mkt-grid">' + itemsHtml + '</div>',
    '<div class="divider"></div>',
    '<div style="text-align:center;"><button class="btn-go" onclick="finishMarket()">Set Sail for Lemnos &#9654;</button></div>',
    '<button class="btn-back" onclick="window.location.href=\'/student.html?view=heroic\'">&#8592; Dashboard</button>'
  ].join(''));
}

window.buyItem = function(key, price) {
  if (G.drachma < price) return;
  G.drachma -= price;
  G.inventory[key] = (G.inventory[key] || 0) + 1;
  updateHeader();
  renderIolcosMarket();
};

function finishMarket() {
  recordChoice('market_iolcos', JSON.stringify(G.inventory));
  advanceTo('LEMNOS');
}

// ============================================================
// LEMNOS — The Temptation (spec section 5.2)
// ============================================================
function renderLemnos() {
  if (G.choices.lemnos) { renderLemnosOutcome(G.choices.lemnos); return; }

  const av  = avType();
  const c   = cun();
  const isFallenForced = av === 'fallen';

  // Devoted: auto-resolves negotiate (spec: "automatically passes the Negotiate check")
  if (av === 'devoted') {
    render([
      '<div class="wp-hdr"><div class="wp-loc">&#127965; Waypoint II</div><div class="wp-title">Lemnos</div></div>',
      '<div class="banner b-avatar">&#127925; <strong>The Devoted:</strong> Loyalty reads as trustworthiness. Before you speak a word, Orpheus steps forward and plays something soft and disarming. Hypsipyle listens. Negotiation succeeds automatically&mdash;no Honor cost.</div>',
      '<div style="font-family:var(--px);font-size:14px;color:var(--teal);text-align:center;padding:44px;letter-spacing:3px;animation:blink 1s step-end infinite;">Resolving...</div>'
    ].join(''));
    setTimeout(() => resolveLemnos('negotiate_auto'), 900);
    return;
  }

  const skeptWarn = G.skepticalCompanion
    ? '<div class="banner b-hera">&#9888; <strong>' + cap(G.skepticalCompanion) + '</strong> is watching your decision here. Their skepticism makes this harder.</div>'
    : '';

  // Build choices list
  const choices = [];

  // Path 1 — Stay (Fallen forced here, spec: "courage without humility cannot resist")
  choices.push(
    '<div class="c-btn' + (isFallenForced ? ' forced' : '') + '"' +
    (isFallenForced ? '' : ' onclick="resolveLemnos(\'stay\')"') + '>' +
    '<div class="c-tag ' + (isFallenForced ? 'tag-forced">FORCED' : 'tag-honor">&ndash;2 HONOR') + '</div>' +
    '<div class="c-title">' + (isFallenForced ? '&#9939; Stay on Lemnos (Required)' : 'Stay on Lemnos') + '</div>' +
    '<div class="c-desc">Linger three days. Gain full provisions (+8). Lose 2 Honor. Hera notes every day you delay.' +
      (G.skepticalCompanion ? ' ' + cap(G.skepticalCompanion) + '\'s skepticism deepens.' : '') + '</div>' +
    (isFallenForced ? '<div style="margin-top:12px;"><button class="btn-buy" onclick="resolveLemnos(\'stay\')">Confirm &#8594;</button></div>' : '') +
    '</div>'
  );

  // Path 2 — Negotiate (Cunning 8+, spec)
  if (!isFallenForced) {
    if (c >= 8) {
      const chance = Math.min(95, 50 + (c - 8) * 5);
      choices.push(
        '<div class="c-btn" onclick="resolveLemnos(\'negotiate\')">' +
        '<div class="c-tag tag-cun">CUNNING ' + c + '</div>' +
        '<div class="c-title">Negotiate for Provisions</div>' +
        '<div class="c-desc">Arrange a fair trade. Success rate: ~' + chance + '%. Pass: provisions and Honor intact. Fail: same as Staying. No Honor lost on the attempt itself.</div>' +
        '</div>'
      );
    } else {
      choices.push(
        '<div class="c-btn locked">' +
        '<div class="c-tag tag-locked">CUNNING 8 REQUIRED</div>' +
        '<div class="c-title">Negotiate for Provisions</div>' +
        '<div class="c-desc">Requires Cunning 8. Your score is ' + c + '. Win arena battles to raise Cunning (each win = +3 Cunning).</div>' +
        '</div>'
      );
    }
    // Path 3 — Leave (Honor intact, spec)
    choices.push(
      '<div class="c-btn" onclick="resolveLemnos(\'leave\')">' +
      '<div class="c-tag tag-honor">HONOR INTACT</div>' +
      '<div class="c-title">Leave at Dawn</div>' +
      '<div class="c-desc">Honor intact. Lose 20% of provisions. Crew morale &ndash;1. The Argo sails now, no delays. Hera approves.</div>' +
      '</div>'
    );
  }

  // Path 4 — Seeker hidden option (spec: "4th option: investigate the island")
  if (av === 'seeker' && !isFallenForced) {
    choices.push(
      '<div class="c-btn hidden" onclick="resolveLemnos(\'investigate\')">' +
      '<div class="c-tag tag-hid">SEEKER ONLY</div>' +
      '<div class="c-title">&#128269; Investigate the Island</div>' +
      '<div class="c-desc">Something is wrong here. All the men&mdash;gone. There is a story no one is telling. Small Lore reward. Honor neutral. Only a Seeker would notice this.</div>' +
      '</div>'
    );
  }

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#127965; Waypoint II</div><div class="wp-title">Lemnos</div><div class="wp-sub">The Island of Women &mdash; The First Test of Character</div></div>',
    isFallenForced
      ? '<div class="banner b-hera">&#128065; <strong>Hera watches.</strong> The Fallen cannot resist comfort and coin. Your nature decides this&mdash;not your will.</div>'
      : '',
    skeptWarn,
    '<div class="narr">',
      '<p>The Argo drops anchor off <em>Lemnos</em>&mdash;an island where the women killed all their men years ago and now rule alone. Their queen, <em>Hypsipyle</em>, sends a herald: stay, rest, take provisions. The harbor is warm. The offer is generous.</p>',
      '<p>The goddess <em>Hera</em> is watching. She knows the Fleece will not wait, and she is measuring what kind of leader you are. Every day you linger is a day wasted.</p>',
      '<p><i>' + (G.skepticalCompanion ? cap(G.skepticalCompanion) + ' watches you especially closely. Choose carefully.' : 'Your companions wait for your word.') + '</i></p>',
    '</div>',
    '<div class="choice-panel"><div class="choice-prompt">What do you do?</div><div class="choice-grid">' + choices.join('') + '</div></div>',
    '<button class="btn-back" onclick="window.location.href=\'/student.html?view=heroic\'">&#8592; Dashboard</button>'
  ].join(''));
}

function resolveLemnos(choice) {
  const c = cun();
  let honorDelta = 0, provDelta = 0, type = 'warning', title = '', body = '';
  const effs = [];

  // Negotiate success roll (spec: Cunning 8+ enables; auto-pass for Devoted)
  const negSuccess = choice === 'negotiate_auto' ||
    (choice === 'negotiate' && Math.random() < Math.min(0.95, 0.50 + (c - 8) * 0.05));

  switch(choice) {
    case 'stay':
      honorDelta=-2; provDelta=+8; type='warning';
      title='Three Days on Lemnos';
      body='Hypsipyle\'s hospitality fills the hold. The crew is rested and well-fed. But you feel Hera\'s eye on every sunrise you waste here. Three days gone. The Fleece does not wait.';
      effs.push(pip('&ndash;2 Honor','neg'), pip('+8 Provisions','pos'), pip('Hera: Displeased','neg'));
      if (G.skepticalCompanion) effs.push(pip(cap(G.skepticalCompanion)+': Doubts deepen','neg'));
      break;

    case 'negotiate':
    case 'negotiate_auto':
      if (negSuccess) {
        provDelta=+5; type='success';
        title = choice === 'negotiate_auto' ? 'Orpheus Speaks for You' : 'A Fair Bargain';
        body  = choice === 'negotiate_auto'
          ? 'Before you speak a word, Orpheus is already playing&mdash;something soft and disarming. Hypsipyle listens. A fair trade is arranged before sundown. Provisions loaded, Honor intact, the Argo underway at dawn.'
          : 'Your words are careful and honest. Hypsipyle recognizes a leader who respects her people. The trade is arranged. Honor intact. The Argo sails at dawn.';
        effs.push(pip('Honor intact','pos'), pip('+5 Provisions','pos'), pip('No delay','pos'));
      } else {
        honorDelta=-2; provDelta=+8; type='warning';
        title='The Negotiation Collapses';
        body='Your words were reasonable, but Hypsipyle sensed reluctance in them. The talks fell apart. You stay three days anyway, taking provisions by the queen\'s grace&mdash;but she knows you could have done better.';
        effs.push(pip('&ndash;2 Honor (failed negotiate)','neg'), pip('+8 Provisions','neu'));
      }
      break;

    case 'leave':
      provDelta = -Math.round(G.provisions * 0.2); type='success';
      title='Gone Before Dawn';
      body='You order the crew back to the Argo before sunrise. They grumble&mdash;they were warm and fed. Twenty percent of your provisions are left behind. But Honor is intact and Hera approves. The wind is with you.';
      effs.push(pip('Honor intact','pos'), pip(Math.round(G.provisions*.2)+' Provisions lost','neg'), pip('Crew morale &ndash;1','neg'), pip('Hera: Approves','pos'));
      break;

    case 'investigate':
      type='success';
      title='The Truth Beneath the Island';
      body='You slip away from the others and search the hills above the harbor. A shrine, hidden in the rocks, still smoking. The story of what happened here is darker and older than anyone admits. You record every detail. The gods keep records too.';
      effs.push(pip('+Lore insight','pos'), pip('Honor neutral','neu'));
      break;
  }

  // Apply deltas (spec: honor floor is 0, provisions floor is 0)
  G.honor      = Math.max(0, G.honor + honorDelta);
  G.provisions = Math.max(0, G.provisions + provDelta);

  G.choices.lemnos = choice;
  recordChoice('lemnos', choice);
  saveCheckpoint('LEMNOS');
  renderLemnosOutcome(choice, type, title, body, effs);
}

function renderLemnosOutcome(choice, type, title, body, effs) {
  // Restore mode: reconstruct from choice key alone
  if (!type) {
    const MAP = {
      stay:           {type:'warning', title:'Three Days on Lemnos',   body:'Provisions gained. Two Honor lost. Hera was displeased.'},
      negotiate:      {type:'success', title:'A Bargain Was Struck',    body:'Provisions and Honor intact. The Argo sailed at dawn.'},
      negotiate_auto: {type:'success', title:'Orpheus Spoke for You',   body:'Full provisions. Honor intact. Devoted\'s loyalty carried the day.'},
      leave:          {type:'success', title:'Gone Before Dawn',        body:'Honor intact. Provisions reduced. Hera approved.'},
      investigate:    {type:'success', title:'The Truth of the Island', body:'Knowledge gained. Honor neutral.'}
    };
    const m = MAP[choice] || MAP.stay;
    type=m.type; title=m.title; body=m.body; effs=[];
  }

  const effHtml = (effs||[]).length ? '<div class="eff-row">' + (effs||[]).join('') + '</div>' : '';

  const heraLine = G.honor >= 15 ? 'Hera watches&mdash;and is grudgingly impressed.'
    : G.honor >= 10 ? 'Hera watches. She is not pleased, but she is not yet hostile.'
    : G.honor >= 5  ? 'Hera\'s hostility is building. You can feel it like a cold wind off Olympus.'
    : 'Hera\'s curse is upon you. She has not forgotten, and she will not forgive easily.';

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#127965; Lemnos &mdash; Resolved</div><div class="wp-title">The Argo Sails East</div></div>',
    '<div class="outcome oc-' + type + '">',
      '<div class="oc-title">' + title + '</div>',
      '<div class="oc-body">' + body + '</div>',
      effHtml,
    '</div>',
    '<div class="narr">',
      '<p>Ahead lies the <em>Symplegades</em>&mdash;the Clashing Rocks. Two massive cliff faces that snap shut like jaws. No ship has ever navigated them and survived. Every sailor in Greece knows this.</p>',
      '<p><i>' + heraLine + '</i></p>',
    '</div>',
    '<div style="text-align:center;"><button class="btn-go" onclick="advanceTo(\'SYMPLEGADES\')">Sail for the Clashing Rocks &#9654;</button></div>',
    '<button class="btn-back" onclick="window.location.href=\'/student.html?view=heroic\'">&#8592; Dashboard</button>'
  ].join(''));
  updateHeader();
}

// ============================================================
// ============================================================
// SYMPLEGADES — The Clashing Rocks (spec section 5.2)
// Canvas mini-game: side-scrolling, rocks close from both sides,
// navigate Argo through narrowing gap, 3 waves of increasing difficulty.
// ============================================================

const SYMP = {
  gapForCunning: function() {
    const c = cun();
    if (c >= 12) return 270;
    if (c >= 6)  return 240;
    return 210;
  },
  speedForProvisions: function() {
    if (G.provisions >= 15) return 1.0;
    if (G.provisions >= 8)  return 1.12;
    return 1.25;
  },
  WAVES: [
    { speed: 0.6,  vertDrift: false, extraPairs: 0 },
    { speed: 0.85, vertDrift: true,  extraPairs: 0 },
    { speed: 1.1,  vertDrift: true,  extraPairs: 1 }
  ],
  SPEED_BONUS_DRACHMA: 20,
  DAMAGE_DRACHMA_PENALTY: 15
};

let SG = null;

function initSympState(canvas) {
  const W = canvas.width, H = canvas.height;
  return {
    W, H,
    argoX: W / 2, argoY: H * 0.65,
    argoW: 60, argoH: 28,
    keys: { left: false, right: false },
    wave: 0, wavePhase: 'intro', phaseTimer: 0, totalTime: 0,
    rockLeft: 0, rockRight: W,
    targetGap: SYMP.gapForCunning(),
    baseGap: W,
    closingSpeed: SYMP.WAVES[0].speed * SYMP.speedForProvisions(),
    vertOffset: 0, vertDir: 1, vertDrift: false,
    extraPairs: 0, extraRocks: [],
    hits: 0,
    builderBuffer: isAv('builder'),
    builderUsed: false,
    mirrorEarly: isAv('mirror'),
    shakeFrames: 0, shakeMag: 0,
    speedMult: SYMP.speedForProvisions(),
    gap: SYMP.gapForCunning(),
    animId: null, wavesPassed: 0,
    damaged: false, startTime: null,
    _cleanup: null
  };
}

function renderSympStub() {
  // Restore: if already completed, show outcome
  if (G.choices.symplegades) { renderSympOutcome(G.choices.symplegades === 'damaged', 0, 0); return; }
  const cunv = cun();
  const provNote = G.provisions < 8
    ? '<div class="banner b-hera">&#9889; Low provisions (' + G.provisions + ') &mdash; crew is panicked. Rocks close faster.</div>'
    : G.provisions < 15
    ? '<div class="banner b-hera">&#9888; Reduced provisions (' + G.provisions + ') &mdash; crew is unsettled. Slightly faster closure.</div>'
    : '';
  const mirNote  = isAv('mirror')  ? '<div class="banner b-avatar">&#128270; <strong>The Mirror:</strong> Pattern recognition gives you 0.5s early warning before each rock closure.</div>' : '';
  const bldNote  = isAv('builder') ? '<div class="banner b-avatar">&#128296; <strong>The Builder:</strong> Pre-reinforced hull &mdash; absorbs one collision before damage triggers.</div>' : '';
  const cunNote  = cunv >= 6 ? '<div class="banner b-craft">&#127919; <strong>Cunning ' + cunv + ':</strong> Tactical awareness widens your safe passage window.</div>' : '';

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#129704; Waypoint III</div><div class="wp-title">The Symplegades</div><div class="wp-sub">The Clashing Rocks &mdash; Nothing has ever survived</div></div>',
    provNote, mirNote, bldNote, cunNote,
    '<div class="narr">',
      '<p>The <em>Clashing Rocks</em> loom ahead &mdash; two cliff faces the size of mountains, grinding together with a sound like the earth being torn apart. The old trick: release a <em>dove</em> first. If it passes through, you have a heartbeat to follow.</p>',
      '<p><strong>Steer the Argo left and right through three waves of closing rocks. Do not let the rocks reach you.</strong></p>',
    '</div>',
    '<div style="background:var(--bg2);border:1px solid var(--gold3);border-radius:4px;padding:16px 20px;width:100%;font-family:var(--px);font-size:13px;line-height:2;color:var(--text2);">',
      '&#8592; &#8594; Arrow keys or A / D to steer &nbsp;&middot;&nbsp; Touch: tap left or right half &nbsp;&middot;&nbsp; Under 45s = Drachma bonus',
    '</div>',
    '<div style="text-align:center;"><button class="btn-go" onclick="startSymplegades()">Release the Dove &#9654;</button></div>',
    '<button class="btn-back" onclick="window.location.href=\'/student.html?view=heroic\'">&#8592; Dashboard</button>'
  ].join(''));
}

function startSymplegades() {
  const wrap = document.getElementById('wp-content');
  wrap.innerHTML =
    '<div id="symp-wrap" style="width:100%;display:flex;flex-direction:column;align-items:center;">' +
    '<canvas id="symp-canvas" style="display:block;image-rendering:pixelated;cursor:none;touch-action:none;border:2px solid var(--gold3);"></canvas>' +
    '<div id="symp-hud" style="width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;' +
         'background:var(--bg1);border:2px solid var(--gold3);border-top:none;padding:10px 18px;font-family:var(--px);font-size:13px;">' +
      '<span style="color:var(--teal);" id="symp-wave">WAVE 1 / 3</span>' +
      '<span style="color:var(--gold);" id="symp-timer">90s</span>' +
      '<span style="color:var(--text2);" id="symp-status">NAVIGATE THE ARGO</span>' +
    '</div></div>';

  const canvas = document.getElementById('symp-canvas');
  const maxW = Math.min(820, window.innerWidth - 32);
  canvas.width  = maxW;
  canvas.height = Math.floor(window.innerHeight * 0.55);

  SG = initSympState(canvas);
  SG.startTime = Date.now();

  const onKey = e => {
    const d = e.type === 'keydown';
    if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') { SG.keys.left  = d; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { SG.keys.right = d; e.preventDefault(); }
  };
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup',   onKey);

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    SG.keys.left = SG.keys.right = false;
    Array.from(e.touches).forEach(t => {
      const rect = canvas.getBoundingClientRect();
      if (t.clientX - rect.left < canvas.width / 2) SG.keys.left  = true;
      else SG.keys.right = true;
    });
  }, {passive:false});
  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    SG.keys.left = SG.keys.right = false;
  }, {passive:false});

  SG._cleanup = () => {
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('keyup',   onKey);
  };

  beginWave(0);
  let lastTs = 0;
  function sympLoop(ts) {
    if (!SG) return;
    const dt = Math.min(ts - lastTs, 50);
    lastTs = ts;
    SG.totalTime += dt;
    SG.phaseTimer += dt;
    const c = document.getElementById('symp-canvas');
    if (!c) return;
    const ctx = c.getContext('2d');
    updateSympPhysics(dt);
    drawSympFrame(ctx);
    if (SG.wavePhase !== 'gameover' && SG.wavePhase !== 'victory') {
      SG.animId = requestAnimationFrame(sympLoop);
    }
  }
  SG.animId = requestAnimationFrame(sympLoop);
}

function beginWave(waveIdx) {
  const spec = SYMP.WAVES[waveIdx];
  SG.wave = waveIdx; SG.wavePhase = 'intro'; SG.phaseTimer = 0;
  SG.rockLeft = 0; SG.rockRight = SG.W;
  SG.closingSpeed = spec.speed * SG.speedMult;
  SG.vertDrift = spec.vertDrift; SG.extraPairs = spec.extraPairs;
  SG.vertOffset = 0; SG.vertDir = 1; SG.warningFlashed = false;
  SG.extraRocks = [];
  if (spec.extraPairs > 0) {
    for (let i = 0; i < spec.extraPairs; i++) {
      const rH = SG.H * 0.22;
      const y  = SG.H * 0.10 + i * SG.H * 0.14;
      SG.extraRocks.push(
        {x: -80,   y, w: 80, h: rH, vx:  1.2 * SG.speedMult, vy:  0.3},
        {x: SG.W,  y, w: 80, h: rH, vx: -1.2 * SG.speedMult, vy: -0.3}
      );
    }
  }
  const wl = el('symp-wave');
  if (wl) wl.textContent = 'WAVE ' + (waveIdx + 1) + ' / 3';
}

function updateSympPhysics(dt) {
  const S = SG, SPEED = 3.5;
  if (S.shakeFrames > 0) S.shakeFrames--;

  if (S.wavePhase === 'closing' || S.wavePhase === 'gap') {
    const half = S.argoW / 2;
    if (S.keys.left)  S.argoX = Math.max(S.rockLeft  + half + 2, S.argoX - SPEED);
    if (S.keys.right) S.argoX = Math.min(S.rockRight - half - 2, S.argoX + SPEED);
  }

  switch(S.wavePhase) {
    case 'intro':
      if (S.phaseTimer > 1500) { S.wavePhase = 'warning'; S.phaseTimer = 0; }
      break;
    case 'warning':
      if (S.phaseTimer > (S.mirrorEarly ? 1200 : 700)) { S.wavePhase = 'closing'; S.phaseTimer = 0; }
      break;
    case 'closing': {
      const rate = S.closingSpeed * (dt / 16);
      S.rockLeft += rate; S.rockRight -= rate;
      if (S.vertDrift) {
        S.vertOffset += S.vertDir * 0.5 * (dt / 16);
        if (Math.abs(S.vertOffset) > S.H * 0.12) S.vertDir *= -1;
      }
      S.extraRocks.forEach(r => {
        r.x += r.vx * (dt / 16); r.y += r.vy * (dt / 16);
        if (r.y < 0 || r.y + r.h > S.H * 0.6) r.vy *= -1;
      });
      if (S.rockRight - S.rockLeft <= S.targetGap) {
        S.rockLeft  = (S.W - S.targetGap) / 2;
        S.rockRight = S.rockLeft + S.targetGap;
        S.wavePhase = 'gap'; S.phaseTimer = 0;
      }
      checkArgoCollision();
      break;
    }
    case 'gap':
      if (S.vertDrift) {
        S.vertOffset += S.vertDir * 0.4 * (dt / 16);
        if (Math.abs(S.vertOffset) > S.H * 0.10) S.vertDir *= -1;
      }
      S.extraRocks.forEach(r => {
        r.x += r.vx * (dt / 16); r.y += r.vy * (dt / 16);
        if (r.y < 0 || r.y + r.h > S.H * 0.6) r.vy *= -1;
      });
      checkArgoCollision();
      if (S.phaseTimer > 2500) {
        S.wavesPassed++;
        if (S.wavesPassed >= SYMP.WAVES.length) sympVictory();
        else beginWave(S.wavesPassed);
      }
      break;
  }
}

function checkArgoCollision() {
  const S = SG;
  const ax1 = S.argoX - S.argoW/2, ax2 = S.argoX + S.argoW/2;
  const ay1 = S.argoY - S.argoH/2, ay2 = S.argoY + S.argoH/2;
  let hit = ax1 <= S.rockLeft || ax2 >= S.rockRight;
  if (!hit) S.extraRocks.forEach(r => {
    if (ax2 > r.x && ax1 < r.x + r.w && ay2 > r.y && ay1 < r.y + r.h) hit = true;
  });
  if (!hit) return;
  if (S.builderBuffer && !S.builderUsed) {
    S.builderUsed = true; S.shakeFrames = 8; S.shakeMag = 4;
    const st = el('symp-status'); if (st) st.textContent = 'HULL REINFORCED — BUFFER USED!';
    setTimeout(() => { const s = el('symp-status'); if (s) s.textContent = 'NAVIGATE THE ARGO'; }, 1500);
  } else if (!S.damaged) {
    S.damaged = true; S.shakeFrames = 18; S.shakeMag = 8;
    S.argoX = S.W / 2;
    const st = el('symp-status'); if (st) st.textContent = 'HULL DAMAGED!';
    setTimeout(() => { const s = el('symp-status'); if (s) s.textContent = 'NAVIGATE THE ARGO'; }, 1500);
  }
}

function sympVictory() {
  const S = SG;
  if (S.animId) cancelAnimationFrame(S.animId);
  if (S._cleanup) S._cleanup();
  const elapsed = (Date.now() - S.startTime) / 1000;
  const speedBonus = elapsed < 45 ? SYMP.SPEED_BONUS_DRACHMA : 0;
  if (S.damaged) {
    G.equipment = Math.max(1, G.equipment - 1);
    G.symplegadesDamaged = true;
  }
  if (speedBonus) G.drachma += speedBonus;
  G.choices.symplegades = S.damaged ? 'damaged' : 'clean';
  recordChoice('symplegades', G.choices.symplegades);
  saveCheckpoint('SYMPLEGADES');
  renderSympOutcome(S.damaged, speedBonus, elapsed);
}

function renderSympOutcome(damaged, speedBonus, elapsed) {
  const effs = [];
  if (damaged)    { effs.push(pip('Equipment &ndash;1 tier','neg'), pip('&ndash;15 Drachma at next market','neg')); }
  else            { effs.push(pip('Hull intact','pos')); }
  if (speedBonus) { effs.push(pip('+' + speedBonus + ' Drachma speed bonus','pos')); }
  effs.push(pip('Provisions: ' + G.provisions,'neu'));

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#129704; Symplegades &mdash; Cleared</div><div class="wp-title">East of the Rocks</div></div>',
    '<div class="outcome ' + (damaged ? 'oc-warning' : 'oc-success') + '">',
      '<div class="oc-title">' + (damaged ? 'Through the Rocks &mdash; at a Cost' : 'Clear! The Argo Passes Through!') + '</div>',
      '<div class="oc-body">' + (damaged
        ? 'The Argo made it through, but the hull took damage. Equipment degraded. Repairs cost 15 Drachma at the next market.'
        : 'The rocks snap shut behind you like thunder. The crew erupts. No ship has ever made it through &mdash; until now.'
      ) + '</div>',
      '<div class="eff-row">' + effs.join('') + '</div>',
    '</div>',
    '<div class="narr">',
      '<p>Ahead lies the coast of <em>Colchis</em> &mdash; kingdom of King Aeetes, guardian of the Golden Fleece. The crew is shaken but alive.</p>',
      '<p><i>' + (damaged ? 'The hull will hold for now. Find a forge at Colchis.' : 'Hera watched the passage. She said nothing. That alone feels like approval.') + '</i></p>',
    '</div>',
    '<div style="text-align:center;"><button class="btn-go" onclick="advanceTo(\'COLCHIS\')">Sail for Colchis &#9654;</button></div>',
    '<button class="btn-back" onclick="window.location.href=\'/student.html?view=heroic\'">&#8592; Dashboard</button>'
  ].join(''));
  updateHeader();
}

function drawSympFrame(ctx) {
  const S = SG, W = S.W, H = S.H;
  let sx = 0, sy = 0;
  if (S.shakeFrames > 0) { sx = (Math.random()-.5)*S.shakeMag; sy = (Math.random()-.5)*S.shakeMag; }
  ctx.save();
  ctx.translate(sx, sy);

  // Background — dark water with SNES scanline banding
  ctx.fillStyle = '#0a1520';
  ctx.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 6) {
    ctx.fillStyle = 'rgba(30,80,120,' + (0.12 + (y/H)*0.06) + ')';
    ctx.fillRect(0, y, W, 3);
  }
  // Wake lines
  ctx.strokeStyle = 'rgba(64,216,192,0.2)'; ctx.lineWidth = 2;
  for (let i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.moveTo(S.argoX-18, S.argoY+S.argoH/2+i*5);
    ctx.lineTo(S.argoX+18, S.argoY+S.argoH/2+i*5);
    ctx.stroke();
  }

  // Main rocks
  const rockY = S.vertDrift ? H*0.05 + S.vertOffset : H*0.05;
  const rockH = H * 0.92;
  drawRock(ctx, 0, rockY, S.rockLeft, rockH, 'left');
  drawRock(ctx, S.rockRight, rockY, W - S.rockRight, rockH, 'right');

  // Danger zone tint
  if (S.wavePhase === 'closing' || S.wavePhase === 'gap') {
    const gapW = S.rockRight - S.rockLeft;
    ctx.fillStyle = 'rgba(224,64,64,' + Math.max(0, 0.15 - gapW/W*0.15) + ')';
    ctx.fillRect(S.rockLeft, 0, gapW, H);
  }

  // Extra rocks
  S.extraRocks.forEach(r => drawRock(ctx, r.x, r.y, r.w, r.h, 'chunk'));

  // Warning flash
  if (S.wavePhase === 'warning') {
    const a = Math.abs(Math.sin(S.phaseTimer/180)) * 0.3;
    ctx.fillStyle = 'rgba(240,192,64,' + a + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f0c040'; ctx.font = 'bold 14px "Courier New"'; ctx.textAlign = 'center';
    ctx.fillText(S.mirrorEarly ? '[ PATTERN DETECTED — MIRROR ADVANTAGE ]' : '[ ROCKS CLOSING ]', W/2, H*0.10);
  }

  // Argo
  drawArgo(ctx, S.argoX, S.argoY, S.argoW, S.argoH, S.damaged && !S.builderBuffer);

  // Intro overlay
  if (S.wavePhase === 'intro') {
    ctx.fillStyle = 'rgba(8,8,15,0.7)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#f0c040'; ctx.font = 'bold 20px "Courier New"'; ctx.textAlign = 'center';
    ctx.fillText('WAVE ' + (S.wave+1) + ' OF 3', W/2, H/2-18);
    ctx.font = '13px "Courier New"'; ctx.fillStyle = '#40d8c0';
    ctx.fillText(S.wave===0 ? 'NAVIGATE THROUGH THE GAP' : S.wave===1 ? 'ROCKS DRIFT — STAY CENTERED' : 'MAXIMUM SPEED — EXTRA HAZARDS', W/2, H/2+14);
  }

  // Gap indicator
  if (S.wavePhase==='closing'||S.wavePhase==='gap') {
    const gapW = S.rockRight - S.rockLeft;
    ctx.fillStyle = gapW > S.argoW*1.6 ? 'rgba(64,192,96,0.8)' : 'rgba(224,64,64,0.9)';
    ctx.font = '11px "Courier New"'; ctx.textAlign = 'center';
    ctx.fillText('GAP: ' + Math.round(gapW) + 'px', W/2, H-10);
  }

  // Builder shield glow
  if (S.builderBuffer && !S.builderUsed && S.shakeFrames > 0) {
    ctx.strokeStyle = 'rgba(64,192,96,0.85)'; ctx.lineWidth = 3;
    ctx.strokeRect(S.argoX-S.argoW/2-5, S.argoY-S.argoH/2-5, S.argoW+10, S.argoH+10);
  }

  ctx.restore();

  // HUD timer (outside shake)
  const rem = Math.max(0, 90 - Math.floor(SG.totalTime/1000));
  const timerEl = el('symp-timer');
  if (timerEl) { timerEl.textContent = rem+'s'; timerEl.style.color = rem < 20 ? '#e04040':'#f0c040'; }
}

function drawRock(ctx, x, y, w, h, side) {
  if (w <= 0) return;
  const C = ['#5a4020','#7a5830','#9a7040'];
  const bW = Math.max(1, w/3);
  if (side==='left') {
    ctx.fillStyle=C[2]; ctx.fillRect(x,       y, Math.min(bW,w),            h);
    ctx.fillStyle=C[1]; ctx.fillRect(x+bW,    y, Math.min(bW, Math.max(0,w-bW)),   h);
    ctx.fillStyle=C[0]; ctx.fillRect(x+bW*2,  y, Math.max(0,w-bW*2),        h);
  } else if (side==='right') {
    ctx.fillStyle=C[0]; ctx.fillRect(x,       y, Math.min(bW,w),            h);
    ctx.fillStyle=C[1]; ctx.fillRect(x+bW,    y, Math.min(bW, Math.max(0,w-bW)),   h);
    ctx.fillStyle=C[2]; ctx.fillRect(x+bW*2,  y, Math.max(0,w-bW*2),        h);
  } else {
    ctx.fillStyle=C[1]; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=C[0]; ctx.fillRect(x,y,w,4);
    ctx.fillStyle=C[2]; ctx.fillRect(x,y+h-4,w,4);
  }
  ctx.fillStyle='rgba(0,0,0,0.28)';
  const cxs = side==='right' ? [x+w*0.25, x+w*0.6] : [x+w*0.3, x+w*0.65];
  cxs.forEach(cx => { for (let ry=y+12; ry<y+h-12; ry+=20) ctx.fillRect(cx, ry, 2, 10); });
  ctx.fillStyle='rgba(255,255,255,0.10)';
  if (side==='left')  ctx.fillRect(x+w-3, y, 3, h);
  if (side==='right') ctx.fillRect(x, y, 3, h);
}

function drawArgo(ctx, cx, cy, w, h, damaged) {
  const x=cx-w/2, y=cy-h/2;
  const hullC = damaged ? '#804020' : '#c89820';
  const sailC = damaged ? '#604030' : '#f0e8d0';
  ctx.fillStyle=hullC; ctx.fillRect(x, y+h*0.4, w, h*0.6);
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(x, y+h*0.8, w, h*0.2);
  ctx.fillStyle='#80510a'; ctx.fillRect(cx-2, y, 4, h*0.6);
  ctx.fillStyle=sailC; ctx.fillRect(cx-w*0.3, y+2, w*0.6, h*0.4);
  ctx.strokeStyle='#805810'; ctx.lineWidth=2;
  [-w*0.35, w*0.35].forEach(ox => {
    ctx.beginPath(); ctx.moveTo(cx+ox, y+h*0.55); ctx.lineTo(cx+ox*1.5, y+h*0.85); ctx.stroke();
  });
  if (damaged) { ctx.fillStyle='rgba(224,64,64,0.45)'; ctx.fillRect(x,y,w,h); }
  ctx.fillStyle='rgba(240,192,64,0.35)'; ctx.fillRect(x+w-4, y+h*0.4, 4, h*0.3);
}

// ============================================================
// COLCHIS COAST — The Fire-Breathing Bulls (spec section 5.2)
// Escape-room tile puzzle: cover all fire breath paths before timer.
// Medea's first appearance — moral choice to accept help or not.
// ============================================================

// Grid: 4 cols x 4 rows. Fire paths are [row,col] pairs to cover.
// Craft stat determines free pre-placed tiles (spec: 12+=2, 6-11=1, below=0).
// Wrong placements count toward 3-mistake limit.
// Failure: lose 10 provisions, redo. No checkpoint rollback.

const COLCHIS_COLS     = 4;
const COLCHIS_ROWS     = 4;
const COLCHIS_TIMER    = 60;  // seconds

// 8 fire-path cells the player must cover
const FIRE_CELLS = [
  [0,1],[0,3],
  [1,0],[1,2],
  [2,1],[2,3],
  [3,0],[3,2]
];

let CC = null;  // Colchis puzzle state

function initCC() {
  const cr = craft();
  const free = cr >= 12 ? 2 : cr >= 6 ? 1 : 0;
  const prePlaced = new Set(FIRE_CELLS.slice(0, free).map(([r,c]) => r+','+c));
  return {
    covered:        new Set(prePlaced),
    prePlaced,
    mistakes:       0,
    timeLeft:       COLCHIS_TIMER,
    timerInterval:  null,
    medeaAccepted:  false,
    medeaHelped:    false,
    seekerFreeUsed: false,
    free,
    done:           false
  };
}

// ── Entry point ──────────────────────────────────────────────
function renderColchis() {
  if (G.choices.colchis) { renderColchisOutcome(G.choices.colchis); return; }

  // Hull repair: Symplegades damage costs 15 Drachma here (spec: deducted at next market)
  const repairNote = G.symplegadesDamaged
    ? '<div class="banner b-hera">&#9874; <strong>Forge repair:</strong> The harbor forge patches your hull. 15 Drachma deducted.</div>'
    : '';
  if (G.symplegadesDamaged) {
    G.drachma = Math.max(0, G.drachma - 15);
    G.symplegadesDamaged = false;
    updateHeader();
  }

  const notices = [];
  const cr = craft();
  if (cr >= 12)
    notices.push('<div class="banner b-craft">&#128296; <strong>Craft ' + cr + ':</strong> Engineering skill pre-places 2 bronze tiles for you.</div>');
  else if (cr >= 6)
    notices.push('<div class="banner b-craft">&#128296; <strong>Craft ' + cr + ':</strong> Engineering skill pre-places 1 bronze tile for you.</div>');
  if (isAv('tested'))
    notices.push('<div class="banner b-avatar">&#9878; <strong>The Tested:</strong> Medea respects earned suffering. Her help costs no Honor.</div>');
  if (isAv('seeker'))
    notices.push('<div class="banner b-avatar">&#128270; <strong>The Seeker:</strong> Curiosity grants one free wrong placement before the mistake counter starts.</div>');

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#127807; Waypoint IV</div>',
    '<div class="wp-title">Colchis Coast</div>',
    '<div class="wp-sub">The Fire-Breathing Bulls &mdash; King Aeetes\' First Trial</div></div>',
    repairNote,
    notices.join(''),
    '<div class="narr">',
      '<p>King <em>Aeetes</em> has agreed to give you the Fleece &mdash; if you survive three trials. The first: yoke his fire-breathing bronze bulls and plow the <em>Field of Ares</em>. The bulls exhale jets of flame on a fixed pattern. Cover the fire paths with bronze shield-plates before you approach them, or be burned alive.</p>',
      '<p>A woman stands at the edge of the field. Dark-eyed, utterly still. She has not spoken yet. She knows exactly where the fire will land.</p>',
    '</div>',
    '<div style="text-align:center;">',
      '<button class="btn-go" onclick="startColchisPuzzle()">Begin the Trial &#9654;</button>',
    '</div>',
  ].join(''));
}

function startColchisPuzzle() {
  CC = initCC();
  renderMedeaOffer();
}

// ── Medea offer (spec: first decision — trust her or solve alone) ──
function renderMedeaOffer() {
  const honorCost  = isAv('tested') ? 0 : 1;
  const costLabel  = honorCost === 0
    ? '<span style="color:var(--green);">Free &mdash; Tested</span>'
    : '&ndash;1 Honor';

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#127807; Colchis &mdash; Before the Trial</div>',
    '<div class="wp-title">A Woman at the Edge of the Field</div></div>',
    '<div class="narr">',
      '<p>She approaches before you reach the gates. Up close her eyes are unsettling &mdash; she sees too much. <em>&ldquo;I know the pattern,&rdquo;</em> she says quietly. <em>&ldquo;I can show you where the fire lands. No one else here will.&rdquo;</em></p>',
      '<p>Her name is <em>Medea</em>. Daughter of the king. Priestess of Hecate. She should not be talking to you at all.</p>',
    '</div>',
    '<div class="choice-panel">',
      '<div class="choice-prompt">What do you do?</div>',
      '<div class="choice-grid">',
        '<div class="c-btn" onclick="acceptMedea()">',
          '<div class="c-tag tag-forced">' + costLabel + '</div>',
          '<div class="c-title">Accept her help</div>',
          '<div class="c-desc">She reveals the fire pattern. The puzzle becomes easier &mdash; the fire cells are shown. But you owe her something now, and she knows it.</div>',
        '</div>',
        '<div class="c-btn" onclick="refuseMedea()">',
          '<div class="c-tag tag-honor">HONOR INTACT</div>',
          '<div class="c-title">Solve it yourself</div>',
          '<div class="c-desc">You study the bulls\' movement &mdash; their eyes, the angle of their heads, the rhythm of their breathing. Harder, but the victory is yours alone.</div>',
        '</div>',
      '</div>',
    '</div>',
  ].join(''));
}

function acceptMedea() {
  const honorCost = isAv('tested') ? 0 : 1;
  G.honor = Math.max(0, G.honor - honorCost);
  G.medeaHelpCount++;
  CC.medeaAccepted = true;
  CC.medeaHelped   = true;
  // Reveal all fire cells as pre-placed hints
  FIRE_CELLS.forEach(([r,c]) => CC.prePlaced.add(r+','+c));
  recordChoice('medea_colchis', 'accepted');
  updateHeader();
  renderPuzzle();
}

function refuseMedea() {
  CC.medeaAccepted = false;
  recordChoice('medea_colchis', 'refused');
  renderPuzzle();
}

// ── Puzzle board ────────────────────────────────────────────
function renderPuzzle() {
  const medeaNote = CC.medeaHelped
    ? '<div class="banner b-hera">&#9733; Medea revealed the fire pattern. Red cells show where the flames will land &mdash; cover them all.</div>'
    : '';
  const seekerNote = isAv('seeker') && !CC.seekerFreeUsed
    ? '<div class="banner b-avatar">&#128270; <strong>Seeker:</strong> Your first wrong placement is free &mdash; curiosity lets you experiment once without penalty.</div>'
    : '';

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#127807; Colchis &mdash; The Puzzle</div>',
    '<div class="wp-title">Cover the Fire Paths</div>',
    '<div class="wp-sub">Place bronze shield-tiles on every fire cell before time runs out</div></div>',
    medeaNote,
    seekerNote,
    // HUD row
    '<div style="width:100%;display:flex;justify-content:space-between;align-items:center;',
         'font-family:var(--px);font-size:13px;padding:0 4px;margin-bottom:8px;">',
      '<span style="color:var(--text2);">Mistakes: <span id="cc-err" style="color:var(--red);font-weight:700;">',
        CC.mistakes, '</span> / 3</span>',
      '<span style="color:var(--gold);">&#9200; <span id="cc-time">', CC.timeLeft, '</span>s</span>',
      '<span style="color:var(--text2);">Covered: <span id="cc-done" style="color:var(--green);font-weight:700;">',
        CC.covered.size, '</span> / ', FIRE_CELLS.length, '</span>',
    '</div>',
    // Grid
    '<div id="cc-grid" style="display:grid;grid-template-columns:repeat(', COLCHIS_COLS, ',1fr);',
         'gap:10px;width:100%;max-width:440px;margin:0 auto 16px;"></div>',
    // Instructions
    '<div style="font-family:var(--px);font-size:12px;color:var(--text2);text-align:center;line-height:1.9;">',
      'Click a cell to place a bronze shield-tile &nbsp;&middot;&nbsp;',
      'Cover every fire cell &nbsp;&middot;&nbsp;',
      '3 wrong placements = &ndash;10 provisions &amp; puzzle resets',
    '</div>',
  ].join(''));

  buildGrid();
  startCCTimer();
}

function buildGrid() {
  const grid = document.getElementById('cc-grid');
  if (!grid) return;
  grid.innerHTML = '';

  for (let r = 0; r < COLCHIS_ROWS; r++) {
    for (let c = 0; c < COLCHIS_COLS; c++) {
      const key      = r + ',' + c;
      const isFire   = FIRE_CELLS.some(([fr,fc]) => fr===r && fc===c);
      const covered  = CC.covered.has(key);
      const revealed = CC.medeaHelped && isFire;

      const cell = document.createElement('div');
      cell.style.cssText = 'height:80px;border-radius:4px;display:flex;align-items:center;' +
        'justify-content:center;font-size:26px;transition:all .12s;border:2px solid;cursor:pointer;' +
        (covered  ? 'background:#3a2a10;border-color:#c89820;'
                  : revealed ? 'background:rgba(224,64,64,.1);border-color:rgba(224,64,64,.5);'
                              : 'background:var(--bg2);border-color:var(--bg3);');

      cell.textContent = covered ? '\uD83D\uDEE1' : revealed ? '\uD83D\uDD25' : '';
      cell.dataset.r = r; cell.dataset.c = c;

      if (!covered) {
        cell.addEventListener('click', () => onCellClick(r, c));
        cell.addEventListener('mouseenter', () => {
          if (!CC.covered.has(r+','+c)) cell.style.background = 'var(--bg3)';
        });
        cell.addEventListener('mouseleave', () => {
          if (!CC.covered.has(r+','+c))
            cell.style.background = (CC.medeaHelped && FIRE_CELLS.some(([fr,fc])=>fr===r&&fc===c))
              ? 'rgba(224,64,64,.1)' : 'var(--bg2)';
        });
      }
      grid.appendChild(cell);
    }
  }
  syncHUD();
}

function onCellClick(r, c) {
  if (!CC || CC.done) return;
  const key    = r + ',' + c;
  if (CC.covered.has(key)) return;

  const isFire = FIRE_CELLS.some(([fr,fc]) => fr===r && fc===c);

  if (isFire) {
    CC.covered.add(key);
    buildGrid();
    if (FIRE_CELLS.every(([fr,fc]) => CC.covered.has(fr+','+fc))) colchisSuccess();
  } else {
    // Wrong placement
    if (isAv('seeker') && !CC.seekerFreeUsed) {
      CC.seekerFreeUsed = true;
      flashCell(r, c, 'orange');
      return;
    }
    CC.mistakes++;
    flashCell(r, c, 'red');
    syncHUD();
    if (CC.mistakes >= 3) colchisMistakeLimit();
  }
}

function flashCell(r, c, color) {
  const grid = document.getElementById('cc-grid');
  if (!grid) return;
  const cell = grid.children[r * COLCHIS_COLS + c];
  if (!cell) return;
  const orig = cell.style.background;
  cell.style.background = color === 'red' ? 'rgba(224,64,64,.5)' : 'rgba(249,115,22,.5)';
  setTimeout(() => { cell.style.background = orig; }, 500);
}

function syncHUD() {
  const errEl  = document.getElementById('cc-err');
  const doneEl = document.getElementById('cc-done');
  if (errEl)  errEl.textContent  = CC.mistakes;
  if (doneEl) doneEl.textContent = CC.covered.size;
}

function startCCTimer() {
  if (CC.timerInterval) clearInterval(CC.timerInterval);
  CC.timerInterval = setInterval(() => {
    if (!CC || CC.done) { clearInterval(CC.timerInterval); return; }
    CC.timeLeft--;
    const t = document.getElementById('cc-time');
    if (t) { t.textContent = CC.timeLeft; t.style.color = CC.timeLeft <= 15 ? 'var(--red)' : 'var(--gold)'; }
    if (CC.timeLeft <= 0) colchisTimeout();
  }, 1000);
}

function stopCCTimer() {
  if (CC && CC.timerInterval) { clearInterval(CC.timerInterval); CC.timerInterval = null; }
}

// ── Outcomes ─────────────────────────────────────────────────
function colchisSuccess() {
  CC.done = true;
  stopCCTimer();
  G.choices.colchis = CC.medeaAccepted ? 'success_medea' : 'success_solo';
  recordChoice('colchis', G.choices.colchis);
  saveCheckpoint('COLCHIS');
  renderColchisOutcome(G.choices.colchis);
}

function resetPuzzleAfterFail() {
  // Preserve Medea help state if already accepted
  const wasMediaHelped = CC && CC.medeaHelped;
  const wasAccepted    = CC && CC.medeaAccepted;
  CC = initCC();
  if (wasMediaHelped) {
    FIRE_CELLS.forEach(([r,c]) => CC.prePlaced.add(r+','+c));
    CC.medeaHelped   = true;
    CC.medeaAccepted = wasAccepted;
  }
}

function colchisMistakeLimit() {
  CC.done = true;
  stopCCTimer();
  G.provisions = Math.max(0, G.provisions - 10);
  updateHeader();
  resetPuzzleAfterFail();
  render([
    '<div class="wp-hdr"><div class="wp-loc">&#127807; Colchis &mdash; Setback</div>',
    '<div class="wp-title">The Bull Broke Through</div></div>',
    '<div class="outcome oc-danger">',
      '<div class="oc-title">Three Wrong Placements &mdash; Provisions Scattered</div>',
      '<div class="oc-body">The bronze bull charged through your gap before you could cover it. Provisions scattered across the field. You regroup, gather what remains, and study the pattern again. The fire does not change. You can do this.</div>',
      '<div class="eff-row">' + pip('&ndash;10 Provisions','neg') + pip('Puzzle resets','neu') + '</div>',
    '</div>',
    '<div style="text-align:center;">',
      '<button class="btn-go" onclick="renderPuzzle()">Try Again &#9654;</button>',
    '</div>',
  ].join(''));
}

function colchisTimeout() {
  CC.done = true;
  stopCCTimer();
  G.provisions = Math.max(0, G.provisions - 10);
  updateHeader();
  resetPuzzleAfterFail();
  render([
    '<div class="wp-hdr"><div class="wp-loc">&#127807; Colchis &mdash; Setback</div>',
    '<div class="wp-title">Time Ran Out</div></div>',
    '<div class="outcome oc-danger">',
      '<div class="oc-title">The Bulls Were Not Yoked</div>',
      '<div class="oc-body">The timer expired before all fire paths were covered. The bulls charged. Provisions lost. You drag yourself back to the starting line. The pattern has not changed &mdash; you know it better now.</div>',
      '<div class="eff-row">' + pip('&ndash;10 Provisions','neg') + pip('Puzzle resets','neu') + '</div>',
    '</div>',
    '<div style="text-align:center;">',
      '<button class="btn-go" onclick="renderPuzzle()">Try Again &#9654;</button>',
    '</div>',
  ].join(''));
}

function renderColchisOutcome(choice) {
  const usedMedea = choice && choice.includes('medea');
  const effs = [];
  if (usedMedea) {
    const hCost = isAv('tested') ? 0 : 1;
    effs.push(pip('Medea\'s help accepted','neu'));
    if (hCost > 0) effs.push(pip('&ndash;1 Honor','neg'));
    else           effs.push(pip('No Honor cost (Tested)','pos'));
  } else {
    effs.push(pip('Solved without Medea','pos'), pip('Honor intact','pos'));
  }

  const heraLine = G.honor >= 10
    ? 'Hera watched you complete the trial. She noted your method.'
    : 'Hera watched. She noted what you gave away.';

  render([
    '<div class="wp-hdr"><div class="wp-loc">&#127807; Colchis &mdash; Trial Complete</div>',
    '<div class="wp-title">The Bulls Are Yoked</div></div>',
    '<div class="outcome oc-success">',
      '<div class="oc-title">' + (usedMedea ? 'Trial Complete &mdash; With Help' : 'Trial Complete &mdash; Alone') + '</div>',
      '<div class="oc-body">' + (usedMedea
        ? 'Every bronze plate landed on a fire path. The bulls were yoked before a flame touched you. Medea watched from the field\'s edge, something unreadable in her expression. She expected you to be worse at this.'
        : 'You read the pattern yourself &mdash; watching the bulls\' eyes, the angle of their heads, the rhythm of their breathing. Every plate landed in the right place. No help. No debt. No obligation. Medea watched you in silence.') +
      '</div>',
      '<div class="eff-row">' + effs.join('') + '</div>',
    '</div>',
    '<div class="narr">',
      '<p>Two trials remain: the <em>Dragon\'s Field</em> &mdash; where the Teeth of the Serpent must be sown in the correct ritual order &mdash; and then the Fleece itself, guarded by a dragon that never sleeps. King Aeetes watches from the palace. He did not expect you to survive this far.</p>',
      '<p><i>' + heraLine + '</i></p>',
    '</div>',
    '<div style="text-align:center;">',
      '<button class="btn-go" onclick="advanceTo(\'DRAGONS_FIELD\')">Enter the Dragon\'s Field &#9654;</button>',
    '</div>',
  ].join(''));
  updateHeader();
}

    '<div style="text-align:center;"><button class="btn-go" onclick="window.location.href=\'/student.html?view=heroic\'">&#8592; Return to Dashboard</button></div>'
  ].join(''));
}

// NAVIGATION HELPERS

function goDashboard() { window.location.href = '/student.html?view=heroic'; }

// ============================================================
// RESET — clears chapter 1 progress and restarts
// ============================================================
async function resetChapter1() {
  if (!confirm('Restart Chapter 1 from the beginning? Your current progress will be lost.')) return;
  try {
    await fetch(API + '/heroic/checkpoint', {
      method:'POST', headers:H,
      body: JSON.stringify({
        chapter:1, waypoint:'IOLCOS',
        state_json:{companions:[],skepticalCompanion:null,honor:10,
          drachma:G.student ? (G.student.drachma||0) : 0,
          provisions:20,equipment:1,inventory:{},choices:{},
          medeaHelpCount:0,checkpoint_rollbacks:0},
        honor_score:10, drachma_balance:G.student ? (G.student.drachma||0) : 0, equipment_tier:1
      })
    });
  } catch(e) { console.warn('Reset save failed:', e); }
  // Reset local state
  G.honor=10; G.drachma=G.student?(G.student.drachma||0):0; G.provisions=20;
  G.equipment=1; G.inventory={}; G.companions=[]; G.skepticalCompanion=null;
  G.choices={}; G.medeaHelpCount=0; G.checkpoint_rollbacks=0;
  if (G.stats && craft() >= 10) G.equipment = 2;
  routeTo('IOLCOS');
}

function showDevBar(showReset) {
  const btn = el('dev-reset-btn');
  if (btn) btn.style.display = showReset ? 'inline-block' : 'none';
}
