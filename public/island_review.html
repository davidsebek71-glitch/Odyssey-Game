<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Island Approvals — Odyssey to Olympus</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --panel: rgba(30, 18, 56, 0.92); --line: rgba(167, 139, 250, 0.25); --text: #f3eefc; --muted: rgba(243,238,252,0.62);
          --gold: #f0c75e; --green: #6ee7a0; --amber: #fbbf24; --red: #f87171; --violet: #a78bfa; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; color: var(--text); background: linear-gradient(135deg, #0f0a1e, #1a0b2e 50%, #0f0a1e); min-height: 100vh; }
  button, select, textarea { font: inherit; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: rgba(20,10,40,0.8);
            position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
  .topbar h1 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.25rem; margin: 0; flex: 1; }
  .btn { background: rgba(167,139,250,0.14); border: 1px solid var(--line); color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .btn:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn.approve { background: linear-gradient(135deg, #16a34a, #15803d); border-color: #16a34a; font-weight: 700; }
  .btn.return { border-color: var(--red); color: var(--red); }
  .btn.active { border-color: var(--gold); color: var(--gold); }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  select { background: rgba(10,6,22,0.9); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .sub-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .sub-head .who { font-weight: 700; }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; margin-top: 10px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .body { white-space: pre-wrap; line-height: 1.6; background: rgba(10,6,22,0.6); border-radius: 8px; padding: 12px; max-height: 420px; overflow: auto; }
  .count { font-size: 0.85rem; margin-top: 6px; }
  .count .ok { color: var(--green); } .count .short { color: var(--amber); }
  .photo img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  .mini-map { position: relative; line-height: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .mini-map img { width: 100%; }
  .mini-map .dot { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--gold); border: 3px solid #1a0b2e;
                   transform: translate(-50%, -50%); box-shadow: 0 0 0 3px rgba(240,199,94,0.5); }
  textarea { width: 100%; min-height: 70px; background: rgba(10,6,22,0.85); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 10px; }
  .actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .warn { color: var(--amber); font-size: 0.88rem; }
  .msg { font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
  th { color: var(--violet); font-weight: 600; }
  td.n { text-align: center; }
  td:first-child { white-space: nowrap; }
  .empty { text-align: center; padding: 40px; color: var(--muted); }
  a { color: var(--gold); }
  .phase { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
  .phase .btn { padding: 12px 18px; font-weight: 700; }
  .phase .btn.on { border-color: var(--gold); color: var(--gold); background: rgba(240,199,94,0.12); }
  .settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 10px 0; }
  .settings label { font-size: 0.85rem; color: var(--muted); display: block; }
  .settings input { width: 100%; margin-top: 4px; background: rgba(10,6,22,0.9); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; }
  h2.sec { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.05rem; margin: 0 0 8px; }
  .q { background: rgba(10,6,22,0.6); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 0.92rem; }
  .q ol { margin: 6px 0 0; padding-left: 22px; }
  .q li.right { color: var(--green); font-weight: 700; }
</style>
</head>
<body>
<div class="topbar">
  <button class="btn" onclick="location.href='/teacher.html'">← Dashboard</button>
  <h1>Island Approvals</h1>
  <label class="muted" for="period">Period</label>
  <select id="period" onchange="refresh()"><option value="">All periods</option></select>
  <button class="btn active" id="tab-queue" onclick="setTab('queue')">Waiting for approval</button>
  <button class="btn" id="tab-responses" onclick="setTab('responses')">Visit responses</button>
  <button class="btn" id="tab-voyages" onclick="setTab('voyages')">Voyages</button>
  <button class="btn" id="tab-students" onclick="setTab('students')">All islands</button>
  <button class="btn" id="tab-games" onclick="setTab('games')">Mini games</button>
</div>
<main id="main"></main>

<script>
const token = localStorage.getItem('token');
if (!token) location.href = '/index.html';
const H = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
const ICONS = { shrine:'🏛️', creature:'🐉', landmark:'🗿', poem:'📜', lair:'🕳️', guardian:'🛡️', monster:'👹', river:'🌊', mountain:'⛰️', city:'🏘️' };
let tab = 'queue';
const mapCache = {};

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(k => { if (k !== null && k !== undefined) e.append(k.nodeType ? k : document.createTextNode(k)); });
  return e;
}
async function api(method, url, body) {
  const r = await fetch('/api' + url, { method, headers: H, body: body ? JSON.stringify(body) : undefined });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401 || r.status === 403) { if (!d.error || /teacher/i.test(d.error) || /token/i.test(d.error)) throw new Error('Please log in as the teacher.'); }
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
function setTab(t) {
  tab = t;
  ['queue', 'responses', 'voyages', 'students', 'games'].forEach(x => document.getElementById('tab-' + x).classList.toggle('active', t === x));
  refresh();
}
const period = () => document.getElementById('period').value;

async function loadPeriods() {
  try {
    const d = await api('GET', '/teacher/island/students');
    const sel = document.getElementById('period');
    (d.periods || []).forEach(p => sel.append(el('option', { value: p, text: p })));
  } catch (e) { /* shown by refresh */ }
}

async function refresh() {
  const main = document.getElementById('main');
  main.replaceChildren(el('div', { class: 'empty', text: 'Loading…' }));
  try {
    if (tab === 'queue') return renderQueue((await api('GET', '/teacher/island/queue' + (period() ? '?period=' + encodeURIComponent(period()) : ''))).pins);
    if (tab === 'games') return renderGames((await api('GET', '/teacher/games' + (period() ? '?period=' + encodeURIComponent(period()) : ''))).games);
    if (tab === 'responses') return renderResponses((await api('GET', '/teacher/voyage/responses' + (period() ? '?period=' + encodeURIComponent(period()) : ''))).responses);
    if (tab === 'voyages') {
      if (!period()) return main.replaceChildren(el('div', { class: 'empty', text: 'Choose a period above to manage its voyages.' }));
      return renderVoyages(await api('GET', '/teacher/voyage/overview?period=' + encodeURIComponent(period())));
    }
    return renderStudents((await api('GET', '/teacher/island/students' + (period() ? '?period=' + encodeURIComponent(period()) : ''))).students);
  } catch (e) { main.replaceChildren(el('div', { class: 'empty', text: e.message })); }
}

async function studentMap(studentId) {
  if (!(studentId in mapCache)) {
    try { mapCache[studentId] = (await api('GET', '/island/view/' + studentId)).map_image; } catch (e) { mapCache[studentId] = null; }
  }
  return mapCache[studentId];
}
async function photo(pinId, box) {
  try {
    const r = await fetch(`/api/island/pins/${pinId}/photo`, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw new Error();
    box.replaceChildren(el('img', { src: URL.createObjectURL(await r.blob()), alt: 'Student photo' }));
  } catch (e) { box.replaceChildren(el('span', { class: 'muted', text: 'Photo could not be loaded.' })); }
}

function renderQueue(pins) {
  const main = document.getElementById('main');
  if (!pins.length) return main.replaceChildren(el('div', { class: 'empty', text: 'Nothing is waiting for approval. 🎉' }));
  main.replaceChildren(el('p', { class: 'muted', text: `${pins.length} waiting · oldest first` }), ...pins.map(renderSubmission));
}

function renderSubmission(p) {
  const card = el('div', { class: 'card' });
  const note = el('textarea', { placeholder: 'Note to the student (required to return it; optional when approving)', 'aria-label': `Note for ${p.student_name}` });
  const msg = el('span', { class: 'msg' });
  const countPart = (n, min, unit) => el('span', { class: min ? (n >= min ? 'ok' : 'short') : '' }, min ? `${n} / ${min} ${unit}` : `${n} ${unit}`);
  const mapBox = el('div', { class: 'mini-map' }, el('span', { class: 'muted', style: 'line-height:1.4;display:block;padding:8px', text: 'Loading map…' }));
  studentMap(p.owner_student_id).then(src => {
    if (!src) return mapBox.replaceChildren(el('span', { class: 'muted', style: 'line-height:1.4;display:block;padding:8px', text: 'No map uploaded.' }));
    mapBox.replaceChildren(...[el('img', { src, alt: `${p.student_name}'s map` }),
      p.x_pct !== null ? el('span', { class: 'dot', style: `left:${p.x_pct}%;top:${p.y_pct}%` }) : null].filter(Boolean));
  });
  const photoBox = p.has_photo ? el('div', { class: 'photo' }, el('span', { class: 'muted', text: 'Loading photo…' })) : null;
  if (photoBox) photo(p.pin_id, photoBox);
  async function review(action) {
    msg.textContent = ''; card.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      const r = await api('POST', `/teacher/island/pins/${p.pin_id}/review`, { action, note: note.value });
      card.replaceChildren(el('div', { class: 'sub-head' }, el('span', { class: 'who', text: p.student_name }), el('span', { text: p.title }),
        el('span', { style: `color:${action === 'approve' ? 'var(--green)' : 'var(--red)'}`,
          text: action === 'approve' ? `✓ Published${r.points_awarded ? ` · +${r.points_awarded} points to ${p.alliance_name || 'the alliance'}` : ''}` : '↩ Returned to the student' })));
    } catch (e) { msg.textContent = e.message; msg.style.color = 'var(--red)'; card.querySelectorAll('button').forEach(b => b.disabled = false); }
  }
  card.append(...[
    el('div', { class: 'sub-head' },
      el('span', { text: ICONS[p.pin_type] || '📍' }), el('span', { class: 'who', text: p.student_name }),
      el('span', { class: 'muted', text: `${p.alliance_name || 'No alliance'} · Period ${p.class_period}` }),
      el('span', { class: 'muted', text: p.quest_title ? `Quest: ${p.quest_title}${p.quest_points ? ` (${p.quest_points} pts)` : ''}` : `Named ${p.pin_type}` })),
    el('h2', { style: 'font-family:Cinzel,serif;color:var(--gold);font-size:1.1rem;margin:10px 0 0', text: p.title || 'Untitled' }),
    el('div', { class: 'grid' },
      el('div', {},
        el('div', { class: 'body', text: p.body || '(no writing)' }),
        el('div', { class: 'count' }, countPart(p.word_count, p.min_words, 'words'), ' · ', countPart(p.line_count, p.min_lines, 'lines')),
        p.video_url ? el('p', {}, el('a', { href: p.video_url, target: '_blank', rel: 'noopener noreferrer' }, '▶ Open the video link')) : null,
        photoBox,
        p.extra && (p.extra.dangers || []).length ? el('div', { class: 'q' }, el('strong', { text: 'The four dangers: ' }),
          el('ol', {}, p.extra.dangers.map(d => el('li', { text: `${d.label || '(no label)'}${d.x_pct === null || d.x_pct === undefined ? ' — not placed' : ''}` })))) : null,
        p.attributes && p.attributes.length ? el('div', { class: 'q' }, el('strong', { text: 'Attributes and counters (approve these with the monster): ' }),
          el('ol', {}, p.attributes.map(a => el('li', {}, a.description || '(blank)', el('div', { class: 'muted', style: 'font-size:0.85rem' },
            a.counter_type === 'god' ? `Countered by the god power: ${a.counter_value || '(none chosen)'}` :
            `Countered by answering: ${(a.counter_value || {}).prompt || ''} → ${((a.counter_value || {}).options || [])[(a.counter_value || {}).correct_index] || '(no answer marked)'}`)))),
          p.extra && p.extra.hero_gains ? el('div', {}, el('strong', { text: 'What the hero gains: ' }), p.extra.hero_gains) : null) : null,
        p.question && p.question.prompt ? el('div', { class: 'q' }, el('strong', { text: p.pin_type === 'guardian' ? 'The Guardian\'s Test: ' : 'Question for visitors: ' }), p.question.prompt,
          el('ol', {}, p.question.options.map((o, i) => el('li', { class: i === p.question.correct_index ? 'right' : '' }, o + (i === p.question.correct_index ? ' ✓' : ''))))) : null),
      el('div', {}, el('div', { class: 'muted', style: 'font-size:0.85rem;margin-bottom:6px', text: 'Where it sits on the island' }), mapBox)),
    p.submit_problem ? el('div', { class: 'warn', text: `Note: ${p.submit_problem}` }) : null,
    note,
    el('div', { class: 'actions' },
      el('button', { class: 'btn approve', onclick: () => review('approve') }, '✓ Approve and publish'),
      el('button', { class: 'btn return', onclick: () => {
        if (!note.value.trim()) { msg.textContent = 'Write a note telling the student what to change.'; msg.style.color = 'var(--amber)'; note.focus(); return; }
        review('return'); } }, '↩ Return with note'),
      el('a', { href: `/island.html?student=${p.owner_student_id}`, target: '_blank' }, 'Open the whole island'),
      msg)].filter(Boolean));
  return card;
}

function renderStudents(rows) {
  const main = document.getElementById('main');
  if (!rows.length) return main.replaceChildren(el('div', { class: 'empty', text: 'No students in this period.' }));
  main.replaceChildren(el('div', { class: 'card' }, el('table', {},
    el('thead', {}, el('tr', {}, ['Student', 'Alliance', 'Period', 'Map', 'Terrain checked', 'Published', 'Waiting', 'Returned', 'Drafts', ''].map(h => el('th', { text: h })))),
    el('tbody', {}, rows.map(s => el('tr', {},
      el('td', { text: s.name }), el('td', { text: s.alliance_name || '—' }), el('td', { text: s.class_period || '—' }),
      el('td', { class: 'n', text: s.has_map ? '✓' : '—' }),
      el('td', { class: 'n', text: s.terrain_ok ? '✓' : '—' }),
      ...['published', 'submitted', 'returned', 'drafts'].map(k => el('td', { class: 'n', text: String(s[k] || 0) })),
      el('td', {}, el('a', { href: `/island.html?student=${s.student_id}`, target: '_blank' }, 'Open island'))))))));
}

// ── Mini games (Stage 7): approve → a teammate play-tests → published ──────
const G_EVENT = { touches: 'touches', picks_up: 'picks up', enters: 'enters', talks_to: 'talks to', answers: 'answers' };
const G_DO = { survive: 'reader SURVIVES', perish: 'reader PERISHES', message: 'message', open_path: 'opens a path through', appear: 'makes appear', vanish: 'makes vanish', move: 'moves the reader' };
function renderGames(rows) {
  const main = document.getElementById('main');
  if (!rows.length) return main.replaceChildren(el('div', { class: 'empty', text: 'No mini games are waiting. 🎉' }));
  main.replaceChildren(el('p', { class: 'muted', text: 'Approve → a teammate play-tests it → readers can play. "Publish now" skips the play-test.' }), ...rows.map(g => {
    const card = el('div', { class: 'card' }), msg = el('span', { class: 'msg' });
    const nm = id => { const t = g.things.find(x => x.id === id); return t ? `${t.emoji} ${t.name}` : '?'; };
    const note = el('input', { type: 'text', maxlength: '500', placeholder: 'Note to the student (needed to return it)', style: 'flex:1;min-width:220px' });
    async function act(action) {
      card.querySelectorAll('button').forEach(b => b.disabled = true);
      try {
        const d = await api('POST', `/teacher/games/${g.pin_id}/review`, { action, note: note.value });
        card.replaceChildren(el('div', { class: 'sub-head' }, el('span', { class: 'who', text: g.student_name }), el('span', { text: `"${g.story_title}"` }),
          el('span', { style: `color:${action === 'return' ? 'var(--red)' : 'var(--green)'}`, text: { approved: '✓ Approved — a teammate play-tests it next', published: '✓ Published', returned: 'Returned with your note' }[d.status] })));
      } catch (e) { msg.textContent = e.message; msg.style.color = 'var(--red)'; card.querySelectorAll('button').forEach(b => b.disabled = false); }
    }
    card.append(
      el('div', { class: 'sub-head' }, el('span', { class: 'who', text: g.student_name }), el('span', { text: `"${g.story_title}"` }),
        el('span', { class: 'muted', text: `· Period ${g.class_period} · ${g.level} level · ${g.status === 'approved' ? 'approved, waiting for a teammate play-test' : 'waiting for you'}` })),
      el('div', { style: 'margin-top:8px' }, el('strong', { text: 'Clue from the story: ' }), el('span', { text: g.clue_text || '—' })),
      el('div', { style: 'margin-top:6px', class: 'muted', text: 'Things: ' + g.things.map(t => `${t.emoji} ${t.name}`).join(', ') }),
      el('ol', { style: 'margin:8px 0;padding-left:22px;line-height:1.6' }, g.rules.map(r => el('li', { text:
        `When the reader ${G_EVENT[r.when.event] || r.when.event} ${nm(r.when.thing)}${r.when.event === 'answers' ? ' ' + (r.when.answer === 'wrong' ? 'wrongly' : 'correctly') : ''}` +
        (r.if && r.if.carrying ? ` and is ${r.if.not ? 'NOT ' : ''}carrying ${nm(r.if.carrying)}` : '') +
        ` → ${G_DO[r.then.do] || r.then.do}${r.then.thing ? ' ' + nm(r.then.thing) : ''}${r.then.text ? ': "' + r.then.text + '"' : ''}` }))),
      g.things.filter(t => t.question && t.question.prompt).map(t => el('div', { class: 'muted', style: 'font-size:0.9rem' },
        `${t.emoji} ${t.name} asks: ${t.question.prompt} (${t.question.options.filter(o => o).map((o, i) => i === t.question.correct_index ? o + ' ✓' : o).join(' / ')})`)),
      el('div', { style: `margin-top:6px;color:${g.check.ok ? 'var(--green)' : 'var(--amber)'}`, text: g.check.ok ? `✓ Winnable (${g.check.winning_moves} moves)` : 'Problems: ' + g.check.problems.join(' ') }),
      el('div', { class: 'actions', style: 'flex-wrap:wrap' },
        el('a', { class: 'btn', href: `/game.html?pin=${g.pin_id}`, target: '_blank' }, '▶ Play it'),
        g.status === 'submitted' ? el('button', { class: 'btn approve', onclick: () => act('approve') }, '✓ Approve (teammate play-tests next)') : null,
        el('button', { class: 'btn approve', onclick: () => act('publish') }, 'Publish now'),
        note, el('button', { class: 'btn return', onclick: () => act('return') }, 'Return with note'), msg));
    return card;
  }));
}

// ── Visit responses: approve before the author can read them ───────────────
function renderResponses(rows) {
  const main = document.getElementById('main');
  if (!rows.length) return main.replaceChildren(el('div', { class: 'empty', text: 'No visit responses are waiting. 🎉' }));
  main.replaceChildren(el('p', { class: 'muted', text: `${rows.length} waiting · the author reads a response only after you approve it` }), ...rows.map(r => {
    const card = el('div', { class: 'card' });
    const msg = el('span', { class: 'msg' });
    async function act(action) {
      if (action === 'hide' && !confirm(`Hide this response? The author won't see it, and the visit's points (${r.points_visitor + r.points_author}) are taken back from both alliances.`)) return;
      card.querySelectorAll('button').forEach(b => b.disabled = true);
      try {
        const d = await api('POST', `/teacher/voyage/responses/${r.visit_id}`, { action });
        card.replaceChildren(el('div', { class: 'sub-head' }, el('span', { class: 'who', text: r.visitor_name }), el('span', { text: `→ ${r.author_name}: "${r.pin_title}"` }),
          el('span', { style: `color:${action === 'approve' ? 'var(--green)' : 'var(--red)'}`,
            text: action === 'approve' ? '✓ Approved — the author can read it' : `Hidden · ${d.points_removed} points taken back` })));
      } catch (e) { msg.textContent = e.message; msg.style.color = 'var(--red)'; card.querySelectorAll('button').forEach(b => b.disabled = false); }
    }
    const answer = r.answer_correct ? (r.attempts > 1 ? 'answered right on the 2nd try' : 'answered right first try') : 'answer shown after 2 misses';
    card.append(
      el('div', { class: 'sub-head' }, el('span', { class: 'who', text: r.visitor_name }), el('span', { class: 'muted', text: r.visitor_alliance || '' }),
        el('span', { text: `visited ${r.author_name}'s "${r.pin_title}"` }), el('span', { class: 'muted', text: `· Period ${r.class_period} · ${answer}` })),
      el('div', { class: 'body', style: 'margin-top:10px', text: r.response_text }),
      el('div', { class: 'count', text: `${r.word_count} words` }),
      el('div', { class: 'actions' },
        el('button', { class: 'btn approve', onclick: () => act('approve') }, '✓ Approve — send to the author'),
        el('button', { class: 'btn return', onclick: () => act('hide') }, 'Hide (takes the points back)'), msg));
    return card;
  }));
}

// ── Voyages: phase, settings, tokens, per-student table ─────────────────────
const SETTING_LABELS = { tokens_per_publish: 'Tokens per approved piece', visit_cap: 'Visits per student per voyage',
  visitor_points: 'Points to the visitor\'s alliance', author_points: 'Points to the author\'s alliance', min_response_words: 'Minimum words in a response' };
function renderVoyages(d) {
  const main = document.getElementById('main');
  const s = d.settings;
  const msg = el('span', { class: 'msg' });
  async function save(body, okText) {
    try { await api('POST', '/teacher/voyage/settings', Object.assign({ class_period: period() }, body)); await refresh(); }
    catch (e) { msg.textContent = e.message; msg.style.color = 'var(--red)'; }
  }
  const inputs = {};
  const phase = el('div', { class: 'card' },
    el('h2', { class: 'sec', text: `Period ${period()} — ${s.mode === 'voyage' ? '⛵ Voyage open' : '🏗️ Build time'}` }),
    el('div', { class: 'muted', text: s.mode === 'voyage'
      ? 'Students can spend their alliance\'s tokens to visit other alliances\' islands.'
      : 'Students build their islands. Approved pieces still earn tokens for the next voyage.' }),
    el('div', { class: 'phase' },
      el('button', { class: `btn${s.mode === 'build' ? ' on' : ''}`, onclick: () => s.mode !== 'build' && save({ mode: 'build' }) }, '🏗️ Build'),
      el('button', { class: `btn${s.mode === 'voyage' ? ' on' : ''}`, onclick: () => s.mode !== 'voyage' && save({ mode: 'voyage' }) }, '⛵ Voyage'),
      el('a', { href: `/world.html?period=${encodeURIComponent(period())}`, target: '_blank', style: 'align-self:center' }, 'Preview the world map')),
    el('div', { class: 'muted', style: 'font-size:0.85rem', text: 'Opening a voyage starts each student\'s visit count over. Visits already in progress can still be finished in build time.' }),
    el('div', { class: 'settings' }, Object.keys(SETTING_LABELS).map(k => {
      inputs[k] = el('input', { type: 'number', min: '0', value: String(s[k]) });
      return el('label', {}, SETTING_LABELS[k], inputs[k]);
    })),
    el('div', { class: 'actions' }, el('button', { class: 'btn', onclick: () => {
      const body = {}; Object.keys(inputs).forEach(k => body[k] = parseInt(inputs[k].value)); save(body);
    } }, 'Save settings'), msg));

  const tokens = el('div', { class: 'card' }, el('h2', { class: 'sec', text: 'Voyage tokens' }),
    d.alliances.length ? el('table', {}, el('thead', {}, el('tr', {}, ['Alliance', 'Tokens', ''].map(h => el('th', { text: h })))),
      el('tbody', {}, d.alliances.map(a => el('tr', {}, el('td', { text: a.alliance_name }), el('td', { class: 'n', text: String(a.tokens) }),
        el('td', {}, ...[-1, 1].map(n => el('button', { class: 'btn', style: 'padding:3px 10px;margin-right:6px', 'aria-label': `${n > 0 ? 'Add' : 'Remove'} a token for ${a.alliance_name}`,
          onclick: async () => { try { await api('POST', '/teacher/voyage/tokens', { alliance_id: a.alliance_id, delta: n }); refresh(); } catch (e) { alert(e.message); } } }, n > 0 ? '+1' : '−1'))))))) :
      el('div', { class: 'muted', text: 'No alliances in this period.' }));

  const students = el('div', { class: 'card' }, el('h2', { class: 'sec', text: 'Students' }),
    el('table', {}, el('thead', {}, el('tr', {}, ['Student', 'Alliance', 'Pieces published', 'Visits (this voyage / all)', 'Responses approved', 'Responses waiting', 'Times visited', 'Visit in progress']
      .map(h => el('th', { text: h })))),
      el('tbody', {}, d.students.map(r => el('tr', {},
        el('td', { text: r.name }), el('td', { text: r.alliance_name || '—' }), el('td', { class: 'n', text: String(r.published) }),
        el('td', { class: 'n', text: `${r.visits_this_voyage} / ${r.visits_made}` }), el('td', { class: 'n', text: String(r.responses_left) }),
        el('td', { class: 'n', text: String(r.responses_waiting) }), el('td', { class: 'n', text: String(r.times_visited) }),
        el('td', {}, r.open_visit_id ? el('button', { class: 'btn', style: 'padding:3px 10px', onclick: async () => {
          if (!confirm(`End ${r.name}'s visit in progress? Their alliance gets the token back.`)) return;
          try { await api('POST', `/teacher/voyage/visits/${r.open_visit_id}/cancel`); refresh(); } catch (e) { alert(e.message); } } }, 'End visit') : '—'))))));
  main.replaceChildren(phase, tokens, students);
}

loadPeriods().then(refresh);
</script>
