<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Selection - Odyssey to Olympus</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0d0a12;
            color: #e2d8c8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(139, 69, 19, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(30, 58, 138, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(180, 140, 60, 0.08) 0%, transparent 40%);
            z-index: 0;
            animation: bgShift 12s ease-in-out infinite alternate;
        }
        @keyframes bgShift {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: rgba(255, 215, 0, 0.4);
            border-radius: 50%;
            animation: floatUp 8s ease-in-out infinite;
        }
        .particle:nth-child(2) { left: 15%; animation-delay: -2s; animation-duration: 10s; background: rgba(200,200,255,0.3); }
        .particle:nth-child(3) { left: 30%; animation-delay: -4s; animation-duration: 7s; }
        .particle:nth-child(4) { left: 45%; animation-delay: -1s; animation-duration: 9s; background: rgba(200,200,255,0.3); }
        .particle:nth-child(5) { left: 60%; animation-delay: -3s; animation-duration: 11s; }
        .particle:nth-child(6) { left: 75%; animation-delay: -5s; animation-duration: 8s; background: rgba(200,200,255,0.3); }
        .particle:nth-child(7) { left: 90%; animation-delay: -2.5s; animation-duration: 10s; }
        .particle:nth-child(8) { left: 5%; animation-delay: -6s; animation-duration: 12s; background: rgba(200,200,255,0.2); }
        @keyframes floatUp {
            0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; transform: translateY(90vh) scale(1); }
            90% { opacity: 0.5; transform: translateY(10vh) scale(0.5); }
        }

        /* Header */
        .header {
            position: relative; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px;
            background: linear-gradient(135deg, rgba(30,15,10,0.95), rgba(10,15,30,0.95));
            border-bottom: 2px solid;
            border-image: linear-gradient(90deg, #b8860b, #ffd700, #4a90d9, #b8860b) 1;
        }
        .header-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem; font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #f0c040, #ffd700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .student-name {
            font-family: 'Cinzel', serif; font-weight: 600;
            color: #f0c040; font-size: 0.95rem;
        }
        .logout-btn {
            background: rgba(220,38,38,0.2); border: 1px solid rgba(220,38,38,0.5);
            color: #fca5a5; padding: 6px 14px; border-radius: 6px;
            cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.3s;
        }
        .logout-btn:hover { background: rgba(220,38,38,0.4); }

        /* Alliance Bar */
        .alliance-bar {
            position: relative; z-index: 10;
            display: flex; justify-content: center; align-items: center; gap: 32px;
            padding: 14px 24px;
            background: rgba(15,12,20,0.9);
            border-bottom: 1px solid rgba(255,215,0,0.15);
        }
        .alliance-stat {
            font-family: 'Cinzel', serif; font-size: 0.95rem; color: #c9b896;
        }
        .alliance-stat strong { color: #ffd700; }

        /* Main Content */
        .main-content {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            padding: 60px 24px; min-height: calc(100vh - 120px);
        }
        .choose-title {
            font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 700;
            color: #e2d8c8; margin-bottom: 8px; letter-spacing: 3px;
            text-align: center;
        }
        .choose-subtitle {
            font-size: 1rem; color: #9a8b76; margin-bottom: 48px;
            text-align: center;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Portal Cards Container */
        .portal-cards {
            display: flex; gap: 48px; justify-content: center;
            flex-wrap: wrap; max-width: 900px;
        }

        /* Portal Card Base */
        .portal-card {
            position: relative; width: 360px; min-height: 440px;
            border-radius: 16px; padding: 40px 32px;
            display: flex; flex-direction: column; align-items: center;
            text-align: center; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
        }
        .portal-card:hover:not(.portal-locked) { transform: translateY(-8px) scale(1.02); }

        /* Archaic Portal */
        .portal-archaic {
            background: linear-gradient(160deg, rgba(50,20,10,0.9), rgba(30,15,8,0.95));
            border: 2px solid rgba(184,134,11,0.4);
            box-shadow: 0 8px 32px rgba(139,69,19,0.3), inset 0 1px 0 rgba(255,215,0,0.1);
        }
        .portal-archaic:hover {
            border-color: rgba(255,215,0,0.6);
            box-shadow: 0 16px 48px rgba(184,134,11,0.4), 0 0 60px rgba(255,215,0,0.1), inset 0 1px 0 rgba(255,215,0,0.2);
        }
        .portal-archaic .portal-icon {
            font-size: 4.5rem; margin-bottom: 20px;
            filter: drop-shadow(0 4px 20px rgba(184,134,11,0.5));
        }
        .portal-archaic .portal-age-name {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .portal-archaic .portal-enter-btn {
            background: linear-gradient(135deg, #b8860b, #daa520); color: #1a0a05;
        }
        .portal-archaic .portal-enter-btn:hover {
            background: linear-gradient(135deg, #daa520, #ffd700);
            box-shadow: 0 4px 20px rgba(218,165,32,0.5);
        }

        /* Classical Portal */
        .portal-classical {
            background: linear-gradient(160deg, rgba(10,20,45,0.9), rgba(8,15,35,0.95));
            border: 2px solid rgba(74,144,217,0.3);
            box-shadow: 0 8px 32px rgba(30,58,138,0.3), inset 0 1px 0 rgba(200,200,255,0.08);
        }
        .portal-classical:hover:not(.portal-locked) {
            border-color: rgba(74,144,217,0.6);
            box-shadow: 0 16px 48px rgba(30,58,138,0.4), 0 0 60px rgba(74,144,217,0.15), inset 0 1px 0 rgba(200,200,255,0.15);
        }
        .portal-classical .portal-icon {
            font-size: 4.5rem; margin-bottom: 20px;
            filter: drop-shadow(0 4px 20px rgba(74,144,217,0.5));
        }
        .portal-classical .portal-age-name {
            background: linear-gradient(135deg, #7cb3e8, #4a90d9, #c0d8f0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .portal-classical .portal-enter-btn {
            background: linear-gradient(135deg, #2563eb, #4a90d9); color: #fff;
        }
        .portal-classical .portal-enter-btn:hover {
            background: linear-gradient(135deg, #4a90d9, #7cb3e8);
            box-shadow: 0 4px 20px rgba(74,144,217,0.5);
        }
        /* Classical glow animation when unlocked */
        .portal-classical:not(.portal-locked) {
            animation: classicalPulse 3s ease-in-out infinite;
        }
        @keyframes classicalPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(30,58,138,0.3), inset 0 1px 0 rgba(200,200,255,0.08); }
            50% { box-shadow: 0 8px 48px rgba(30,58,138,0.5), 0 0 40px rgba(74,144,217,0.15), inset 0 1px 0 rgba(200,200,255,0.12); }
        }

        /* Locked State */
        .portal-locked { cursor: not-allowed; opacity: 0.6; }
        .portal-locked:hover { transform: none; }
        .lock-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); border-radius: 16px;
            display: none; flex-direction: column; justify-content: center;
            align-items: center; z-index: 5; padding: 20px;
        }
        .portal-locked .lock-overlay { display: flex; }
        .lock-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.8; }
        .lock-text {
            font-family: 'Cinzel', serif; font-size: 0.95rem;
            color: #9a8b76; max-width: 260px; line-height: 1.5;
        }

        /* Shared Card Elements */
        .portal-age-name {
            font-family: 'Cinzel', serif; font-size: 2rem; font-weight: 900; letter-spacing: 4px; margin-bottom: 8px;
        }
        .portal-age-label {
            font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 600;
            color: #9a8b76; letter-spacing: 3px; margin-bottom: 20px;
        }
        .portal-description {
            font-size: 0.9rem; line-height: 1.6; color: #b0a48e; margin-bottom: 28px; flex-grow: 1;
        }
        .portal-enter-btn {
            padding: 12px 36px; border: none; border-radius: 8px;
            font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700;
            letter-spacing: 3px; cursor: pointer; transition: all 0.3s; text-transform: uppercase;
        }

        /* Requirements Checklist */
        .requirements {
            margin-top: 24px; padding: 20px 24px;
            background: rgba(15,12,20,0.8); border: 1px solid rgba(255,215,0,0.1);
            border-radius: 12px; max-width: 500px; width: 100%;
        }
        .requirements h3 {
            font-family: 'Cinzel', serif; font-size: 1rem;
            color: #f0c040; margin-bottom: 12px; letter-spacing: 2px;
        }
        .req-item {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 0; font-size: 0.88rem; color: #9a8b76;
        }
        .req-item.complete { color: #4ade80; }
        .req-icon { font-size: 1rem; }

        /* Cinematic Overlay */
        .cinematic-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #000; z-index: 1000;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .cinematic-overlay.active { display: flex; }
        .cinematic-text {
            font-family: 'Cinzel', serif; font-weight: 900; text-align: center; opacity: 0;
        }
        .cinematic-alliance {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ffd700, #f0c040);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
        }
        .cinematic-message {
            font-size: 1.8rem; letter-spacing: 6px; margin-top: 16px;
            background: linear-gradient(135deg, #7cb3e8, #4a90d9, #c0d8f0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        @keyframes cinematicFadeIn {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes cinematicFlash {
            0% { background: #000; }
            15% { background: #0a1a30; }
            30% { background: #000; }
            45% { background: #1a1500; }
            60% { background: #000; }
            100% { background: #000; }
        }

        /* Loading */
        .loading {
            display: flex; justify-content: center; align-items: center; min-height: 60vh;
            font-family: 'Cinzel', serif; font-size: 1.2rem; color: #9a8b76; letter-spacing: 2px;
        }

        /* Responsive */
        @media (max-width: 820px) {
            .portal-cards { flex-direction: column; align-items: center; gap: 32px; }
            .portal-card { width: 100%; max-width: 400px; min-height: 380px; }
            .main-content { padding: 40px 16px; }
            .choose-title { font-size: 1.4rem; }
            .alliance-bar { flex-wrap: wrap; gap: 16px; }
        }
    </style>
</head>
<body>
    <!-- Particles -->
    <div class="particles">
        <div class="particle" style="left:8%"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="header-title">⚡ ODYSSEY TO OLYMPUS</div>
        <div class="header-right">
            <span class="student-name" id="studentName"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Alliance Bar -->
    <div class="alliance-bar" id="allianceBar" style="display:none">
        <span class="alliance-stat">Alliance: <strong id="allianceName">—</strong></span>
        <span class="alliance-stat">Points: <strong id="alliancePoints">—</strong></span>
        <span class="alliance-stat">Rank: <strong id="allianceRank">—</strong></span>
        <span class="alliance-stat">Age: <strong id="allianceAge">—</strong></span>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent" style="animation: pageReveal 0.6s ease-out forwards;">
        <div class="loading" id="loadingState">Loading your journey...</div>
    </div>
    <style>
        @keyframes pageReveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <!-- Cinematic Overlay -->
    <div class="cinematic-overlay" id="cinematicOverlay">
        <div class="cinematic-text cinematic-alliance" id="cinematicAlliance"></div>
        <div class="cinematic-text cinematic-message" id="cinematicMessage"></div>
    </div>

    <script>
        // Auth
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/';
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        // State
        let studentData = null;
        let allianceData = null;
        let classicalStatus = null;

        document.getElementById('studentName').textContent = user.name || user.display_name || 'Student';
        loadHubData();

        async function apiFetch(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...(options.headers || {})
                }
            });
            if (res.status === 401 || res.status === 403) {
                localStorage.clear();
                window.location.href = '/';
                return null;
            }
            return res.json();
        }

        async function loadHubData() {
            try {
                const dashData = await apiFetch('/api/student/dashboard');
                if (!dashData) return;
                studentData = dashData.student;
                
                // Alliance data is joined into the student object from the dashboard endpoint
                // Build allianceData from the student fields
                if (studentData && studentData.alliance_id) {
                    // Find full alliance info from leaderboard (has all fields)
                    var allianceFromLeaderboard = dashData.leaderboard ? 
                        dashData.leaderboard.find(function(a) { return a.alliance_id === studentData.alliance_id; }) : null;
                    
                    allianceData = allianceFromLeaderboard || {
                        alliance_id: studentData.alliance_id,
                        alliance_name: studentData.alliance_name,
                        alliance_emoji: studentData.alliance_emoji || '',
                        total_points: studentData.alliance_points || 0,
                        current_age: studentData.current_age || 'Archaic'
                    };
                }
                
                classicalStatus = await apiFetch('/api/student/classical-status');

                if (allianceData) {
                    document.getElementById('allianceName').textContent = 
                        (allianceData.alliance_name || '') + ' ' + (allianceData.alliance_emoji || '');
                    document.getElementById('alliancePoints').textContent = 
                        (allianceData.total_points || 0).toLocaleString();
                    document.getElementById('allianceAge').textContent = allianceData.current_age || 'Archaic';
                    document.getElementById('allianceBar').style.display = 'flex';

                    if (dashData.leaderboard) {
                        const rank = dashData.leaderboard.findIndex(a => a.alliance_id === allianceData.alliance_id) + 1;
                        document.getElementById('allianceRank').textContent = rank > 0 ? '#' + rank : '—';
                    }
                }
                renderPortals();
            } catch (err) {
                console.error('Hub load error:', err);
                document.getElementById('loadingState').textContent = 'Error loading. Please refresh.';
            }
        }

        function renderPortals() {
            const main = document.getElementById('mainContent');
            const canAccess = classicalStatus && classicalStatus.canAccess;
            const allianceAge = allianceData ? allianceData.current_age : 'Archaic';

            let html = '<h1 class="choose-title">CHOOSE YOUR AGE</h1>';
            html += '<p class="choose-subtitle">Select which age to explore — your alliance spans across all ages</p>';
            html += '<div class="portal-cards">';

            // Archaic Portal
            html += '<div class="portal-card portal-archaic" onclick="enterArchaic()">';
            html += '<div class="portal-icon">🏺</div>';
            html += '<div class="portal-age-name">ARCHAIC</div>';
            html += '<div class="portal-age-label">AGE</div>';
            html += '<div class="portal-description">The foundation of your civilization. Build structures, compete in the Battle Arena, and grow your alliance\'s power.</div>';
            html += '<button class="portal-enter-btn">ENTER</button>';
            html += '</div>';

            // Classical Portal
            html += '<div class="portal-card portal-classical ' + (canAccess ? '' : 'portal-locked') + '" ';
            html += 'onclick="' + (canAccess ? 'enterClassical()' : '') + '">';
            if (!canAccess) {
                let lockReason = 'Your teacher has not yet opened the Classical Age gate for your period.';
                if (classicalStatus && classicalStatus.gateOpen) {
                    lockReason = 'Your alliance has not yet advanced to the Classical Age.';
                }
                html += '<div class="lock-overlay"><div class="lock-icon">🔒</div>';
                html += '<div class="lock-text">' + lockReason + '</div></div>';
            }
            html += '<div class="portal-icon">🏛️</div>';
            html += '<div class="portal-age-name">CLASSICAL</div>';
            html += '<div class="portal-age-label">AGE</div>';
            html += '<div class="portal-description">The age of myths and legends. Explore Myth Portals, face greater challenges, and ascend toward Olympus.</div>';
            html += '<button class="portal-enter-btn" ' + (canAccess ? '' : 'disabled') + '>';
            html += canAccess ? 'ENTER' : 'LOCKED';
            html += '</button></div>';

            html += '</div>'; // end portal-cards

            // Requirements checklist if locked
            if (!canAccess && classicalStatus) {
                html += '<div class="requirements">';
                html += '<h3>⚡ CLASSICAL AGE REQUIREMENTS</h3>';
                const gateOk = classicalStatus.gateOpen;
                const ageOk = allianceAge === 'Classical' || allianceAge === 'Heroic';
                html += '<div class="req-item ' + (gateOk ? 'complete' : '') + '">';
                html += '<span class="req-icon">' + (gateOk ? '✅' : '⬜') + '</span>';
                html += 'Teacher opens the Classical Age gate for your period</div>';
                html += '<div class="req-item ' + (ageOk ? 'complete' : '') + '">';
                html += '<span class="req-icon">' + (ageOk ? '✅' : '⬜') + '</span>';
                html += 'Alliance advances to Classical Age (complete all Archaic requirements)</div>';
                html += '</div>';
            }

            main.innerHTML = html;
        }

        function enterArchaic() { window.location.href = '/student.html'; }

        async function enterClassical() {
            if (classicalStatus && !classicalStatus.classicalEntered) {
                await playCinematic();
                await apiFetch('/api/student/enter-classical', { method: 'POST' });
            }
            window.location.href = '/student.html';
        }

        function playCinematic() {
            return new Promise(function(resolve) {
                var overlay = document.getElementById('cinematicOverlay');
                var allianceText = document.getElementById('cinematicAlliance');
                var messageText = document.getElementById('cinematicMessage');
                overlay.classList.add('active');

                var name = allianceData ? (allianceData.alliance_name + ' ' + (allianceData.alliance_emoji || '')) : 'Your Alliance';

                // Phase 1: Alliance name fades in (0.5s)
                setTimeout(function() {
                    allianceText.textContent = name.toUpperCase();
                    allianceText.style.animation = 'cinematicFadeIn 1.5s ease-out forwards';
                }, 500);

                // Phase 2: Flash + message (2.8s)
                setTimeout(function() {
                    overlay.style.animation = 'cinematicFlash 1.5s ease-out';
                    messageText.textContent = 'THE CLASSICAL AGE BEGINS';
                    messageText.style.animation = 'cinematicFadeIn 1.5s ease-out 0.3s forwards';
                }, 2800);

                // Phase 3: Hold on black then redirect (5.5s)
                // Overlay stays fully opaque — redirect happens from black screen
                setTimeout(function() {
                    resolve();
                }, 5500);
            });
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }
    </script>
</body>
</html>
