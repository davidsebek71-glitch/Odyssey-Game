const IMG_BASE = '/images/classical/Psyche/';
const sprites = {};
let spritesLoaded = 0, spritesTotal = 0;
function loadSprite(n, f) {
  spritesTotal++;
  const img = new Image();
  img.onload = () => {
    const tc = document.createElement('canvas');
    tc.width=img.width;tc.height=img.height;
    const tx=tc.getContext('2d');tx.drawImage(img,0,0);
    const d=tx.getImageData(0,0,tc.width,tc.height);
    for(let i=0;i<d.data.length;i+=4)
      if(d.data[i]>=180&&d.data[i+1]<=80&&d.data[i+2]>=180&&(d.data[i]-d.data[i+1])>100) d.data[i+3]=0;
    tx.putImageData(d,0,0);
    sprites[n]=tc;spritesLoaded++;
    document.getElementById('loadBar').style.width=(spritesLoaded/spritesTotal*100)+'%';
  };
  img.onerror=()=>{spritesLoaded++;
    document.getElementById('loadBar').style.width=(spritesLoaded/spritesTotal*100)+'%';};
  img.src=IMG_BASE+f;
}
// Scene images — NO magenta removal (full illustrations with pink/red content)
function loadScene(n, f) {
  spritesTotal++;
  const img = new Image();
  img.onload = () => { sprites[n]=img; spritesLoaded++;

  img.onerror = () => { spritesLoaded++;
    document.getElementById('loadBar').style.width=(spritesLoaded/spritesTotal*100)+'%'; };
  img.src=IMG_BASE+f;
}

function spawnP(x,y,n,c){for(let i=0;i<n;i++)GAME.particles.push({x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3-1,life:.5+Math.random()*.3,ml:.7,color:c,size:2+Math.random()*2});}
function showFloat(x,y,t,c,sz){const el=document.createElement('div');el.className='float-text';el.textContent=t;el.style.left=Math.max(5,Math.min(W-180,x-50))+'px';el.style.top=y+'px';el.style.color=c;el.style.fontSize=(sz||13)+'px';container.appendChild(el);setTimeout(()=>el.remove(),1000);}
function shake(){container.classList.add('shake');setTimeout(()=>container.classList.remove('shake'),300);}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function lerpC(a,b,t){const f=(s,i)=>parseInt(s.slice(i,i+2),16);const r=Math.round(f(a,1)+(f(b,1)-f(a,1))*t);const g=Math.round(f(a,3)+(f(b,3)-f(a,3))*t);const bl=Math.round(f(a,5)+(f(b,5)-f(a,5))*t);return'#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+bl.toString(16).padStart(2,'0');}
function getPos(e){const rect=canvas.getBoundingClientRect();const raw=e.touches?e.touches[0]:e;return{x:(raw.clientX-rect.left)*(W/rect.width),y:(raw.clientY-rect.top)*(H/rect.height)};}
function drawHearts(){
  ctx.fillStyle='rgba(0,0,0,.55)';rr(ctx,10,10,130,40,6);ctx.fill();
  let hs='';for(let i=0;i<4;i++)hs+=i<GAME.hearts?'\u2764\uFE0F':'\u{1F5A4}';
  ctx.font='15px "Segoe UI"';ctx.textAlign='left';ctx.fillText(hs,18,28);
  ctx.fillStyle='rgba(200,180,140,.4)';ctx.font='14px "Segoe UI"';
  ctx.fillText(GAME.totalHearts+' lives remaining',18,44);ctx.textAlign='left';
}
function getSeedRegion(type){const spr=sprites['seed_types'];if(!spr)return null;const cw=Math.floor(spr.width/2),ch=Math.floor(spr.height/2);return{sx:(type%2)*cw,sy:Math.floor(type/2)*ch,sw:cw,sh:ch};}

const GAME = {
  phase: 'loading', // loading|story|trial1|trial2|trial3|trial4|cinematic|results
  totalHearts: 10,
  hearts: 4,
  elapsed: 0,
  particles: [],

  storyCallback: null,

};

function loseHeart() {
  GAME.hearts--;
  GAME.totalHearts--;
  shake();
  if (GAME.hearts <= 0 && GAME.totalHearts > 0) {
    GAME.hearts = Math.min(4, GAME.totalHearts);
    return 'restart';
  }
  if (GAME.totalHearts <= 0) return 'gameover';
  return 'ok';
}

// ================================================================

// ================================================================
const STORIES = {
  intro:{title:'The Trials of Psyche',text:'Eros is gone. Aphrodite, furious that a mortal dared to\nlove her son, declares Psyche must complete four\nimpossible tasks to prove her worth.\n\n"If you truly love him," Aphrodite says, "then survive this."',scene:'scene_intro',btn:'Begin the Trials'},
  toRams:{title:'The Golden Rams',text:'"Your next task," Aphrodite sneers.\n"Bring me golden wool from the rams of Helios.\nThey will crush anyone foolish enough to approach."\n\nA river reed whispers: "Wait. Be patient.\nWhen the rams rest, the wool catches on the thorns."',scene:'scene_rams',btn:'Enter the Field'},
  toPalace:{title:'The Dark Palace',text:'Aphrodite demands proof of Eros\'s divine nature.\nPsyche returns to the palace where she once lived with Eros.\n\nThe halls are dark now. She lights her oil lamp\nand steps inside. But her sisters are waiting,\nwhispering lies in the shadows.',scene:'scene_palace',btn:'Enter the Palace'},
  toDescent:{title:'The Underworld',text:'"One final task," Aphrodite says.\n"Descend to the Underworld.\nAsk Persephone for a box of divine beauty."\n\n"Do not stop. Do not help anyone. Do not look back."\n\nPsyche takes two coins and two barley cakes.\nShe begins the descent.',scene:'scene_descent',btn:'Begin the Descent'}
};

function showStory(key, cb) { GAME.storyCard = STORIES[key]; GAME.storyCallback = cb; GAME.phase = 'story'; }

function renderStoryCard() {
  const s = GAME.storyCard; if (!s) return;
  ctx.fillStyle='rgba(0,0,0,.95)';ctx.fillRect(0,0,W,H);
  const spr=sprites[s.scene];
  let textY = 60;
  if(spr){
    const maxW = 300, maxH = 180;
    const ratio = spr.width / spr.height;
    let iw = maxW, ih = maxW / ratio;
    if (ih > maxH) { ih = maxH; iw = maxH * ratio; }
    const imgX = W/2 - iw/2, imgY = 30;
    // Clip to hide magenta edges — generous inset
    ctx.save();
    const inset = 16;
    rr(ctx, imgX+inset, imgY+inset, iw-inset*2, ih-inset*2, 6);
    ctx.clip();
    ctx.drawImage(spr, imgX, imgY, iw, ih);
    ctx.restore();
    ctx.strokeStyle = 'rgba(200,180,140,0.15)'; ctx.lineWidth = 1;
    rr(ctx, imgX+inset, imgY+inset, iw-inset*2, ih-inset*2, 6); ctx.stroke();
    // 30px gap below image
    textY = imgY + ih + 30;
  }
  ctx.textAlign='center';
  // Title — with clear space above and below
  ctx.fillStyle='#f0d68a';ctx.font='bold 22px "Segoe UI"';
  ctx.fillText(s.title, W/2, textY);
  // 24px gap before body text starts
  ctx.fillStyle='#c8b88a';ctx.font='14px "Segoe UI"';
  const lines = s.text.split('\n');
  let lineIdx = 0;
  lines.forEach((l)=>{
    if (l.trim() === '') { lineIdx++; return; }
    ctx.fillText(l, W/2, textY + 28 + lineIdx * 22);
    lineIdx++;
  });
  // Button — moved up 15%
  const btnY = H - 140;
  const p = .7 + Math.sin(GAME.elapsed*3) * .3;
  ctx.fillStyle='rgba(240,214,138,'+p*.12+')';rr(ctx,W/2-80,btnY,160,40,8);ctx.fill();
  ctx.strokeStyle='rgba(240,214,138,'+p*.5+')';ctx.lineWidth=1.5;rr(ctx,W/2-80,btnY,160,40,8);ctx.stroke();
  ctx.fillStyle='#f0d68a';ctx.font='bold 16px "Segoe UI"';ctx.fillText(s.btn,W/2,btnY+25);
  ctx.textAlign='left';
}

// ================================================================
// TRIAL FLOW
// ================================================================
function startTrial(num) {
  GAME.phase = 'trial'+num;
  GAME.hearts = Math.min(4, GAME.totalHearts);
  if (num===1) { GAME.trial = Trial1; Trial1.init(); }
  if (num===2) { GAME.trial = Trial2; Trial2.init(); }
  if (num===3) { GAME.trial = Trial3; Trial3.init(); }
  if (num===4) { GAME.trial = Trial4; Trial4.init(); }
}

function trialComplete(num, virtueKey, virtueData) {
  GAME.virtues[virtueKey] = virtueData;
  if (num===1) showStory('toRams', ()=>startTrial(2));
  else if (num===2) showStory('toPalace', ()=>startTrial(3));
  else if (num===3) showStory('toDescent', ()=>startTrial(4));
  else if (num===4) { GAME.boxChoice = virtueData.boxChoice; startCinematic(); }
}

// ================================================================
// CINEMATIC ENDING
// ================================================================
function startCinematic() { GAME.phase='cinematic'; GAME.cinematicTimer=0; GAME.cinematicPhase=0; }

function updateCinematicEnd(dt) {
  GAME.cinematicTimer+=dt;
  if(GAME.cinematicTimer>2.5&&GAME.cinematicPhase===0) GAME.cinematicPhase=1;
  if(GAME.cinematicTimer>5.5&&GAME.cinematicPhase===1) GAME.cinematicPhase=2;
  if(GAME.cinematicTimer>8.5&&GAME.cinematicPhase===2) GAME.cinematicPhase=3;
  if(GAME.cinematicTimer>11) showResults();
}

function renderCinematicEnd() {
  const t=GAME.cinematicTimer,p=GAME.cinematicPhase;
  const lt=Math.min(1,t/10);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,lerpC('#080a16','#3a2858',lt));
  bg.addColorStop(1,lerpC('#0a0c18','#c8943a',lt));
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  if(p===0){
    if(GAME.boxChoice){ctx.fillStyle='rgba(200,170,220,.8)';ctx.font='italic 15px "Segoe UI"';ctx.fillText('Psyche opens the box. Sleep pours out...',W/2,H/2);}
    else{ctx.fillStyle='rgba(200,170,220,.7)';ctx.font='italic 15px "Segoe UI"';ctx.fillText('Psyche resists. But the box trembles...',W/2,H/2-15);if(t>1.5)ctx.fillText('Fate is not so easily denied. The box opens on its own.',W/2,H/2+15);}
  }else if(p===1){
    ctx.fillStyle='rgba(255,215,100,'+Math.min(1,(t-2.5)/2)+')';ctx.font='italic 15px "Segoe UI"';
    ctx.fillText('Eros, healed by love, descends from the sky.',W/2,H/2-20);
    ctx.fillText('He wipes the sleep from her eyes.',W/2,H/2+10);
  }else if(p===2){
    ctx.fillStyle='rgba(255,240,200,'+Math.min(1,(t-5.5)/1.5)+')';ctx.font='italic 15px "Segoe UI"';
    ctx.fillText('"For enduring what no mortal should,',W/2,H/2-25);
    ctx.fillText('I grant you immortality."',W/2,H/2+5);
    ctx.fillStyle='rgba(200,180,255,.6)';ctx.font='15px "Segoe UI"';
    ctx.fillText('Wings grow from Psyche\'s back.',W/2,H/2+35);
  }else{ctx.fillStyle='#f0d68a';ctx.font='bold 20px "Segoe UI"';ctx.fillText('Love endures.',W/2,H/2);}
  ctx.textAlign='left';
}

function showResults() {
  GAME.phase='results';
  const r=Object.values(GAME.virtues).map(v=>v.rating);
  const exc=r.filter(x=>x==='Excellent').length;
  const good=r.filter(x=>x==='Excellent'||x==='Good').length;
  GAME.starRating=exc===4&&GAME.totalHearts>=8?4:good===4?3:good>=3?2:1;
}

function renderResults() {
  ctx.fillStyle='rgba(5,5,15,.95)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.fillStyle='#f0d68a';ctx.font='bold 24px "Segoe UI"';ctx.fillText('TRIALS COMPLETE',W/2,55);

  ctx.font='28px "Segoe UI"';ctx.fillText(stars,W/2,90);

  vd.forEach((v,i)=>{

    ctx.fillStyle='#c8b88a';ctx.font='15px "Segoe UI"';ctx.fillText(v.n,145,y+28);

async function submitResults() {
  if(token){try{await fetch(window.location.origin+'/api/student/psyche-complete',{

  });}catch(e){console.error(e);}}
  window.location.href='/student.html?openPortal=6'+(token?'&token='+token:'');

// ================================================================

const Trial1 = (function(){


// ============================================================
// SPRITE SYSTEM
// ============================================================


// Load sprites

// Extract a sub-region from a sprite sheet
function drawSprite(spriteName, sx, sy, sw, sh, dx, dy, dw, dh, alpha) {
  const spr = sprites[spriteName];
  if (!spr) return false;
  ctx.globalAlpha = alpha !== undefined ? alpha : 1;
  ctx.drawImage(spr, sx, sy, sw, sh, dx, dy, dw, dh);
  ctx.globalAlpha = 1;
  return true;
}

// Seed sprite regions: seed_types.png is a 2x2 grid
// Order: top-left=Barley(0), top-right=Lentil(1), bottom-left=Poppy(2), bottom-right=Millet(3)
// We'll detect the grid size from the loaded image
function getSeedRegion(type) {
  const spr = sprites['seed_types'];
  if (!spr) return null;
  const cellW = Math.floor(spr.width / 2);
  const cellH = Math.floor(spr.height / 2);
  const col = type % 2;
  const row = Math.floor(type / 2);
  return { sx: col * cellW, sy: row * cellH, sw: cellW, sh: cellH };
}

// ============================================================
// SEEDS
// ============================================================
const SEEDS = [
  { name:'Barley', fill:'#E8B830', dark:'#B08820', hi:'#F0D868', shape:'elongated' },
  { name:'Lentil', fill:'#C03030', dark:'#8A1818', hi:'#E05050', shape:'round' },
  { name:'Poppy',  fill:'#4080D0', dark:'#2858A0', hi:'#60A0F0', shape:'cluster' },
  { name:'Millet', fill:'#40B840', dark:'#288028', hi:'#60E060', shape:'oval' }
];

// ============================================================
// CONFIG
// ============================================================
const TOTAL_TIME = 180;
const ROUNDS = [
  { types:2, target:0, seedCount:50, squads:2, antSpeed:0.50, label:'Two seed types' },
  { types:3, target:2, seedCount:60, squads:2, antSpeed:0.58, label:'Three types' },
  { types:4, target:3, seedCount:70, squads:3, antSpeed:0.61, label:'All four types' }
];

// Layout
const HORIZON_Y = 140;
const PILE_CX = 180, PILE_CY = 380;

// Ant march path: smooth curve from below pile, well clear of bins
const PATH = [
  {x: 220, y: 570},   // Start: below pile
  {x: 310, y: 555},   // Gentle rightward
  {x: 400, y: 530},   // Curving up
  {x: 470, y: 490},   // SORT ZONE START
  {x: 520, y: 440},   // Sort zone
  {x: 550, y: 380},   // Sort zone
  {x: 555, y: 310},   // Sort zone upper
  {x: 540, y: 245},   // Sort zone end — past here = missed
];

// Sort zone: segment index 3-7 (~57% of path)
const SORT_ZONE_START = 3;
const SORT_ZONE_END = 7;

// Bins flush to right edge with tight spacing
const BIN_X = 640;
const BIN_START_Y = 180;
const BIN_SPACING = 95;
const BIN_W = 70, BIN_H = 60;

// ============================================================
// STATE
// ============================================================
  let G = {};
function freshState() {
  return {
    phase: 'tutorial',
    round: 0,
    seeds: [],
    // Ant squads collecting from pile
    collectors: [],   // Ants going TO seeds
    maxSquads: 2,
    activeSquads: 0,
    // March line: ants returning with seeds
    marchers: [],     // { type, isTarget, pathProgress, speed, wiggle, sortState, deliverBin, deliverProgress }
    // Bins
    bins: [],
    targetType: 0,
    // Drawing
    drawing: false, drawStart: null, drawCurrent: null,
    // Scoring
    sorted: 0, needed: 0,
    correctSorts: 0, wrongSorts: 0, missedSorts: 0,
    totalDeploys: 0, goodDeploys: 0, badDeploys: 0,
    // Timer
    timeLeft: TOTAL_TIME, totalTime: TOTAL_TIME,
    // Hearts
    hearts: 4,
    // Global
    globalSorted: 0, globalNeeded: 0,
    elapsed: 0, particles: [],
    // Jam
    jammedBin: -1, jamTimer: 0,
    // Transition
    transitionTimer: 0,
    // Round pass/fail
    roundMinRequired: 0
  };
}

// ============================================================
// PATH HELPERS
// ============================================================
function getPathPos(progress) {
  // progress: 0 to 1 along the full path
  const totalSegs = PATH.length - 1;
  const seg = Math.min(totalSegs - 1, Math.floor(progress * totalSegs));
  const t = (progress * totalSegs) - seg;
  const a = PATH[seg], b = PATH[Math.min(seg + 1, PATH.length - 1)];
  return {
    x: a.x + (b.x - a.x) * t,
    y: a.y + (b.y - a.y) * t,
    seg: seg
  };
}

function isInSortZone(progress) {
  const totalSegs = PATH.length - 1;
  const seg = progress * totalSegs;
  return seg >= SORT_ZONE_START && seg <= SORT_ZONE_END;
}

function isPastSortZone(progress) {
  const totalSegs = PATH.length - 1;
  return progress * totalSegs > SORT_ZONE_END;
}

// ============================================================
// SEED GENERATION
// ============================================================
function generatePile(seedCount, typeCount, targetIdx) {
  const seeds = [];
  const targetCount = Math.floor(seedCount * 0.36);
  const otherCount = seedCount - targetCount;
  const otherTypes = [];
  for (let i = 0; i < typeCount; i++) if (i !== targetIdx) otherTypes.push(i);

  for (let i = 0; i < targetCount; i++) seeds.push(makeSeed(targetIdx, true));
  for (let i = 0; i < otherCount; i++)
    seeds.push(makeSeed(otherTypes[i % otherTypes.length], false));

  // Shuffle
  for (let i = seeds.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [seeds[i], seeds[j]] = [seeds[j], seeds[i]];
  }

  // Cluster target seeds
  const clusters = [];
  for (let c = 0; c < 3; c++) clusters.push({
    x: PILE_CX + (Math.random()-0.5)*180,
    y: PILE_CY + (Math.random()-0.5)*140
  });
  seeds.forEach(s => {
    if (s.isTarget && Math.random() < 0.4) {
      const cc = clusters[Math.floor(Math.random()*clusters.length)];
      s.x = s.x*0.5 + cc.x*0.5 + (Math.random()-0.5)*35;
      s.y = s.y*0.5 + cc.y*0.5 + (Math.random()-0.5)*30;
    }
    s.x = Math.max(20, Math.min(420, s.x));
    s.y = Math.max(170, Math.min(500, s.y));
  });
  return { seeds, targetCount };
}

function makeSeed(type, isTarget) {
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.pow(Math.random(), 0.45) * 190;
  return {
    type, isTarget,
    x: PILE_CX + Math.cos(angle)*dist + (Math.random()-0.5)*50,
    y: PILE_CY + Math.sin(angle)*dist*0.75 + (Math.random()-0.5)*40,
    size: (type===2?6:8.5) + Math.random()*2.5,
    rot: Math.random()*Math.PI*2,
    collected: false, collecting: false, opacity: 1
  };
}

// ============================================================
// DRAW SEED
// ============================================================
function drawSeed(x, y, type, size, rot, alpha) {
  // Try sprite first
  const region = getSeedRegion(type);
  if (region) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = alpha;
    const drawSize = size * 4.5;
    ctx.drawImage(sprites['seed_types'],
      region.sx, region.sy, region.sw, region.sh,
      -drawSize/2, -drawSize/2, drawSize, drawSize);
    ctx.restore();
    ctx.globalAlpha = 1;
    return;
  }

  // Programmatic fallback
  const S = SEEDS[type]; ctx.save();
  ctx.translate(x,y); ctx.rotate(rot); ctx.globalAlpha = alpha;
  if (S.shape==='elongated') {
    ctx.fillStyle=S.fill;
    ctx.beginPath();ctx.ellipse(0,0,size*1.4,size*0.5,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=S.dark;ctx.lineWidth=0.8;
    ctx.beginPath();ctx.ellipse(0,0,size*1.4,size*0.5,0,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=S.hi;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(-size*0.4,-1);ctx.lineTo(size*0.4,-1.5);ctx.stroke();
    ctx.strokeStyle=S.dark;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(size*1.2,0);ctx.lineTo(size*1.8,-2);ctx.stroke();
  } else if (S.shape==='round') {
    ctx.fillStyle=S.fill;
    ctx.beginPath();ctx.ellipse(0,0,size*0.7,size*0.55,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=S.dark;ctx.lineWidth=0.8;ctx.stroke();
    ctx.fillStyle=S.hi;ctx.globalAlpha=alpha*0.35;
    ctx.beginPath();ctx.arc(-size*0.12,-size*0.1,size*0.18,0,Math.PI*2);ctx.fill();
  } else if (S.shape==='cluster') {
    ctx.strokeStyle=S.hi;ctx.lineWidth=0.8;
    ctx.beginPath();ctx.arc(0,0,size*0.55,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=S.fill;
    [{x:0,y:0},{x:-2.5,y:-2.5},{x:2.5,y:-1.5},{x:-1.5,y:3},{x:2.5,y:2.5}].forEach(d=>{
      ctx.beginPath();ctx.arc(d.x*size/8,d.y*size/8,size*0.22,0,Math.PI*2);ctx.fill();
    });
  } else if (S.shape==='oval') {
    ctx.fillStyle=S.fill;
    ctx.beginPath();ctx.ellipse(0,0,size*0.65,size*0.4,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=S.dark;ctx.lineWidth=0.8;ctx.stroke();
    ctx.strokeStyle=S.hi;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(-size*0.25,0);ctx.lineTo(size*0.25,0);ctx.stroke();
  }
  ctx.restore();ctx.globalAlpha=1;
}

// ============================================================
// DRAW ANT
// ============================================================
function drawAnt(x, y, seedType, seedSize, heading, wigglePhase, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(heading);
  ctx.globalAlpha = alpha || 1;

  // Use ant sprite if available
  const antSpr = sprites['ants_marching'];
  if (antSpr) {
    const frameW = Math.floor(antSpr.width / 3);
    const frameH = antSpr.height;
    const targetW = 40;
    const scale = targetW / frameW;
    const dw = frameW * scale;
    const dh = frameH * scale;
    ctx.drawImage(antSpr, 0, 0, frameW, frameH, -dw/2, -dh/2, dw, dh);
  } else {
    // Programmatic fallback — single ant ~40px long
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath(); ctx.ellipse(0, 2, 14, 4, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#4a2a10';
    ctx.beginPath(); ctx.ellipse(-12, 0, 9, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#6a4a20';
    ctx.beginPath(); ctx.ellipse(-11, -1.5, 6, 3.5, -0.2, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#5a3a18';
    ctx.beginPath(); ctx.ellipse(-1, 0, 6, 4.5, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#6a4a20';
    ctx.beginPath(); ctx.ellipse(8, 0, 5, 4, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(11, -1.5, 1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(11, 1.5, 1, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = '#4a2a10'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(12, -2); ctx.lineTo(15, -4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, 2); ctx.lineTo(15, 4); ctx.stroke();

    ctx.strokeStyle = '#4a2a10'; ctx.lineWidth = 1;
    [-10, -1, 7].forEach((lx, i) => {
      const swing = Math.sin(wigglePhase + i * 2.2) * 2.5;
      ctx.beginPath(); ctx.moveTo(lx, -5); ctx.lineTo(lx - swing, -12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(lx, 5); ctx.lineTo(lx + swing, 12); ctx.stroke();
    });

    const aw = Math.sin(wigglePhase * 0.7) * 2;
    ctx.strokeStyle = '#5a3a18'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(12, -2.5);
    ctx.quadraticCurveTo(17, -7+aw, 20, -9+aw); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, 2.5);
    ctx.quadraticCurveTo(17, 7-aw, 20, 9-aw); ctx.stroke();
  }

  // Carried seed above thorax
  if (seedType !== undefined && seedType >= 0) {
    drawSeed(0, -13, seedType, (seedSize||7)*0.7, 0, 0.92);
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

// ============================================================
// BINS
// ============================================================
function buildBins(typeCount) {
  const bins = [];
  for (let i = 0; i < typeCount; i++) {
    bins.push({
      type: i, x: BIN_X, y: BIN_START_Y + i*BIN_SPACING,
      w: BIN_W, h: BIN_H, count: 0,
      flash: 0, wrongFlash: 0, hovered: false
    });
  }
  return bins;
}

function getBinAt(mx, my) {
  for (let i = 0; i < G.bins.length; i++) {
    const b = G.bins[i];
    if (mx >= b.x-b.w/2 && mx <= b.x+b.w/2 && my >= b.y-b.h/2 && my <= b.y+b.h/2) return i;
  }
  return -1;
}

// ============================================================
// DEPLOY SQUAD
// ============================================================
function deploySquad(zoneX, zoneY, zoneR) {
  const inZone = G.seeds.filter(s => !s.collected && !s.collecting &&
    Math.hypot(s.x-zoneX, s.y-zoneY) <= zoneR);
  if (inZone.length === 0) return false;

  const tgtIn = inZone.filter(s => s.isTarget).length;
  const ratio = tgtIn / inZone.length;
  let quality, msg, color;
  if (ratio >= 0.6) { quality='excellent'; msg='🐜 Great cluster!'; color='#4ade80'; G.goodDeploys++; }
  else if (ratio >= 0.35) { quality='decent'; msg='🐜 Mixed grab'; color='#fbbf24'; }
  else { quality='poor'; msg='🐜 Messy — watch the parade!'; color='#f87171'; G.badDeploys++; }
  G.totalDeploys++;
  showFloat(zoneX, zoneY-zoneR-12, msg, color);

  const toCollect = inZone.slice(0, 8);
  toCollect.forEach(s => s.collecting = true);

  // Create collector ants that go to each seed then join the march
  const r = ROUNDS[G.round];
  toCollect.forEach((s, i) => {
    G.collectors.push({
      seed: s,
      startX: zoneX, startY: zoneY,
      progress: 0,
      speed: (r.antSpeed || 0.7) * (0.9 + Math.random()*0.2),
      delay: i * 0.35,  // Stagger so ants spread out on march path
      phase: 'goToSeed', // goToSeed -> pickup -> joinMarch
      wiggle: Math.random()*20,
      antX: zoneX, antY: zoneY
    });
  });

  G.activeSquads++;
  return true;
}

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  G.particles = G.particles.filter(p => {
    p.x+=p.vx; p.y+=p.vy; p.vy+=3*dt; p.life-=dt; return p.life>0;
  });

  if (G.phase === 'transition') {
    G.transitionTimer -= dt;
    if (G.transitionTimer <= 0) { G.phase = 'playing'; }
    return;
  }
  if (G.phase !== 'playing') return;

  G.elapsed += dt;
  G.timeLeft -= dt;
  if (G.timeLeft <= 0) { G.timeLeft = 0; endRound(); return; }

  // Bin flashes
  G.bins.forEach(b => {
    if (b.flash > 0) b.flash -= dt*2;
    if (b.wrongFlash > 0) b.wrongFlash -= dt*2;
  });
  if (G.jamTimer > 0) { G.jamTimer -= dt; if (G.jamTimer <= 0) G.jammedBin = -1; }

  // Update collectors (ants going to grab seeds)
  G.collectors = G.collectors.filter(c => {
    c.delay -= dt;
    if (c.delay > 0) return true;

    c.progress += dt * c.speed;

    if (c.phase === 'goToSeed') {
      const t = Math.min(1, c.progress / 0.5);
      const e = t*t*(3-2*t);
      const dx = c.seed.x-c.startX, dy = c.seed.y-c.startY;
      const len = Math.hypot(dx,dy)||1;
      const wb = Math.sin(c.progress*18+c.wiggle)*3*(1-t);
      c.antX = c.startX + dx*e + (-dy/len)*wb;
      c.antY = c.startY + dy*e + (dx/len)*wb;

      if (t >= 1) {
        c.phase = 'pickup';
        c.progress = 0;
        c.seed.collected = true;
        c.seed.collecting = false;
        spawnP(c.seed.x, c.seed.y, 3, SEEDS[c.seed.type].fill);
      }
    }
    else if (c.phase === 'pickup') {
      // Brief pause at seed, then join march
      if (c.progress > 0.2) {
        // Add to marcher line
        G.marchers.push({
          type: c.seed.type,
          isTarget: c.seed.isTarget,
          size: c.seed.size,
          rot: c.seed.rot,
          pathProgress: 0,
          speed: (ROUNDS[G.round].antSpeed || 0.7) * (0.85 + Math.random()*0.2),
          wiggle: c.wiggle,
          sortState: 'marching', // marching | delivering | sorted | missed
          deliverBin: -1,
          deliverProgress: 0,
          deliverStartX: 0, deliverStartY: 0
        });
        // Squad tracking
        G.activeSquads = Math.max(0, G.activeSquads - 0.1); // Gradual free-up
        return false;
      }
    }
    return true;
  });

  // Recalculate active squads based on collectors still working
  if (G.collectors.length === 0 && G.activeSquads > 0) {
    G.activeSquads = 0;
  }

  // Update marchers
  const totalSegs = PATH.length - 1;
  G.marchers.forEach((m, idx) => {
    if (m.sortState === 'marching') {
      // Gentle spacing: nudge slower if very close to ant ahead
      let speedMult = 1;
      for (let j = 0; j < G.marchers.length; j++) {
        if (j === idx) continue;
        const other = G.marchers[j];
        if (other.sortState !== 'marching') continue;
        const gap = other.pathProgress - m.pathProgress;
        if (gap > 0 && gap < 0.025) {
          speedMult = 0.7; // Slight slowdown, not a hard stop
          break;
        }
      }
      m.pathProgress += dt * m.speed * 0.35 * speedMult;

      // Past sort zone — not clicked in time, loop back to end of line
      if (isPastSortZone(m.pathProgress)) {
        G.missedSorts++;
        showFloat(570, 340, '💨 Missed! Looping back...', 'rgba(200,170,100,0.7)');

        // Start return animation (same as wrong-click)
        const pos = getPathPos(m.pathProgress);
        m.sortState = 'returning';
        m.returnProgress = 0;
        m.returnStartX = pos.x;
        m.returnStartY = pos.y;
        m.returnEndX = PATH[0].x;
        m.returnEndY = PATH[0].y;
        m.returnMidX = (pos.x + PATH[0].x) * 0.5;
        m.returnMidY = Math.min(H - 30, Math.max(pos.y, PATH[0].y) + 60);
      }
    }
    else if (m.sortState === 'delivering') {
      m.deliverProgress += dt * 2.5;
      if (m.deliverProgress >= 1) {
        m.sortState = 'sorted';
        const bin = G.bins[m.deliverBin];
        if (bin) {
          bin.count++;
          bin.flash = 0.5;
          spawnP(bin.x, bin.y, 5, '#ffd700');
        }
        if (m.isTarget) { G.sorted++; G.globalSorted++; }
        G.correctSorts++;
        checkRoundEnd();
      }
    }
    else if (m.sortState === 'returning') {
      // Animate off-path loop back to start of line
      m.returnProgress += dt * 1.2;
      if (m.returnProgress >= 1) {
        // Rejoin the march at the start
        m.sortState = 'marching';
        m.pathProgress = 0;
        m.returnProgress = 0;
      }
    }
  });

  // Clean up only fully sorted marchers
  G.marchers = G.marchers.filter(m => m.sortState !== 'sorted');
}

function checkRoundEnd() {
  // Pass immediately if player has sorted enough (60% of target)
  const minRequired = Math.ceil(G.needed * 0.7);
  if (G.sorted >= minRequired) {
    endRound();
    return;
  }

  // Otherwise, end when all target seeds are accounted for
  const remaining = G.seeds.filter(s => s.isTarget && !s.collected && !s.collecting).length;
  const collecting = G.collectors.filter(c => c.seed.isTarget).length;
  const marching = G.marchers.filter(m => m.isTarget && (m.sortState === 'marching' || m.sortState === 'returning')).length;
  const delivering = G.marchers.filter(m => m.isTarget && m.sortState === 'delivering').length;
  if (remaining === 0 && collecting === 0 && marching === 0 && delivering === 0) {
    endRound();
  }
}

function endRound() {
  // Check if player met the 60% minimum sort requirement
  const minRequired = Math.ceil(G.needed * 0.7);
  const passed = G.sorted >= minRequired;

  if (!passed) {
    // Failed round — lose a heart and replay
    G.phase = 'roundFail';
    G.roundMinRequired = minRequired;
    const result = loseHeart();
    if (result === 'gameover') {
      // Out of hearts entirely — go to complete with what they have
      setTimeout(() => { G.phase = 'complete'; }, 2500);
    } else {
      // Replay this round after showing fail message
      setTimeout(() => {
        G.phase = 'transition'; G.transitionTimer = 3;
        // Bonus time for retry
        G.timeLeft = Math.max(G.timeLeft, 30);
        setupRound();
      }, 2500);
    }
  } else {
    // Passed round — advance
    G.phase = 'roundEnd';
    G.roundMinRequired = minRequired;
    setTimeout(() => {
      G.round++;
      if (G.round >= ROUNDS.length) G.phase = 'complete';
      else {
        const bonus = Math.max(30, 15 + Math.floor(G.timeLeft * 0.3));
        G.timeLeft = Math.max(G.timeLeft, bonus);
        G.phase = 'transition'; G.transitionTimer = 3; setupRound();
      }
    }, 1800);
  }
}

// ============================================================
// SORT ACTION
// ============================================================
function sortToBin(binIdx) {
  // Find the first marcher in the sort zone
  const inZone = G.marchers.filter(m =>
    m.sortState === 'marching' && isInSortZone(m.pathProgress)
  );
  if (inZone.length === 0) return;

  // Sort the one furthest along (about to leave the zone)
  inZone.sort((a,b) => b.pathProgress - a.pathProgress);
  const ant = inZone[0];
  const bin = G.bins[binIdx];

  if (bin.type === ant.type) {
    // CORRECT
    ant.sortState = 'delivering';
    ant.deliverBin = binIdx;
    ant.deliverProgress = 0;
    const pos = getPathPos(ant.pathProgress);
    ant.deliverStartX = pos.x;
    ant.deliverStartY = pos.y;
  } else {
    // WRONG — brief jam, ant peels off path and loops back to end of line
    bin.wrongFlash = 0.4;
    G.wrongSorts++;
    G.jammedBin = binIdx;
    G.jamTimer = 0.3;
    shake();
    showFloat(bin.x, bin.y-40, '✗ Wrong! Back of the line!', '#ef4444');

    // Capture current position, start return animation
    const pos = getPathPos(ant.pathProgress);
    ant.sortState = 'returning';
    ant.returnProgress = 0;
    ant.returnStartX = pos.x;
    ant.returnStartY = pos.y;
    // Return destination: start of path
    ant.returnEndX = PATH[0].x;
    ant.returnEndY = PATH[0].y;
    // Mid-point: loop below the path for visual clarity
    ant.returnMidX = (pos.x + PATH[0].x) * 0.5;
    ant.returnMidY = Math.min(H - 30, Math.max(pos.y, PATH[0].y) + 60);
    ant.speed *= 0.95;

    if (G.wrongSorts % 5 === 0 && G.hearts > 1) {
      G.hearts--;
      showFloat(W/2, 50, '💔', '#ef4444');
    }
  }
}

// ============================================================
// ROUND MANAGEMENT
// ============================================================
function initGame() {
  G = freshState();
  G.globalNeeded = ROUNDS.reduce((s,r) => s + Math.floor(r.seedCount*0.36), 0);
  setupRound();
}

function setupRound() {
  const r = ROUNDS[G.round];
  const pile = generatePile(r.seedCount, r.types, r.target);
  G.seeds = pile.seeds;
  G.needed = pile.targetCount;
  G.sorted = 0;
  G.maxSquads = r.squads;
  G.activeSquads = 0;
  G.collectors = [];
  G.marchers = [];
  G.bins = buildBins(r.types);
  G.targetType = r.target;
  G.drawing = false; G.drawStart = null;
  G.particles = [];
  G.jammedBin = -1; G.jamTimer = 0;
}

// ============================================================
// RENDER
// ============================================================
function render() {
  ctx.clearRect(0,0,W,H);
  const dp = Math.min(1, 1 - G.timeLeft/G.totalTime);

  // === SKY — animated SNES-style banded sunrise ===
  // dp goes 0 (full time) → 1 (dawn/time up)
  // Night palette transitions to dawn palette as dp increases
  const nightBands = [
    [18,8,42],[28,14,52],[38,18,62],[48,20,68],[55,22,72],[60,24,75],[65,26,78],[70,28,80]
  ];
  const dawnBands = [
    [28,12,52],[62,22,82],[120,38,65],[180,60,45],[210,90,35],[235,130,40],[248,170,55],[255,200,75]
  ];
  const bandH = Math.ceil(HORIZON_Y / nightBands.length);
  for (let i = 0; i < nightBands.length; i++) {
    const n = nightBands[i], d = dawnBands[i];
    const r = Math.round(n[0] + (d[0]-n[0]) * dp);
    const g = Math.round(n[1] + (d[1]-n[1]) * dp);
    const b = Math.round(n[2] + (d[2]-n[2]) * dp);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, i * bandH, W, bandH + 1);
    // SNES dither between bands
    if (i < nightBands.length - 1) {
      const n2 = nightBands[i+1], d2 = dawnBands[i+1];
      const r2 = Math.round(n2[0]+(d2[0]-n2[0])*dp);
      const g2 = Math.round(n2[1]+(d2[1]-n2[1])*dp);
      const b2 = Math.round(n2[2]+(d2[2]-n2[2])*dp);
      ctx.fillStyle = `rgb(${r2},${g2},${b2})`;
      const ditherY = (i+1) * bandH;
      for (let dx = 0; dx < W; dx += 2) {
        ctx.fillRect(dx, ditherY - 1, 1, 1);
      }
    }
  }

  // Horizon glow — intensifies with dp
  if (dp > 0.1) {
    const glowAlpha = (dp - 0.1) * 0.6;
    ctx.fillStyle = `rgba(255,180,60,${Math.min(0.4, glowAlpha)})`;
    ctx.fillRect(0, HORIZON_Y - 20, W, 20);
    ctx.fillStyle = `rgba(255,220,100,${Math.min(0.25, glowAlpha * 0.5)})`;
    ctx.fillRect(0, HORIZON_Y - 35, W, 15);
  }

  // Mountain silhouette — pixel art jagged peaks
  ctx.fillStyle = 'rgb(30,22,15)';
  ctx.beginPath(); ctx.moveTo(0, HORIZON_Y);
  // Chunky 2-pixel stepped mountains
  const mtnPoints = [0,8,20,6,50,12,80,10,120,16,160,8,200,14,240,6,280,18,320,10,360,16,400,8,440,20,480,12,520,16,560,8,600,14,640,10,680,6];
  for (let m = 0; m < mtnPoints.length; m += 2) {
    const mx = mtnPoints[m], mh = mtnPoints[m+1];
    // Step in 2-pixel increments for pixel art feel
    const steppedH = Math.round(mh / 2) * 2;
    ctx.lineTo(mx, HORIZON_Y - steppedH);
  }
  ctx.lineTo(W, HORIZON_Y); ctx.closePath(); ctx.fill();

  // Sun — rises from behind mountains into the sky as dp increases
  // At dp=0: sun is fully below horizon (hidden)
  // At dp=0.3: glow starts appearing behind mountains
  // At dp=0.6: sun peeks over mountains
  // At dp=1: sun is ~40% up the sky
  const sunX = W * 0.55;
  const sunR = 14;
  const sunStartY = HORIZON_Y + sunR + 20; // fully hidden below horizon
  const sunEndY = HORIZON_Y * 0.4; // 40% up the sky at dawn
  const sunY = sunStartY + (sunEndY - sunStartY) * dp;
  if (sunY < HORIZON_Y + sunR) { // Only draw when any part is visible
    // Sun glow (always visible before sun itself)
    if (dp > 0.15) {
      const glowR = sunR * 4;
      const sg = ctx.createRadialGradient(sunX, Math.min(sunY, HORIZON_Y), 0, sunX, Math.min(sunY, HORIZON_Y), glowR);
      sg.addColorStop(0, `rgba(255,220,100,${Math.min(0.3, dp * 0.4)})`);
      sg.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(sunX - glowR, HORIZON_Y - glowR, glowR * 2, glowR);
    }
    // Sun disc — clip to above horizon only
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, HORIZON_Y);
    ctx.clip();
    // Outer disc
    ctx.fillStyle = `rgba(255,230,120,${Math.min(1, dp * 2)})`;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2); ctx.fill();
    // Bright center
    ctx.fillStyle = `rgba(255,250,220,${Math.min(0.9, dp * 2)})`;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Stars — fade out as dawn approaches
  if (dp < 0.55) {
    const starAlpha = (1 - dp / 0.55) * 0.8;
    ctx.fillStyle = `rgba(255,255,220,${starAlpha})`;
    [[50,20],[175,50],[310,15],[430,40],[595,55],[125,75],[400,25],[550,35],[260,65]].forEach(([x,y]) => {
      if (y < HORIZON_Y - 20) { ctx.fillRect(x, y, 1, 1); ctx.fillRect(x, y, 2, 1); } // 1-2px stars
    });
  }

  // === GROUND — tiled stone floor ===
  const groundTile = sprites['ground'];
  if (groundTile) {
    const tw = groundTile.width, th = groundTile.height;
    for (let ty = HORIZON_Y; ty < H; ty += th) {
      for (let tx = 0; tx < W; tx += tw) { ctx.drawImage(groundTile, tx, ty, tw, th); }
    }
  } else { ctx.fillStyle='#6c6960';ctx.fillRect(0,HORIZON_Y,W,H-HORIZON_Y); }

  // Subtle vignette
  const vig = ctx.createRadialGradient(W/2, H/2+40, 80, W/2, H/2+40, 420);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.18)');
  ctx.fillStyle = vig; ctx.fillRect(0, HORIZON_Y, W, H-HORIZON_Y);

  // === MARCH PATH — polygon outline filled with pattern ===
  // Compute left and right edge points for each waypoint
  const PATH_HALF_W = 16; // half-width of the path in pixels
  const leftEdge = [], rightEdge = [];
  for (let i = 0; i < PATH.length; i++) {
    // Direction vector: average of prev->cur and cur->next for smooth normals
    let dx = 0, dy = 0;
    if (i < PATH.length - 1) { dx += PATH[i+1].x - PATH[i].x; dy += PATH[i+1].y - PATH[i].y; }
    if (i > 0) { dx += PATH[i].x - PATH[i-1].x; dy += PATH[i].y - PATH[i-1].y; }
    const len = Math.hypot(dx, dy) || 1;
    // Perpendicular normal (rotate 90 degrees)
    const nx = -dy / len, ny = dx / len;
    leftEdge.push({ x: PATH[i].x + nx * PATH_HALF_W, y: PATH[i].y + ny * PATH_HALF_W });
    rightEdge.push({ x: PATH[i].x - nx * PATH_HALF_W, y: PATH[i].y - ny * PATH_HALF_W });
  }

  // Build closed polygon: left edge forward, right edge backward
  ctx.beginPath();
  ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
  for (let i = 1; i < leftEdge.length; i++) ctx.lineTo(leftEdge[i].x, leftEdge[i].y);
  for (let i = rightEdge.length - 1; i >= 0; i--) ctx.lineTo(rightEdge[i].x, rightEdge[i].y);
  ctx.closePath();

  // Fill with path tile pattern or solid color
  const pathTile = sprites['path_tile'];
  if (pathTile) {
    const pat = ctx.createPattern(pathTile, 'repeat');
    ctx.fillStyle = pat;
  } else {
    ctx.fillStyle = 'rgba(82,74,62,0.9)';
  }
  ctx.fill();

  // Dark border on both edges
  ctx.strokeStyle = 'rgba(30,24,15,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
  for (let i = 1; i < leftEdge.length; i++) ctx.lineTo(leftEdge[i].x, leftEdge[i].y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rightEdge[0].x, rightEdge[0].y);
  for (let i = 1; i < rightEdge.length; i++) ctx.lineTo(rightEdge[i].x, rightEdge[i].y);
  ctx.stroke();

  // Inner highlight line (center of path)
  ctx.strokeStyle = 'rgba(110,100,82,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  PATH.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.stroke();

  // === SORT ZONE — golden tint overlay on the path polygon section ===
  const szStart = getPathPos(SORT_ZONE_START / (PATH.length-1));
  const szEnd = getPathPos(SORT_ZONE_END / (PATH.length-1));
  // Draw golden overlay only on the sort zone segment
  ctx.beginPath();
  ctx.moveTo(leftEdge[SORT_ZONE_START].x, leftEdge[SORT_ZONE_START].y);
  for (let i = SORT_ZONE_START+1; i <= SORT_ZONE_END && i < leftEdge.length; i++)
    ctx.lineTo(leftEdge[i].x, leftEdge[i].y);
  for (let i = Math.min(SORT_ZONE_END, rightEdge.length-1); i >= SORT_ZONE_START; i--)
    ctx.lineTo(rightEdge[i].x, rightEdge[i].y);
  ctx.closePath();
  ctx.fillStyle = `rgba(220,200,100,${0.15+Math.sin(G.elapsed*2)*0.05})`;
  ctx.fill();

  // Sort zone archway
  const archSpr = sprites['sort_zone'];
  if (archSpr) {
    ctx.drawImage(archSpr, szStart.x - 45, szStart.y - 57, 90, 90);
  } else {
    ctx.save();
    const ag = ctx.createRadialGradient(szStart.x, szStart.y-8, 5, szStart.x, szStart.y-8, 40);
    ag.addColorStop(0, 'rgba(220,200,120,0.25)'); ag.addColorStop(1, 'rgba(220,200,120,0)');
    ctx.fillStyle = ag; ctx.fillRect(szStart.x-45, szStart.y-50, 90, 65);
    ctx.strokeStyle = 'rgba(200,180,120,0.7)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(szStart.x, szStart.y, 24, Math.PI, 0); ctx.stroke();
    const pg = ctx.createLinearGradient(0, szStart.y-8, 0, szStart.y+28);
    pg.addColorStop(0, 'rgba(200,180,120,0.6)'); pg.addColorStop(1, 'rgba(140,120,70,0.3)');
    ctx.fillStyle = pg;
    ctx.fillRect(szStart.x-25, szStart.y-4, 8, 30); ctx.fillRect(szStart.x+17, szStart.y-4, 8, 30);
    ctx.restore();
  }

  // Exit gate
  ctx.fillStyle = `rgba(220,100,80,${0.25+Math.sin(G.elapsed*3)*0.1})`;
  ctx.beginPath(); ctx.arc(PATH[SORT_ZONE_END].x, PATH[SORT_ZONE_END].y, 8, 0, Math.PI*2); ctx.fill();

  // Sort zone label
  ctx.fillStyle = 'rgba(220,230,140,0.75)';
  ctx.font = 'bold 15px "Segoe UI"'; ctx.textAlign = 'center';
  ctx.fillText('SORT ZONE', (szStart.x + PATH[SORT_ZONE_END].x)/2 - 30, (szStart.y + PATH[SORT_ZONE_END].y)/2);
  ctx.fillStyle = 'rgba(200,210,130,0.5)'; ctx.font = '12px "Segoe UI"';
  ctx.fillText('click a bin!', (szStart.x + PATH[SORT_ZONE_END].x)/2 - 30, (szStart.y + PATH[SORT_ZONE_END].y)/2 + 17);
  ctx.textAlign = 'left';

  // (pile shadow removed)

  // === DRAW ZONE PREVIEW ===
  if (G.drawing && G.drawStart && G.drawCurrent) {
    const dx=G.drawCurrent.x-G.drawStart.x, dy=G.drawCurrent.y-G.drawStart.y;
    const r=Math.min(90,Math.max(25,Math.hypot(dx,dy)));
    const cx=G.drawStart.x, cy=G.drawStart.y;

    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fill();

    const inZ=G.seeds.filter(s=>!s.collected&&!s.collecting&&Math.hypot(s.x-cx,s.y-cy)<=r);
    const ti=inZ.filter(s=>s.isTarget).length, tot=inZ.length;
    const rat=tot>0?ti/tot:0;
    const zc=rat>=0.6?'rgba(74,222,128,':rat>=0.35?'rgba(251,191,36,':'rgba(248,113,113,';

    ctx.fillStyle=zc+'0.12)';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=zc+'0.5)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);

    ctx.fillStyle=zc+'0.8)';ctx.font='bold 11px "Segoe UI"';ctx.textAlign='center';
    if(tot===0) ctx.fillText('No seeds',cx,cy-r-8);
    else ctx.fillText(`${ti} target + ${tot-ti} other`,cx,cy-r-8);
    ctx.textAlign='left';
  }

  // === SEEDS IN PILE ===
  G.seeds.forEach(s => {
    if (s.collected || s.collecting) return;
    drawSeed(s.x, s.y, s.type, s.size, s.rot, s.opacity*(s.isTarget?1:0.85));
  });

  // === COLLECTOR ANTS (going to seeds) ===
  G.collectors.forEach(c => {
    if (c.delay > 0) return;
    const heading = Math.atan2(c.seed.y-c.antY, c.seed.x-c.antX);
    const carrying = c.phase === 'pickup' ? c.seed.type : -1;
    drawAnt(c.antX, c.antY, carrying, c.seed.size, heading, G.elapsed*14+c.wiggle, 1);
  });

  // === MARCHING ANTS (returning with seeds) ===
  G.marchers.forEach(m => {
    if (m.sortState === 'sorted') return;

    let ax, ay, heading;

    if (m.sortState === 'delivering') {
      // Flying to bin
      const t = m.deliverProgress;
      const e = t*t*(3-2*t);
      const bin = G.bins[m.deliverBin];
      if (!bin) return;
      ax = m.deliverStartX + (bin.x - m.deliverStartX)*e;
      ay = m.deliverStartY + (bin.y - m.deliverStartY)*e - Math.sin(t*Math.PI)*20;
      heading = Math.atan2(bin.y-m.deliverStartY, bin.x-m.deliverStartX);
      drawAnt(ax, ay, m.type, m.size, heading, G.elapsed*14+m.wiggle, 1-t*0.3);
      return;
    }

    if (m.sortState === 'returning') {
      // Quadratic bezier: start -> mid (below path) -> end (path start)
      const t = Math.min(1, m.returnProgress);
      const inv = 1 - t;
      ax = inv*inv*m.returnStartX + 2*inv*t*m.returnMidX + t*t*m.returnEndX;
      ay = inv*inv*m.returnStartY + 2*inv*t*m.returnMidY + t*t*m.returnEndY;
      // Heading: tangent of bezier
      const tx = 2*inv*(m.returnMidX-m.returnStartX) + 2*t*(m.returnEndX-m.returnMidX);
      const ty = 2*inv*(m.returnMidY-m.returnStartY) + 2*t*(m.returnEndY-m.returnMidY);
      heading = Math.atan2(ty, tx);
      // Draw slightly transparent to show it's "shamed"
      drawAnt(ax, ay, m.type, m.size, heading, G.elapsed*14+m.wiggle, 0.6);
      return;
    }

    // Normal marching
    const pos = getPathPos(Math.min(1, m.pathProgress));
    ax = pos.x; ay = pos.y;

    // Get heading from path direction
    const nextPos = getPathPos(Math.min(1, m.pathProgress + 0.02));
    heading = Math.atan2(nextPos.y-pos.y, nextPos.x-pos.x);

    // Wobble perpendicular to path
    const wb = Math.sin(G.elapsed*10+m.wiggle)*3;
    ax += Math.cos(heading+Math.PI/2)*wb;
    ay += Math.sin(heading+Math.PI/2)*wb;

    // In sort zone: highlight
    if (isInSortZone(m.pathProgress)) {
      ctx.strokeStyle = `rgba(255,215,100,${0.3+Math.sin(G.elapsed*6)*0.15})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ax, ay, 14, 0, Math.PI*2); ctx.stroke();
    }

    // Missed: fade out
    const alpha = m.sortState === 'missed' ? Math.max(0, 1-(m.pathProgress-0.9)*5) : 1;

    drawAnt(ax, ay, m.type, m.size, heading, G.elapsed*14+m.wiggle, alpha);
  });

  // === BINS ===
  if (G.phase === 'playing' || G.phase === 'roundEnd' || G.phase === 'roundFail') renderBins();

  // === PARTICLES ===
  G.particles.forEach(p => {
    ctx.globalAlpha=Math.max(0,p.life/p.ml);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.ml),0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // === HUD ===
  if (G.phase === 'playing') renderHUD();

  // === OVERLAYS ===
  if (G.phase==='tutorial') renderTutorial();
  if (G.phase==='transition') renderTransition();
  if (G.phase==='roundEnd') renderRoundEnd();
  if (G.phase==='roundFail') renderRoundFail();
  if (G.phase==='complete') renderComplete();
}

function renderBins() {
  const SEED_COLORS = ['#E8B830','#C03030','#4080D0','#40B840'];
  G.bins.forEach((b,i) => {
    const S = SEEDS[b.type]; const isT = b.type === G.targetType; const sc = SEED_COLORS[b.type];
    if (isT) { /* target highlight handled by border glow */ }
    ctx.fillStyle = 'rgba(25,22,18,0.88)'; rr(ctx, b.x-b.w/2, b.y-b.h/2, b.w, b.h, 6); ctx.fill();
    const binSpr = sprites['sorting_bins'];
    if (binSpr) { const cellW=Math.floor(binSpr.width/2),cellH=Math.floor(binSpr.height/2),col=b.type%2,row=Math.floor(b.type/2),sprSize=Math.min(b.w-14,b.h-14); ctx.drawImage(binSpr,col*cellW,row*cellH,cellW,cellH,b.x-sprSize/2,b.y-sprSize/2,sprSize,sprSize); }
    if (b.wrongFlash>0){ctx.fillStyle=`rgba(200,40,40,${b.wrongFlash*0.5})`;rr(ctx,b.x-b.w/2,b.y-b.h/2,b.w,b.h,6);ctx.fill();}
    if (b.flash>0){ctx.fillStyle=`rgba(40,200,60,${b.flash*0.4})`;rr(ctx,b.x-b.w/2,b.y-b.h/2,b.w,b.h,6);ctx.fill();}
    ctx.strokeStyle=sc;ctx.lineWidth=isT?3:2;if(isT){ctx.shadowColor=sc;ctx.shadowBlur=8;}
    rr(ctx,b.x-b.w/2,b.y-b.h/2,b.w,b.h,6);ctx.stroke();ctx.shadowBlur=0;
    const labelY=b.y+b.h/2+5;ctx.fillStyle='rgba(0,0,0,0.65)';rr(ctx,b.x-b.w/2,labelY,b.w,22,4);ctx.fill();
    ctx.fillStyle=sc;ctx.beginPath();ctx.arc(b.x-b.w/2+12,labelY+11,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ddd';ctx.font='bold 13px "Segoe UI"';ctx.textAlign='left';ctx.fillText(S.name,b.x-b.w/2+22,labelY+15);
    ctx.fillStyle='rgba(240,220,180,0.7)';ctx.font='bold 13px "Segoe UI"';ctx.textAlign='right';ctx.fillText(b.count,b.x+b.w/2-8,labelY+15);
    if(G.jammedBin===i){ctx.fillStyle=`rgba(255,80,80,${0.5+Math.sin(G.elapsed*20)*0.2})`;ctx.font='bold 12px "Segoe UI"';ctx.textAlign='center';ctx.fillText('JAMMED',b.x,labelY+36);}
    if(b.hovered&&G.marchers.some(m=>m.sortState==='marching'&&isInSortZone(m.pathProgress))){ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;rr(ctx,b.x-b.w/2-3,b.y-b.h/2-3,b.w+6,b.h+6,8);ctx.stroke();}
    ctx.textAlign='left';
  });
}

function renderHUD() {
  const r = ROUNDS[G.round];
  ctx.textAlign='left';

  // === TOP BAR — single row, spread across width ===
  // Hearts (far left)
  let hs='';for(let i=0;i<G.hearts;i++)hs+='❤️';for(let i=G.hearts;i<4;i++)hs+='🖤';
  ctx.fillStyle='rgba(0,0,0,0.6)';rr(ctx,8,6,85,30,6);ctx.fill();
  ctx.font='13px "Segoe UI"';ctx.fillText(hs,14,26);

  // Target seed (left of center)
  ctx.fillStyle='rgba(0,0,0,0.6)';rr(ctx,100,6,130,30,6);ctx.fill();
  drawSeed(114,21,r.target,9,0,1);
  ctx.fillStyle=SEEDS[r.target].fill;ctx.font='bold 13px "Segoe UI"';
  ctx.fillText(`Sort: ${SEEDS[r.target].name}`,130,25);

  // Progress (center)
  ctx.fillStyle='rgba(0,0,0,0.6)';rr(ctx,238,6,75,30,6);ctx.fill();
  ctx.fillStyle='#f0d68a';ctx.font='bold 16px "Segoe UI"';ctx.textAlign='center';
  ctx.fillText(`${G.sorted}/${G.needed}`,275,27);

  // Round (center-right)
  ctx.fillStyle='rgba(0,0,0,0.6)';rr(ctx,320,6,60,30,6);ctx.fill();
  ctx.fillStyle='rgba(200,180,140,0.6)';ctx.font='bold 13px "Segoe UI"';
  ctx.fillText(`Rd ${G.round+1}/3`,350,26);

  // Timer (right of center)
  const tr=G.timeLeft/G.totalTime;
  const tc=tr>0.4?'#c8b88a':tr>0.2?'#fbbf24':'#ef4444';
  ctx.fillStyle='rgba(0,0,0,0.6)';rr(ctx,388,6,55,30,6);ctx.fill();
  ctx.fillStyle=tc;ctx.font='bold 15px "Segoe UI"';
  ctx.fillText(`${Math.ceil(G.timeLeft)}s`,415,27);

  ctx.textAlign='left';

  // Squads (bottom-left)
  const avail = G.maxSquads - Math.ceil(G.activeSquads);
  ctx.fillStyle='rgba(0,0,0,0.5)';rr(ctx,10,H-36,100,26,6);ctx.fill();
  ctx.fillStyle=avail>0?'#f0d68a':'rgba(200,140,140,0.5)';
  ctx.font='13px "Segoe UI"';ctx.textAlign='center';
  ctx.fillText(`🐜 Squads: ${Math.max(0,avail)}/${G.maxSquads}`,60,H-19);
  ctx.textAlign='left';
}

function renderTutorial() {
  ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#f0d68a';ctx.font='bold 22px "Segoe UI"';
  ctx.fillText('"Discern what belongs."',W/2,85);
  ctx.fillStyle='#c8b88a';ctx.font='14px "Segoe UI"';
  [
    'Aphrodite has dumped a mountain of mixed seeds before you.',
    'Direct the ants to sort them before dawn.',
    '',
    '① CIRCLE a cluster in the pile (click & drag)',
    '     Ants grab seeds and march back in a line',
    '',
    '② As each ant enters the SORT ZONE,',
    '     click the correct BIN for the seed it carries',

const Trial2 = (function(){


// ============================================================
// SPRITES
// ============================================================

// ============================================================
// THORNS
// ============================================================
const THORNS = [
  {x:100,y:200},{x:230,y:175},{x:370,y:195},{x:510,y:170},{x:610,y:205},
  {x:150,y:320},{x:310,y:340},{x:460,y:315},{x:570,y:355},{x:240,y:440}
];

// ============================================================
// STATE
// ============================================================
  let G = {};
function freshState() {
  return {
    phase:'tutorial', elapsed:0,
    // Psyche
    px: 340, py: 500, // Start near bottom
    pSpeed: 2.5,
    pRunSpeed: 5.5,    // Sprint speed when fleeing — must clearly outrun rams
    pFacing: 1,        // 1=right, -1=left
    pMoving: false,
    pHit: false,       // Invincibility after being hit
    pHitTimer: 0,
    pKnockX: 0, pKnockY: 0, // Knockback velocity
    pNearWool: -1,     // Index of wool within grab range
    pGrabbing: false,
    pGrabTimer: 0,
    // Wool
    woolCollected: 0,
    woolNeeded: 15,
    woolTufts: [],
    spawnTimer: 2,
    // Rams
    rams: [],
    // Hearts: synced from master GAME state
    totalHearts: GAME.totalHearts,
    hearts: Math.min(4, GAME.totalHearts),

    // Basket

    reedCooldown: 0,
    // Flying wool animations
    flyingWool: []
  };
}

// ============================================================
// PSYCHE MOVEMENT
// ============================================================
  // keys: uses shared keys object

function updatePsyche(dt) {
  if (G.pGrabbing) {
    G.pGrabTimer -= dt;
    if (G.pGrabTimer <= 0) G.pGrabbing = false;
    return; // Can't move while grabbing
  }

  // Knockback
  if (Math.abs(G.pKnockX) > 0.5 || Math.abs(G.pKnockY) > 0.5) {
    G.px += G.pKnockX;
    G.py += G.pKnockY;
    G.pKnockX *= 0.85;
    G.pKnockY *= 0.85;
  }

  // Hit invincibility
  if (G.pHitTimer > 0) G.pHitTimer -= dt;
  if (G.pHitTimer <= 0) G.pHit = false;

  // Movement
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;

  G.pMoving = dx !== 0 || dy !== 0;

  if (G.pMoving) {
    // Normalize diagonal
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;

    // Sprint if any ram is chasing
    const beingChased = G.rams.some(r => r.state === 'chasing');
    const speed = beingChased ? G.pRunSpeed : G.pSpeed;

    const newX = G.px + dx * speed * 60 * dt;
    const newY = G.py + dy * speed * 60 * dt;

    // Thorn collision: push out of bushes
    let blocked = false;
    THORNS.forEach(t => {
      const BUSH_R = 25; // Collision radius of thorn bush
      const distToThorn = Math.hypot(newX - t.x, newY - t.y);
      if (distToThorn < BUSH_R) {
        // Push out along the vector from thorn center
        const pushDx = newX - t.x;
        const pushDy = newY - t.y;
        const pushDist = Math.hypot(pushDx, pushDy) || 1;
        G.px = t.x + (pushDx / pushDist) * BUSH_R;
        G.py = t.y + (pushDy / pushDist) * BUSH_R;
        blocked = true;
      }
    });

    if (!blocked) {
      G.px = newX;
      G.py = newY;
    }

    if (dx !== 0) G.pFacing = dx > 0 ? 1 : -1;
  }

  // Clamp to field bounds
  G.px = Math.max(25, Math.min(W - 25, G.px));
  G.py = Math.max(130, Math.min(H - 55, G.py));

  // Check proximity to wool
  G.pNearWool = -1;
  G.woolTufts.forEach((w, i) => {
    if (w.collected || w.fadeOut) return;
    if (Math.hypot(G.px - w.x, G.py - w.y) < 28) {
      G.pNearWool = i;
    }
  });
}

function grabWool() {
  if (G.pNearWool < 0 || G.pGrabbing) return;
  const w = G.woolTufts[G.pNearWool];
  if (!w || w.collected) return;

  w.collected = true;
  G.woolCollected++;
  G.pGrabbing = true;
  G.pGrabTimer = 0.3; // Brief pause while grabbing
  G.basketBounce = 0.4;
  spawnP(w.x, w.y, 8, '#ffd700');
  showFloat(w.x, w.y - 15, '+1 🧶', '#ffd700');

  // Flying wool to basket
  G.flyingWool.push({
    startX: w.x, startY: w.y, progress: 0
  });

  // Escalation
  checkEscalation();

  if (G.woolCollected >= G.woolNeeded) {
    setTimeout(() => { G.phase = 'complete'; }, 800);
  }
}

function checkEscalation() {
  const wc = G.woolCollected;
  // More rams as more wool collected
  if (wc === 3 && G.rams.length < 3) {
    G.rams.push(createRam(320, 310, 150, 520, 0.6, 95));   // Middle patrol
    showFloat(W/2, 120, '🐏 Another ram enters the field!', '#fbbf24');
  }
  if (wc === 8 && G.rams.length < 4) {
    G.rams.push(createRam(450, 180, 300, 620, 0.65, 90));   // Top-right patrol
    showFloat(W/2, 120, '🐏 The herd grows restless!', '#fbbf24');
  }
  if (wc === 12 && G.rams.length < 5) {
    G.rams.push(createRam(180, 420, 60, 400, 0.7, 85));     // Bottom-left patrol
    showFloat(W/2, 120, '🐏 A fifth ram! Be careful!', '#ef4444');
  }
}

// ============================================================
// RAMS
// ============================================================
function createRam(x, y, patrolL, patrolR, speed, detectR) {
  return {
    x, y, patrolL, patrolR,
    homeY: y,
    baseSpeed: speed || 0.5,
    speed: speed || 0.5,
    dir: 1, facingRight: true,
    state: 'grazing',
    stateTimer: 2.5 + Math.random()*1.5,
    detectRadius: detectR || 100,
    chargeSpeed: 3.5,
    chaseTimer: 0,
    maxChaseTime: 4.0,
    headBob: 0,
    grazeTime: () => {
      const t = Math.min(1, G.woolCollected / 15);
      return (3.5 - t * 2.5) + Math.random() * (1.2 - t * 0.6);
    },
    alertTime: () => {
      const t = Math.min(1, G.woolCollected / 15);
      return (2.0 + t * 2.5) + Math.random() * 0.5;
    },
    returnX: 0, returnY: 0
  };
}

function updateRam(ram, dt) {
  // Ramp patrol speed: 1x at 0 wool → 2.2x at 15 wool
  const speedScale = 1 + (Math.min(1, G.woolCollected / 15)) * 1.2;
  ram.speed = ram.baseSpeed * speedScale;

  if (ram.state === 'grazing') {
    // Find nearest wool-bearing thorn to bias patrol toward
    let woolTarget = null;
    let nearestWoolDist = Infinity;
    G.woolTufts.forEach(w => {
      if (w.collected || w.fadeOut) return;
      const d = Math.hypot(w.x - ram.x, w.y - ram.y);
      if (d < 250 && d < nearestWoolDist) {
        nearestWoolDist = d;
        woolTarget = w;
      }
    });

    if (woolTarget && nearestWoolDist > 30) {
      // Drift toward the wool — blend patrol direction with pull toward wool
      const dx = woolTarget.x - ram.x;
      const dy = woolTarget.y - ram.y;
      const dist = Math.hypot(dx, dy) || 1;
      const pull = 0.3; // How strongly rams are attracted (0 = ignore, 1 = beeline)
      const patrolDx = ram.dir * ram.speed * 60 * dt;
      const woolDx = (dx / dist) * ram.speed * 60 * dt * pull;
      const woolDy = (dy / dist) * ram.speed * 60 * dt * pull;

      ram.x += patrolDx * (1 - pull) + woolDx;
      ram.y += woolDy;

      // Still respect patrol bounds loosely
      if (ram.x >= ram.patrolR + 30) { ram.dir = -1; ram.facingRight = false; }
      if (ram.x <= ram.patrolL - 30) { ram.dir = 1; ram.facingRight = true; }
      ram.facingRight = (patrolDx * (1 - pull) + woolDx) > 0;
    } else {
      // Normal patrol — no wool nearby
      ram.x += ram.dir * ram.speed * 60 * dt;
      if (ram.x >= ram.patrolR) { ram.dir = -1; ram.facingRight = false; }
      if (ram.x <= ram.patrolL) { ram.dir = 1; ram.facingRight = true; }
    }

    // Gently pull Y back toward home when not chasing wool
    if (!woolTarget) {
      ram.y += (ram.homeY - ram.y) * 0.02;
    }

    ram.headBob = Math.sin(G.elapsed * 2.5) * 3;

    ram.stateTimer -= dt;
    if (ram.stateTimer <= 0) {
      ram.state = 'alert';
      ram.stateTimer = ram.alertTime();
      checkReedWarning(ram);
    }
  }
  else if (ram.state === 'alert') {
    // Patrol slower
    ram.x += ram.dir * ram.speed * 0.3 * 60 * dt;
    if (ram.x >= ram.patrolR) { ram.dir = -1; ram.facingRight = false; }
    if (ram.x <= ram.patrolL) { ram.dir = 1; ram.facingRight = true; }
    ram.headBob = 0;

    // Detect Psyche
    const distToPsyche = Math.hypot(G.px - ram.x, G.py - ram.y);
    if (distToPsyche < ram.detectRadius) {
      // SPOTTED — start chasing!
      ram.state = 'chasing';
      ram.chaseTimer = 0;
      ram.stateTimer = 0;
      ram.facingRight = G.px > ram.x;
    } else {
      ram.stateTimer -= dt;
      if (ram.stateTimer <= 0) {
        ram.state = 'grazing';
        ram.stateTimer = ram.grazeTime();
      }
    }
  }
  else if (ram.state === 'chasing') {
    // Chase Psyche
    const dx = G.px - ram.x;
    const dy = G.py - ram.y;
    const dist = Math.hypot(dx, dy);
    ram.facingRight = dx > 0;

    // Chase timer — ram tires out
    ram.chaseTimer += dt;
    const tiredness = Math.min(1, ram.chaseTimer / ram.maxChaseTime);
    const currentChargeSpeed = ram.chargeSpeed * (1 - tiredness * 0.5); // Slows to 50% as it tires

    if (dist > 3) {
      ram.x += (dx / dist) * currentChargeSpeed * 60 * dt;
      ram.y += (dy / dist) * currentChargeSpeed * 60 * dt;
    }

    // Check if caught Psyche
    if (dist < 20 && !G.pHit) {
      hitPsyche(ram);
    }

    // Escape conditions: either outran the radius OR ram timed out
    const escaped = dist > ram.detectRadius + 20;
    const timedOut = ram.chaseTimer >= ram.maxChaseTime;

    if (escaped || timedOut) {
      ram.state = 'returning';
      ram.returnX = (ram.patrolL + ram.patrolR) / 2;
      ram.returnY = ram.homeY;
      ram.chaseTimer = 0;
    }
  }
  else if (ram.state === 'returning') {
    // Walk back to patrol route
    const dx = ram.returnX - ram.x;
    const dy = ram.returnY - ram.y;
    const dist = Math.hypot(dx, dy);
    ram.facingRight = dx > 0;

    if (dist > 5) {
      ram.x += (dx / dist) * ram.speed * 1.5 * 60 * dt;
      ram.y += (dy / dist) * ram.speed * 1.5 * 60 * dt;
    } else {
      ram.state = 'grazing';
      ram.stateTimer = ram.grazeTime();
    }
  }

  // Ram thorn collision — push out of bushes
  THORNS.forEach(t => {
    const RAM_BUSH_R = 28;
    const d = Math.hypot(ram.x - t.x, ram.y - t.y);
    if (d < RAM_BUSH_R && d > 0) {
      ram.x = t.x + ((ram.x - t.x) / d) * RAM_BUSH_R;
      ram.y = t.y + ((ram.y - t.y) / d) * RAM_BUSH_R;
    }
  });
}

function hitPsyche(ram) {
  G.pHit = true;
  G.pHitTimer = 1.5; // Invincibility frames

  // Knockback away from ram
  const dx = G.px - ram.x;
  const dy = G.py - ram.y;
  const dist = Math.hypot(dx, dy) || 1;
  G.pKnockX = (dx / dist) * 8;
  G.pKnockY = (dy / dist) * 8;

  // Ram returns after hit
  ram.state = 'returning';
  ram.returnX = (ram.patrolL + ram.patrolR) / 2;
  ram.returnY = ram.homeY;

  // Every hit costs a heart from both attempt and total pool
  G.hearts--;
  G.totalHearts--;
  GAME.totalHearts--;
  GAME.hearts = G.hearts;
  G.heartsUsedThisAttempt++;
  showFloat(G.px, G.py - 20, '🐏💔 Hit!', '#ef4444');

  shake();
  const flash = document.createElement('div');
  flash.className = 'charge-flash';
  container.appendChild(flash);
  setTimeout(() => flash.remove(), 500);

  spawnP(G.px, G.py, 6, '#ef4444');

  // Out of attempt hearts — restart level
  if (G.hearts <= 0) {
    if (GAME.totalHearts <= 0) {
      G.phase = 'gameover';
      return;
    }
    G.phase = 'restart';
    G.attempts++;
    showFloat(W/2, H/2, '💔 Restarting trial...', '#ef4444');
    setTimeout(() => {
      restartLevel();
    }, 1500);
  }
}

function restartLevel() {
  const attempts = G.attempts;
  G = freshState();
  G.totalHearts = GAME.totalHearts;
  G.attempts = attempts;
  G.hearts = Math.min(4, GAME.totalHearts);

  setupRams();
  G.phase = 'playing';
}

// ============================================================
// REED WARNING
// ============================================================
function checkReedWarning(ram) {
  if (G.reedCooldown > 0) return;
  // Warn if Psyche is somewhat near this ram
  const dist = Math.hypot(G.px - ram.x, G.py - ram.y);
  if (dist < ram.detectRadius + 60) {
    const el = document.createElement('div');
    el.className = 'reed-msg';
    el.textContent = '🌿 careful... it\'s looking around...';
    container.appendChild(el);
    setTimeout(() => el.remove(), 2200);
    G.reedCooldown = 5;
  }
}

// ============================================================
// WOOL
// ============================================================
function spawnWool() {
  const available = THORNS.filter((t,i) =>
    !G.woolTufts.some(w => w.thornIdx === i && !w.collected && !w.fadeOut));
  if (available.length === 0) return;
  const thornIdx = THORNS.indexOf(available[Math.floor(Math.random()*available.length)]);
  const t = THORNS[thornIdx];
  G.woolTufts.push({
    thornIdx, x: t.x + (Math.random()-0.5)*6, y: t.y - 14,
    life: 10 + Math.random()*4, maxLife: 14,
    collected: false, fadeOut: 0
  });
}

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  G.particles = G.particles.filter(p => {
    p.x+=p.vx; p.y+=p.vy; p.vy+=2*dt; p.life-=dt; return p.life>0;
  });
  G.flyingWool = G.flyingWool.filter(f => {
    f.progress += dt * 2.5;
    return f.progress < 1;
  });

  if (G.phase !== 'playing') return;
  G.elapsed += dt;

  if (G.basketBounce > 0) G.basketBounce -= dt*2;
  if (G.reedCooldown > 0) G.reedCooldown -= dt;

  updatePsyche(dt);
  G.rams.forEach(r => updateRam(r, dt));

  // Space/Enter to grab
  if ((keys[' '] || keys['Enter']) && G.pNearWool >= 0) {
    grabWool();
    keys[' '] = false; keys['Enter'] = false;
  }

  // Spawn wool
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0 && G.woolTufts.filter(w=>!w.collected&&!w.fadeOut).length < 4) {
    spawnWool();
    G.spawnTimer = (G.woolCollected < 5 ? 3 : G.woolCollected < 10 ? 2.5 : 2) + Math.random()*1.5;
  }

  // Wool lifetime
  G.woolTufts.forEach(w => {
    if (w.collected) return;
    w.life -= dt;
    if (w.life <= 0 && !w.fadeOut) w.fadeOut = 1;
    if (w.fadeOut > 0) w.fadeOut -= dt*2;
  });
  G.woolTufts = G.woolTufts.filter(w => {
    if (w.collected) return false;
    if (w.fadeOut <= 0 && w.life <= 0) return false;
    return true;
  });
}

// ============================================================
// RENDER
// ============================================================
function render() {
  ctx.clearRect(0, 0, W, H);

  // === SKY ===
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#3a6090'); sky.addColorStop(0.15,'#6a88a8');
  sky.addColorStop(0.3,'#c89848'); sky.addColorStop(0.45,'#d8a838');
  sky.addColorStop(0.65,'#5a8a3a'); sky.addColorStop(0.85,'#3a6828');
  sky.addColorStop(1,'#2a4a1e');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  // Sun glow
  const sg = ctx.createRadialGradient(560,90,0,560,90,200);
  sg.addColorStop(0,'rgba(255,210,100,0.25)');
  sg.addColorStop(1,'rgba(255,160,40,0)');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);

  // Hills
  ctx.fillStyle='#4a7a2a'; ctx.beginPath();
  ctx.moveTo(0,280);
  ctx.quadraticCurveTo(120,250,240,270);
  ctx.quadraticCurveTo(380,290,500,260);
  ctx.quadraticCurveTo(600,250,W,275);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

  ctx.fillStyle='#3a6a22'; ctx.beginPath();
  ctx.moveTo(0,340);
  ctx.quadraticCurveTo(200,330,400,345);
  ctx.quadraticCurveTo(550,355,W,340);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

  // Grass
  ctx.strokeStyle='rgba(50,100,30,0.25)'; ctx.lineWidth=1;
  for (let gx=0;gx<W;gx+=12) {
    const gy=290+Math.sin(gx*0.03)*20+Math.random()*40;
    if (gy>260) {
      ctx.beginPath();ctx.moveTo(gx,gy);
      ctx.lineTo(gx+Math.sin(G.elapsed*1.5+gx)*2,gy-5-Math.random()*3);
      ctx.stroke();
    }
  }

  // River
  const riverY=H-45;
  ctx.fillStyle='#2a5a88'; ctx.fillRect(0,riverY,W,45);
  ctx.fillStyle='rgba(100,180,220,0.12)';
  for (let rx=0;rx<W;rx+=30) {
    const ry=riverY+5+Math.sin(G.elapsed*2+rx*0.1)*3;
    ctx.fillRect(rx,ry,18,2);
  }

  // === DANGER ZONES (subtle ground telegraph) ===
  G.rams.forEach(ram => {
    if (ram.state === 'alert') {
      const pulse = 0.05 + Math.sin(G.elapsed*3)*0.02;
      ctx.fillStyle = `rgba(220,180,50,${pulse})`;
      ctx.beginPath(); ctx.arc(ram.x, ram.y, ram.detectRadius, 0, Math.PI*2); ctx.fill();
    } else if (ram.state === 'chasing') {
      ctx.fillStyle = 'rgba(200,50,30,0.06)';
      ctx.beginPath(); ctx.arc(ram.x, ram.y, ram.detectRadius, 0, Math.PI*2); ctx.fill();
      // Chase line to Psyche
      ctx.strokeStyle = 'rgba(200,50,30,0.15)';
      ctx.lineWidth = 1; ctx.setLineDash([4,6]);
      ctx.beginPath(); ctx.moveTo(ram.x, ram.y); ctx.lineTo(G.px, G.py); ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  // === THORNS ===
  THORNS.forEach(t => {
    const bushSpr = sprites['thorn_bush'];
    if (bushSpr) {
      const bsz = 56;
      ctx.drawImage(bushSpr, t.x - bsz/2, t.y - bsz/2 + 5, bsz, bsz);
    } else {
      ctx.fillStyle='#2a4a18';
      ctx.beginPath(); ctx.arc(t.x,t.y+5,20,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#3a5a22';
      ctx.beginPath(); ctx.arc(t.x-5,t.y+2,14,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(t.x+7,t.y+3,12,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#4a3a1a'; ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(t.x-3,t.y); ctx.lineTo(t.x-9,t.y-18);
      ctx.moveTo(t.x+4,t.y-2); ctx.lineTo(t.x+12,t.y-15);
      ctx.moveTo(t.x,t.y-1); ctx.lineTo(t.x+1,t.y-20);
      ctx.stroke();
    }
  });

  // === WOOL ===
  G.woolTufts.forEach((w,i) => {
    if (w.collected) return;
    const fadeA = w.fadeOut > 0 ? w.fadeOut : 1;
    const isNear = i === G.pNearWool;
    const pulse = 0.8 + Math.sin(G.elapsed*4)*0.2;

    const woolSpr = sprites['wool'];
    if (woolSpr) {
      ctx.save(); ctx.globalAlpha = fadeA;
      const sz = isNear ? 34 : 28;
      ctx.drawImage(woolSpr, w.x-sz/2, w.y-sz/2, sz, sz);
      ctx.restore();
    } else {
      ctx.fillStyle = `rgba(255,215,0,${pulse*fadeA})`;
      ctx.beginPath(); ctx.arc(w.x,w.y,isNear?9:7,0,Math.PI*2); ctx.fill();
      if (isNear) {
        ctx.fillStyle = `rgba(255,240,100,${0.15*fadeA})`;
        ctx.beginPath(); ctx.arc(w.x,w.y,14,0,Math.PI*2); ctx.fill();
      }
    }

    // Grab prompt when near
    if (isNear && G.phase === 'playing' && !G.pGrabbing) {
      ctx.fillStyle = 'rgba(255,215,100,0.7)';
      ctx.font = 'bold 10px "Segoe UI"'; ctx.textAlign = 'center';
      ctx.fillText('SPACE to grab', w.x, w.y - 18);
      ctx.textAlign = 'left';
    }

    // Life bar
    const lr = w.life / w.maxLife;
    if (lr < 0.35 && !w.fadeOut) {
      ctx.fillStyle = `rgba(255,255,255,${0.2*fadeA})`;
      ctx.fillRect(w.x-8, w.y+12, 16*lr/0.35, 2);
    }
  });

  // Flying wool to basket
  G.flyingWool.forEach(f => {
    const t = f.progress;
    const e = t*t*(3-2*t);
    const fx = f.startX + (W-75 - f.startX)*e;
    const fy = f.startY + (25 - f.startY)*e - Math.sin(t*Math.PI)*40;
    ctx.fillStyle = `rgba(255,215,0,${1-t*0.5})`;
    ctx.beginPath(); ctx.arc(fx,fy,5*(1-t*0.3),0,Math.PI*2); ctx.fill();
    ctx.fillStyle = `rgba(255,240,150,${(1-t)*0.3})`;
    ctx.beginPath(); ctx.arc(fx-3,fy+2,3,0,Math.PI*2); ctx.fill();
  });

  // === RAMS ===
  G.rams.forEach(ram => {
    const sprName = ram.state==='chasing'?'ram_charge':ram.state==='alert'?'ram_alert':'ram_graze';
    const spr = sprites[sprName];

    if (spr) {
      ctx.save();
      const sz = 80;
      if (!ram.facingRight) {
        ctx.translate(ram.x, ram.y-sz/2+10); ctx.scale(-1,1);
        ctx.drawImage(spr,-sz/2,0,sz,sz);
      } else {
        ctx.drawImage(spr, ram.x-sz/2, ram.y-sz/2+10, sz, sz);
      }
      ctx.restore();
    } else {
      // Programmatic ram
      const headOff = ram.state==='grazing'?12+ram.headBob:ram.state==='alert'?-8:5;
      const headX = ram.x+(ram.facingRight?20:-20);
      const headY = ram.y+headOff;
      ctx.fillStyle='#d4a020';
      ctx.beginPath();ctx.ellipse(ram.x,ram.y,26,16,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#c89418';
      ctx.beginPath();ctx.ellipse(ram.x,ram.y-3,22,12,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#b88418';
      ctx.beginPath();ctx.arc(headX,headY,9,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#8a6a10';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(headX,headY-7,7,Math.PI*0.8,Math.PI*1.9);ctx.stroke();
      ctx.fillStyle=ram.state==='chasing'?'#ff3333':'#222';
      ctx.beginPath();ctx.arc(headX+(ram.facingRight?4:-4),headY-1,
        ram.state==='chasing'?2.5:1.5,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#8a6a18';ctx.lineWidth=2.5;
      const la=ram.state==='chasing'?Math.sin(G.elapsed*18)*5:Math.sin(G.elapsed*3)*2;
      ctx.beginPath();
      ctx.moveTo(ram.x-12,ram.y+14);ctx.lineTo(ram.x-12+la,ram.y+28);
      ctx.moveTo(ram.x+12,ram.y+14);ctx.lineTo(ram.x+12-la,ram.y+28);
      ctx.stroke();
      if (ram.state==='chasing') {
        for(let d=0;d<4;d++){
          ctx.fillStyle=`rgba(160,140,80,${0.3+Math.random()*0.3})`;
          ctx.beginPath();
          ctx.arc(ram.x-(ram.facingRight?1:-1)*(20+d*8)+Math.random()*6,
            ram.y+22+Math.random()*6,2+Math.random()*2,0,Math.PI*2);ctx.fill();
        }
      }
    }

    // State aura
    if (ram.state==='grazing') {
      ctx.fillStyle='rgba(80,180,80,0.05)';
      ctx.beginPath();ctx.arc(ram.x,ram.y,22,0,Math.PI*2);ctx.fill();
    } else if (ram.state==='alert') {
      ctx.strokeStyle=`rgba(220,180,50,${0.25+Math.sin(G.elapsed*4)*0.1})`;
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(ram.x,ram.y+5,20,0,Math.PI*2);ctx.stroke();
    }
  });

  // === PSYCHE ===
  renderPsyche();

  // === REED ===
  const reedSway = Math.sin(G.elapsed*1.8)*4;
  const reedSpr = sprites['reed'];
  const rX=55, rBase=riverY;
  if (reedSpr) {
    ctx.save();
    const rH=50, rW=rH*(reedSpr.width/reedSpr.height);
    ctx.translate(rX, rBase-rH+10);
    ctx.transform(1,0,reedSway*0.02,1,0,0);
    ctx.drawImage(reedSpr,-rW/2,0,rW,rH);
    ctx.restore();
  } else {
    ctx.strokeStyle='#4a6a3a';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(rX,rBase);
    ctx.quadraticCurveTo(rX+reedSway,rBase-30,rX+reedSway*1.3,rBase-55);ctx.stroke();
    ctx.fillStyle='#5a3a2a';
    ctx.beginPath();ctx.ellipse(rX+reedSway*1.3,rBase-62,4,10,reedSway*0.01,0,Math.PI*2);ctx.fill();
  }

  // === PARTICLES ===
  G.particles.forEach(p => {
    ctx.globalAlpha=Math.max(0,p.life/p.ml);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.ml),0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // === HUD ===
  if (G.phase==='playing') renderHUD();

  // === OVERLAYS ===
  if (G.phase==='tutorial') renderTutorial();
  if (G.phase==='complete') renderComplete();
  if (G.phase==='gameover') renderGameOver();
  if (G.phase==='restart') renderRestart();
}

function renderPsyche() {
  const blink = G.pHit && Math.sin(G.elapsed*30) > 0; // Flash when hit
  if (blink) return; // Skip render on blink frames

  const spr = sprites['psyche'];
  if (spr) {
    ctx.save();
    const sz = 72;
    if (G.pFacing < 0) {
      ctx.translate(G.px, G.py-sz+8); ctx.scale(-1,1);
      ctx.drawImage(spr,-sz/2,0,sz,sz);
    } else {
      ctx.drawImage(spr, G.px-sz/2, G.py-sz+8, sz, sz);
    }
    ctx.restore();
  } else {
    // Programmatic Psyche
    // Head
    ctx.fillStyle='#e8ddd0';
    ctx.beginPath();ctx.arc(G.px, G.py-18, 7, 0, Math.PI*2);ctx.fill();
    // Hair
    ctx.fillStyle='#6a4a28';
    ctx.beginPath();ctx.arc(G.px, G.py-21, 6, Math.PI, Math.PI*2);ctx.fill();
    ctx.fillRect(G.px-5, G.py-21, 2, 12);
    ctx.fillRect(G.px+3, G.py-21, 2, 10);
    // Body (white chiton)
    ctx.fillStyle='#f0ece4';
    ctx.beginPath();
    ctx.moveTo(G.px, G.py-11);
    ctx.lineTo(G.px-9, G.py+4);
    ctx.lineTo(G.px+9, G.py+4);
    ctx.closePath();ctx.fill();
    // Gold belt
    ctx.strokeStyle='#d4a020'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(G.px-6,G.py-6);ctx.lineTo(G.px+6,G.py-6);ctx.stroke();
    // Legs
    ctx.strokeStyle='#e8ddd0';ctx.lineWidth=2;
    const legAnim = G.pMoving ? Math.sin(G.elapsed*12)*4 : 0;
    ctx.beginPath();ctx.moveTo(G.px-3,G.py+4);ctx.lineTo(G.px-3+legAnim,G.py+12);ctx.stroke();
    ctx.beginPath();ctx.moveTo(G.px+3,G.py+4);ctx.lineTo(G.px+3-legAnim,G.py+12);ctx.stroke();
  }

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();ctx.ellipse(G.px, G.py+10, 10, 4, 0, 0, Math.PI*2);ctx.fill();
}

function renderComplete() {

  G.rams.push(createRam(160, 190, 60, 350, 0.5, 100));    // Top-left patrol
  G.rams.push(createRam(500, 440, 350, 640, 0.55, 100));   // Bottom-right patrol
}

  G = freshState();
  setupRams();
}
function startGame() { G.phase = 'playing'; }



  return {
    init(){ initGame(); G.phase='tutorial'; },
    update(dt){ G.elapsed+=dt; update(dt);
      if(G.woolCollected>=G.woolNeeded&&G.phase==='playing'){
        G.phase='complete';
      }
    },
    render(){ render(); },
    click(x,y){
      const p={x,y};
      if(G.phase==='tutorial'){if(p.x>W/2-65&&p.x<W/2+65&&p.y>460&&p.y<500){G.phase='playing';}return;}
      if(G.phase==='complete'){
        if(p.x>W/2-90&&p.x<W/2+90&&p.y>390&&p.y<426){
          const lost=10-GAME.totalHearts;
          let rating;
          if(lost===0)rating='Excellent';else if(lost<=2)rating='Good';
          else if(lost<=4)rating='Fair';else rating='Needs Work';
          trialComplete(2,'patience',{score:Math.max(0,100-lost*15),rating});
        }
        return;
      }
      if(G.phase==='gameover'){restartLevel();return;}
      if(G.phase==='playing'&&G.pNearWool>=0) grabWool();
    },
    mousemove(x,y){},
    mouseup(x,y){},
    G: ()=>G
  };
})();
