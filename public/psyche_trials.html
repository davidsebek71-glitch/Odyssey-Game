// ================================================================
// TRIAL 3: THE EAGLE'S FLIGHT
// Zeus's eagle carries the jug to the Styx source and back.
// Two phases: ASCENT (scroll up) then DESCENT (scroll down).
// Hazards knock the jug — grip meter must stay above 0.
// Virtue earned: Humility
// ================================================================
const Trial3 = (function(){

// ── Constants ───────────────────────────────────────────────
const GRIP_MAX        = 100;
const GRIP_REGEN      = 6;
const GRIP_HIT        = 18;
const EAGLE_SPEED_X   = 300;    // snappy but controllable
const EAGLE_ACCEL     = 10;
const GRAVITY         = 100;    // more air time per flap
const FLAP_IMPULSE    = -220;
const FLAP_COOLDOWN   = 0.15;
const SCROLL_START    = 62;
const SCROLL_PEAK     = 123;
const DESCENT_SCROLL  = 84;
const BRAKE_FORCE     = 140;
const JUG_SLOSH_SPEED = 180;
const JUG_SLOSH_GRIP  = 2;
const WIND_INTERVAL   = 6.0;
const WIND_FORCE      = 120;
const WIND_DUR        = 2.5;

// Lane centers (invisible to player — spawn logic only):
// Cliff=0-160px, L1=160-280, L2=280-400, L3=400-520, L4=520-640
const LANE_CX = [220, 340, 460, 580];
const CLIFF_W = 160;         // display width of cliff wall
const CLIFF_STONE_FRAC = 0.73; // stone occupies 73% of cliff_wall.png width

const HZ = { CLOUD:0, HARPY:1, ROCK:2, SOUL:3 };

// ── State ────────────────────────────────────────────────────
let G = {};
function freshState() {
  return {
    phase: 'cutscene_intro',
    elapsed: 0,
    ex: 420, ey: H*0.55,
    vy: 0,
    flapCooldown: 0,
    ascentDist: 2800,
    descentDist: 2800,
    scrolled: 0,
    grip: GRIP_MAX,
    gripHitTimer: 0,
    windTimer: WIND_INTERVAL * 0.5,
    windActive: false,
    windDir: 0,
    windTimeLeft: 0,
    windAlpha: 0,
    hazards: [],
    hazSpawnTimer: 1.2,
    hazSpawnInterval: 2.0,
    particles: [],
    summitTimer: 0,
    summitPhase: 0,
    hits: 0,
    heartsLost: 0,
    targetX: 420,
    // Cutscene state
    csTimer: 0,
    csBeat: 0,
    csReady: false,      // true when click-to-advance is available
    csEagleX: 0,
    csEagleY: 0,
    csWon: false,        // true if descent completed, false if all hearts lost
  };
}

// ── Hazard factory ───────────────────────────────────────────
// Lane centers (invisible to player — spawn logic only):
// L1=190 (cliff lane, rocks only), L2=310, L3=430, L4=565
function spawnHazard(phase) {
  let type;
  if(phase==='descent'){
    type = Math.random()<0.5 ? HZ.SOUL : Math.random()<0.5 ? HZ.HARPY : HZ.CLOUD;
  } else {
    type = Math.random()<0.55 ? HZ.HARPY : HZ.CLOUD;
  }

  const h = { type, phase:'active', timer:0 };
  const spd = G.currentScroll || SCROLL_START;

  if(type === HZ.CLOUD){
    const laneIdx = Math.floor(Math.random()*4);
    h.x = LANE_CX[laneIdx] + (Math.random()-0.5)*50;
    h.y = phase==='descent' ? H+70 : -70;
    h.w = 150+Math.random()*70; h.h = 55;
    h.vx = (Math.random()-0.5)*15;
    // Clouds move at world scroll speed — same as background, feels embedded
    h.vy = phase==='descent' ? -(spd*0.9+20) : spd*0.9+20;
  } else if(type === HZ.HARPY){
    const laneIdx = Math.floor(Math.random()*4);
    h.laneCX = LANE_CX[laneIdx]; // store lane center for constrained homing
    h.x = h.laneCX;              // spawn exactly on lane center
    h.w = 80; h.h = 68;          // larger — clearly visible
    h.phase = 'diving';
    h.timer = 0;
    if(phase === 'descent'){
      h.y = H + 70;
      h.vx = 0;
      h.vy = -(spd + 80 + Math.random()*40);
    } else {
      h.y = -70;
      h.vx = 0;
      h.vy = spd + 80 + Math.random()*40;
    }
  } else if(type === HZ.SOUL){
    const laneIdx = Math.floor(Math.random()*4);
    h.x = LANE_CX[laneIdx] + (Math.random()-0.5)*55;
    h.y = H+55;
    h.w = 70; h.h = 95;
    h.vx = (Math.random()-0.5)*15;
    h.vy = -(spd*0.9+30+Math.random()*30);
  }
  G.hazards.push(h);
}

// ── Particles ────────────────────────────────────────────────
function spawnParticles(x,y,n,color) {
  for(let i=0;i<n;i++) {
    G.particles.push({
      x,y,
      vx:(Math.random()-0.5)*120,
      vy:(Math.random()-0.5)*120-40,
      life:0.5+Math.random()*0.3,
      ml:0.8,
      color,
      size:2+Math.random()*3
    });
  }
}

// ── Update ───────────────────────────────────────────────────
function update(dt) {
  if(G.phase==='tutorial'||G.phase==='complete') return;

  // ── CUTSCENE INTRO — Zeus gives eagle to Psyche ──
  if(G.phase==='cutscene_intro'){
    G.csTimer+=dt;
    // Beat 0: fade in scene (0-1.5s)
    // Beat 1: Zeus speaks (1.5s)
    // Beat 2: Eagle hops forward (3.0s)
    // Beat 3: Psyche speaks (4.5s)
    // Beat 4: click ready (5.5s)
    // Beat 5: eagle launches (after click)
    if(G.csBeat===0&&G.csTimer>=1.5){G.csBeat=1;}
    if(G.csBeat===1&&G.csTimer>=3.0){G.csBeat=2;}
    if(G.csBeat===2&&G.csTimer>=4.5){G.csBeat=3;}
    if(G.csBeat===3&&G.csTimer>=5.5){G.csBeat=4;G.csReady=true;}
    // Beat 5: eagle flies up off screen
    if(G.csBeat===5){
      G.csEagleY-=320*dt;
      if(G.csEagleY<-120){
        // Straight into gameplay — no tutorial screen
        G.phase='ascent'; G.hazSpawnTimer=2.0;
      }
    }
    return;
  }

  // ── CUTSCENE OUTRO — Eagle returns to Psyche ──
  if(G.phase==='cutscene_outro'){
    G.csTimer+=dt;
    // Beat 0: eagle descends from top (0s+)
    if(G.csBeat===0){
      G.csEagleY+=180*dt;
      const landY=H*0.72;
      if(G.csEagleY>=landY){G.csEagleY=landY;G.csBeat=1;G.csTimer=0;}
    }
    // Beat 1: pause, text appears (0-1.5s)
    if(G.csBeat===1&&G.csTimer>=1.5){G.csBeat=2;}
    // Beat 2: second line (1.5-3.0s)
    if(G.csBeat===2&&G.csTimer>=3.0){G.csBeat=3;G.csReady=true;}
    // Beat 3: click ready → go to score screen
    return;
  }

  G.elapsed += dt;

  // Current scroll speed — escalates with ascent progress (racing acceleration)
  const ascentProgress = G.phase==='ascent' ? Math.min(1, G.scrolled/G.ascentDist) : 0;
  const currentScroll = G.phase==='ascent'
    ? SCROLL_START + (SCROLL_PEAK - SCROLL_START)*ascentProgress
    : DESCENT_SCROLL;
  G.currentScroll = currentScroll; // expose to render for streak speed

  // ── LATERAL MOVEMENT — race car snap steering ──
  const moveL = keys['ArrowLeft']||keys['a']||keys['A'];
  const moveR = keys['ArrowRight']||keys['d']||keys['D'];
  if(moveL) G.targetX = Math.max(165, G.targetX - EAGLE_SPEED_X*dt);
  if(moveR) G.targetX = Math.min(W-40, G.targetX + EAGLE_SPEED_X*dt);
  const prevEx = G.ex;
  G.ex += (G.targetX - G.ex) * Math.min(1, dt*EAGLE_ACCEL);
  G.ex = Math.max(165, Math.min(W-40, G.ex));
  // Track lateral velocity for sprite flip
  G.vx = (G.ex - prevEx) / Math.max(dt, 0.001);

  // ── VERTICAL — gravity + flap + dive, full screen freedom ──
  const flapKey = keys[' ']||keys['ArrowUp']||keys['w']||keys['W'];
  const diveKey = keys['ArrowDown']||keys['s']||keys['S'];
  if(G.flapCooldown>0) G.flapCooldown-=dt;

  if(G.phase==='ascent'||G.phase==='summit'){
    G.vy += GRAVITY*dt;
    if(flapKey && G.flapCooldown<=0){
      G.vy = FLAP_IMPULSE;
      G.flapCooldown = FLAP_COOLDOWN;
      spawnParticles(G.ex, G.ey+28, 4, 'rgba(180,210,255,0.5)');
    }
    // DOWN = instant dive impulse (same responsiveness as flap)
    if(diveKey && G.flapCooldown<=0){
      G.vy = 220; // instant downward velocity
      G.flapCooldown = FLAP_COOLDOWN;
      spawnParticles(G.ex, G.ey-20, 3, 'rgba(180,210,255,0.4)');
    }
    G.ey += G.vy*dt;
    if(G.ey<40){ G.ey=40; G.vy=Math.max(0,G.vy); }
    if(G.ey>H-40){
      G.ey=H-40; G.vy=FLAP_IMPULSE*0.4;
      if(G.gripHitTimer<=0){
        G.grip=Math.max(0,G.grip-GRIP_HIT);
        G.gripHitTimer=0.7; G.hits++;
        spawnParticles(G.ex,G.ey,6,'#ff8040');
        showFloat(G.ex,G.ey-36,'💥 Mountain floor!','#ff8040',12);
        if(G.grip<=0) triggerJugSlip();
      }
    }
  } else if(G.phase==='descent'){
    G.vy += GRAVITY*0.55*dt;
    // UP/Space = instant brake impulse — same responsiveness as flap on ascent
    if(flapKey && G.flapCooldown<=0){
      G.vy = -120;  // instant upward push
      G.flapCooldown = FLAP_COOLDOWN;
      spawnParticles(G.ex, G.ey+28, 3, 'rgba(100,190,220,0.5)');
    }
    // DOWN = instant dive (accepts grip risk)
    if(diveKey && G.flapCooldown<=0){
      G.vy = 280;
      G.flapCooldown = 0.12;
    }
    if(G.vy > JUG_SLOSH_SPEED && G.gripHitTimer<=0){
      G.grip = Math.max(0, G.grip - JUG_SLOSH_GRIP*dt*60);
      if(G.grip<=0) triggerJugSlip();
    }
    G.ey += G.vy*dt;
    if(G.ey<40){ G.ey=40; G.vy=20; }
    if(G.ey>H-40){ G.ey=H-40; G.vy=0; }
  }

  // Grip regen
  if(G.gripHitTimer>0) G.gripHitTimer-=dt;
  else G.grip=Math.min(GRIP_MAX, G.grip+GRIP_REGEN*dt);

  // ── WIND GUST ──
  if(G.phase==='ascent'||G.phase==='descent'){
    if(G.windActive){
      G.windTimeLeft-=dt;
      G.windAlpha=Math.min(1,G.windTimeLeft/0.4);
      G.targetX+=G.windDir*WIND_FORCE*dt;
      G.targetX=Math.max(145,Math.min(W-40,G.targetX));
      if(G.windTimeLeft<=0){G.windActive=false;G.windAlpha=0;}
    } else {
      G.windTimer-=dt;
      if(G.windTimer<=0){
        G.windActive=true;
        G.windDir=Math.random()<0.5?-1:1;
        G.windTimeLeft=WIND_DUR+(Math.random()-0.5)*0.6;
        G.windAlpha=1;
        G.windTimer=WIND_INTERVAL+(Math.random()-0.5)*1.5;
        showFloat(W/2,70,G.windDir<0?'💨 Wind from the right!':'💨 Wind from the left!','rgba(180,210,255,0.9)',13);
      }
    }
  }

  // ── ASCENT ──
  if(G.phase==='ascent'){
    G.scrolled+=currentScroll*dt;
    G.hazSpawnTimer-=dt;
    const spawnInterval=G.hazSpawnInterval*(1-ascentProgress*0.55);
    if(G.hazSpawnTimer<=0){
      spawnHazard('ascent');
      if(ascentProgress>0.5&&Math.random()<0.35) spawnHazard('ascent');
      G.hazSpawnTimer=spawnInterval+Math.random()*0.35;
    }
    if(G.scrolled>=G.ascentDist){
      G.phase='summit';G.summitTimer=5.0;G.summitPhase=0;
      G.hazards=[];G.windActive=false;G.vy=-50;
      spawnParticles(G.ex,G.ey,25,'#80d8ff');
    }
  }

  // ── SUMMIT ──
  if(G.phase==='summit'){
    G.summitTimer-=dt;
    G.vy=Math.max(G.vy-GRAVITY*0.4*dt,-25);
    G.ey=Math.max(H*0.3,G.ey+G.vy*dt);
    if(G.summitPhase===0&&G.summitTimer<3.8){G.summitPhase=1;showFloat(W/2,H*0.17,'"Well done, chosen eagle."','#f0d68a',15);}
    if(G.summitPhase===1&&G.summitTimer<2.0){G.summitPhase=2;showFloat(W/2,H*0.23,'"Do not spill a drop."','rgba(180,230,255,0.9)',13);}
    if(G.summitTimer<=0){G.phase='descent';G.scrolled=0;G.vy=50;G.windTimer=WIND_INTERVAL*0.4;G.hazSpawnTimer=1.8;G.gripHitTimer=3.0;G.grip=GRIP_MAX;}
  }

  // ── DESCENT ──
  if(G.phase==='descent'){
    G.scrolled+=DESCENT_SCROLL*dt;
    G.hazSpawnTimer-=dt;
    const prog=Math.min(1,G.scrolled/G.descentDist);
    const interval=G.hazSpawnInterval*(1-prog*0.4);
    if(G.hazSpawnTimer<=0){spawnHazard('descent');G.hazSpawnTimer=interval+Math.random()*0.4;}
    if(G.scrolled>=G.descentDist){
      G.phase='cutscene_outro';G.csTimer=0;G.csBeat=0;G.csReady=false;
      G.csEagleX=W*0.55;G.csEagleY=-80;
      G.hazards=[];G.csWon=true;
    }
  }

  // ── ROCKS — scroll with world ──
  // ── HAZARDS — all rush toward eagle ──
  G.hazards=G.hazards.filter(h=>{
    h.timer+=dt;
    if(h.type===HZ.HARPY&&h.phase==='diving'){
      // Zig-zag within lane ±60px of spawn center — not full-screen homing
      const laneMin = (h.laneCX||h.x) - 60;
      const laneMax = (h.laneCX||h.x) + 60;
      const targetX = Math.max(laneMin, Math.min(laneMax, G.ex));
      const homing = 1.5 + ascentProgress*2.0;
      h.vx += (targetX - h.x) * homing * dt;
      h.vx = Math.max(-100, Math.min(100, h.vx));
    }
    h.x+=h.vx*dt; h.y+=h.vy*dt;
    if(h.y>H+100||h.y<-200||h.x<-200||h.x>W+200) return false;
    if(G.gripHitTimer<=0){
      const hw=h.w*0.38,hh=h.h*0.38;
      if(Math.abs(G.ex-h.x)<hw+22&&Math.abs(G.ey-h.y)<hh+22){
        G.grip=Math.max(0,G.grip-GRIP_HIT);
        G.gripHitTimer=1.0;G.hits++;
        spawnParticles(G.ex,G.ey,10,'#ff8040');
        showFloat(G.ex,G.ey-38,h.type===HZ.HARPY?'🦅 Harpy!':h.type===HZ.SOUL?'👻 Soul!':'☁️ Turbulence!','#ff8040',13);
        if(G.grip<=0) triggerJugSlip();
      }
    }
    return true;
  });

  G.particles=G.particles.filter(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt;p.life-=dt;return p.life>0;
  });
}

// ── Jug slip ────────────────────────────────────────────────
function triggerJugSlip(){
  if(G.grip>0) return;
  G.grip=0;
  GAME.totalHearts--;G.heartsLost++;
  showFloat(W/2,H/2,'💧 Jug slipped!','#ef4444',16);
  shake();
  setTimeout(()=>{
    G.grip=GRIP_MAX;G.vy=0;G.hazards=[];
    if(G.phase==='ascent') G.scrolled=Math.max(0,G.scrolled-500);
    if(G.phase==='descent') G.scrolled=Math.max(0,G.scrolled-400);
    if(GAME.totalHearts<=0){
      G.phase='cutscene_outro';G.csTimer=0;G.csBeat=0;G.csReady=false;
      G.csEagleX=W*0.55;G.csEagleY=-80;G.hazards=[];G.csWon=false;
    }
    G.gripHitTimer=2.0;
  },1200);
}



// ── Render ───────────────────────────────────────────────────
function render() {
  ctx.clearRect(0,0,W,H);
  if(G.phase==='cutscene_intro'){renderCutsceneIntro();return;}
  if(G.phase==='cutscene_outro'){renderCutsceneOutro();return;}
  if(G.phase==='tutorial'){renderTutorial();return;}
  if(G.phase==='complete'){renderComplete();return;}

  // ── BACKGROUND — bright canyon sky ──────────────────────────
  const skyBgSpr=sprites['sky_bg'];
  const styxSpr=sprites['scene_styx'];

  if(skyBgSpr){
    // sky_bg.png — draw across FULL canvas width so sky shows through cliff transparency
    const srcW = skyBgSpr.naturalWidth||skyBgSpr.width||1024;
    const srcH = skyBgSpr.naturalHeight||skyBgSpr.height||1536;
    const tileH = srcH * (W / srcW); // scale to full canvas width
    const off = (G.scrolled * 0.15) % tileH; // slow parallax scroll
    ctx.drawImage(skyBgSpr, 0,0, srcW,srcH,  0,off,       W,tileH);
    ctx.drawImage(skyBgSpr, 0,0, srcW,srcH,  0,off-tileH, W,tileH);
  } else {
    // ── Programmatic bright canyon sky ──
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#4a80c4');   // deep cornflower blue at top
    grad.addColorStop(0.5,'#6aa0d8');  // mid blue
    grad.addColorStop(1,'#88b8e8');    // lighter horizon blue
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

    // Background clouds — fluffy white, scrolling slowly, no lightning
    const cloudScroll=(G.scrolled*0.12)%H;
    const bgClouds=[
      {x:260,y:80,w:140,h:55},{x:480,y:140,w:100,h:45},
      {x:350,y:220,w:120,h:50},{x:580,y:60,w:90,h:40},
      {x:200,y:310,w:110,h:48},{x:520,y:350,w:130,h:52},
      {x:300,y:430,w:100,h:44},{x:600,y:480,w:85,h:38},
      // Second tile for seamless scroll
      {x:260,y:80+H,w:140,h:55},{x:480,y:140+H,w:100,h:45},
      {x:350,y:220+H,w:120,h:50},{x:580,y:60+H,w:90,h:40},
      {x:200,y:310+H,w:110,h:48},{x:520,y:350+H,w:130,h:52},
    ];
    bgClouds.forEach(c=>{
      const cy=((c.y-cloudScroll)%H+H)%H;
      if(cy>-60&&cy<H+60){
        // White cloud with light grey shadow
        ctx.fillStyle='rgba(230,238,248,0.85)';
        ctx.beginPath();ctx.ellipse(c.x,cy,c.w/2,c.h/2,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(c.x-c.w*0.15,cy-c.h*0.1,c.w*0.35,c.h*0.42,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(c.x+c.w*0.18,cy-c.h*0.08,c.w*0.32,c.h*0.38,0,0,Math.PI*2);ctx.fill();
        // Shadow underside
        ctx.fillStyle='rgba(180,200,220,0.5)';
        ctx.beginPath();ctx.ellipse(c.x,cy+c.h*0.18,c.w*0.45,c.h*0.28,0,0,Math.PI*2);ctx.fill();
      }
    });

    // Far canyon walls in background — muted blue-grey
    const bgWallScroll=(G.scrolled*0.15)%800;
    ctx.fillStyle='rgba(80,100,140,0.5)';
    const farPts=[[130,200],[200,150],[260,180],[320,130],[380,160],[440,120],[520,150],[580,110],[640,140],[680,120],[680,H],[130,H]];
    ctx.beginPath();
    farPts.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y+(bgWallScroll%100)-50):ctx.lineTo(x,y+(bgWallScroll%100)-50));
    ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(60,80,120,0.7)';
    const midPts=[[130,350],[180,300],[250,330],[330,280],[420,320],[500,270],[580,310],[640,260],[680,280],[680,H],[130,H]];
    ctx.beginPath();
    midPts.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y));
    ctx.closePath();ctx.fill();
  }

  // ── CLIFF WALL — left edge, stone tile over sky ──
  const cliffWallSpr = sprites['cliff_wall'];

  if(cliffWallSpr){
    const srcH = cliffWallSpr.naturalHeight || cliffWallSpr.height || 1536;
    // Stone centered in image: x=290 to x=723 (433px wide)
    const srcStoneX = 290;
    const srcStoneW = 433;
    const tileH = srcH * (CLIFF_W / srcStoneW);
    // Ascent scrolls up (positive), descent scrolls down (negative offset)
    const cliffScroll = G.phase==='descent' ? -(G.scrolled * 1.0) : (G.scrolled * 1.0);
    const off = ((cliffScroll % tileH) + tileH) % tileH;
    const drawW = CLIFF_W + 20;
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,drawW,H); ctx.clip();
    ctx.drawImage(cliffWallSpr, srcStoneX,0, srcStoneW,srcH,  0,off,       drawW,tileH);
    ctx.drawImage(cliffWallSpr, srcStoneX,0, srcStoneW,srcH,  0,off-tileH, drawW,tileH);
    ctx.restore();
  } else {
    // Programmatic fallback — warm brown stone bands matching cliff_wall palette
    ctx.fillStyle='#5c3d1e';
    ctx.fillRect(0,0,CLIFF_W,H);
    const strata=[
      {col:'#6b4826',h:24},{col:'#573518',h:18},{col:'#644020',h:28},
      {col:'#4e2e10',h:20},{col:'#6a4522',h:22},{col:'#5a3a1a',h:26},
      {col:'#624018',h:20},{col:'#503212',h:18},{col:'#684424',h:24},
    ];
    const totalH=strata.reduce((s,b)=>s+b.h,0);
    let ry=-(G.scrolled%totalH);
    for(let rep=0;rep<4;rep++){
      strata.forEach(band=>{
        if(ry<H&&ry+band.h>0){ctx.fillStyle=band.col;ctx.fillRect(0,ry,CLIFF_W-8,band.h);}
        ry+=band.h;
      });
    }
    // Jagged right edge
    ctx.fillStyle='#3a2008';
    ctx.beginPath();ctx.moveTo(CLIFF_W-8,0);
    for(let y=0;y<=H;y+=30){
      const jag=Math.sin(y*0.07+G.scrolled*0.012)*6+4;
      ctx.lineTo(CLIFF_W-8+jag,y);
    }
    ctx.lineTo(CLIFF_W,H);ctx.lineTo(CLIFF_W,0);ctx.closePath();ctx.fill();
  }

  // ── SUMMIT: Styx scene fades in ──
  if(G.phase==='summit'){
    const t=Math.min(1,(5.0-G.summitTimer)/2.0);
    if(styxSpr){
      ctx.globalAlpha=t*0.85;
      ctx.drawImage(styxSpr,0,0,W,H);
      ctx.globalAlpha=1;
    }
    // Zeus golden glow
    const gg=ctx.createRadialGradient(W/2,H*0.25,0,W/2,H*0.25,220);
    gg.addColorStop(0,`rgba(255,220,80,${t*0.3})`);
    gg.addColorStop(1,'rgba(200,160,40,0)');
    ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
    // Spring ripple
    const sr=ctx.createRadialGradient(W/2,H*0.52,0,W/2,H*0.52,80+Math.sin(G.elapsed*3)*8);
    sr.addColorStop(0,`rgba(80,200,255,${t*0.7})`);
    sr.addColorStop(0.5,`rgba(40,140,220,${t*0.3})`);
    sr.addColorStop(1,'rgba(20,80,180,0)');
    ctx.fillStyle=sr;ctx.fillRect(0,0,W,H);
    // Zeus message
    ctx.textAlign='center';
    if(G.summitPhase>=1){
      ctx.globalAlpha=Math.min(1,t*2);
      ctx.fillStyle='#f0d68a';ctx.font='bold 17px "Segoe UI"';
      ctx.shadowColor='rgba(255,200,50,0.8)';ctx.shadowBlur=10;
      ctx.fillText('"Well done, chosen eagle."',W/2,H*0.2);
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
    if(G.summitPhase>=2){
      ctx.fillStyle='rgba(180,230,255,0.9)';ctx.font='italic 14px "Segoe UI"';
      ctx.fillText('"Carry the sacred water — do not spill a drop."',W/2,H*0.28);
    }
    ctx.fillStyle=`rgba(120,200,255,${t})`;ctx.font='bold 15px "Segoe UI"';
    ctx.fillText('The Source of the Styx!',W/2,H*0.38);
    ctx.textAlign='left';
  }

  // Descent arrival warm glow
  if(G.phase==='descent'&&G.scrolled>G.descentDist-250){
    const t=(G.scrolled-(G.descentDist-250))/250;
    ctx.fillStyle=`rgba(240,200,100,${t*0.18})`;ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle=`rgba(240,214,138,${t})`;ctx.font='bold 18px "Segoe UI"';
    ctx.fillText('Psyche waits below...',W/2,H*0.78);
    ctx.textAlign='left';
  }

  // ── HAZARDS ──
  G.hazards.forEach(h=>{
    if(h.type===HZ.CLOUD){
      const spr=sprites['storm_cloud'];
      if(spr){
        ctx.drawImage(spr,h.x-h.w/2,h.y-h.h/2,h.w,h.h);
      } else {
        ctx.fillStyle='rgba(80,85,110,0.88)';
        ctx.beginPath();ctx.ellipse(h.x,h.y,h.w/2,h.h/2,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(95,100,130,0.75)';
        ctx.beginPath();ctx.ellipse(h.x-h.w*0.22,h.y-h.h*0.18,h.w/2.8,h.h/2.0,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(h.x+h.w*0.18,h.y-h.h*0.14,h.w/3.0,h.h/2.2,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(50,52,70,0.6)';
        ctx.beginPath();ctx.ellipse(h.x,h.y+h.h*0.15,h.w/2.2,h.h/3.5,0,0,Math.PI*2);ctx.fill();
      }
    } else if(h.type===HZ.HARPY){
      const spr=sprites['harpy'];
      ctx.save();
      if(spr){
        // Render at 90x75 — big enough to see clearly against sky
        const dw=90, dh=75;
        ctx.translate(h.x,h.y);
        // During descent, harpies rise from below — flip vertically
        if(G.phase==='descent') ctx.scale(1,-1);
        // Face toward eagle horizontally
        if(h.x>G.ex) ctx.scale(-1,1);
        ctx.drawImage(spr,-dw/2,-dh/2,dw,dh);
      } else {
        // Programmatic harpy — dark purple with vivid red eyes, large wings
        ctx.fillStyle='#3a1858';
        ctx.beginPath();ctx.ellipse(h.x,h.y,22,14,0,0,Math.PI*2);ctx.fill();
        const wd=h.x>G.ex?-1:1;
        // Wide swept wings
        ctx.beginPath();ctx.moveTo(h.x,h.y-6);
        ctx.lineTo(h.x-wd*60,h.y-38);ctx.lineTo(h.x-wd*40,h.y+4);ctx.closePath();ctx.fill();
        ctx.beginPath();ctx.moveTo(h.x,h.y-6);
        ctx.lineTo(h.x+wd*60,h.y-38);ctx.lineTo(h.x+wd*40,h.y+4);ctx.closePath();ctx.fill();
        // Bright red eyes — visible from distance
        ctx.fillStyle='#ff2020';
        ctx.beginPath();ctx.arc(h.x+(wd*7),h.y-5,6,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ff8080';
        ctx.beginPath();ctx.arc(h.x+(wd*7),h.y-5,3,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    } else if(h.type===HZ.SOUL){
      const spr=sprites['soul_rising'];
      ctx.save();
      const sa=0.8+Math.sin(G.elapsed*3+h.x*0.05)*0.15;
      ctx.globalAlpha=sa;
      if(spr){
        ctx.drawImage(spr,h.x-h.w/2,h.y-h.h/2,h.w,h.h);
      } else {
        const gx=h.x,gy=h.y,gw=h.w*0.48,gh=h.h*0.48;
        const glow=ctx.createRadialGradient(gx,gy,0,gx,gy,gw*1.8);
        glow.addColorStop(0,'rgba(100,160,255,0.3)');
        glow.addColorStop(1,'rgba(60,100,220,0)');
        ctx.fillStyle=glow;ctx.beginPath();ctx.arc(gx,gy,gw*1.8,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(215,228,255,0.95)';
        ctx.beginPath();
        ctx.arc(gx,gy-gh*0.05,gw,Math.PI,0,false);
        ctx.lineTo(gx+gw,gy+gh*0.65);
        ctx.quadraticCurveTo(gx+gw*0.65,gy+gh*0.95,gx+gw*0.33,gy+gh*0.65);
        ctx.quadraticCurveTo(gx,gy+gh*0.98,gx-gw*0.33,gy+gh*0.65);
        ctx.quadraticCurveTo(gx-gw*0.65,gy+gh*0.95,gx-gw,gy+gh*0.65);
        ctx.lineTo(gx-gw,gy-gh*0.05);
        ctx.closePath();ctx.fill();
        ctx.fillStyle='rgba(20,40,120,0.92)';
        ctx.beginPath();ctx.ellipse(gx-gw*0.34,gy-gh*0.08,gw*0.2,gw*0.26,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(gx+gw*0.34,gy-gh*0.08,gw*0.2,gw*0.26,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.9)';
        ctx.beginPath();ctx.ellipse(gx-gw*0.26,gy-gh*0.14,gw*0.1,gw*0.12,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(gx+gw*0.42,gy-gh*0.14,gw*0.1,gw*0.12,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(150,190,255,0.45)';ctx.lineWidth=2.5;ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(gx,gy+gh*0.85);
        ctx.quadraticCurveTo(gx+Math.sin(G.elapsed*3.5)*10,gy+gh*1.3,gx,gy+gh*1.65);
        ctx.stroke();
      }
      ctx.restore();
    }
  });

  // ── EAGLE — flip to face direction of travel ──
  const eagleKey=G.phase==='descent'?'eagle_full':(G.grip<30?'eagle_grip_low':'eagle_fly');
  const eagleSpr=sprites[eagleKey]||sprites['eagle_fly'];
  const eSize=90;
  const hitFlicker=G.gripHitTimer>0&&Math.sin(G.elapsed*22)>0;

  // Bank into turns like a race car
  const tilt=Math.max(-0.3,Math.min(0.3,(G.vx||0)*0.0012));
  // Face left when moving left
  const facingLeft = (G.vx||0) < -15;

  ctx.save();
  ctx.translate(G.ex,G.ey);
  if(facingLeft) ctx.scale(-1,1);  // flip sprite
  ctx.rotate(tilt * (facingLeft?-1:1));
  if(hitFlicker) ctx.globalAlpha=0.35;

  if(eagleSpr){
    ctx.drawImage(eagleSpr,-eSize/2,-eSize/2,eSize,eSize);
  } else {
    ctx.fillStyle='#8B5E1A';
    ctx.beginPath();ctx.ellipse(0,0,22,14,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#EEE8DC';
    ctx.beginPath();ctx.ellipse(20,-6,12,10,0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#D4A020';
    ctx.beginPath();ctx.moveTo(31,-6);ctx.lineTo(40,-3);ctx.lineTo(31,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='#6B420E';
    ctx.beginPath();ctx.moveTo(-5,-4);ctx.lineTo(-60,-35);ctx.lineTo(-40,4);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(-5,-4);ctx.lineTo(50,-30);ctx.lineTo(35,5);ctx.closePath();ctx.fill();
    ctx.fillStyle=G.phase==='descent'?'#8090B0':'#C4742A';
    ctx.beginPath();ctx.ellipse(0,30,10,14,0,0,Math.PI*2);ctx.fill();
    if(G.phase==='descent'){
      ctx.fillStyle='rgba(100,180,220,0.6)';
      ctx.beginPath();ctx.ellipse(0,24,5,4,0,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // ── SPEED STREAKS — wind lines rushing past ──
  if(G.phase==='ascent'||G.phase==='descent'){
    const spd = G.currentScroll||SCROLL_START;
    const streakAlpha = Math.min(0.55, (spd-SCROLL_START)/(SCROLL_PEAK-SCROLL_START)*0.55 + 0.1);
    const windSpr = sprites['wind_streak'];
    if(windSpr && streakAlpha>0.05){
      // Multiple streaks at different Y positions, scrolling past
      ctx.globalAlpha=streakAlpha;
      for(let s=0;s<5;s++){
        const sy = ((G.elapsed*spd*0.4 + s*140)%H) - 20;
        ctx.drawImage(windSpr, 150+s*15, sy, 180, 30);
      }
      ctx.globalAlpha=1;
    } else if(streakAlpha>0.08) {
      // Programmatic speed lines
      ctx.save();
      for(let s=0;s<6;s++){
        const sy=((G.elapsed*spd*0.4+s*110)%H)-10;
        const len=60+s*20;
        const alpha=streakAlpha*(0.5+s*0.08);
        ctx.strokeStyle=`rgba(200,220,255,${alpha})`;
        ctx.lineWidth=1+s%2;
        ctx.beginPath();ctx.moveTo(200+s*60,sy);ctx.lineTo(200+s*60+len,sy);ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ── PARTICLES ──
  G.particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/p.ml);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // ── HUD ──
  renderHUD();
}

function renderHUD(){
  // Grip meter
  ctx.fillStyle='rgba(0,0,0,0.65)';rr(ctx,10,10,200,38,6);ctx.fill();
  ctx.fillStyle='rgba(200,180,140,0.6)';ctx.font='bold 11px "Segoe UI"';ctx.textAlign='left';
  ctx.fillText(G.phase==='descent'?'🏺 JUG GRIP':'🏺 JUG GRIP',16,25);
  // Bar bg
  ctx.fillStyle='rgba(255,255,255,0.08)';rr(ctx,16,28,180,10,4);ctx.fill();
  // Bar fill
  const gripPct=G.grip/GRIP_MAX;
  const gripColor=gripPct>0.6?'#4ade80':gripPct>0.3?'#fbbf24':'#ef4444';
  ctx.fillStyle=gripColor;rr(ctx,16,28,Math.max(0,180*gripPct),10,4);ctx.fill();
  ctx.strokeStyle='rgba(200,180,140,0.2)';ctx.lineWidth=1;rr(ctx,16,28,180,10,4);ctx.stroke();

  // Progress bar
  const total = G.phase==='descent' ? G.descentDist : G.ascentDist;
  const pct = G.phase==='summit' ? 1 : Math.min(1,G.scrolled/total);
  ctx.fillStyle='rgba(0,0,0,0.65)';rr(ctx,10,55,200,28,6);ctx.fill();
  const label = G.phase==='ascent'?'↑ Ascending':'↓ Returning';
  ctx.fillStyle='rgba(200,180,140,0.5)';ctx.font='11px "Segoe UI"';
  ctx.fillText(G.phase==='summit'?'Summit reached!':label,16,68);
  ctx.fillStyle='rgba(255,255,255,0.06)';rr(ctx,16,70,180,8,3);ctx.fill();
  ctx.fillStyle='rgba(100,180,255,0.7)';rr(ctx,16,70,180*pct,8,3);ctx.fill();

  // Hearts
  ctx.fillStyle='rgba(0,0,0,0.6)';rr(ctx,W-110,10,100,32,6);ctx.fill();
  ctx.font='16px "Segoe UI"';
  const hearts=Math.max(0,Math.min(4,GAME.totalHearts));
  for(let i=0;i<4;i++){
    ctx.fillStyle=i<hearts?'#ef4444':'rgba(100,80,80,0.3)';
    ctx.fillText('\u2665',W-102+i*23,30);
  }

  // Phase label
  if(G.phase==='ascent'||G.phase==='descent'){
    ctx.fillStyle='rgba(0,0,0,0.5)';rr(ctx,W/2-90,10,180,24,4);ctx.fill();
    ctx.fillStyle='rgba(200,180,140,0.6)';ctx.font='bold 12px "Segoe UI"';ctx.textAlign='center';
    ctx.fillText(G.phase==='ascent'
      ? '⬆ Fly to the Styx source'
      : '⬇ Return the water to Psyche', W/2, 27);
    ctx.textAlign='left';
  }

  // Hit flash overlay
  if(G.gripHitTimer>0 && G.gripHitTimer>0.9){
    ctx.fillStyle='rgba(255,80,20,0.15)';
    ctx.fillRect(0,0,W,H);
  }

  // Wind gust indicator
  if(G.windActive && G.windAlpha>0){
    const windLabel = G.windDir<0 ? '← ← ← WIND' : 'WIND → → →';
    const windX = G.windDir<0 ? 60 : W-60;
    ctx.fillStyle=`rgba(140,180,255,${G.windAlpha*0.85})`;
    ctx.font=`bold 13px "Segoe UI"`;ctx.textAlign='center';
    ctx.fillText(windLabel, windX, H*0.55);
    // Arrow lines
    ctx.strokeStyle=`rgba(140,180,255,${G.windAlpha*0.4})`;ctx.lineWidth=1.5;
    for(let i=0;i<3;i++){
      const ly=H*0.5+i*18;
      ctx.beginPath();
      ctx.moveTo(windX-30,ly);ctx.lineTo(windX+30,ly);
      ctx.stroke();
    }
    ctx.textAlign='left';
  }

  // Controls hint — changes by phase
  ctx.fillStyle='rgba(200,180,140,0.3)';ctx.font='10px "Segoe UI"';ctx.textAlign='center';
  if(G.phase==='ascent'){
    ctx.fillText('← → to steer  |  ↑/Space = flap up  |  ↓ = dive down',W/2,H-8);
  } else if(G.phase==='descent'){
    ctx.fillText('← → to steer  |  ↑/Space = BRAKE  |  ↓ = dive (watch the jug!)',W/2,H-8);
  } else {
    ctx.fillText('← → Arrow keys or mouse to steer the eagle',W/2,H-8);
  }
  ctx.textAlign='left';
}

// ── Cutscene: Intro — Zeus gives Psyche the eagle ───────────
function renderCutsceneIntro(){
  // Full-width sky background
  const skyBgSpr=sprites['sky_bg'];
  if(skyBgSpr){
    const srcW=skyBgSpr.naturalWidth||skyBgSpr.width||1024;
    const srcH=skyBgSpr.naturalHeight||skyBgSpr.height||1536;
    ctx.drawImage(skyBgSpr,0,0,srcW,srcH, 0,0,W,H);
  } else {
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#4a80c4');grad.addColorStop(1,'#88b8e8');
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  }

  // Mountain background at bottom
  const mtSpr=sprites['mountain_bg'];
  if(mtSpr){
    const mw=mtSpr.naturalWidth||mtSpr.width||1024;
    const mh=mtSpr.naturalHeight||mtSpr.height||512;
    const drawH=H*0.45;const drawW=drawH*(mw/mh);
    ctx.drawImage(mtSpr,0,0,mw,mh, (W-drawW)/2,H-drawH,drawW,drawH);
  }

  // Ground strip
  ctx.fillStyle='#4a3520';ctx.fillRect(0,H*0.82,W,H*0.18);
  ctx.fillStyle='#3a2810';ctx.fillRect(0,H*0.82,W,4);
  // Grass tufts
  ctx.fillStyle='#5a7a3a';
  for(let gx=10;gx<W;gx+=35){
    const gh=6+Math.sin(gx*0.7)*3;
    ctx.fillRect(gx,H*0.82-gh,3,gh);
    ctx.fillRect(gx+8,H*0.82-gh+2,2,gh-2);
  }

  const fadeIn=Math.min(1,G.csTimer/1.2);
  ctx.globalAlpha=fadeIn;

  // ── Characters on ground ──
  const groundY=H*0.82;
  const zeusSpr=sprites['zeus'];
  const psycheSpr=sprites['psyche'];
  const eagleSpr=sprites['eagle_full'];

  // Zeus — left side
  const zeusX=W*0.25, zeusSize=130;
  if(zeusSpr){
    ctx.drawImage(zeusSpr, zeusX-zeusSize/2, groundY-zeusSize, zeusSize, zeusSize);
  } else {
    ctx.fillStyle='#c0a060';ctx.fillRect(zeusX-15,groundY-80,30,80);
  }

  // Psyche — right side, facing left toward Zeus
  const psycheX=W*0.70, psycheSize=90;
  if(psycheSpr){
    ctx.save();
    ctx.translate(psycheX, groundY-psycheSize);
    ctx.scale(-1,1);
    ctx.drawImage(psycheSpr, -psycheSize/2, 0, psycheSize, psycheSize);
    ctx.restore();
  } else {
    ctx.fillStyle='#e8ddd0';ctx.fillRect(psycheX-12,groundY-65,24,65);
  }

  // Eagle — between them, hops forward at beat 2
  const eagleRestX=W*0.30, eagleReadyX=W*0.48;
  const eagleGroundY=groundY-55;
  let eX=eagleRestX, eY=eagleGroundY;
  if(G.csBeat>=2&&G.csBeat<5){
    const hopT=Math.min(1,(G.csTimer-3.0)/1.0);
    eX=eagleRestX+(eagleReadyX-eagleRestX)*hopT;
    // Small hop arc
    eY=eagleGroundY - Math.sin(hopT*Math.PI)*40;
  }
  if(G.csBeat===5){
    eX=G.csEagleX||eagleReadyX;
    eY=G.csEagleY;
  }
  // Store eagle position for launch beat
  if(G.csBeat<5){G.csEagleX=eX;G.csEagleY=eY;}

  const eagleSize=80;
  if(eagleSpr){
    ctx.save();
    ctx.translate(eX,eY);
    // Gentle wing flap during hover
    if(G.csBeat>=2){
      const wobble=Math.sin(G.csTimer*5)*0.06;
      ctx.rotate(wobble);
    }
    ctx.drawImage(eagleSpr,-eagleSize/2,-eagleSize/2,eagleSize,eagleSize);
    ctx.restore();
  } else {
    ctx.fillStyle='#8B5E1A';
    ctx.beginPath();ctx.ellipse(eX,eY,20,12,0,0,Math.PI*2);ctx.fill();
  }

  // ── Dialogue text ──
  ctx.textAlign='center';
  if(G.csBeat>=1&&G.csBeat<5){
    const zt='"Take my eagle. She will carry the jug for you."';
    ctx.font='italic 14px "Segoe UI"';
    const zbw=Math.max(280, ctx.measureText(zt).width+40);
    ctx.fillStyle='rgba(0,0,0,0.55)';rr(ctx,W*0.25-zbw/2,groundY-zeusSize-52,zbw,40,6);ctx.fill();

// ── Cutscene: Outro — Eagle returns to Psyche ───────────────
function renderCutsceneOutro(){
  // Sky background
  const skyBgSpr=sprites['sky_bg'];
  if(skyBgSpr){
    const srcW=skyBgSpr.naturalWidth||skyBgSpr.width||1024;
    const srcH=skyBgSpr.naturalHeight||skyBgSpr.height||1536;
    ctx.drawImage(skyBgSpr,0,0,srcW,srcH, 0,0,W,H);
  } else {
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#4a80c4');grad.addColorStop(1,'#88b8e8');
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  }

  // Mountain background
  const mtSpr=sprites['mountain_bg'];
  if(mtSpr){
    const mw=mtSpr.naturalWidth||mtSpr.width||1024;
    const mh=mtSpr.naturalHeight||mtSpr.height||512;
    const drawH=H*0.45;const drawW=drawH*(mw/mh);
    ctx.drawImage(mtSpr,0,0,mw,mh, (W-drawW)/2,H-drawH,drawW,drawH);
  }

  // Ground strip
  ctx.fillStyle='#4a3520';ctx.fillRect(0,H*0.82,W,H*0.18);
  ctx.fillStyle='#3a2810';ctx.fillRect(0,H*0.82,W,4);
  ctx.fillStyle='#5a7a3a';
  for(let gx=10;gx<W;gx+=35){
    const gh=6+Math.sin(gx*0.7)*3;
    ctx.fillRect(gx,H*0.82-gh,3,gh);
    ctx.fillRect(gx+8,H*0.82-gh+2,2,gh-2);
  }

  const groundY=H*0.82;

  // Psyche — waiting on the right, facing left
  const psycheSpr=sprites['psyche'];
  const psycheX=W*0.62, psycheSize=90;
  if(psycheSpr){
    ctx.save();
    ctx.translate(psycheX, groundY-psycheSize);
    ctx.scale(-1,1);
    ctx.drawImage(psycheSpr, -psycheSize/2, 0, psycheSize, psycheSize);
    ctx.restore();
  } else {
    ctx.fillStyle='#e8ddd0';ctx.fillRect(psycheX-12,groundY-65,24,65);
  }

  // Eagle — descends from sky, lands near Psyche
  const eagleSpr=sprites['eagle_full'];
  const eagleSize=80;
  const eX=G.csEagleX;
  const eY=G.csEagleY;

  if(eagleSpr){
    ctx.save();
    ctx.translate(eX,eY);
    if(G.csBeat===0){
      // Gentle wing wobble during descent
      const wobble=Math.sin(G.csTimer*6)*0.08;
      ctx.rotate(wobble);
    }
    ctx.drawImage(eagleSpr,-eagleSize/2,-eagleSize/2,eagleSize,eagleSize);
    ctx.restore();
  } else {
    ctx.fillStyle='#8B5E1A';
    ctx.beginPath();ctx.ellipse(eX,eY,20,12,0,0,Math.PI*2);ctx.fill();
  }

  // Jug glow when eagle has landed — only on win
  if(G.csBeat>=1 && G.csWon){
    const glow=0.3+Math.sin(G.csTimer*2.5)*0.15;
    ctx.fillStyle=`rgba(100,180,220,${glow})`;
    ctx.beginPath();ctx.ellipse(eX,eY+10,12,8,0,0,Math.PI*2);ctx.fill();
  }

  // ── Dialogue — win vs loss ──
  ctx.textAlign='center';
  if(G.csBeat>=1){
    const line1 = G.csWon
      ? '"The water is yours. Not a drop was spilled."'
      : '"The jug is empty. The water was lost."';
    const line1Color = G.csWon ? '#f0d68a' : '#f87171';
    ctx.font='italic 15px "Segoe UI"';
    const bw1=Math.max(320, ctx.measureText(line1).width+40);
    ctx.fillStyle='rgba(0,0,0,0.55)';rr(ctx,W/2-bw1/2,groundY*0.42,bw1,40,6);ctx.fill();
    ctx.fillStyle=line1Color;
    ctx.fillText(line1,W/2,groundY*0.42+26);
  }
  if(G.csBeat>=2){
    const line2 = G.csWon
      ? '"Accepting help took more strength than pride."'
      : '"Even in failure, she had the courage to ask for help."';
    ctx.font='italic 14px "Segoe UI"';
    const bw2=Math.max(320, ctx.measureText(line2).width+40);
    ctx.fillStyle='rgba(0,0,0,0.55)';rr(ctx,W/2-bw2/2,groundY*0.42+52,bw2,40,6);ctx.fill();
    ctx.fillStyle='#dcc8a0';
    ctx.fillText(line2,W/2,groundY*0.42+78);
  }

  // Click prompt
  if(G.csReady){
    const p=0.6+Math.sin(G.csTimer*3)*0.4;
    ctx.fillStyle=`rgba(240,214,138,${p*0.12})`;rr(ctx,W/2-80,H*0.90,160,40,8);ctx.fill();
    ctx.strokeStyle=`rgba(240,214,138,${p*0.5})`;ctx.lineWidth=1.5;rr(ctx,W/2-80,H*0.90,160,40,8);ctx.stroke();
    ctx.fillStyle='#f0d68a';ctx.font='bold 15px "Segoe UI"';

canvas.addEventListener('mousemove', e=>{

  G.targetX = Math.max(40, Math.min(W-40, p.x));
});
canvas.addEventListener('touchmove', e=>{
  if(GAME.phase!=='trial3') return;
  const p=getPos(e);
  G.targetX = Math.max(40, Math.min(W-40, p.x));
},{passive:true});

return {
  init(){ G=freshState(); G.elapsed=0; },
  update(dt){ G.elapsed+=dt; update(dt); },
  render(){ render(); },
  click(x,y){
    // ── Cutscene Intro: click "Send the Eagle" → eagle launches ──
    if(G.phase==='cutscene_intro'){
      if(G.csReady && G.csBeat===4){
        const btnY=H*0.90;
        if(x>W/2-80&&x<W/2+80&&y>btnY&&y<btnY+40){
          G.csBeat=5; G.csReady=false;
        }
      }
      return;
    }
    // ── Cutscene Outro: click "View Results" → score screen ──
    if(G.phase==='cutscene_outro'){
      if(G.csReady){
        const btnY=H*0.90;
        if(x>W/2-80&&x<W/2+80&&y>btnY&&y<btnY+40){
          G.phase='complete';
        }
      }
      return;
    }
    if(G.phase==='tutorial'){
      if(x>W/2-80&&x<W/2+80&&y>480&&y<520){
        G.phase='ascent'; G.hazSpawnTimer=2.0;
      }
      return;
    }
    if(G.phase==='complete'){
      if(x>W/2-90&&x<W/2+90&&y>355&&y<393){
        if(G.csWon){
          // WIN — advance to Trial 4
          const gripScore=Math.round((G.grip/GRIP_MAX)*60);
          const heartScore=Math.round(Math.max(0,(GAME.totalHearts/10))*40);
          const combined=gripScore+heartScore;
          let rating;
          if(combined>=85)rating='Excellent';
          else if(combined>=65)rating='Good';
          else if(combined>=45)rating='Fair';
          else rating='Needs Work';
          trialComplete(3,'humility',{score:combined,rating});
        } else {
          // FAIL — restart Trial 3 with fresh hearts
          GAME.totalHearts=Math.max(4,GAME.totalHearts);
          if(GAME.totalHearts<=0) GAME.totalHearts=4;
          G=freshState(); G.elapsed=0;
        }
      }
      return;
    }
  },
  mousemove(x,y){ G.targetX=Math.max(165,Math.min(W-40,x)); },
  mousedown(x,y){
    // Click/tap anywhere = flap (during ascent) or brake (during descent)
    if(G.phase==='ascent'||G.phase==='descent') keys[' ']=true;
  },
  mouseup(x,y){ keys[' ']=false; },
  G:()=>G
};
})();

// ================================================================
// TRIAL 4: EROS VS. THANATOS — Street Fighter Style
// Greek-aesthetic fighting game. Eros battles Thanatos to
// reclaim Psyche's soul. Three moves: shoot, dash, shield.
// Three boss phases. Virtue earned: Devotion.
// ================================================================
const Trial4 = (function(){

// ── Constants ────────────────────────────────────────────────
const FLOOR_Y      = 470;   // where characters stand
const EROS_X       = 130;   // fixed X (Eros stays left)
const THANATOS_X   = 550;   // Thanatos stays right
const EROS_HP_MAX  = 100;
const THAN_HP_MAX  = 120;

// Timings (seconds)
const SHOOT_COOLDOWN = 0.55;
const DASH_COOLDOWN  = 1.8;
const SHIELD_DUR     = 0.7;
const SHIELD_COOLDOWN= 2.2;

// Thanatos AI intervals per phase
const AI_INTERVAL = [2.8, 1.4, 0.8];  // Phase 1 much slower — students need to learn

// ── State ────────────────────────────────────────────────────
let G = {};
function freshState(){
  return {
    phase: 'tutorial',   // tutorial|dummy|fighting|victory|defeat|complete
    elapsed: 0,

    // Eros
    erosHP: EROS_HP_MAX,
    erosShielding: false,
    erosShieldTimer: 0,
    erosShieldCooldown: 0,
    erosShootCooldown: 0,
    erosDashCooldown: 0,
    erosDashing: false,
    erosDashTimer: 0,
    erosDashDir: 1,
    erosX: EROS_X,
    erosAnim: 'idle',   // idle|shoot|dash|shield|hit
    erosAnimTimer: 0,
    erosHitTimer: 0,    // invuln after hit

    // Thanatos
    thanHP: THAN_HP_MAX,
    thanPhase: 1,       // 1|2|3
    thanAnim: 'idle',
    thanAnimTimer: 0,
    thanAttackTimer: AI_INTERVAL[0],
    thanShades: [],     // phase 2 shade soldiers
    thanRaging: false,  // phase 3 deathstorm

    // Projectiles
    arrows: [],         // {x,y,vx,vy}
    shadowBolts: [],    // {x,y,vx,vy,blocked}
    shadeBolts: [],     // from shade soldiers

    // Particles
    particles: [],

    // Fight result
    result: null,       // 'victory'|'defeat'
    resultTimer: 0,

    // Round flash
    hitFlash: 0,
    flashColor: 'rgba(255,255,255,0)',

    // Psyche pulse (she's in the corner — visible all fight)
    psychePulse: 0,

    // Stats for virtue scoring
    arrowsLanded: 0,
    hitsTaken: 0,
    dashesUsed: 0,
    shieldsUsed: 0,
    boltsBlocked: 0,
    // Combat dummy state
    dummyHP: 40,
    dummyHPMax: 40,
    dummyArrows: [],   // dummy fires slow easy bolts
    dummyFireTimer: 3.5,
    dummyComplete: false,
  };
}

// ── Particles ────────────────────────────────────────────────
function spawnP(x,y,n,color){
  for(let i=0;i<n;i++){
    G.particles.push({
      x,y,
      vx:(Math.random()-0.5)*180,
      vy:(Math.random())*(-120)-20,
      life:0.4+Math.random()*0.3,
      ml:0.7, color,
      size:2+Math.random()*3
    });
  }
}

// ── Eros actions ─────────────────────────────────────────────
function erosShoot(){
  if(G.erosShootCooldown>0||G.erosDashing) return;
  G.erosAnim='shoot'; G.erosAnimTimer=0.35;
  G.erosShootCooldown=SHOOT_COOLDOWN;
  // Arrow travels right toward Thanatos
  G.arrows.push({
    x: G.erosX+50, y: FLOOR_Y-55,
    vx: 520, vy: 0,
    hit: false
  });
}

function erosDash(){
  if(G.erosDashCooldown>0||G.erosDashing) return;
  G.erosDashing=true;
  G.erosDashTimer=0.28;
  G.erosDashCooldown=DASH_COOLDOWN;
  G.erosDashDir=1;
  G.erosAnim='dash'; G.erosAnimTimer=0.28;
  G.dashesUsed=(G.dashesUsed||0)+1;
}

function erosShield(){
  if(G.erosShieldCooldown>0||G.erosShielding) return;
  G.erosShielding=true;
  G.erosShieldTimer=SHIELD_DUR;
  G.erosShieldCooldown=SHIELD_COOLDOWN;
  G.erosAnim='shield'; G.erosAnimTimer=SHIELD_DUR;
  G.shieldsUsed=(G.shieldsUsed||0)+1;
}

// ── Thanatos AI ───────────────────────────────────────────────
function thanatosAI(dt){
  G.thanAttackTimer -= dt;
  if(G.thanAttackTimer>0) return;

  const phase=G.thanPhase;
  G.thanAttackTimer = AI_INTERVAL[phase-1] + (Math.random()*0.4-0.2);

  if(phase===1){
    // Single shadow bolt
    thanShoot(1);
  } else if(phase===2){
    // Shadow bolt + spawn shade if < 3 active
    thanShoot(1);
    if(G.thanShades.length<3){
      spawnShade();
    }
  } else {
    // Phase 3: rapid fire 2 bolts + always shades
    thanShoot(2);
    if(G.thanShades.length<5) spawnShade();
  }

  G.thanAnim='attack'; G.thanAnimTimer=0.4;
}

function thanShoot(count){
  for(let i=0;i<count;i++){
    const delay=i*0.22;
    setTimeout(()=>{
      if(G.phase!=='fighting') return;
      G.shadowBolts.push({
        x: THANATOS_X-55,
        y: FLOOR_Y-65 + (Math.random()-0.5)*30,
        vx: -(340 + Math.random()*80),
        vy: (Math.random()-0.5)*40,
        hit: false, blocked: false
      });
    }, delay*1000);
  }
}

function spawnShade(){
  G.thanShades.push({
    x: THANATOS_X - 80 - Math.random()*60,
    y: FLOOR_Y,
    vx: -(55 + Math.random()*30),
    hp: 1,
    anim: 'walk',
    animTimer: 0,
    dead: false,
    deathTimer: 0
  });
}

// ── Update ────────────────────────────────────────────────────
function update(dt){
  if(G.phase==='tutorial'||G.phase==='complete') return;
  G.elapsed+=dt;
  G.psychePulse+=dt;

  // ── COMBAT DUMMY PHASE ──
  if(G.phase==='dummy'){
    if(G.erosShootCooldown>0) G.erosShootCooldown-=dt;
    if(G.erosDashCooldown>0)  G.erosDashCooldown-=dt;
    if(G.erosShieldCooldown>0)G.erosShieldCooldown-=dt;
    if(G.erosAnimTimer>0){G.erosAnimTimer-=dt;if(G.erosAnimTimer<=0)G.erosAnim='idle';}
    if(G.hitFlash>0) G.hitFlash-=dt;
    if(G.erosHitTimer>0) G.erosHitTimer-=dt;

    // Movement
    const moveL=keys['ArrowLeft']||keys['a'];
    const moveR=keys['ArrowRight']||keys['d'];
    if(moveL) G.erosX=Math.max(60,G.erosX-180*dt);
    if(moveR) G.erosX=Math.min(320,G.erosX+180*dt);

    // Shield timer
    if(G.erosShielding){G.erosShieldTimer-=dt;if(G.erosShieldTimer<=0)G.erosShielding=false;}

    // Dummy fires a single slow bolt every few seconds
    G.dummyFireTimer-=dt;
    if(G.dummyFireTimer<=0){
      G.dummyArrows.push({x:480,y:390,vx:-180,vy:0,hit:false,blocked:false});
      G.dummyFireTimer=3.8+Math.random()*1.2;
    }

    // Dummy arrows
    G.dummyArrows=G.dummyArrows.filter(b=>{
      b.x+=b.vx*dt;
      if(b.blocked||b.hit||b.x<-20) return false;
      if(G.erosShielding&&b.x<G.erosX+60&&b.x>G.erosX-30){
        b.blocked=true;
        G.boltsBlocked++;
        spawnP(G.erosX+40,380,6,'#7c3aed');
        showFloat(G.erosX,360,'BLOCKED!','#a78bfa',13);
        return false;
      }
      if(G.erosHitTimer<=0&&b.x<G.erosX+40&&b.x>G.erosX-30&&b.y>350&&b.y<430){
        b.hit=true;
        G.erosHP=Math.max(0,G.erosHP-8);
        G.hitsTaken++;
        G.erosHitTimer=0.8;
        G.erosAnim='hit';G.erosAnimTimer=0.2;
        G.hitFlash=0.25;G.flashColor='rgba(255,50,50,0.15)';
        spawnP(G.erosX,380,6,'#ef4444');
        showFloat(G.erosX,360,'-8','#ef4444',14);
        shake();
        return false;
      }
      return true;
    });

    // Player arrows hit dummy
    G.arrows=G.arrows.filter(a=>{
      a.x+=a.vx*dt;
      if(a.hit||a.x>W+20) return false;
      if(a.x>455&&a.x<535&&!a.hit){
        a.hit=true;
        const dmg=15+Math.floor(Math.random()*8);
        G.dummyHP=Math.max(0,G.dummyHP-dmg);
        G.arrowsLanded++;
        spawnP(500,370,8,'#a855f7');
        showFloat(500,350,`-${dmg}`,'#c084fc',14);
        if(G.dummyHP<=0&&!G.dummyComplete){
          G.dummyComplete=true;
          G.dummyHP=0;
          setTimeout(()=>{
            // Reset Eros HP before real fight, keep stats
            G.erosHP=EROS_HP_MAX;
            G.erosHitTimer=0;
            G.erosShielding=false;
            G.erosX=EROS_X;
            G.arrows=[];
            G.dummyArrows=[];
            G.phase='fighting';
            showFloat(W/2,H/2-30,'Training complete! Now face Thanatos!','#f0d68a',15);
          },1800);
        }
        return false;
      }
      return true;
    });

    updateParticles(dt);
    return;
  }

  if(G.phase==='victory'||G.phase==='defeat'){
    G.resultTimer+=dt;
    if(G.resultTimer>3.5) G.phase='complete';
    updateParticles(dt);
    return;
  }

  // Timers
  if(G.erosShootCooldown>0) G.erosShootCooldown-=dt;
  if(G.erosDashCooldown>0)  G.erosDashCooldown-=dt;
  if(G.erosShieldCooldown>0)G.erosShieldCooldown-=dt;
  if(G.erosAnimTimer>0){G.erosAnimTimer-=dt;if(G.erosAnimTimer<=0)G.erosAnim='idle';}
  if(G.thanAnimTimer>0){G.thanAnimTimer-=dt;if(G.thanAnimTimer<=0)G.thanAnim='idle';}
  if(G.hitFlash>0) G.hitFlash-=dt;
  if(G.erosHitTimer>0) G.erosHitTimer-=dt;

  // Eros dash movement
  if(G.erosDashing){
    G.erosDashTimer-=dt;
    G.erosX+=G.erosDashDir*520*dt;
    G.erosX=Math.max(60,Math.min(THANATOS_X-80,G.erosX));
    if(G.erosDashTimer<=0){
      G.erosDashing=false;
      // Snap back toward home
      G.erosX=EROS_X;
    }
  } else {
    // Keyboard movement (optional repositioning)
    const moveL=keys['ArrowLeft']||keys['a'];
    const moveR=keys['ArrowRight']||keys['d'];
    if(moveL) G.erosX=Math.max(60,G.erosX-180*dt);
    if(moveR) G.erosX=Math.min(320,G.erosX+180*dt);
  }

  // Shield timer
  if(G.erosShielding){
    G.erosShieldTimer-=dt;
    if(G.erosShieldTimer<=0) G.erosShielding=false;
  }

  // Thanatos AI
  thanatosAI(dt);

  // Check phase transitions
  const hpPct=G.thanHP/THAN_HP_MAX;
  if(hpPct<=0.5&&G.thanPhase<2){
    G.thanPhase=2;
    G.thanAttackTimer=0.5;
    G.hitFlash=0.4; G.flashColor='rgba(120,0,180,0.25)';
    showFloat(THANATOS_X, FLOOR_Y-160, 'PHASE 2 — Thanatos Unleashed!','#c084fc',14);
    G.thanAnim='phase2'; G.thanAnimTimer=1.0;
  }
  if(hpPct<=0.2&&G.thanPhase<3){
    G.thanPhase=3;
    G.thanAttackTimer=0.3;
    G.hitFlash=0.5; G.flashColor='rgba(180,0,0,0.2)';
    showFloat(THANATOS_X, FLOOR_Y-160, '⚡ DEATHSTORM! ⚡','#ef4444',16);
    G.thanAnim='phase2'; G.thanAnimTimer=1.2;
  }

  // ── Arrows ──
  G.arrows = G.arrows.filter(a=>{
    a.x+=a.vx*dt; a.y+=a.vy*dt;
    if(a.hit||a.x>W+20) return false;
    // Hit Thanatos
    if(a.x>THANATOS_X-50&&a.x<THANATOS_X+50&&!a.hit){
      a.hit=true;
      const dmg=18+Math.floor(Math.random()*6);
      G.thanHP=Math.max(0,G.thanHP-dmg);
      G.arrowsLanded++;
      spawnP(THANATOS_X-30,FLOOR_Y-80,10,'#a855f7');
      showFloat(THANATOS_X-30,FLOOR_Y-100,`-${dmg}`,'#c084fc',15);
      G.thanAnim='hit'; G.thanAnimTimer=0.2;
      if(G.thanHP<=0) endFight('victory');
      return false;
    }
    return true;
  });

  // ── Shadow bolts ──
  G.shadowBolts = G.shadowBolts.filter(b=>{
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.blocked||b.hit||b.x<-20) return false;
    // Check shield block
    if(G.erosShielding&&b.x<G.erosX+60&&b.x>G.erosX-30){
      b.blocked=true;
      G.boltsBlocked++;
      spawnP(G.erosX+40,FLOOR_Y-60,8,'#7c3aed');
      showFloat(G.erosX,FLOOR_Y-100,'BLOCKED!','#a78bfa',13);
      return false;
    }
    // Check dash invuln
    if(G.erosDashing) return true;
    // Hit Eros
    if(G.erosHitTimer<=0&&b.x<G.erosX+40&&b.x>G.erosX-30&&b.y>FLOOR_Y-120&&b.y<FLOOR_Y){
      b.hit=true;
      const dmg=12+Math.floor(Math.random()*6);
      G.erosHP=Math.max(0,G.erosHP-dmg);
      G.hitsTaken++;
      GAME.totalHearts=Math.max(0,GAME.totalHearts-1);
      G.erosHitTimer=0.9;
      G.erosAnim='hit'; G.erosAnimTimer=0.25;
      G.hitFlash=0.3; G.flashColor='rgba(255,50,50,0.2)';
      spawnP(G.erosX,FLOOR_Y-60,10,'#ef4444');
      showFloat(G.erosX,FLOOR_Y-100,`-${dmg}`,'#ef4444',15);
      shake();
      if(G.erosHP<=0) endFight('defeat');
      return false;
    }
    return true;
  });

  // ── Shade soldiers ──
  G.thanShades = G.thanShades.filter(s=>{
    if(s.dead){
      s.deathTimer-=dt;
      return s.deathTimer>0;
    }
    s.x+=s.vx*dt;
    s.animTimer+=dt;
    // Hit Eros
    if(G.erosHitTimer<=0&&Math.abs(s.x-G.erosX)<40){
      s.dead=true; s.deathTimer=0.4;
      G.erosHP=Math.max(0,G.erosHP-8);
      G.hitsTaken++;
      GAME.totalHearts=Math.max(0,GAME.totalHearts-1);
      G.erosHitTimer=1.0;
      G.erosAnim='hit'; G.erosAnimTimer=0.25;
      spawnP(G.erosX,FLOOR_Y-40,8,'#6b21a8');
      showFloat(G.erosX,FLOOR_Y-90,'-8 Shade!','#a855f7',13);
      shake();
      if(G.erosHP<=0) endFight('defeat');
    }
    // Arrow hits shade
    G.arrows.forEach(a=>{
      if(a.hit) return;
      if(Math.abs(a.x-s.x)<30&&!s.dead){
        a.hit=true;
        s.dead=true; s.deathTimer=0.4;
        spawnP(s.x,FLOOR_Y-40,8,'#7c3aed');
        showFloat(s.x,FLOOR_Y-70,'Shade down!','#c084fc',12);
      }
    });
    // Off screen
    if(s.x<-30){ s.dead=true; s.deathTimer=0; }
    return true;
  });

  updateParticles(dt);
}

function updateParticles(dt){
  G.particles=G.particles.filter(p=>{
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=80*dt;
    p.life-=dt; return p.life>0;
  });
}

function endFight(result){
  if(G.phase!=='fighting') return;
  G.result=result;
  G.phase=result;
  G.resultTimer=0;
  if(result==='victory'){
    spawnP(W/2,H/2,30,'#ffd700');
    spawnP(THANATOS_X,FLOOR_Y-80,20,'#a855f7');
  }
}

// ── Render ────────────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,W,H);
  if(G.phase==='tutorial'){renderTutorial();return;}
  if(G.phase==='dummy'){renderDummy();return;}
  if(G.phase==='complete'){renderComplete();return;}

  // ── Arena background ──
  const arenaSpr=sprites['arena_bg'];
  if(arenaSpr){
    ctx.drawImage(arenaSpr,0,0,W,H);
  } else {
    // Programmatic arena
    const bgGrad=ctx.createLinearGradient(0,0,0,H);
    bgGrad.addColorStop(0,'#0c0814');
    bgGrad.addColorStop(0.7,'#140a1e');
    bgGrad.addColorStop(1,'#1a0a0a');
    ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H);

    // Floor tiles
    ctx.fillStyle='#0f0c18';
    ctx.fillRect(0,FLOOR_Y+10,W,H-FLOOR_Y-10);
    // Tile grid
    ctx.strokeStyle='rgba(60,40,80,0.5)';ctx.lineWidth=1;
    for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,FLOOR_Y+10);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=FLOOR_Y+10;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    // Floor line
    ctx.fillStyle='rgba(80,50,120,0.6)';
    ctx.fillRect(0,FLOOR_Y+8,W,3);

    // Columns
    const colColor='rgba(20,12,32,0.95)';
    [[30,80],[W-110,80]].forEach(([cx])=>{
      ctx.fillStyle=colColor;
      ctx.fillRect(cx,60,80,FLOOR_Y-55);
      ctx.fillStyle='rgba(50,30,70,0.8)';
      ctx.fillRect(cx,55,80,14);
      ctx.fillRect(cx,FLOOR_Y-10,80,20);
      // Highlight edge
      ctx.fillStyle='rgba(80,50,110,0.4)';
      ctx.fillRect(cx,60,4,FLOOR_Y-60);
    });

    // Torch glows
    const tg1=ctx.createRadialGradient(120,FLOOR_Y-60,0,120,FLOOR_Y-60,120);
    tg1.addColorStop(0,'rgba(200,120,20,0.12)');
    tg1.addColorStop(1,'rgba(180,80,10,0)');
    ctx.fillStyle=tg1;ctx.fillRect(0,0,W,H);
    const tg2=ctx.createRadialGradient(W-120,FLOOR_Y-60,0,W-120,FLOOR_Y-60,120);
    tg2.addColorStop(0,'rgba(120,20,200,0.1)');
    tg2.addColorStop(1,'rgba(100,10,180,0)');
    ctx.fillStyle=tg2;ctx.fillRect(0,0,W,H);

    // Fog along floor
    const fogGrad=ctx.createLinearGradient(0,FLOOR_Y-20,0,FLOOR_Y+30);
    fogGrad.addColorStop(0,'rgba(60,20,100,0)');
    fogGrad.addColorStop(0.5,`rgba(60,20,100,${0.15+Math.sin(G.elapsed*0.8)*0.05})`);
    fogGrad.addColorStop(1,'rgba(40,10,80,0)');
    ctx.fillStyle=fogGrad;ctx.fillRect(0,FLOOR_Y-20,W,50);
  }

  // ── Psyche (rescue objective — bottom right corner) ──
  renderPsyche();

  // ── Health bars ──
  renderHealthBars();

  // ── Shade soldiers ──
  G.thanShades.forEach(s=>{
    const alpha = s.dead ? Math.max(0,s.deathTimer/0.4)*0.6 : 0.85;
    const spr=sprites['shade_soldier'];
    if(spr){
      ctx.globalAlpha=alpha;
      ctx.drawImage(spr,s.x-20,FLOOR_Y-55,40,55);
      ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=alpha;
      ctx.fillStyle='rgba(80,60,140,0.9)';
      ctx.beginPath();ctx.ellipse(s.x,FLOOR_Y-30,12,25,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(s.x,FLOOR_Y-58,9,10,0,0,Math.PI*2);ctx.fill();
      // Spear
      ctx.strokeStyle='rgba(140,100,180,0.8)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(s.x-14,FLOOR_Y-65);ctx.lineTo(s.x-14,FLOOR_Y-5);ctx.stroke();
      // Eyes
      ctx.fillStyle='rgba(220,230,255,0.9)';
      ctx.beginPath();ctx.arc(s.x-4,FLOOR_Y-60,2.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(s.x+4,FLOOR_Y-60,2.5,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
  });

  // ── Arrows ──
  G.arrows.forEach(a=>{
    const spr=sprites['arrow_proj'];
    if(spr){
      ctx.drawImage(spr,a.x-24,a.y-6,48,12);
    } else {
      ctx.fillStyle='#f0d060';
      ctx.fillRect(a.x-22,a.y-2,44,4);
      ctx.fillStyle='#fff8c0';
      ctx.fillRect(a.x+16,a.y-3,8,6);
      // Tip
      ctx.fillStyle='#ffd700';
      ctx.beginPath();ctx.moveTo(a.x+22,a.y);ctx.lineTo(a.x+14,a.y-4);ctx.lineTo(a.x+14,a.y+4);ctx.closePath();ctx.fill();
    }
  });

  // ── Shadow bolts ──
  G.shadowBolts.forEach(b=>{
    const spr=sprites['shadow_bolt'];
    if(spr){
      ctx.drawImage(spr,b.x-24,b.y-6,48,12);
    } else {
      ctx.fillStyle='#4c1d95';
      ctx.fillRect(b.x-22,b.y-3,44,6);
      ctx.fillStyle='rgba(140,80,220,0.7)';
      ctx.fillRect(b.x-22,b.y-5,8,10);
      ctx.fillStyle='rgba(80,20,160,0.5)';
      ctx.fillRect(b.x+8,b.y-2,16,4);
    }
  });

  // ── Eros ──
  renderEros();

  // ── Thanatos ──
  renderThanatos();

  // ── Particles ──
  G.particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/p.ml);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // ── Hit flash ──
  if(G.hitFlash>0){
    ctx.fillStyle=G.flashColor;
    ctx.fillRect(0,0,W,H);
  }

  // ── Phase banner ──
  if(G.thanPhase>=2){
    ctx.fillStyle='rgba(0,0,0,0.5)';rr(ctx,W/2-80,6,160,20,4);ctx.fill();
    ctx.fillStyle=G.thanPhase===3?'#ef4444':'#c084fc';
    ctx.font=`bold 12px "Segoe UI"`;ctx.textAlign='center';
    ctx.fillText(G.thanPhase===3?'⚡ DEATHSTORM ⚡':'☠ Phase 2 — Unleashed',W/2,20);
    ctx.textAlign='left';
  }

  // ── Victory/Defeat overlay ──
  if(G.phase==='victory'||G.phase==='defeat'){
    const t=Math.min(1,G.resultTimer/0.6);
    ctx.fillStyle=`rgba(0,0,0,${t*0.65})`;ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    if(G.phase==='victory'){
      ctx.fillStyle=`rgba(240,214,138,${t})`;ctx.font='bold 32px "Segoe UI"';
      ctx.fillText('VICTORY',W/2,H/2-30);
      ctx.fillStyle=`rgba(200,180,255,${t*0.8})`;ctx.font='italic 16px "Segoe UI"';
      ctx.fillText('Thanatos falls. Eros reaches Psyche.',W/2,H/2+10);
      if(G.resultTimer>1.2){
        ctx.fillStyle=`rgba(200,255,200,${Math.min(1,(G.resultTimer-1.2)/0.5)})`;
        ctx.font='14px "Segoe UI"';
        ctx.fillText('Eros wipes the sleep from her eyes...',W/2,H/2+40);
      }
    } else {
      ctx.fillStyle=`rgba(239,68,68,${t})`;ctx.font='bold 32px "Segoe UI"';
      ctx.fillText('FALLEN',W/2,H/2-20);
      ctx.fillStyle=`rgba(200,180,200,${t*0.7})`;ctx.font='16px "Segoe UI"';
      ctx.fillText('"Love endures. Try again."',W/2,H/2+20);
    }
    ctx.textAlign='left';
  }
}

function renderPsyche(){
  const px=W-90, py=FLOOR_Y;
  const pulse=0.5+Math.sin(G.psychePulse*1.8)*0.3;
  // Glow around her
  const glow=ctx.createRadialGradient(px,py-30,0,px,py-30,55);
  glow.addColorStop(0,`rgba(240,200,100,${pulse*0.18})`);
  glow.addColorStop(1,'rgba(220,180,80,0)');
  ctx.fillStyle=glow;ctx.fillRect(px-55,py-80,110,90);

  const spr=sprites['psyche_down'];
  if(spr){
    ctx.drawImage(spr,px-40,py-30,80,30);
  } else {
    // Psyche lying down — programmatic
    ctx.fillStyle='rgba(220,210,190,0.9)';
    ctx.beginPath();ctx.ellipse(px,py-14,38,12,0,0,Math.PI*2);ctx.fill();
    // Head
    ctx.fillStyle='rgba(200,185,165,0.9)';
    ctx.beginPath();ctx.ellipse(px+30,py-20,10,9,0.2,0,Math.PI*2);ctx.fill();
    // Hair
    ctx.fillStyle='rgba(90,55,25,0.9)';
    ctx.beginPath();ctx.ellipse(px+33,py-24,8,6,0.5,0,Math.PI*2);ctx.fill();
    // Dress folds
    ctx.fillStyle='rgba(240,235,220,0.7)';
    ctx.fillRect(px-28,py-16,56,8);
    // Gold pulse outline
    ctx.strokeStyle=`rgba(240,200,80,${pulse*0.5})`;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(px,py-14,40,14,0,0,Math.PI*2);ctx.stroke();
  }
  ctx.fillStyle='rgba(200,180,140,0.45)';ctx.font='italic 10px "Segoe UI"';ctx.textAlign='center';
  ctx.fillText('Psyche',px,py+8);
  ctx.textAlign='left';
}

function renderEros(){
  const ex=G.erosX, ey=FLOOR_Y;
  const anim=G.erosAnim;
  const hitFlicker=G.erosHitTimer>0&&Math.sin(G.elapsed*18)>0;

  let sprKey='eros_idle';
  if(anim==='shoot') sprKey='eros_shoot';
  else if(anim==='dash') sprKey='eros_dash';
  else if(anim==='shield') sprKey='eros_shield';

  const spr=sprites[sprKey]||sprites['eros_idle'];

  ctx.save();
  if(hitFlicker) ctx.globalAlpha=0.35;

  if(spr){
    ctx.drawImage(spr,ex-32,ey-95,64,95);
  } else {
    // Programmatic Eros
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(ex,ey+2,28,8,0,0,Math.PI*2);ctx.fill();

    if(anim==='shield'){
      // Wings folded forward
      ctx.fillStyle='rgba(220,215,200,0.9)';
      ctx.beginPath();ctx.ellipse(ex+10,ey-50,35,55,0.2,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(240,220,180,0.6)';ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(ex+10,ey-50,35,55,0.2,0,Math.PI*2);ctx.stroke();
    } else if(anim==='dash'){
      // Horizontal dash body
      ctx.fillStyle='rgba(220,215,200,0.5)';
      ctx.beginPath();ctx.ellipse(ex-10,ey-45,50,15,0.15,0,Math.PI*2);ctx.fill();
      // Wings swept back
      ctx.fillStyle='rgba(230,225,210,0.7)';
      ctx.beginPath();
      ctx.moveTo(ex+20,ey-50);ctx.lineTo(ex-40,ey-80);ctx.lineTo(ex-20,ey-40);ctx.closePath();ctx.fill();
    } else {
      // Wings
      const wingSpread = anim==='shoot' ? 28 : 20;
      ctx.fillStyle='rgba(230,225,210,0.9)';
      ctx.beginPath();
      ctx.moveTo(ex-10,ey-60);
      ctx.lineTo(ex-10-wingSpread,ey-90);
      ctx.lineTo(ex,ey-55);
      ctx.closePath();ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ex-10,ey-60);
      ctx.lineTo(ex+wingSpread,ey-88);
      ctx.lineTo(ex+5,ey-52);
      ctx.closePath();ctx.fill();
      // Body
      ctx.fillStyle='#e8ddd0';
      ctx.beginPath();ctx.ellipse(ex,ey-45,12,28,0,0,Math.PI*2);ctx.fill();
      // Tunic
      ctx.fillStyle='rgba(255,252,240,0.9)';
      ctx.fillRect(ex-11,ey-52,22,30);
      ctx.fillStyle='rgba(200,180,100,0.6)';
      ctx.fillRect(ex-11,ey-52,22,3);
      // Head
      ctx.fillStyle='#e0cfa0';
      ctx.beginPath();ctx.ellipse(ex,ey-76,10,11,0,0,Math.PI*2);ctx.fill();
      // Hair
      ctx.fillStyle='#c8a820';
      ctx.beginPath();ctx.ellipse(ex,ey-84,9,6,0,0,Math.PI*2);ctx.fill();
      // Bow (when shooting)
      if(anim==='shoot'){
        ctx.strokeStyle='#b8900a';ctx.lineWidth=2.5;
        ctx.beginPath();ctx.arc(ex+20,ey-55,18,-0.8,0.8);ctx.stroke();
        ctx.strokeStyle='rgba(200,200,180,0.7)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(ex+20+18*Math.cos(-0.8),ey-55+18*Math.sin(-0.8));
        ctx.lineTo(ex+20+18*Math.cos(0.8),ey-55+18*Math.sin(0.8));ctx.stroke();
      } else {
        // Bow at side
        ctx.strokeStyle='#b8900a';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(ex+16,ey-40,12,-0.5,0.5);ctx.stroke();
      }
    }

    // Shield glow when shielding
    if(G.erosShielding){
      ctx.strokeStyle='rgba(200,180,255,0.5)';ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(ex+10,ey-50,38,58,0.2,0,Math.PI*2);ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // Cooldown indicators (small dots below character)
  const dotY=ey+14;
  // Shoot CD
  const sFrac=Math.max(0,G.erosShootCooldown/SHOOT_COOLDOWN);
  ctx.fillStyle=sFrac>0?'rgba(100,100,100,0.5)':'rgba(240,200,80,0.8)';
  ctx.beginPath();ctx.arc(ex-16,dotY,4,0,Math.PI*2);ctx.fill();
  // Dash CD
  const dFrac=Math.max(0,G.erosDashCooldown/DASH_COOLDOWN);
  ctx.fillStyle=dFrac>0?'rgba(100,100,100,0.5)':'rgba(100,180,255,0.8)';
  ctx.beginPath();ctx.arc(ex,dotY,4,0,Math.PI*2);ctx.fill();
  // Shield CD
  const shFrac=Math.max(0,G.erosShieldCooldown/SHIELD_COOLDOWN);
  ctx.fillStyle=shFrac>0?'rgba(100,100,100,0.5)':'rgba(180,140,255,0.8)';
  ctx.beginPath();ctx.arc(ex+16,dotY,4,0,Math.PI*2);ctx.fill();
}

function renderThanatos(){
  const tx=THANATOS_X, ty=FLOOR_Y;
  const anim=G.thanAnim;
  const phase=G.thanPhase;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.ellipse(tx,ty+2,35,10,0,0,Math.PI*2);ctx.fill();

  const spr = phase>=2 ? (sprites['thanatos_phase2']||sprites['thanatos_idle']) : sprites['thanatos_idle'];
  const attackSpr = sprites['thanatos_attack'];

  const useSpr = anim==='attack'&&attackSpr ? attackSpr : spr;

  if(useSpr){
    ctx.save();ctx.scale(-1,1);
    ctx.drawImage(useSpr,-(tx+40),ty-110,80,110);
    ctx.restore();
  } else {
    // Programmatic Thanatos
    ctx.save();
    const rageAlpha=phase===3?0.15+Math.sin(G.elapsed*6)*0.08:0;
    if(rageAlpha>0){
      ctx.fillStyle=`rgba(180,0,40,${rageAlpha})`;
      ctx.beginPath();ctx.ellipse(tx,ty-60,55,80,0,0,Math.PI*2);ctx.fill();
    }

    // Wings (large, dark)
    const wingW=phase>=2?65:50;
    ctx.fillStyle=phase>=2?'rgba(20,8,35,0.95)':'rgba(15,8,28,0.9)';
    ctx.beginPath();
    ctx.moveTo(tx+10,ty-70);
    ctx.lineTo(tx+10+wingW,ty-110-phase*8);
    ctx.lineTo(tx+10+wingW*0.6,ty-60);
    ctx.closePath();ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tx+10,ty-70);
    ctx.lineTo(tx-wingW+10,ty-108-phase*8);
    ctx.lineTo(tx-wingW*0.5+10,ty-58);
    ctx.closePath();ctx.fill();
    // Robe
    ctx.fillStyle='rgba(12,6,22,0.97)';
    ctx.beginPath();
    ctx.moveTo(tx-24,ty-80);ctx.lineTo(tx+24,ty-80);
    ctx.lineTo(tx+32,ty);ctx.lineTo(tx-32,ty);ctx.closePath();ctx.fill();
    // Robe highlight
    ctx.strokeStyle='rgba(80,30,120,0.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(tx-22,ty-78);ctx.lineTo(tx-30,ty);ctx.stroke();
    ctx.beginPath();ctx.moveTo(tx+22,ty-78);ctx.lineTo(tx+30,ty);ctx.stroke();
    // Body
    ctx.fillStyle='rgba(25,12,40,0.95)';
    ctx.beginPath();ctx.ellipse(tx,ty-90,14,22,0,0,Math.PI*2);ctx.fill();
    // Head — pale
    ctx.fillStyle='rgba(200,195,185,0.95)';
    ctx.beginPath();ctx.ellipse(tx,ty-110,13,14,0,0,Math.PI*2);ctx.fill();
    // Hood shadow
    ctx.fillStyle='rgba(8,4,18,0.8)';
    ctx.beginPath();ctx.ellipse(tx,ty-114,13,8,0,0,Math.PI*2);ctx.fill();
    // Eyes — hollow
    ctx.fillStyle='rgba(20,5,40,0.95)';
    ctx.beginPath();ctx.ellipse(tx-5,ty-110,4,5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(tx+5,ty-110,4,5,0,0,Math.PI*2);ctx.fill();
    // Eye glow (phase 2+)
    if(phase>=2){
      ctx.fillStyle='rgba(180,40,220,0.7)';
      ctx.beginPath();ctx.arc(tx-5,ty-110,2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(tx+5,ty-110,2,0,Math.PI*2);ctx.fill();
    }
    // Attack arm extended
    if(anim==='attack'){
      ctx.fillStyle='rgba(20,10,35,0.9)';
      ctx.beginPath();ctx.moveTo(tx-16,ty-90);ctx.lineTo(tx-55,ty-85);ctx.lineTo(tx-50,ty-78);ctx.lineTo(tx-14,ty-80);ctx.closePath();ctx.fill();
      // Energy at palm
      ctx.fillStyle=`rgba(140,40,220,${0.6+Math.sin(G.elapsed*10)*0.3})`;
      ctx.beginPath();ctx.arc(tx-55,ty-82,7,0,Math.PI*2);ctx.fill();
    }

    ctx.restore();
  }

  // Phase energy crackle (phase 3)
  if(phase===3){
    for(let i=0;i<3;i++){
      const cx=tx+(Math.random()-0.5)*60;
      const cy=ty-40-Math.random()*80;
      ctx.strokeStyle=`rgba(200,50,255,${0.3+Math.random()*0.4})`;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+(Math.random()-0.5)*20,cy-12);ctx.stroke();
    }
  }
}

  // ── Thanatos bar (right) ──
  const thanPct=Math.max(0,G.thanHP/THAN_HP_MAX);
  ctx.fillStyle='rgba(0,0,0,0.8)';rr(ctx,W-270,barY,260,barH+28,6);ctx.fill();
  ctx.strokeStyle='rgba(200,180,140,0.2)';ctx.lineWidth=1;rr(ctx,W-270,barY,260,barH+28,6);ctx.stroke();
  ctx.fillStyle='#c084fc';ctx.font='bold 12px "Segoe UI"';ctx.textAlign='right';
  ctx.fillText('THANATOS',W-16,barY+13);
  // Bar bg (fills right to left)
  ctx.fillStyle='rgba(255,255,255,0.06)';rr(ctx,W-264,barY+16,248,barH,4);ctx.fill();

  const thanColor=thanPct>0.5?'#a855f7':thanPct>0.25?'#ec4899':'#ef4444';
  // Fill from right
  ctx.fillStyle=thanColor;
  rr(ctx,W-264+(248-thanBarW),barY+16,Math.max(0,thanBarW),barH,4);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.12)';
  rr(ctx,W-264+(248-thanBarW),barY+16,Math.max(0,thanBarW),barH/2,4);ctx.fill();
  ctx.strokeStyle='rgba(200,180,140,0.25)';ctx.lineWidth=1;rr(ctx,W-264,barY+16,248,barH,4);ctx.stroke();

  // Phase indicator below Thanatos bar
  ctx.textAlign='right';ctx.fillStyle='rgba(180,140,220,0.6)';ctx.font='10px "Segoe UI"';
  ctx.fillText(`Phase ${G.thanPhase}/3`,W-16,barY+46);

  // ── Controls reminder (bottom) ──
  ctx.fillStyle='rgba(0,0,0,0.6)';rr(ctx,W/2-170,H-28,340,22,4);ctx.fill();
  ctx.fillStyle='rgba(200,180,140,0.5)';ctx.font='10px "Segoe UI"';ctx.textAlign='center';
  ctx.fillText('Z / Click = Arrow  ·  X / Double-click = Dash  ·  Space / Right-click = Shield',W/2,H-13);
  ctx.textAlign='left';
}

function renderTutorial(){
  ctx.fillStyle='rgba(0,0,0,0.94)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#f0d68a';ctx.font='bold 22px "Segoe UI"';
  ctx.fillText('"She is mine," said Eros. "She is mine."',W/2,65);
  ctx.fillStyle='#c8b88a';ctx.font='14px "Segoe UI"';
  [
    'Psyche lies unconscious. Thanatos stands between you.',
    'Fight through three phases to reclaim her.',
    '',
    '🏹  Z key or CLICK → Fire Arrow  (your main attack)',
    '💨  X key or DOUBLE-CLICK → Wing Dash  (invincible, closes gap)',
    '🛡  SPACE or RIGHT-CLICK → Wing Shield  (blocks one bolt)',
    '',
    '← → Arrow keys: reposition left and right',
    '',
    'Phase 1: Shadow bolts — dodge or block',
    'Phase 2: Shade soldiers join the fight — shoot them down',
    'Phase 3: Deathstorm — rapid fire, maximum shades',

      'rgba(180,165,130,0.8)';
    ctx.fillText(l,W/2,115+i*23);
  });

  const p=0.7+Math.sin((G.elapsed||0)*3)*0.3;
  ctx.fillStyle=`rgba(240,214,138,${p*0.12})`;rr(ctx,W/2-80,490,160,40,8);ctx.fill();
  ctx.strokeStyle=`rgba(240,214,138,${p*0.5})`;ctx.lineWidth=1.5;rr(ctx,W/2-80,490,160,40,8);ctx.stroke();
  ctx.fillStyle='#f0d68a';ctx.font='bold 15px "Segoe UI"';
  ctx.fillText('Fight for Psyche',W/2,515);
  ctx.textAlign='left';
}

function renderComplete(){
  ctx.fillStyle='rgba(0,0,0,0.94)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';

  const won = G.result==='victory';
  ctx.fillStyle='#f0d68a';ctx.font='bold 24px "Segoe UI"';
  ctx.fillText(won?'Trial IV Complete':'Trial IV — Fallen',W/2,90);

  if(won){
    ctx.fillStyle='rgba(200,170,255,0.7)';ctx.font='italic 14px "Segoe UI"';
    ctx.fillText('"Eros reached her. He wiped the sleep from her eyes.',W/2,135);
    ctx.fillText('Psyche woke to find him there — and wept."',W/2,158);
  } else {
    ctx.fillStyle='rgba(200,150,150,0.7)';ctx.font='italic 14px "Segoe UI"';
    ctx.fillText('"Even gods fall. But love tries again."',W/2,140);
  }

  // Score
  const hitScore=Math.max(0,50-G.hitsTaken*8);
  const arrowScore=Math.min(40,G.arrowsLanded*4);
  const blockScore=Math.min(10,G.boltsBlocked*2);
  const combined=hitScore+arrowScore+blockScore+(won?0:0);
  let rating,rc;
  if(combined>=80&&won){rating='Excellent';rc='#4ade80';}
  else if(combined>=55&&won){rating='Good';rc='#60a5fa';}
  else if(won){rating='Fair';rc='#fbbf24';}
  else{rating='Needs Work';rc='#f87171';}

  ctx.fillStyle='#c8b88a';ctx.font='14px "Segoe UI"';
  ctx.fillText(`Arrows Landed: ${G.arrowsLanded}`,W/2,215);
  ctx.fillText(`Bolts Blocked: ${G.boltsBlocked}`,W/2,240);
  ctx.fillText(`Times Hit: ${G.hitsTaken}`,W/2,265);

  ctx.fillStyle=rc;ctx.font='bold 20px "Segoe UI"';
  ctx.fillText(`❤️ Devotion: ${rating}`,W/2,320);
  ctx.fillStyle='rgba(200,180,140,0.5)';ctx.font='italic 13px "Segoe UI"';
  ctx.fillText('"He fought not for glory — but for her."',W/2,360);

  ctx.fillStyle='rgba(74,222,128,0.12)';rr(ctx,W/2-80,400,160,38,8);ctx.fill();
  ctx.strokeStyle='rgba(74,222,128,0.4)';ctx.lineWidth=1;rr(ctx,W/2-80,400,160,38,8);ctx.stroke();
  ctx.fillStyle='#4ade80';ctx.font='bold 14px "Segoe UI"';
  ctx.fillText(won?'The Trials Are Over →':'Try Again →',W/2,424);
  ctx.textAlign='left';
}

// ── Input ────────────────────────────────────────────────────
let lastClickTime=0;
return {
  init(){ G=freshState(); G.elapsed=0; },
  update(dt){ G.elapsed+=dt; update(dt); },
  render(){ render(); },
  click(x,y){
    if(G.phase==='tutorial'){
      if(x>W/2-80&&x<W/2+80&&y>490&&y<530){ G.phase='fighting'; }
      return;
    }
    if(G.phase==='complete'){
      if(x>W/2-80&&x<W/2+80&&y>400&&y<438){
        if(G.result==='victory'){
          trialComplete(4,'devotion',{
            score:Math.max(0,Math.min(100,Math.max(0,50-G.hitsTaken*8)+Math.min(40,G.arrowsLanded*4)+Math.min(10,G.boltsBlocked*2))),
            rating: G.arrowsLanded>=8&&G.hitsTaken<=3?'Excellent':G.arrowsLanded>=5?'Good':G.hitsTaken<=6?'Fair':'Needs Work'
          });
        } else {
          // Retry
          G=freshState(); G.elapsed=0; G.phase='fighting';
        }
      }
      return;
    }
    if(G.phase!=='fighting') return;
    // Double-click = dash
    const now=Date.now();
    if(now-lastClickTime<280){ erosDash(); }
    else { erosShoot(); }
    lastClickTime=now;
  },
  mousemove(x,y){},
  mouseup(x,y){},
  keydown(key){
    if(G.phase!=='fighting') return;
    if(key==='z'||key==='Z') erosShoot();
    if(key==='x'||key==='X') erosDash();
    if(key===' ') erosShield();
  },
  G:()=>G
};
})();

// ================================================================
// DEV LEVEL SELECT
// ================================================================
const LEVEL_SELECT_BTNS = [
  { label:'Trial I',   sub:'Sorting the Seeds',     virtue:'Precision', color:'#f0d68a', trial:1 },
  { label:'Trial II',  sub:'The Golden Rams',        virtue:'Patience',  color:'#4ade80', trial:2 },
  { label:'Trial III', sub:"The Eagle's Flight",     virtue:'Humility',  color:'#60a5fa', trial:3 },
  { label:'Trial IV',  sub:'Eros vs. Thanatos',      virtue:'Devotion',  color:'#c084fc', trial:4 },
  { label:'Full Game', sub:'Play from the beginning',virtue:'',          color:'#e2e8f0', trial:0 },
];

function renderDevSelect(){
  ctx.fillStyle='rgba(5,5,15,0.97)'; ctx.fillRect(0,0,W,H);

  // Header
  ctx.textAlign='center';
  ctx.fillStyle='#f0d68a'; ctx.font='bold 22px "Segoe UI"';
  ctx.fillText('THE TRIALS OF PSYCHE', W/2, 52);
  ctx.fillStyle='rgba(200,180,140,0.5)'; ctx.font='13px "Segoe UI"';
  ctx.fillText('— Developer Level Select —', W/2, 76);

  // Divider
  ctx.strokeStyle='rgba(200,180,140,0.15)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(80,90); ctx.lineTo(W-80,90); ctx.stroke();

  // Buttons
  const btnW=480, btnH=58, btnX=(W-btnW)/2;
  LEVEL_SELECT_BTNS.forEach((btn, i)=>{
    const btnY = 112 + i*72;
    const isFullGame = btn.trial===0;

    // Button bg
    ctx.fillStyle=`rgba(255,255,255,0.04)`;
    rr(ctx, btnX, btnY, btnW, btnH, 8); ctx.fill();
    ctx.strokeStyle=`${btn.color}44`; ctx.lineWidth=1.5;
    rr(ctx, btnX, btnY, btnW, btnH, 8); ctx.stroke();

    // Color accent bar on left
    if(!isFullGame){
      ctx.fillStyle=btn.color;
      rr(ctx, btnX, btnY, 5, btnH, 4); ctx.fill();
    }

    // Trial label
    ctx.textAlign='left';
    ctx.fillStyle=btn.color; ctx.font=`bold 16px "Segoe UI"`;
    ctx.fillText(btn.label, btnX+22, btnY+22);

    // Sub label
    ctx.fillStyle='rgba(200,180,140,0.7)'; ctx.font='13px "Segoe UI"';
    ctx.fillText(btn.sub, btnX+22, btnY+42);

    // Virtue tag (right side)
    if(btn.virtue){
      ctx.textAlign='right';
      ctx.fillStyle=`${btn.color}99`; ctx.font='italic 12px "Segoe UI"';
      ctx.fillText(btn.virtue, btnX+btnW-16, btnY+35);
    }

    // Arrow
    ctx.textAlign='right';
    ctx.fillStyle=`${btn.color}66`; ctx.font='16px "Segoe UI"';
    ctx.fillText('→', btnX+btnW-8, btnY+36);
  });

  // Footer note
  ctx.textAlign='center';
  ctx.fillStyle='rgba(120,110,100,0.5)'; ctx.font='11px "Segoe UI"';
  ctx.fillText('DEV MODE — set DEV_MODE = false before deploying to Railway', W/2, H-18);
  ctx.textAlign='left';
}

function clickDevSelect(x, y){
  const btnW=480, btnH=58, btnX=(W-btnW)/2;
  LEVEL_SELECT_BTNS.forEach(btn=>{
    const btnY = 112 + (btn.trial===0 ? 4 : btn.trial-1) * 72;
    if(x>=btnX && x<=btnX+btnW && y>=btnY && y<=btnY+btnH){
      if(btn.trial===0){
        // Full game — normal intro flow
        GAME.phase='story';
        showStory('intro',()=>startTrial(1));
      } else {
        // Jump straight to chosen trial, seed prior virtues
        if(btn.trial>=2) GAME.virtues.precision={score:80,rating:'Good'};
        if(btn.trial>=3) GAME.virtues.patience ={score:80,rating:'Good'};
        if(btn.trial>=4) GAME.virtues.humility ={score:80,rating:'Good'};
        startTrial(btn.trial);
      }
    }
  });
}

// ================================================================
// INPUT ROUTING
// ================================================================
canvas.addEventListener('mousedown',(e)=>{
  const p=getPos(e);
  // Dev level select
  if(GAME.phase==='devselect'){ clickDevSelect(p.x,p.y); return; }
  // Right-click = Shield in Trial 4
  if(e.button===2&&GAME.phase==='trial4'){
    if(GAME.trial&&GAME.trial.keydown) GAME.trial.keydown(' ');
    e.preventDefault(); return;
  }
  if(GAME.phase==='story'){
    const btnY=H-140;
    if(p.x>W/2-80&&p.x<W/2+80&&p.y>btnY&&p.y<btnY+40){
      const cb=GAME.storyCallback;GAME.storyCard=null;GAME.storyCallback=null;if(cb)cb();
    }
    return;
  }
  if(GAME.phase==='results'){
    if(p.x>W/2-100&&p.x<W/2+100&&p.y>400&&p.y<442) submitResults();
    return;
  }
  if(GAME.trial&&GAME.trial.click) GAME.trial.click(p.x,p.y);

});
canvas.addEventListener('contextmenu',(e)=>e.preventDefault());
canvas.addEventListener('mousemove',(e)=>{
  const p=getPos(e);
  if(GAME.trial&&GAME.trial.mousemove) GAME.trial.mousemove(p.x,p.y);
});
canvas.addEventListener('mouseup',(e)=>{
  const p=getPos(e);
  if(GAME.trial&&GAME.trial.mouseup) GAME.trial.mouseup(p.x,p.y);
});
canvas.addEventListener('touchstart',(e)=>{e.preventDefault();canvas.dispatchEvent(new MouseEvent('mousedown',{clientX:e.touches[0].clientX,clientY:e.touches[0].clientY}));},{passive:false});
canvas.addEventListener('touchmove',(e)=>{e.preventDefault();canvas.dispatchEvent(new MouseEvent('mousemove',{clientX:e.touches[0].clientX,clientY:e.touches[0].clientY}));},{passive:false});
canvas.addEventListener('touchend',(e)=>{e.preventDefault();canvas.dispatchEvent(new MouseEvent('mouseup',{}));},{passive:false});
// Keydown routing — Trial 4 combat keys
document.addEventListener('keydown',(e)=>{
  if(GAME.phase==='trial4'&&GAME.trial&&GAME.trial.keydown){
    GAME.trial.keydown(e.key);
  }
});

// ================================================================
// MAIN LOOP
// ================================================================
let lastTime=0;
function gameLoop(ts){
  const dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;
  GAME.elapsed+=dt;
  GAME.particles=GAME.particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=2*dt;p.life-=dt;return p.life>0;});
  ctx.clearRect(0,0,W,H);

  if(GAME.phase==='loading'){/* handled by HTML overlay */}
  else if(GAME.phase==='devselect'){renderDevSelect();}
  else if(GAME.phase==='story'){renderStoryCard();}
  else if(GAME.phase.startsWith('trial')&&GAME.trial){GAME.trial.update(dt);GAME.trial.render();}
  else if(GAME.phase==='cinematic'){updateCinematicEnd(dt);renderCinematicEnd();}
  else if(GAME.phase==='results'){renderResults();}

  GAME.particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.ml);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.ml),0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  // Cursor — default for all trials
  container.style.cursor='default';

  requestAnimationFrame(gameLoop);
}

function checkLoaded(){
  if(spritesLoaded>=spritesTotal){
    document.getElementById('loading-screen').style.opacity='0';
    setTimeout(()=>{document.getElementById('loading-screen').style.display='none';
      // Dev mode — show level select screen
      const urlTrial = parseInt(urlParams.get('trial'));
      if(DEV_MODE){
        GAME.phase='devselect';
      } else if(urlTrial >= 1 && urlTrial <= 4){
        // URL param still works in production for teacher testing
        if(urlTrial>=2) GAME.virtues.precision={score:80,rating:'Good'};
        if(urlTrial>=3) GAME.virtues.patience ={score:80,rating:'Good'};
        if(urlTrial>=4) GAME.virtues.humility ={score:80,rating:'Good'};
        startTrial(urlTrial);
      } else {
        showStory('intro',()=>startTrial(1));
      }
    },600);
  } else setTimeout(checkLoaded,100);
}
checkLoaded();
requestAnimationFrame(gameLoop);
</script>
