const Trial3 = (function(){


// ============================================================
// SPRITES
// ============================================================

// ============================================================
// ROOM 1: THE STORY WALL
// Fragments of a mural showing Eros & Psyche's story.
// Player finds fragments scattered in darkness, then arranges
// them in chronological order on the empty mural panel.
// ============================================================
const STORY_FRAGMENTS = [
  { id:0, icon:'💘', title:'Eros Strikes', desc:'Eros sees Psyche and falls in love', color:'#e8a040', spriteKey:'fragment_eros' },
  { id:1, icon:'🏛️', title:'The Invisible Palace', desc:'Psyche lives in a palace, never seeing her husband', color:'#c090d0', spriteKey:'fragment_palace' },
  { id:2, icon:'🪔', title:'The Oil Lamp', desc:'Psyche lights a lamp to see Eros\'s face', color:'#f0d060', spriteKey:'fragment_lamp' },
  { id:3, icon:'💔', title:'The Betrayal', desc:'Oil drops on Eros — he wakes and flies away', color:'#e06060', spriteKey:'fragment_betrayal' }
];

// False fragments (sister lies) — look similar but don't belong
const FALSE_FRAGMENTS = [
  { id:'f0', icon:'🐍', title:'The Serpent', desc:'A monster lurks in the palace', color:'#5080a0', whisper:'He was always a monster...', spriteKey:'fragment_false_serpent' },
  { id:'f1', icon:'⛓️', title:'The Prison', desc:'Psyche was trapped against her will', color:'#5080a0', whisper:'You were never free...', spriteKey:'fragment_false_serpent' }
];

// ============================================================
// ROOM 2: THE OFFERING ALTAR
// Find divine objects and match them to the correct altar slot
// by reading the symbol hint on each slot.
// ============================================================
const ALTAR_OBJECTS = [
  { id:0, icon:'🪶', name:'White Feather', symbol:'🦋', symbolHint:'Wings of the soul', color:'#e8d8c0', spriteKey:'white_feather' },
  { id:1, icon:'🏹', name:'Golden Arrow', symbol:'💘', symbolHint:'Weapon of love', color:'#d4a020', spriteKey:'golden_arrow' },
  { id:2, icon:'🌹', name:'Rose Petals', symbol:'❤️', symbolHint:'Where love bloomed', color:'#d06080', spriteKey:'rose_petals' },
  { id:3, icon:'✨', name:'Divine Light', symbol:'☀️', symbolHint:'Radiance of the gods', color:'#f0e080', spriteKey:'oil_lamp' }
];

const FALSE_OBJECTS = [
  { id:'f0', icon:'💀', name:'Skull Fragment', symbol:null, color:'#6090a0', whisper:'Death was always near...' },
  { id:'f1', icon:'🐍', name:'Dark Scale', symbol:null, color:'#5080a0', whisper:'A serpent lived here...' }
];

// ============================================================
// STATE
// ============================================================
  let G = {};
function freshState() {
  return {
    phase: 'tutorial',
    elapsed: 0,
    // Lamp / Psyche position
    lampX: W/2, lampY: H/2,
    lampTX: W/2, lampTY: H/2,
    lampR: 84,
    lampOn: true, lampOutTimer: 0,
    facingRight: true,
    // Floor bounds — Psyche can't walk on walls
    floorL: 50, floorR: W-50, floorT: 90, floorB: H-40,
    // Oil
    oil: 100,
    // Room
    roomIdx: 0, // 0=Story Wall, 1=Altar, 2=Bedchamber
    // Clue items scattered in darkness
    items: [],
    inventory: [],
    // Puzzle panel / altar
    slots: [],
    puzzleSolved: false,
    // Hint paintings on walls (discoverable with lamp)
    hints: [],
    // Sisters
    sisters: [],
    sisterTimer: 0,
    sisterAttacksLeft: 0,
    // Scoring
    falseCollected: 0,
    wrongPlacements: 0,
    // Bedchamber
    bedReveal: 0, bedPhase: 0,
    // UI state
    selectedItem: null,   // Index in inventory of currently selected item
    dragging: null,       // Legacy — kept for mouseup compat
    dragX: 0, dragY: 0,
    hoveredSlot: -1,
    // Particles
    particles: [],
    // Hearts (display only — Trial 3 uses oil, not hearts)
    totalHearts: GAME.totalHearts, hearts: Math.min(4, GAME.totalHearts),
    // Cold flash
    coldFlash: 0
  };
}

// ============================================================
// ROOM SETUP
// ============================================================
function setupRoom(idx) {
  G.roomIdx = idx;
  G.items = [];
  G.inventory = [];
  G.slots = [];
  G.hints = [];
  G.puzzleSolved = false;
  G.sisters = [];
  G.dragging = null;
  G.hoveredSlot = -1;

  if (idx === 0) {
    // ROOM 1: Story Wall
    G.sisterAttacksLeft = 1;
    G.sisterTimer = 18 + Math.random() * 5;
    G.oil = Math.min(100, G.oil + 5);

    // Scatter story fragments — spread across floor, clear of inscription area (top-left)
    const positions = [
      {x:520, y:200}, {x:560, y:400}, {x:140, y:420}, {x:180, y:320}
    ];
    const shuffled = [...positions].sort(() => Math.random() - 0.5);
    STORY_FRAGMENTS.forEach((frag, i) => {
      G.items.push({
        x: shuffled[i].x, y: shuffled[i].y,
        data: frag, found: false, discovered: false, glow: 0,
        isReal: true, pickedUp: false
      });
    });

    // False fragment — bottom center, away from everything
    G.items.push({
      x: 340 + (Math.random()-0.5)*40, y: 380 + (Math.random()-0.5)*30,
      data: FALSE_FRAGMENTS[0], found: false, discovered: false, glow: 0,
      isReal: false, pickedUp: false
    });

    // Mural panel slots (bottom-center, 4 slots in a row)
    const slotY = H - 80;
    const slotStartX = W/2 - 150;
    for (let i = 0; i < 4; i++) {
      G.slots.push({
        x: slotStartX + i * 100, y: slotY,
        label: `${i+1}`,
        symbolHint: ['First', 'Second', 'Third', 'Fourth'][i],
        correctId: i,
        placedItem: null,
        flash: 0, wrongFlash: 0
      });
    }

    // Hint: Ancient inscription — complete static sprite, positioned on left wall
    G.hints.push({
      x: 60, y: 110, w: 340, h: 118,
      title: 'Ancient Inscription',
      lines: ['Love struck first', 'Then a hidden palace', 'Light revealed truth', 'And love was lost'],
      discovered: false, glow: 0
    });
  }
  else if (idx === 1) {
    // ROOM 2: Offering Altar
    G.sisterAttacksLeft = 2;
    G.sisterTimer = 14 + Math.random() * 5;
    G.oil = Math.min(85, G.oil + 5);

    const positions = [
      {x:100, y:180}, {x:540, y:200}, {x:140, y:400}, {x:500, y:420}
    ];
    const shuffled = [...positions].sort(() => Math.random() - 0.5);
    ALTAR_OBJECTS.forEach((obj, i) => {
      G.items.push({
        x: shuffled[i].x, y: shuffled[i].y,
        data: obj, found: false, discovered: false, glow: 0,
        isReal: true, pickedUp: false
      });
    });

    // False objects
    FALSE_OBJECTS.forEach((obj, i) => {
      G.items.push({
        x: 300 + (Math.random()-0.5)*150, y: 250 + (Math.random()-0.5)*120,
        data: obj, found: false, discovered: false, glow: 0,
        isReal: false, pickedUp: false
      });
    });

    // Altar slots (right side, vertical)
    const slotX = W - 90;
    for (let i = 0; i < 4; i++) {
      G.slots.push({
        x: slotX, y: 160 + i * 95,
        label: ALTAR_OBJECTS[i].symbol,
        symbolHint: ALTAR_OBJECTS[i].symbolHint,
        correctId: i,
        placedItem: null,
        flash: 0, wrongFlash: 0
      });
    }

    // Hint: Stone carving showing what each symbol means
    G.hints.push({
      x: 320, y: 160, w: 190, h: 90,
      title: '🪨 Stone Carving',
      lines: ['🦋 = feathers that fly', '💘 = the archer\'s tool', '❤️ = petals of the heart', '☀️ = light from above'],
      discovered: false, glow: 0
    });
  }
  else if (idx === 2) {
    // Bedchamber
    G.phase = 'bedchamber';
    G.bedPhase = 0;
    G.bedReveal = 0;
    G.lampOn = true;
  }
}

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  G.particles = G.particles.filter(p => {
    p.x+=p.vx; p.y+=p.vy; p.vy+=1*dt; p.life-=dt; return p.life>0;
  });
  if (G.coldFlash > 0) G.coldFlash -= dt * 2;

  if (G.phase === 'roomTransition') return;
  if (G.phase === 'bridge') {
    G.bridgeTimer += dt;
    const line = G.bridgeLines[G.bridgeStep];
    if (line && G.bridgeTimer >= line.pause) {
      G.bridgeStep++;
      G.bridgeTimer = 0;
      if (G.bridgeStep >= G.bridgeLines.length) {
        // Bridge complete — move to next room
        G.roomIdx++;
        setupRoom(G.roomIdx);
        if (G.phase !== 'bedchamber') G.phase = 'playing';
      }
    }
    return;
  }
  if (G.phase !== 'playing' && G.phase !== 'bedchamber') return;

  G.elapsed += dt;

  // Lamp smoothing + floor bounds clamping — slow, cautious movement
  const clampedTX = Math.max(G.floorL, Math.min(G.floorR, G.lampTX));
  const clampedTY = Math.max(G.floorT, Math.min(G.floorB, G.lampTY));
  G.lampX += (clampedTX - G.lampX) * 0.05;
  G.lampY += (clampedTY - G.lampY) * 0.05;

  if (!G.lampOn) {
    G.lampOutTimer -= dt;
    if (G.lampOutTimer <= 0) G.lampOn = true;
  }

  if (G.phase === 'bedchamber') { updateBedchamber(dt); return; }

  // Oil drain
  G.oil -= 1.85 * dt;
  if (G.oil <= 0) {
    G.oil = 70;
    // Return all placed slot items and inventory items back to the field
    G.slots.forEach(s => {
      if (s.placedItem) {
        // Find the original item and un-pick it
        const orig = G.items.find(it => it.data === s.placedItem || (it.data.id === s.placedItem.id && it.isReal));
        if (orig) { orig.pickedUp = false; orig.discovered = false; orig.glow = 0; }
        s.placedItem = null;
      }
      s.flash = 0; s.wrongFlash = 0;
    });
    G.inventory.forEach(invItem => {
      const orig = G.items.find(it => it.data === invItem || (it.data.id === invItem.id && it.isReal));
      if (orig) { orig.pickedUp = false; orig.discovered = false; orig.glow = 0; }
    });
    G.inventory = [];
    // Also reset undiscovered items
    G.items.forEach(it => { if (!it.pickedUp) { it.discovered = false; it.glow = 0; } });
    G.dragging = null;
    showFloat(W/2, H/2, '🛢️ Oil ran out! Room resets...', '#f97316');
  }

  // Discover items
  if (G.lampOn) {
    G.items.forEach(it => {
      if (it.pickedUp) return;
      const dist = Math.hypot(it.x - G.lampX, it.y - G.lampY);
      if (dist < G.lampR * 0.75) {
        it.discovered = true;
        it.glow = Math.min(1, it.glow + dt * 3);
      } else {
        it.glow = Math.max(0, it.glow - dt * 1.5);
      }
    });

    // Discover hints (paintings/inscriptions on walls)
    G.hints.forEach(h => {
      const dist = Math.hypot((h.x + h.w/2) - G.lampX, (h.y + h.h/2) - G.lampY);
      if (dist < G.lampR) {
        h.discovered = true;
        h.glow = Math.min(1, h.glow + dt * 2.5);
      } else {
        h.glow = Math.max(0, h.glow - dt * 1);
      }
    });
  }

  // Slot flashes
  G.slots.forEach(s => {
    if (s.flash > 0) s.flash -= dt * 2;
    if (s.wrongFlash > 0) s.wrongFlash -= dt * 2;
  });

  // Sisters
  if (G.sisterAttacksLeft > 0) {
    G.sisterTimer -= dt;
    if (G.sisterTimer <= 0) {
      spawnSister();
      G.sisterAttacksLeft--;
      G.sisterTimer = 15 + Math.random() * 8;
    }
  }
  G.sisters = G.sisters.filter(s => {
    s.timer -= dt;
    if (s.phase === 'warning' && s.timer <= 0) {
      s.phase = 'gust'; s.timer = 0.8;
      const inPath = s.side === 'left'
        ? (G.lampX < W*0.5 && Math.abs(G.lampY - s.gustY) < 90)
        : (G.lampX > W*0.5 && Math.abs(G.lampY - s.gustY) < 90);
      if (inPath) {
        G.lampOn = false; G.lampOutTimer = 3;
        showFloat(G.lampX, G.lampY-20, '💨 Lamp blown out!', 'rgba(150,180,220,0.8)');
      }
    }
    return s.timer > -2;
  });

  // Check puzzle solved
  if (!G.puzzleSolved && G.slots.length > 0 && G.slots.every(s => s.placedItem !== null)) {
    const allCorrect = G.slots.every(s => s.placedItem && s.placedItem.id === s.correctId);
    if (allCorrect) {
      G.puzzleSolved = true;
      spawnP(W/2, H/2, 15, '#ffd700');

      // Narrative bridge before next room
      if (G.roomIdx === 0) {
        G.phase = 'bridge';
        G.bridgeStep = 0;
        G.bridgeTimer = 0;
        G.bridgeLines = [
          { icon: '✨', text: 'The mural glows. The story is in order.', pause: 2.5 },
          { icon: '🚪', text: 'A hidden door grinds open behind the wall.', pause: 2.5 },
          { icon: '🏛️', text: 'Beyond it — a deeper chamber. An altar stands in the shadows.', pause: 3 },
          { icon: '⚠️', text: 'Your sisters\' whispers grow louder here. Be careful what you trust.', pause: 3 }
        ];
      } else if (G.roomIdx === 1) {
        G.phase = 'bridge';
        G.bridgeStep = 0;
        G.bridgeTimer = 0;
        G.bridgeLines = [
          { icon: '✨', text: 'The altar accepts your offerings. The symbols illuminate.', pause: 2.5 },
          { icon: '🚪', text: 'The final door opens — a private chamber.', pause: 2.5 },
          { icon: '🤫', text: 'Someone is here. You can hear soft breathing.', pause: 2.5 },
          { icon: '🪔', text: 'Your oil lamp flickers. Move closer to see the truth.', pause: 3 }
        ];
      }
    }
  }
}

function spawnSister() {
  const side = Math.random() > 0.5 ? 'left' : 'right';
  const gustY = 150 + Math.random() * 250;
  const whispers = [
    "He is hiding something...", "Why does he fear the light?",
    "What kind of husband hides?", "Your sisters know the truth...",
    "A monster wears a gentle face..."
  ];
  G.sisters.push({
    side, gustY, x: side==='left'?20:W-20, y: gustY,
    phase: 'warning', timer: 2
  });
  const el = document.createElement('div');
  el.className = 'whisper-text';
  el.textContent = `"${whispers[Math.floor(Math.random()*whispers.length)]}"`;
  el.style.color = 'rgba(100,140,180,0.7)';
  el.style.left = side==='left' ? '30px' : '';
  el.style.right = side==='right' ? '30px' : '';
  el.style.top = (gustY-30+Math.random()*60)+'px';
  container.appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

// ============================================================
// CLICK / DRAG
// ============================================================
function handleClick(mx, my) {
  if (G.phase !== 'playing') return;
  if (!G.lampOn) return;

  // === STEP 1: If holding a selected item, try to place it on a slot ===
  if (G.selectedItem !== null) {
    const slotIdx = getSlotAt(mx, my);
    if (slotIdx >= 0) {
      // Place the selected item
      const slot = G.slots[slotIdx];
      if (slot.placedItem) {
        // Swap: return placed item to inventory
        G.inventory.push(slot.placedItem);
        slot.placedItem = null;
      }
      const item = G.inventory[G.selectedItem];
      slot.placedItem = item;
      G.inventory.splice(G.selectedItem, 1);
      G.selectedItem = null;

      // Check correctness
      if (item.id === slot.correctId) {
        slot.flash = 0.6;
        spawnP(slot.x, slot.y, 5, '#ffd700');
      } else {
        slot.wrongFlash = 0.5;
        G.wrongPlacements++;
        G.oil = Math.max(0, G.oil - 5);
        showFloat(slot.x, slot.y - 30, '✗ Wrong spot! -5% oil', '#f97316');
      }
      return;
    }
    // Click elsewhere = deselect
    G.selectedItem = null;
    return;
  }

  // === STEP 2: Click on a slot to retrieve a placed item ===
  const clickedSlot = getSlotAt(mx, my);
  if (clickedSlot >= 0) {
    const slot = G.slots[clickedSlot];
    if (slot.placedItem) {
      G.inventory.push(slot.placedItem);
      slot.placedItem = null;
      showFloat(mx, my - 15, '↩', 'rgba(200,180,140,0.7)');
      return;
    }
  }

  // === STEP 3: Click inventory item to select it ===
  const invIdx = getInventoryAt(mx, my);
  if (invIdx >= 0) {
    G.selectedItem = invIdx;
    return;
  }

  // === STEP 4: Click an item in the world to pick it up ===
  for (let i = G.items.length - 1; i >= 0; i--) {
    const it = G.items[i];
    if (it.pickedUp || !it.discovered || it.glow < 0.3) continue;
    if (Math.hypot(it.x - mx, it.y - my) > 35) continue;

    if (it.isReal) {
      it.pickedUp = true;
      G.inventory.push(it.data);
      spawnP(it.x, it.y, 8, it.data.color);
      showFloat(mx, my-10, `${it.data.title || it.data.name}`, '#ffd700');
    } else {
      it.pickedUp = true;
      G.falseCollected++;
      G.oil = Math.max(0, G.oil - 15);
      G.coldFlash = 0.5;
      spawnP(it.x, it.y, 5, '#4488cc');
      showFloat(mx, my-10, `False clue! -15% oil`, '#6495ed');
      if (it.data.whisper) {
        const el = document.createElement('div');
        el.className = 'whisper-text';
        el.textContent = `"${it.data.whisper}"`;
        el.style.color = 'rgba(100,140,180,0.7)';
        el.style.left = (mx - 60) + 'px'; el.style.top = (my + 20) + 'px';
        container.appendChild(el);
        setTimeout(()=>el.remove(), 3000);
      }
    }
    return;
  }
}

function handleMouseUp(mx, my) {
  if (G.dragging === null) return;
  const slotIdx = getSlotAt(mx, my);
  if (slotIdx >= 0) {
    placeItem(slotIdx);
  }
  G.dragging = null;
}

function placeItem(slotIdx) {
  if (G.dragging === null) return;
  const slot = G.slots[slotIdx];
  if (slot.placedItem) {
    // Slot already has an item — swap back to inventory
    G.inventory.push(slot.placedItem);
    slot.placedItem = null;
  }
  const item = G.inventory[G.dragging];
  slot.placedItem = item;
  G.inventory.splice(G.dragging, 1);
  G.dragging = null;

  // Check if correct
  if (item.id === slot.correctId) {
    slot.flash = 0.6;
    spawnP(slot.x, slot.y, 5, '#ffd700');
  } else {
    slot.wrongFlash = 0.5;
    G.wrongPlacements++;
    G.oil = Math.max(0, G.oil - 5);
    showFloat(slot.x, slot.y - 30, '✗ Wrong spot! -5% oil', '#f97316');
  }
}

function getInventoryAt(mx, my) {
  // Must match renderHUD inventory positions: ix = 14 + i*54 + 24, iy = 76
  for (let i = 0; i < G.inventory.length; i++) {
    const ix = 14 + i * 54 + 24;
    const iy = 76;
    if (Math.abs(mx - ix) < 26 && Math.abs(my - iy) < 22) return i;
  }
  return -1;
}

function getSlotAt(mx, my) {
  for (let i = 0; i < G.slots.length; i++) {
    const s = G.slots[i];
    if (Math.abs(mx - s.x) < 45 && Math.abs(my - s.y) < 38) return i;
  }
  return -1;
}

// ============================================================
// BEDCHAMBER
// ============================================================
function updateBedchamber(dt) {
  const cx = W/2, cy = H/2 - 30;
  if (G.bedPhase === 0) {
    if (G.lampOn && Math.hypot(G.lampX-cx, G.lampY-cy) < 100) {
      G.bedReveal += dt * 0.12;
    }
    if (G.bedReveal >= 1) {
      G.bedPhase = 1;
      setTimeout(()=>{ G.bedPhase = 2; }, 2500);
      setTimeout(()=>{ G.bedPhase = 3; }, 4500);
      setTimeout(()=>{ G.phase = 'complete'; }, 7000);
    }
  }
}

// ============================================================
// RENDER
// ============================================================
function render() {
  ctx.clearRect(0, 0, W, H);

  // Cursor
  container.style.cursor = (G.phase==='playing'||G.phase==='bedchamber')
    ? (G.dragging !== null ? 'grabbing' : 'none') : 'default';

  if (G.phase === 'tutorial') { renderTutorial(); return; }
  if (G.phase === 'complete') { renderComplete(); return; }

  // ---- LAYER 1: Draw full scene at normal brightness ----
  renderWalls();
  renderFurniture();

  if (G.phase === 'bedchamber') {
    renderBedchamber();
  } else {
    renderItems();
    renderHints();
    renderSlots();
    renderSisters();
  }

  // ---- LAYER 2: DARKNESS + LAMP REVEAL ----
  if (G.lampOn) {
    const flicker = G.lampR + Math.sin(G.elapsed * 8) * 4 + Math.sin(G.elapsed * 13) * 2;
    const lx = G.lampX, ly = G.lampY - 5;

    // Build darkness mask on offscreen canvas (opaque black with transparent hole)
    if (!G._darkCanvas) {
      G._darkCanvas = document.createElement('canvas');
      G._darkCanvas.width = W;
      G._darkCanvas.height = H;
    }
    const dc = G._darkCanvas;
    const dx = dc.getContext('2d');

    // Fill solid black
    dx.clearRect(0, 0, W, H);
    dx.fillStyle = '#000';
    dx.fillRect(0, 0, W, H);

    // Punch transparent hole using destination-out on the OFFSCREEN canvas
    dx.globalCompositeOperation = 'destination-out';
    const hole = dx.createRadialGradient(lx, ly, 0, lx, ly, flicker);
    hole.addColorStop(0, 'rgba(0,0,0,1)');
    hole.addColorStop(0.3, 'rgba(0,0,0,1)');
    hole.addColorStop(0.6, 'rgba(0,0,0,0.8)');
    hole.addColorStop(0.85, 'rgba(0,0,0,0.3)');
    hole.addColorStop(1, 'rgba(0,0,0,0)');
    dx.fillStyle = hole;
    dx.fillRect(0, 0, W, H);
    dx.globalCompositeOperation = 'source-over';

    // Draw the darkness mask onto the main canvas at 88% opacity
    ctx.globalAlpha = 0.88;
    ctx.drawImage(dc, 0, 0);
    ctx.globalAlpha = 1;

    // Warm SNES glow — visible golden light around Psyche
    const wg1 = ctx.createRadialGradient(lx, ly, 0, lx, ly, flicker * 0.65);
    wg1.addColorStop(0, 'rgba(255,200,80,0.16)');
    wg1.addColorStop(0.4, 'rgba(255,180,60,0.08)');
    wg1.addColorStop(1, 'rgba(255,140,30,0)');
    ctx.fillStyle = wg1;
    ctx.fillRect(0, 0, W, H);

    // Bright inner flame core
    const wg2 = ctx.createRadialGradient(lx, ly, 0, lx, ly, 35);
    wg2.addColorStop(0, 'rgba(255,235,160,0.22)');
    wg2.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = wg2;
    ctx.fillRect(lx - 40, ly - 40, 80, 80);

    // ---- PSYCHE WITH LAMP (drawn ABOVE darkness so always visible) ----
    // Track facing direction based on lamp movement
    const moveDx = G.lampTX - G.lampX;
    if (Math.abs(moveDx) > 1) G.facingRight = moveDx > 0;

    const psycheSpr = sprites['psyche_lamp'];
    if (psycheSpr) {
      const sz = 76;
      ctx.save();
      ctx.translate(G.lampX, G.lampY - sz*0.4 + sz/2);
      if (G.facingRight === false) ctx.scale(-1, 1);
      ctx.drawImage(psycheSpr, -sz/2, -sz/2, sz, sz);
      ctx.restore();
    } else {
      // Programmatic Psyche fallback
      ctx.fillStyle = '#e8ddd0';
      ctx.beginPath(); ctx.arc(G.lampX, G.lampY - 14, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f0ece4';
      ctx.beginPath();
      ctx.moveTo(G.lampX, G.lampY - 8); ctx.lineTo(G.lampX - 8, G.lampY + 6); ctx.lineTo(G.lampX + 8, G.lampY + 6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd700';
      ctx.beginPath(); ctx.arc(G.lampX + 9, G.lampY - 10, 3, 0, Math.PI*2); ctx.fill();
    }
  } else {
    // Lamp is out — near total darkness
    ctx.fillStyle = 'rgba(5,5,16,0.92)';
    ctx.fillRect(0, 0, W, H);
  }

  // Lamp out message
  if (!G.lampOn) {
    ctx.fillStyle = 'rgba(150,180,220,0.5)';
    ctx.font = 'italic 16px "Segoe UI"'; ctx.textAlign = 'center';
    ctx.fillText(`Lamp out... ${Math.ceil(G.lampOutTimer)}s`, W/2, H/2);
    ctx.textAlign = 'left';
  }

  // Cold flash
  if (G.coldFlash > 0) {
    ctx.fillStyle = `rgba(40,60,100,${G.coldFlash * 0.25})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Particles (above darkness)
  G.particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life/p.ml);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(p.life/p.ml),0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ---- HUD (always visible, above everything) ----
  if (G.phase === 'playing') renderHUD();

  // Dragging item (above darkness so you can see what you're dragging)
  if (G.dragging !== null && G.phase === 'playing') {
    const item = G.inventory[G.dragging];
    if (item) {
      ctx.fillStyle = 'rgba(255,215,100,0.2)';
      ctx.beginPath(); ctx.arc(G.dragX, G.dragY, 26, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.9;
      const spr = item.spriteKey ? sprites[item.spriteKey] : null;
      if (spr) {
        ctx.drawImage(spr, G.dragX - 20, G.dragY - 20, 40, 40);
      } else {
        ctx.font = '32px "Segoe UI"'; ctx.textAlign = 'center';
        ctx.fillText(item.icon, G.dragX, G.dragY + 10);
      }
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }
  }

  // Narrative bridge between rooms
  if (G.phase === 'bridge') {
    ctx.fillStyle = 'rgba(0,0,0,0.88)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    const step = G.bridgeStep;
    const timer = G.bridgeTimer;

    // Show all completed lines (faded) plus current line (bright)
    G.bridgeLines.forEach((line, i) => {
      if (i > step) return; // Not yet reached
      const isCurrent = (i === step);
      const y = 180 + i * 55;

      // Fade in for current line
      let alpha;
      if (isCurrent) {
        alpha = Math.min(1, timer * 2); // Fade in over 0.5s
      } else {
        alpha = 0.35; // Past lines stay dim
      }

      // Icon
      ctx.globalAlpha = alpha;
      ctx.font = '28px "Segoe UI"';
      ctx.fillText(line.icon, W/2, y - 8);

      // Text
      ctx.fillStyle = isCurrent ? '#f0d68a' : 'rgba(200,180,140,0.6)';
      ctx.font = isCurrent ? '15px "Segoe UI"' : '15px "Segoe UI"';
      ctx.fillText(line.text, W/2, y + 22);

      ctx.globalAlpha = 1;
    });

    ctx.textAlign = 'left';
  }

  // Old room transition fallback
  if (G.phase === 'roomTransition') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#4ade80'; ctx.font = 'bold 20px "Segoe UI"'; ctx.textAlign = 'center';
    ctx.fillText('✓ Puzzle Solved!', W/2, H/2 - 10);
    ctx.textAlign = 'left';
  }
}

function renderItems() {
  // Item color tints for visual distinction
  const ITEM_TINTS = {
    '#e8a040': 'rgba(255,180,60,',   // Eros Strikes — warm orange
    '#c090d0': 'rgba(180,130,220,',  // Invisible Palace — purple
    '#f0d060': 'rgba(255,220,80,',   // Oil Lamp — bright gold
    '#e06060': 'rgba(230,80,80,',    // Betrayal — red
    '#e8d8c0': 'rgba(240,220,180,',  // White Feather — cream
    '#d4a020': 'rgba(220,170,40,',   // Golden Arrow — gold
    '#d06080': 'rgba(220,80,130,',   // Rose Petals — pink
    '#f0e080': 'rgba(250,230,120,',  // Divine Light — yellow
    '#5080a0': 'rgba(80,130,180,',   // False — cold blue
    '#6090a0': 'rgba(90,140,170,',   // False — cold teal
  };

  G.items.forEach(it => {
    if (it.pickedUp) return;
    if (it.glow <= 0 && !it.discovered) return;
    const dist = Math.hypot(it.x - G.lampX, it.y - G.lampY);
    if (dist > G.lampR * 1.3) return;

    const a = it.glow;
    const tint = ITEM_TINTS[it.data.color] || 'rgba(200,180,140,';
    const sz = 56;

    // Ground glow — colored per item
    const ag = ctx.createRadialGradient(it.x, it.y, 0, it.x, it.y, sz * 0.7);
    ag.addColorStop(0, tint + (a*0.35) + ')');
    ag.addColorStop(0.5, tint + (a*0.12) + ')');
    ag.addColorStop(1, tint + '0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(it.x, it.y, sz*0.7, 0, Math.PI*2); ctx.fill();

    if (a > 0.15) {
      ctx.globalAlpha = a;

      // Draw sprite with color tint overlay
      const sprKey = it.data.spriteKey;
      const spr = sprKey ? sprites[sprKey] : null;
      // Gentle float animation
      const bob = Math.sin(G.elapsed * 2.5 + it.x * 0.1) * 3;

      if (spr) {
        ctx.drawImage(spr, it.x - sz/2, it.y - sz/2 + bob, sz, sz);
      } else {
        // Emoji fallback only if sprite failed to load
        ctx.font = '38px "Segoe UI"'; ctx.textAlign = 'center';
        ctx.fillText(it.data.icon, it.x, it.y + 12 + bob);
      }

      // SNES-style pickup indicator: bouncing down-arrow when close
      if (dist < 55 && a > 0.5) {
        const arrowBob = Math.sin(G.elapsed * 5) * 4;
        ctx.fillStyle = `rgba(255,255,255,${a * 0.7})`;
        ctx.beginPath();
        ctx.moveTo(it.x, it.y - sz/2 - 6 + arrowBob);
        ctx.lineTo(it.x - 6, it.y - sz/2 - 14 + arrowBob);
        ctx.lineTo(it.x + 6, it.y - sz/2 - 14 + arrowBob);
        ctx.closePath(); ctx.fill();
        // Item name — small, clean, below the item
        ctx.fillStyle = it.isReal ? `rgba(255,230,150,${a*0.85})` : `rgba(130,170,200,${a*0.75})`;
        ctx.font = 'bold 12px "Segoe UI"'; ctx.textAlign = 'center';
        ctx.fillText(it.data.title || it.data.name, it.x, it.y + sz/2 + 12 + bob);
      }

      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
  });
}

function renderHints() {
  G.hints.forEach(h => {
    if (h.glow <= 0 && !h.discovered) return;
    const a = h.glow;

    ctx.globalAlpha = a;

    // Draw the complete inscription as a single static sprite
    const spr = sprites['inscription_complete'] || sprites['inscription_plaque'];
    if (spr) {
      // Draw at the hint's position, sized to fit naturally
      const pw = 340, ph = 118;
      const px = h.x + h.w/2 - pw/2, py = h.y + h.h/2 - ph/2;
      ctx.drawImage(spr, px, py, pw, ph);
    } else {
      // Last resort fallback
      const pw = 200, ph = 100;
      const px = h.x + h.w/2 - pw/2, py = h.y + h.h/2 - ph/2;
      ctx.fillStyle = 'rgba(45,38,55,0.92)';
      rr(ctx, px, py, pw, ph, 4); ctx.fill();
      ctx.fillStyle = '#f0d68a'; ctx.font = 'bold 12px "Segoe UI"'; ctx.textAlign = 'center';
      ctx.fillText('Ancient Inscription', px+pw/2, py+20);
      ctx.fillStyle = 'rgba(200,180,140,0.8)'; ctx.font = '11px "Segoe UI"';
      h.lines.forEach((line, i) => { ctx.fillText(line, px+pw/2, py+40+i*16); });
      ctx.textAlign = 'left';

    ctx.globalAlpha = 1;

}

function renderSlots() {
  G.slots.forEach((s, i) => {
    const w = 85, h = 68;

    // Slot background — use mural_slot sprite
    const slotSpr = sprites['mural_slot'];
    if (slotSpr) {
      ctx.drawImage(slotSpr, s.x - w/2, s.y - h/2, w, h);
    } else {
      ctx.fillStyle = s.placedItem ? 'rgba(25,30,22,0.7)' : 'rgba(15,12,25,0.75)';
      rr(ctx, s.x-w/2, s.y-h/2, w, h, 5); ctx.fill();
      ctx.strokeStyle = 'rgba(70,65,90,0.4)'; ctx.lineWidth = 2;
      rr(ctx, s.x-w/2, s.y-h/2, w, h, 5); ctx.stroke();
    }

    // Flash overlays
    if (s.wrongFlash > 0) {
      ctx.fillStyle = `rgba(180,50,40,${s.wrongFlash*0.35})`;
      rr(ctx, s.x-w/2, s.y-h/2, w, h, 5); ctx.fill();
    }
    if (s.flash > 0) {
      ctx.fillStyle = `rgba(50,180,80,${s.flash*0.3})`;
      rr(ctx, s.x-w/2, s.y-h/2, w, h, 5); ctx.fill();
    }

    // Correct placement green border
    if (s.placedItem && s.placedItem.id === s.correctId) {
      ctx.strokeStyle = 'rgba(100,200,100,0.5)'; ctx.lineWidth = 2;
      rr(ctx, s.x-w/2, s.y-h/2, w, h, 5); ctx.stroke();
    }

    ctx.textAlign = 'center';

    if (s.placedItem) {
      // Placed item — always try sprite
      const sprKey = s.placedItem.spriteKey;
      const spr = sprKey ? sprites[sprKey] : null;
      if (spr) {
        ctx.drawImage(spr, s.x - 22, s.y - 22, 44, 44);
      } else {
        ctx.font = '30px "Segoe UI"';
        ctx.fillText(s.placedItem.icon, s.x, s.y + 10);
      }
    } else {
      // Empty slot — show number hint
      if (G.roomIdx === 0) {
        ctx.fillStyle = 'rgba(200,180,140,0.4)'; ctx.font = 'bold 18px "Segoe UI"';
        ctx.fillText(s.label, s.x, s.y + 2);
        ctx.fillStyle = 'rgba(200,180,140,0.25)'; ctx.font = '10px "Segoe UI"';
        ctx.fillText(s.symbolHint, s.x, s.y + 18);
      } else {
        ctx.font = '24px "Segoe UI"';
        ctx.fillText(s.label, s.x, s.y + 2);
        ctx.fillStyle = 'rgba(200,180,140,0.3)'; ctx.font = '10px "Segoe UI"';
        ctx.fillText(s.symbolHint, s.x, s.y + 18);
      }
    }

    // Highlight when player has an item selected and hovers near slot
    if (G.selectedItem !== null) {
      const lampDist = Math.hypot(G.lampX - s.x, G.lampY - s.y);
      if (lampDist < 80) {
        ctx.strokeStyle = 'rgba(255,215,100,0.5)'; ctx.lineWidth = 2.5;
        rr(ctx, s.x-w/2-3, s.y-h/2-3, w+6, h+6, 7); ctx.stroke();
      }
    }

    ctx.textAlign = 'left';
  });
}

function renderSisters() {
  G.sisters.forEach(s => {
    if (s.timer < -1) return;
    const alpha = s.phase === 'warning' ? Math.min(1, (2-s.timer)*0.6) : Math.max(0, s.timer);

    const spr = sprites['sister'];
    if (spr) {
      ctx.save();
      ctx.globalAlpha = alpha * 0.75;
      const sz = 64;
      if (s.side==='right') {
        ctx.translate(s.x, s.y - sz/2);
        ctx.scale(-1, 1);
        ctx.drawImage(spr, -sz/2, 0, sz, sz);
      } else {
        ctx.drawImage(spr, s.x - sz/2, s.y - sz/2, sz, sz);
      }
      ctx.restore();
    } else {
      // Programmatic fallback — ghostly figure
      ctx.fillStyle = `rgba(30,20,45,${alpha*0.6})`;
      ctx.beginPath(); ctx.ellipse(s.x,s.y,15,35,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = `rgba(100,140,180,${alpha*0.4})`;
      ctx.beginPath(); ctx.arc(s.x-3,s.y-10,2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(s.x+3,s.y-10,2,0,Math.PI*2); ctx.fill();
    }

    if (s.phase === 'warning') {
      // Eerie glow around the sister
      const warnGlow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 50);
      warnGlow.addColorStop(0, `rgba(100,130,200,${alpha*0.15})`);
      warnGlow.addColorStop(1, 'rgba(80,110,180,0)');
      ctx.fillStyle = warnGlow;
      ctx.beginPath(); ctx.arc(s.x, s.y, 50, 0, Math.PI*2); ctx.fill();
    }
    if (s.phase === 'gust') {
      // Wind gust lines — more visible
      ctx.strokeStyle = `rgba(140,170,220,${Math.max(0,s.timer)*0.5})`;
      ctx.lineWidth = 2;
      const dir = s.side==='left'?1:-1;
      for (let g=0; g<8; g++) {
        const gx = s.x + dir*(20+g*40);
        const gy = s.gustY - 50 + g*14 + Math.sin(G.elapsed*12+g)*10;
        ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx+dir*40,gy+Math.sin(g)*6); ctx.stroke();
      }
    }
  });
}

function renderBedchamber() {
  const cx=W/2, cy=H/2-30, rev=G.bedReveal;

  ctx.fillStyle = `rgba(50,35,30,${0.3+rev*0.4})`;
  rr(ctx, cx-70, cy-15, 140, 60, 6); ctx.fill();

  if (rev > 0.2) {
    const wa=(rev-0.2)*1.2;
    ctx.fillStyle=`rgba(220,220,240,${Math.min(0.7,wa)})`;
    ctx.beginPath();ctx.ellipse(cx-30,cy,28,16,-0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+30,cy,28,16,0.3,0,Math.PI*2);ctx.fill();
  }
  if (rev > 0.4) {
    ctx.fillStyle=`rgba(240,220,200,${(rev-0.4)*1.3})`;
    ctx.beginPath();ctx.ellipse(cx,cy+12,22,11,0,0,Math.PI*2);ctx.fill();
  }
  if (rev > 0.6) {
    ctx.fillStyle=`rgba(255,235,215,${(rev-0.6)*2})`;
    ctx.beginPath();ctx.arc(cx+25,cy+2,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(218,165,32,${(rev-0.6)*1.8})`;
    ctx.beginPath();ctx.arc(cx+27,cy-4,8,0,Math.PI*2);ctx.fill();
  }

  ctx.textAlign = 'center';
  if (G.bedPhase===0 && rev<0.5) {
    ctx.fillStyle='rgba(200,180,140,0.4)'; ctx.font='italic 12px "Segoe UI"';
    ctx.fillText('Move your lamp closer...', W/2, H-60);
  }
  if (G.bedPhase>=2) {
    ctx.fillStyle='rgba(255,200,100,0.7)'; ctx.font='italic 14px "Segoe UI"';
    ctx.fillText('A drop of oil falls from the lamp...', W/2, H-80);
  }
  if (G.bedPhase>=3) {
    ctx.fillStyle='rgba(180,200,240,0.8)'; ctx.font='italic 14px "Segoe UI"';
    ctx.fillText('Eros wakes. His eyes meet yours. He flies away.', W/2, H-55);
  }
  ctx.textAlign='left';
}

  }
  ctx.fillStyle='rgba(255,255,255,0.08)'; rr(ctx,62,20,110,10,3); ctx.fill();

  ctx.fillText(`${GAME.totalHearts} lives remaining (no heart loss)`,18,H-17);

}

function renderTutorial() {
  ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#f0d68a'; ctx.font='bold 22px "Segoe UI"';
  ctx.fillText('"Seek the truth in darkness."',W/2,80);
  ctx.font='14px "Segoe UI"';

// ============================================================

function freshState() {

// ============================================================
// INPUT
// ============================================================
  // keys: uses shared keys object

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  G.particles = G.particles.filter(p => {
    p.x+=p.vx;p.y+=p.vy;p.life-=dt;return p.life>0;
  });

  if (G.phase === 'tutorial') { G.tutorialTimer += dt; return; }
  if (G.phase === 'complete') return;

  G.elapsed += dt;
  if (G.resistFlash > 0) G.resistFlash -= dt * 2;
  if (G.temptFlash > 0) G.temptFlash -= dt * 2;

  // Hit invincibility
  if (G.pHitTimer > 0) { G.pHitTimer -= dt; if (G.pHitTimer <= 0) G.pHit = false; }

  // Knockback
  if (Math.abs(G.pKnock) > 0.3) { G.px += G.pKnock; G.pKnock *= 0.88; }

  if (G.phase === 'cinematic') { updateCinematic(dt); return; }
  if (G.phase === 'boxChoice') return;
  if (G.phase === 'persephone') { updatePersephone(dt); return; }
  if (G.phase === 'ascending') { updateAscending(dt); return; }
  if (G.phase === 'encounter') return; // Paused during sacred encounters

  if (G.phase !== 'playing') return;

  // === AUTO SCROLL ===
  G.scroll += G.scrollSpeed;

  // Lateral movement
  let dx = 0;
  if (keys['ArrowLeft']||keys['a']||keys['A']) dx = -1;
  if (keys['ArrowRight']||keys['d']||keys['D']) dx = 1;
  G.px += dx * 3.5;

  // Path narrows with depth
  const depthRatio = G.scroll / G.maxScroll;
  G.pathWidth = 280 - depthRatio * 100;
  const pathL = G.pathCenter - G.pathWidth/2;
  const pathR = G.pathCenter + G.pathWidth/2;
  G.px = Math.max(pathL + 15, Math.min(pathR - 15, G.px));

  // === TEMPTATIONS ===
  G.temptations.forEach(t => {
    if (t.resolved) return;
    const screenY = t.scrollY - G.scroll + H/2;
    if (screenY > -60 && screenY < H + 60) t.active = true;

    // Passed off screen top — resisted!
    if (screenY < -80 && t.active) {
      t.resolved = true;
      G.temptResisted++;
      G.resistFlash = 0.5;
      // Shimmer
      const el = document.createElement('div');
      el.className = 'resist-shimmer';
      el.textContent = '✧ resisted';
      el.style.left = Math.min(W-80, Math.max(10, t.x-30)) + 'px';
      el.style.top = '40px';
      container.appendChild(el);
      setTimeout(()=>el.remove(), 1500);
    }
  });

  // === SHADOW HANDS ===
  G.handTimer -= dt;
  if (G.handTimer <= 0) {
    const freq = depthRatio < 0.33 ? 3 : depthRatio < 0.66 ? 2 : 1.2;
    G.handTimer = freq + Math.random() * 1;
    const side = Math.random() > 0.5 ? 'left' : 'right';
    // Spawn at world position ahead of Psyche
    G.hands.push({
      side,
      worldY: G.scroll + H * 0.3 + Math.random() * H * 0.4,
      phase: 'telegraph',
      timer: 1.0,
      reached: false,
      extend: 0
    });
  }

  G.hands = G.hands.filter(h => {
    h.timer -= dt;
    const screenY = h.worldY - G.scroll + H/2;
    // Off screen — remove
    if (screenY < -60 || screenY > H + 60) return false;

    if (h.phase === 'telegraph') {
      h.extend = Math.min(12, h.extend + dt * 15);
      if (h.timer <= 0) { h.phase = 'reach'; h.timer = 0.7; }
    }
    if (h.phase === 'reach') {
      h.extend = Math.min(45, h.extend + dt * 80);
      const handX = h.side === 'left' ? pathL + h.extend : pathR - h.extend;
      if (!h.reached && Math.abs(G.px - handX) < 22 && Math.abs(H/2 - screenY) < 25) {
        h.reached = true;
        G.pKnock = h.side === 'left' ? 25 : -25;
        shake();
      }
      if (h.timer <= 0) { h.phase = 'retract'; h.timer = 0.5; }
    }
    if (h.phase === 'retract') {
      h.extend = Math.max(0, h.extend - dt * 60);
    }
    return h.phase !== 'retract' || h.timer > 0;
  });

  // === SACRED ENCOUNTERS ===
  G.encounters.forEach(enc => {
    if (enc.resolved) return;
    const screenY = enc.scrollY - G.scroll + H/2;
    if (screenY > 150 && screenY < 400) {
      G.currentEncounter = enc;
      G.phase = 'encounter';
      G.scrollSpeed = 0; // Pause scroll
    }
  });

  // === CHECK PERSEPHONE ===
  if (G.scroll >= G.maxScroll) {
    G.phase = 'persephone';
    G.cinematicTimer = 0;
  }
}

// ============================================================
// ENCOUNTER HANDLING
// ============================================================
function useItem(itemType) {
  if (G.phase !== 'encounter' || !G.currentEncounter) return;
  const enc = G.currentEncounter;

  if (itemType === enc.correctItem) {
    // Correct!
    if (itemType === 'coin') G.coins--;
    else G.cakes--;
    enc.resolved = true;
    G.currentEncounter = null;
    G.phase = 'playing';
    G.scrollSpeed = 1.5;
    showFloat(W/2, H/2 - 40, '✓ Correct offering!', '#4ade80');
    spawnP(W/2, H/2, 8, '#ffd700');
  } else {
    // Wrong item
    G.wrongItems++;
    G.hearts--;
    G.totalHearts--;
    GAME.totalHearts--;
    GAME.hearts = G.hearts;
    shake();
    showFloat(W/2, H/2 - 40, '✗ Wrong item! 💔', '#ef4444');
    // Don't resolve — player can try again with correct item
  }
}

// ============================================================
// TEMPTATION CLICK
// ============================================================
function handleTemptClick(mx, my) {
  if (G.phase !== 'playing') return;

  G.temptations.forEach(t => {
    if (t.resolved || !t.active) return;
    const screenY = t.scrollY - G.scroll + H/2;
    if (screenY < -50 || screenY > H + 50) return;
    // Generous hitbox — 45px
    if (Math.hypot(mx - t.x, my - screenY) < 45) {
      t.resolved = true;
      G.temptClicked++;
      G.hearts--;
      G.totalHearts--;
      GAME.totalHearts--;
      GAME.hearts = G.hearts;
      G.pHit = true;
      G.pHitTimer = 1;
      // Big pull back
      G.scroll -= 80;
      shake();
      showFloat(mx, my - 20, '💔 Tempted!', '#ef4444');
      spawnP(mx, my, 8, '#ef4444');
      // Dark flash
      G.temptFlash = 0.5;
    }
  });
}

// ============================================================
// PERSEPHONE & BOX
// ============================================================
function updatePersephone(dt) {
  G.cinematicTimer += dt;
  if (G.cinematicTimer > 6) {
    G.phase = 'ascending';
    G.ascendScroll = 0;
    G.cinematicTimer = 0;
  }
}

function updateAscending(dt) {
  G.ascendScroll += dt * 40;
  G.cinematicTimer += dt;

  if (G.cinematicTimer > 3 && G.phase !== 'boxChoice') {

  }
}

function makeBoxChoice(opened) {

  G.phase = 'cinematic';
  G.cinematicTimer = 0;
  G.cinematicPhase = 0;
}

function updateCinematic(dt) {
  G.cinematicTimer += dt;
  if (G.cinematicTimer > 2 && G.cinematicPhase === 0) G.cinematicPhase = 1; // Sleep
  if (G.cinematicTimer > 4.5 && G.cinematicPhase === 1) G.cinematicPhase = 2; // Eros
  if (G.cinematicTimer > 7 && G.cinematicPhase === 2) G.cinematicPhase = 3; // Zeus
  if (G.cinematicTimer > 9.5) G.phase = 'complete';
}

// ============================================================
// RENDER
// ============================================================
function render() {
  ctx.clearRect(0, 0, W, H);

  if (G.phase === 'tutorial') { renderTutorial(); return; }
  if (G.phase === 'complete') { renderComplete(); return; }
  if (G.phase === 'cinematic') { renderCinematic(); return; }

  // === UNDERWORLD BACKGROUND ===
  const depthRatio = Math.min(1, G.scroll / G.maxScroll);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#060812');
  bg.addColorStop(0.5, lerpC('#080a16', '#0a1210', depthRatio));
  bg.addColorStop(1, lerpC('#0a0c18', '#081a0e', depthRatio));
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Green underworld glow from below
  const glowA = 0.05 + depthRatio * 0.1;
  const glow = ctx.createRadialGradient(W/2, H, 0, W/2, H, 300);
  glow.addColorStop(0, `rgba(0,80,40,${glowA})`);
  glow.addColorStop(1, 'rgba(0,60,30,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  // === STAIRWAY ===
  const pathL = G.pathCenter - G.pathWidth/2;
  const pathR = G.pathCenter + G.pathWidth/2;

  // Path surface
  ctx.fillStyle = '#12141e';
  ctx.fillRect(pathL, 0, G.pathWidth, H);

  // Step lines (scrolling)
  ctx.strokeStyle = 'rgba(60,55,75,0.25)';
  ctx.lineWidth = 1;
  const stepOffset = (G.scroll * 0.5) % 25;
  for (let y = stepOffset; y < H; y += 25) {
    ctx.beginPath(); ctx.moveTo(pathL, y); ctx.lineTo(pathR, y); ctx.stroke();
  }

  // Walls
  ctx.fillStyle = 'rgba(20,18,30,0.6)';
  ctx.fillRect(0, 0, pathL, H);
  ctx.fillRect(pathR, 0, W - pathR, H);

  // Wall texture
  ctx.strokeStyle = 'rgba(40,35,55,0.2)';
  ctx.lineWidth = 1;
  for (let y = stepOffset * 2; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(pathL, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pathR, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // === SHADOW HANDS ===
  G.hands.forEach(h => {
    const screenY = h.worldY - G.scroll + H/2;
    if (screenY < -40 || screenY > H + 40) return;
    const hx = h.side === 'left' ? pathL : pathR;
    const dir = h.side === 'left' ? 1 : -1;
    const alpha = h.phase === 'telegraph' ? 0.3 + Math.sin(G.elapsed*8)*0.15 : 0.65;

    // Arm reaching from wall
    ctx.fillStyle = `rgba(35,15,55,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(hx + dir*h.extend*0.5, screenY, h.extend*0.5+5, 6, 0, 0, Math.PI*2);
    ctx.fill();

    // Fingers at the tip
    for (let f = -1; f <= 1; f++) {
      ctx.beginPath();
      ctx.ellipse(hx + dir*h.extend + dir*f*4, screenY + f*6, 8, 3.5, dir>0?0:Math.PI, 0, Math.PI*2);
      ctx.fill();
    }

    // Purple glow
    ctx.fillStyle = `rgba(80,30,120,${alpha * 0.3})`;
    ctx.beginPath(); ctx.arc(hx + dir*h.extend, screenY, 15, 0, Math.PI*2); ctx.fill();

    // Telegraph warning glow on wall
    if (h.phase === 'telegraph') {
      ctx.fillStyle = `rgba(80,40,120,${0.15 + Math.sin(G.elapsed*6)*0.08})`;
      ctx.beginPath(); ctx.arc(hx, screenY, 20, 0, Math.PI*2); ctx.fill();
    }
  });

  // === TEMPTATIONS ===
  G.temptations.forEach(t => {
    if (t.resolved || !t.active) return;
    const screenY = t.scrollY - G.scroll + H/2;
    if (screenY < -50 || screenY > H + 50) return;

    const pulse = 0.6 + Math.sin(G.elapsed * 3) * 0.2;

    // Warm inviting glow
    const tGlow = ctx.createRadialGradient(t.x, screenY, 0, t.x, screenY, 35);
    tGlow.addColorStop(0, t.data.color.replace('0.6', String(pulse * 0.3)));
    tGlow.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = tGlow;
    ctx.fillRect(t.x-35, screenY-35, 70, 70);

    // Sprite or icon
    const spr = t.data.sprite ? sprites[t.data.sprite] : null;
    if (spr) {
      ctx.globalAlpha = pulse;
      ctx.drawImage(spr, t.x-18, screenY-18, 36, 36);
      ctx.globalAlpha = 1;
    } else {
      ctx.font = '24px "Segoe UI"'; ctx.textAlign = 'center';
      ctx.globalAlpha = pulse;
      ctx.fillText(t.data.icon, t.x, screenY + 7);
      ctx.globalAlpha = 1;
    }

    // Whisper text
    ctx.fillStyle = `rgba(255,220,140,${pulse * 0.6})`;
    ctx.font = 'italic 11px "Segoe UI"'; ctx.textAlign = 'center';
    ctx.fillText(t.data.text, t.x, screenY + 28);

    // Proximity warning — pulsing ring when Psyche is close
    const psycheDist = Math.hypot(G.px - t.x, H/2 - screenY);
    if (psycheDist < 80) {
      const warn = (1 - psycheDist / 80) * 0.4;
      ctx.strokeStyle = `rgba(255,180,60,${warn + Math.sin(G.elapsed*6)*0.1})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(t.x, screenY, 30 + Math.sin(G.elapsed*4)*3, 0, Math.PI*2); ctx.stroke();
    }

    // Tutorial label
    if (t.tutorial) {
      ctx.fillStyle = 'rgba(255,100,100,0.6)';
      ctx.font = 'bold 10px "Segoe UI"';
      ctx.fillText("DON'T CLICK", t.x, screenY - 22);
    }

    ctx.textAlign = 'left';
  });

  // === SACRED ENCOUNTER ===
  if (G.phase === 'encounter' && G.currentEncounter) {
    renderEncounter();
  }

  // === PSYCHE ===
  if (G.phase === 'playing' || G.phase === 'encounter') {
    renderPsyche();
  }

  // === PERSEPHONE SCENE ===
  if (G.phase === 'persephone') renderPersephoneScene();
  if (G.phase === 'ascending') renderAscending();
  if (G.phase === 'boxChoice') { renderAscending(); renderBoxChoice(); }

  // Particles
  G.particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life/0.7);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,2*(p.life/0.7),0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Temptation flash
  if (G.temptFlash > 0) {
    ctx.fillStyle = `rgba(180,40,40,${G.temptFlash * 0.15})`;
    ctx.fillRect(0, 0, W, H);
  }

  // === HUD ===
  renderHUD();
}

function renderPsyche() {
  const py = H / 2;
  const blink = G.pHit && Math.sin(G.elapsed * 30) > 0;
  if (blink) return;

  const spr = sprites['psyche'];
  if (spr) {
    ctx.drawImage(spr, G.px - 18, py - 28, 36, 44);
  } else {
    // Programmatic
    ctx.fillStyle = '#e8ddd0';
    ctx.beginPath(); ctx.arc(G.px, py-16, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#6a4a28';
    ctx.beginPath(); ctx.arc(G.px, py-19, 5, Math.PI, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f0ece4';
    ctx.beginPath();
    ctx.moveTo(G.px, py-10); ctx.lineTo(G.px-8, py+5); ctx.lineTo(G.px+8, py+5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#d4a020'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(G.px-5, py-5); ctx.lineTo(G.px+5, py-5); ctx.stroke();
  }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(G.px, py+8, 10, 4, 0, 0, Math.PI*2); ctx.fill();
}

function renderEncounter() {
  const enc = G.currentEncounter;

  if (enc.type === 'charon') {
    // === RIVER STYX SCENE ===
    // Dark water background
    ctx.fillStyle = '#080c1a';
    ctx.fillRect(0, 0, W, H);

    // River
    const riverGrad = ctx.createLinearGradient(0, H*0.4, 0, H);
    riverGrad.addColorStop(0, '#0a1428');
    riverGrad.addColorStop(0.5, '#0c1830');
    riverGrad.addColorStop(1, '#081020');
    ctx.fillStyle = riverGrad; ctx.fillRect(0, H*0.4, W, H*0.6);

    // Water ripples
    ctx.strokeStyle = 'rgba(40,60,100,0.2)'; ctx.lineWidth = 1;
    for (let r = 0; r < 8; r++) {
      const ry = H*0.45 + r*25 + Math.sin(G.elapsed*1.5+r)*4;
      ctx.beginPath(); ctx.moveTo(0, ry);
      ctx.quadraticCurveTo(W*0.3, ry+Math.sin(G.elapsed*2+r)*6, W*0.6, ry);
      ctx.quadraticCurveTo(W*0.8, ry-Math.sin(G.elapsed*2+r)*4, W, ry);
      ctx.stroke();
    }

    // Mist
    for (let m = 0; m < 5; m++) {
      ctx.fillStyle = `rgba(30,40,60,${0.05+Math.sin(G.elapsed+m)*0.02})`;
      ctx.beginPath();
      ctx.ellipse(100+m*140+Math.sin(G.elapsed*0.5+m)*20, H*0.38, 80, 20, 0, 0, Math.PI*2);
      ctx.fill();
    }

    // Charon and boat
    const spr = sprites['charon'];
    if (spr) {
      ctx.drawImage(spr, W/2-30, H*0.25-20, 60, 60);
    } else {
      // Boat
      ctx.fillStyle = '#2a1e18';
      ctx.beginPath();
      ctx.moveTo(W/2-50, H*0.38); ctx.quadraticCurveTo(W/2, H*0.42, W/2+50, H*0.38);
      ctx.lineTo(W/2+40, H*0.35); ctx.quadraticCurveTo(W/2, H*0.33, W/2-40, H*0.35);
      ctx.closePath(); ctx.fill();
      // Figure
      ctx.fillStyle = '#1a1520';
      ctx.beginPath(); ctx.ellipse(W/2, H*0.28, 12, 25, 0, 0, Math.PI*2); ctx.fill();
    }

    // Far bank
    ctx.fillStyle = '#0a0e16';
    ctx.fillRect(0, H*0.35, W, 8);

  } else {
    // === CERBERUS CAVE SCENE ===
    ctx.fillStyle = '#0a0810';
    ctx.fillRect(0, 0, W, H);

    // Cave walls
    ctx.fillStyle = '#141018';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(150, 0); ctx.lineTo(100, H*0.4);
    ctx.quadraticCurveTo(80, H*0.6, 0, H); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W, 0); ctx.lineTo(W-150, 0); ctx.lineTo(W-100, H*0.4);
    ctx.quadraticCurveTo(W-80, H*0.6, W, H); ctx.closePath(); ctx.fill();

    // Cave ceiling arch
    ctx.fillStyle = '#0e0c14';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.quadraticCurveTo(W/2, 120, W, 0);
    ctx.lineTo(W, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();

    // Eerie green glow from behind Cerberus
    const cGlow = ctx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.4, 150);
    cGlow.addColorStop(0, 'rgba(0,60,30,0.12)');
    cGlow.addColorStop(1, 'rgba(0,40,20,0)');
    ctx.fillStyle = cGlow; ctx.fillRect(0, 0, W, H);

    // Cerberus
    const spr = sprites['cerberus'];
    if (spr) {
      ctx.drawImage(spr, W/2-30, H*0.3-10, 60, 60);
    } else {
      // Three-headed silhouette
      ctx.fillStyle = '#1a1218';
      ctx.beginPath(); ctx.ellipse(W/2, H*0.38, 35, 22, 0, 0, Math.PI*2); ctx.fill();
      for (let head = -1; head <= 1; head++) {
        ctx.beginPath(); ctx.arc(W/2 + head*22, H*0.3, 10, 0, Math.PI*2); ctx.fill();
        // Red eyes
        ctx.fillStyle = '#cc2222';
        ctx.beginPath(); ctx.arc(W/2 + head*22 + 3, H*0.3 - 2, 2, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#1a1218';
      }
    }

    // Bones on ground
    ctx.fillStyle = 'rgba(60,55,50,0.3)';
    [[W/2-80,H*0.5],[W/2+60,H*0.52],[W/2-20,H*0.55]].forEach(([bx,by]) => {
      ctx.beginPath(); ctx.ellipse(bx, by, 8, 2, Math.random(), 0, Math.PI*2); ctx.fill();
    });
  }

  // Prompt text (both encounters)
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  rr(ctx, W/2-180, H*0.6-10, 360, 70, 8); ctx.fill();

  ctx.fillStyle = '#f0d68a'; ctx.font = 'bold 16px "Segoe UI"'; ctx.textAlign = 'center';
  ctx.fillText(enc.prompt, W/2, H*0.6 + 15);
  ctx.fillStyle = '#c8b88a'; ctx.font = '15px "Segoe UI"';
  ctx.fillText(enc.action, W/2, H*0.6 + 35);
  ctx.fillStyle = 'rgba(255,215,100,0.5)'; ctx.font = '14px "Segoe UI"';
  ctx.fillText('Click the correct item from your inventory (top-right) →', W/2, H*0.6 + 52);
  ctx.textAlign = 'left';
}

  bg.addColorStop(0, '#0a0614');

  } else if (t < 3.5) {

}

function renderCinematic() {
  const t = G.cinematicTimer;
  const phase = G.cinematicPhase;

  // Background transition: dark to light
  const lightT = Math.min(1, t / 9);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, lerpC('#080a16', '#3a2858', lightT));
  bg.addColorStop(1, lerpC('#0a0c18', '#c8943a', lightT));
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  if (phase === 0) {
    // Box opens / fate
    if (G.boxChoice) {
      ctx.fillStyle = 'rgba(200,170,220,0.8)'; ctx.font = 'italic 15px "Segoe UI"';
      ctx.fillText('You open the box. Sleep pours out...', W/2, H/2);
    } else {
      ctx.fillStyle = 'rgba(200,170,220,0.7)'; ctx.font = 'italic 15px "Segoe UI"';
      ctx.fillText('You resist. But the box trembles...', W/2, H/2 - 15);
      if (t > 1) {
        ctx.fillStyle = 'rgba(200,170,220,0.8)';
        ctx.fillText('Fate is not so easily denied. The box opens on its own.', W/2, H/2 + 15);
      }
    }
    // Sleep particles
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = `rgba(150,130,200,${0.2 + Math.sin(t*3+i)*0.1})`;
      ctx.beginPath();
      ctx.arc(W/2 + Math.sin(t*2+i*2)*40, H/2+30+i*15+Math.sin(t+i)*10, 3, 0, Math.PI*2);
      ctx.fill();
    }
  }
  else if (phase === 1) {
    // Eros rescue
    ctx.fillStyle = `rgba(255,215,100,${Math.min(1,(t-2)/2)})`; ctx.font = 'italic 15px "Segoe UI"';
    ctx.fillText('Eros, healed by love, descends from the sky.', W/2, H/2-20);
    ctx.fillText('He wipes the sleep from her eyes.', W/2, H/2+10);
    // Golden glow
    const gr = (t-2)*60;
    const gg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, gr);
    gg.addColorStop(0, 'rgba(255,215,100,0.15)'); gg.addColorStop(1, 'rgba(255,215,100,0)');
    ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
  }
  else if (phase === 2) {
    // Zeus grants immortality
    ctx.fillStyle = `rgba(255,240,200,${Math.min(1,(t-4.5)/1.5)})`; ctx.font = 'italic 15px "Segoe UI"';
    ctx.fillText('"For enduring what no mortal should,', W/2, H/2-25);
    ctx.fillText('I grant you immortality."', W/2, H/2+5);
    ctx.fillStyle = 'rgba(200,180,255,0.6)'; ctx.font = '15px "Segoe UI"';
    ctx.fillText('Wings grow from Psyche\'s back.', W/2, H/2+35);
  }
  else if (phase === 3) {
    ctx.fillStyle = '#f0d68a'; ctx.font = 'bold 18px "Segoe UI"';
    ctx.fillText('Love endures.', W/2, H/2);
  }

  ctx.textAlign = 'left';
}

function renderHUD() {
  if (G.phase === 'cinematic' || G.phase === 'complete') return;

  // Hearts
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(ctx, 10, 10, 100, 28, 6); ctx.fill();
  let hs = '';
  for (let i=0;i<4;i++) hs += i<G.hearts?'❤️':'🖤';
  ctx.font = '15px "Segoe UI"'; ctx.textAlign = 'left'; ctx.fillText(hs, 18, 28);

  // Lives remaining
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; rr(ctx, 10, 42, 100, 18, 4); ctx.fill();
  ctx.fillStyle = 'rgba(200,180,140,0.4)'; ctx.font = '14px "Segoe UI"';
  ctx.fillText(`${GAME.totalHearts} lives remaining`, 16, 54);

  // Descent progress
  if (G.phase === 'playing') {
    const pct = Math.min(100, Math.round((G.scroll / G.maxScroll) * 100));
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(ctx, W-55, 60, 35, H-120, 4); ctx.fill();
    // Bar
    const barH = (H - 130) * (pct / 100);
    ctx.fillStyle = '#2a5a3a';
    rr(ctx, W-52, 65, 29, barH, 3); ctx.fill();
    // Marker
    ctx.fillStyle = '#f0d68a';
    ctx.fillRect(W-54, 63 + barH, 33, 3);
    // Label
    ctx.fillStyle = 'rgba(200,180,140,0.4)'; ctx.font = '14px "Segoe UI"'; ctx.textAlign = 'center';
    ctx.fillText(`${pct}%`, W-37, 55);
  }

  // Inventory
  if (G.phase === 'playing' || G.phase === 'encounter') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(ctx, W-120, 10, 110, 38, 6); ctx.fill();
    ctx.font = '14px "Segoe UI"'; ctx.textAlign = 'left';
    // Coins
    ctx.fillStyle = G.coins > 0 ? '#ffd700' : 'rgba(100,100,100,0.4)';
    ctx.fillText(`🪙 ×${G.coins}`, W-112, 26);
    // Cakes
    ctx.fillStyle = G.cakes > 0 ? '#d4a060' : 'rgba(100,100,100,0.4)';
    ctx.fillText(`🍰 ×${G.cakes}`, W-112, 42);

    // During encounter: clickable inventory items
    if (G.phase === 'encounter') {
      ctx.strokeStyle = 'rgba(255,215,100,0.4)'; ctx.lineWidth = 1.5;
      rr(ctx, W-120, 10, 110, 38, 6); ctx.stroke();
      ctx.fillStyle = 'rgba(255,215,100,0.5)'; ctx.font = '14px "Segoe UI"'; ctx.textAlign = 'center';
      ctx.fillText('← click to offer', W-65, 56);
    }
  }

  // Resist counter
  if (G.temptResisted > 0) {
    const ra = G.resistFlash > 0 ? 0.7 : 0.4;
    ctx.fillStyle = `rgba(100,200,150,${ra})`; ctx.font = '15px "Segoe UI"'; ctx.textAlign = 'left';
    ctx.fillText(`✧ ${G.temptResisted} resisted`, 16, 76);
  }

  // Controls
  if (G.phase === 'playing' && G.scroll < 300) {
    ctx.fillStyle = 'rgba(200,180,140,0.3)'; ctx.font = '14px "Segoe UI"'; ctx.textAlign = 'center';
    ctx.fillText('← → Arrow keys to dodge  ·  Don\'t click the temptations!', W/2, H - 15);
    ctx.textAlign = 'left';
  }

  ctx.textAlign = 'left';
}

  ctx.fillText(`Temptations Resisted: ${G.temptResisted}`,W/2,190);
  ctx.fillText(`Temptations Clicked: ${G.temptClicked}`,W/2,218);
  ctx.fillText(`Wrong Items: ${G.wrongItems}`,W/2,246);
  ctx.fillText(`Box Choice: ${G.boxChoice ? 'Opened' : 'Carried Sealed'}`,W/2,274);

  ctx.fillStyle=rc; ctx.font='bold 20px "Segoe UI"';
  ctx.fillText(`🛡️ Resolve: ${rating}`,W/2,330);
  ctx.fillStyle='rgba(200,180,140,0.5)'; ctx.font='italic 13px "Segoe UI"';
  ctx.fillText('"You resisted the call of temptation."',W/2,375);

  ctx.fillStyle='rgba(240,214,138,0.12)'; rr(ctx,W/2-60,410,120,36,8); ctx.fill();
  ctx.strokeStyle='rgba(240,214,138,0.4)'; ctx.lineWidth=1; rr(ctx,W/2-60,410,120,36,8); ctx.stroke();
  ctx.fillStyle='#f0d68a'; ctx.font='bold 14px "Segoe UI"';
  ctx.fillText('Continue →',W/2,433);
  ctx.textAlign='left';
}

  return {
    init(){ G=freshState(); generateDescent(); G.phase='tutorial'; },
    update(dt){ G.elapsed+=dt; update(dt); },
    render(){ render(); },
    click(x,y){
      if(G.phase==='tutorial'){if(x>W/2-70&&x<W/2+70&&y>480&&y<520){G.phase='playing';}return;}
      if(G.phase==='complete'){
        const bad=G.temptClicked+G.wrongItems;
        let rating;
        if(bad===0)rating='Excellent';else if(bad<=2)rating='Good';
        else if(bad<=4)rating='Fair';else rating='Needs Work';
        trialComplete(4,'resolve',{score:Math.max(0,100-bad*15),rating,boxChoice:G.boxChoice});
        return;
      }
      if(G.phase==='encounter'){
        if(x>W-112&&x<W-60&&y>14&&y<30&&G.coins>0){useItem('coin');return;}
        if(x>W-112&&x<W-60&&y>30&&y<46&&G.cakes>0){useItem('cake');return;}
        return;
      }
      if(G.phase==='boxChoice'){
        if(x>W/2-120&&x<W/2+120&&y>H/2-40&&y<H/2-5){makeBoxChoice(true);return;}
        if(x>W/2-120&&x<W/2+120&&y>H/2+15&&y<H/2+50){makeBoxChoice(false);return;}
        return;
      }
      if(G.phase==='playing') handleTemptClick(x,y);
    },
    mousemove(x,y){},
    mouseup(x,y){},
    G: ()=>G
  };
})();

canvas.addEventListener('mousedown',(e)=>{
  const p=getPos(e);
  if(GAME.phase==='story'){
    const btnY=H-140;
    if(p.x>W/2-80&&p.x<W/2+80&&p.y>btnY&&p.y<btnY+40){
      const cb=GAME.storyCallback;GAME.storyCard=null;GAME.storyCallback=null;if(cb)cb();
    }
    return;
  }
  if(GAME.phase==='results'){
    if(p.x>W/2-100&&p.x<W/2+100&&p.y>400&&p.y<442) submitResults();
    return;
  }
  if(GAME.trial&&GAME.trial.click) GAME.trial.click(p.x,p.y);
});
canvas.addEventListener('mousemove',(e)=>{
  const p=getPos(e);
  if(GAME.trial&&GAME.trial.mousemove) GAME.trial.mousemove(p.x,p.y);
});
canvas.addEventListener('mouseup',(e)=>{
  const p=getPos(e);
  if(GAME.trial&&GAME.trial.mouseup) GAME.trial.mouseup(p.x,p.y);
});
canvas.addEventListener('touchstart',(e)=>{e.preventDefault();canvas.dispatchEvent(new MouseEvent('mousedown',{clientX:e.touches[0].clientX,clientY:e.touches[0].clientY}));},{passive:false});
canvas.addEventListener('touchmove',(e)=>{e.preventDefault();canvas.dispatchEvent(new MouseEvent('mousemove',{clientX:e.touches[0].clientX,clientY:e.touches[0].clientY}));},{passive:false});
canvas.addEventListener('touchend',(e)=>{e.preventDefault();canvas.dispatchEvent(new MouseEvent('mouseup',{}));},{passive:false});

// ================================================================
// MAIN LOOP
// ================================================================
let lastTime=0;
function gameLoop(ts){
  const dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;
  GAME.elapsed+=dt;
  GAME.particles=GAME.particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=2*dt;p.life-=dt;return p.life>0;});
  ctx.clearRect(0,0,W,H);

  if(GAME.phase==='loading'){/* handled by HTML overlay */}
  else if(GAME.phase==='story'){renderStoryCard();}
  else if(GAME.phase.startsWith('trial')&&GAME.trial){GAME.trial.update(dt);GAME.trial.render();}
  else if(GAME.phase==='cinematic'){updateCinematicEnd(dt);renderCinematicEnd();}
  else if(GAME.phase==='results'){renderResults();}

  GAME.particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.ml);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.ml),0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  // Cursor
  if(GAME.phase==='trial3'){const g=Trial3.G();container.style.cursor=(g.phase==='playing'||g.phase==='bedchamber')?'none':'default';}
  else{container.style.cursor='default';}

  requestAnimationFrame(gameLoop);
}

function checkLoaded(){
  if(spritesLoaded>=spritesTotal){
    document.getElementById('loading-screen').style.opacity='0';
    setTimeout(()=>{document.getElementById('loading-screen').style.display='none';
      // Dev skip: ?trial=2, ?trial=3, or ?trial=4
      const devTrial = parseInt(urlParams.get('trial'));
      if(devTrial >= 2 && devTrial <= 4){
        console.log('DEV SKIP → Trial '+devTrial);
        if(devTrial >= 2) GAME.virtues.precision = {score:80,rating:'Good'};
        if(devTrial >= 3) GAME.virtues.patience = {score:80,rating:'Good'};
        if(devTrial >= 4) GAME.virtues.trust = {score:80,rating:'Good'};
        startTrial(devTrial);
      } else {
        showStory('intro',()=>startTrial(1));
      }
    },600);
  } else setTimeout(checkLoaded,100);
}
checkLoaded();
requestAnimationFrame(gameLoop);
