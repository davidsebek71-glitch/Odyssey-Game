<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦉 The Forbidden Archive — Beta V5</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#07060d;color:#f5f3ff;font-family:'Crimson Text',Georgia,serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 50%,rgba(109,40,217,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 30%,rgba(139,92,246,0.06) 0%,transparent 50%);pointer-events:none;z-index:0}
.container{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:30px 20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid rgba(167,139,250,0.15)}
.header-title{font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:#b8a4f8}
.header-stats{display:flex;gap:14px;align-items:center}
.stat-badge{padding:5px 12px;border-radius:20px;font-weight:600;font-size:14px}
.stat-deaths{background:rgba(248,113,113,0.15);color:#f87171;border:1px solid rgba(248,113,113,0.3)}
.stat-hints{background:rgba(96,165,250,0.15);color:#93c5fd;border:1px solid rgba(96,165,250,0.3)}
.beta-banner{background:linear-gradient(135deg,rgba(251,191,36,0.15),rgba(245,158,11,0.1));border:1px solid rgba(251,191,36,0.3);border-radius:10px;padding:10px 16px;margin-bottom:22px;font-size:14px;color:#fbbf24}
.narrative-panel{background:rgba(12,10,22,0.85);border:1px solid rgba(167,139,250,0.12);border-radius:14px;padding:28px;margin-bottom:22px;line-height:1.9;font-size:17px;color:rgba(255,255,255,0.95);max-height:48vh;overflow-y:auto;white-space:pre-line}
.narrative-panel::-webkit-scrollbar{width:6px}.narrative-panel::-webkit-scrollbar-thumb{background:rgba(167,139,250,0.3);border-radius:3px}
.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.choice-btn{display:block;width:100%;text-align:left;padding:16px 20px;background:rgba(167,139,250,0.07);border:2px solid rgba(167,139,250,0.22);border-radius:12px;color:rgba(255,255,255,0.97);font-family:'Crimson Text',serif;font-size:16.5px;line-height:1.5;cursor:pointer;transition:all 0.25s ease}
.choice-btn:hover{border-color:rgba(167,139,250,0.6);background:rgba(167,139,250,0.14);transform:translateX(4px)}
.puzzle-panel{background:rgba(251,191,36,0.06);border:2px solid rgba(251,191,36,0.25);border-radius:14px;padding:24px;margin-bottom:20px}
.puzzle-prompt{font-size:16.5px;color:#fcd34d;font-weight:600;margin-bottom:16px;line-height:1.6}
.puzzle-input-row{display:flex;gap:10px}
.puzzle-input{flex:1;padding:12px 16px;background:rgba(0,0,0,0.5);border:2px solid rgba(251,191,36,0.25);border-radius:10px;color:white;font-family:'Crimson Text',serif;font-size:16px;outline:none}
.puzzle-input:focus{border-color:rgba(251,191,36,0.6)}
.puzzle-submit{background:linear-gradient(135deg,#b45309,#d97706);border:none;color:white;padding:12px 24px;border-radius:10px;cursor:pointer;font-family:'Cinzel',serif;font-weight:700;font-size:15px}
.puzzle-submit:hover{transform:scale(1.03)}
.puzzle-feedback{margin-top:10px;font-size:15px;min-height:22px}
.hint-btn{width:100%;padding:10px;margin-bottom:10px;background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.3);color:#93c5fd;border-radius:10px;cursor:pointer;font-family:'Crimson Text',serif;font-size:15px}
.hint-btn:hover{background:rgba(96,165,250,0.2)}
.hint-display{background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.3);border-radius:10px;padding:14px;margin-top:10px;font-size:15px;color:rgba(255,255,255,0.95)}
.death-overlay{background:rgba(10,4,4,0.95);border:2px solid rgba(239,68,68,0.3);border-radius:14px;padding:30px;text-align:center}
.death-skull{font-size:64px;margin-bottom:12px}.death-title{font-family:'Cinzel',serif;font-size:24px;color:#f87171;font-weight:700;margin-bottom:20px}
.death-narrative{text-align:left;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:10px;padding:20px;margin-bottom:20px;font-size:16px;line-height:1.8;color:rgba(255,255,255,0.92);white-space:pre-line;max-height:35vh;overflow-y:auto}
.death-lesson{background:rgba(251,191,36,0.1);border-left:4px solid #fbbf24;padding:14px 18px;border-radius:0 10px 10px 0;text-align:left;margin-bottom:20px}
.death-lesson-label{font-size:13px;color:#fbbf24;font-weight:700;letter-spacing:1px;margin-bottom:6px}
.death-lesson-text{font-size:15px;color:rgba(255,255,255,0.95);line-height:1.65}
.death-timer{font-family:'Cinzel',serif;font-size:22px;color:#f87171;margin-bottom:16px}
.retry-btn{padding:14px 32px;border-radius:10px;font-family:'Cinzel',serif;font-size:15px;font-weight:700;cursor:not-allowed;border:2px solid rgba(239,68,68,0.4);background:rgba(239,68,68,0.2);color:rgba(255,255,255,0.4)}
.retry-btn.ready{cursor:pointer;border-color:rgba(74,222,128,0.5);background:linear-gradient(135deg,rgba(74,222,128,0.2),rgba(34,197,94,0.3));color:white}
.retry-btn.ready:hover{transform:scale(1.03)}
.checkpoint{text-align:center;padding:20px}.checkpoint-icon{font-size:72px;margin-bottom:16px}
.checkpoint-title{font-family:'Cinzel',serif;font-size:26px;color:#4ade80;font-weight:700;margin-bottom:20px}
.checkpoint-narrative{text-align:left;background:rgba(74,222,128,0.05);border:1px solid rgba(74,222,128,0.2);border-radius:10px;padding:24px;margin-bottom:24px;font-size:16.5px;line-height:1.85;color:rgba(255,255,255,0.95);white-space:pre-line}
.hub-title{font-family:'Cinzel',serif;font-size:28px;font-weight:900;color:#b8a4f8;text-align:center;margin-bottom:8px;letter-spacing:2px}
.hub-subtitle{text-align:center;color:rgba(255,255,255,0.45);font-size:14px;margin-bottom:22px;font-family:'Cinzel',serif;letter-spacing:3px;text-transform:uppercase}
.hub-narrative{background:rgba(167,139,250,0.06);border:1px solid rgba(167,139,250,0.15);border-radius:12px;padding:22px;margin-bottom:26px;font-size:16.5px;line-height:1.85;color:rgba(255,255,255,0.93);white-space:pre-line}
.hub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.hub-card{background:rgba(255,255,255,0.03);border:2px solid rgba(255,255,255,0.12);border-radius:14px;padding:24px 16px;text-align:center;cursor:pointer;transition:all 0.3s ease}
.hub-card:hover{transform:translateY(-4px);border-color:rgba(167,139,250,0.5);background:rgba(167,139,250,0.08)}
.hub-card.completed{border-color:rgba(74,222,128,0.4)}.hub-card.in-progress{border-color:rgba(251,191,36,0.4)}
.hub-card-icon{font-size:44px;margin-bottom:10px}.hub-card-name{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:white;margin-bottom:4px}
.hub-card-virtue{font-size:13px;color:rgba(255,255,255,0.45);margin-bottom:10px}.hub-card-status{font-size:13px;font-weight:600}
.hub-card-deaths{font-size:12px;color:#f87171;margin-top:4px}
.return-btn{display:block;margin:0 auto;padding:14px 32px;border-radius:12px;font-family:'Cinzel',serif;font-size:16px;font-weight:700;cursor:pointer;border:2px solid rgba(167,139,250,0.4);background:linear-gradient(135deg,rgba(167,139,250,0.15),rgba(109,40,217,0.2));color:white}
.return-btn:hover{transform:scale(1.03);border-color:rgba(167,139,250,0.7)}
/* MATCHING */
.match-container{display:flex;gap:20px;margin:16px 0}.match-column{flex:1}
.match-col-title{font-family:'Cinzel',serif;font-size:13px;color:rgba(255,255,255,0.65);text-align:center;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase}
.match-item{padding:12px 14px;margin-bottom:6px;border-radius:10px;font-size:14.5px;line-height:1.4;cursor:pointer;transition:all 0.2s;user-select:none}
.match-event{background:rgba(167,139,250,0.08);border:2px solid rgba(167,139,250,0.2);color:rgba(255,255,255,0.95)}
.match-event:hover{border-color:rgba(167,139,250,0.5)}
.match-event.selected{border-color:#a78bfa;background:rgba(167,139,250,0.2);box-shadow:0 0 12px rgba(167,139,250,0.3)}
.match-event.matched{border-color:rgba(74,222,128,0.4);background:rgba(74,222,128,0.08);opacity:0.7;cursor:default}
.match-consequence{background:rgba(251,191,36,0.06);border:2px solid rgba(251,191,36,0.15);color:rgba(255,255,255,0.95)}
.match-consequence:hover{border-color:rgba(251,191,36,0.5)}
.match-consequence.selected{border-color:#fbbf24;background:rgba(251,191,36,0.15);box-shadow:0 0 12px rgba(251,191,36,0.3)}
.match-consequence.matched{border-color:rgba(74,222,128,0.4);background:rgba(74,222,128,0.08);opacity:0.7;cursor:default}
.match-consequence.wrong{border-color:rgba(239,68,68,0.5);background:rgba(239,68,68,0.1);animation:shake 0.4s}
.timer-bar{height:6px;border-radius:3px;background:rgba(255,255,255,0.1);margin-bottom:16px;overflow:hidden}
.timer-fill{height:100%;border-radius:3px;transition:width 1s linear}
.timer-text{text-align:right;font-size:12px;margin-bottom:4px;font-weight:600}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* MAZE */
.maze-wrap{overflow-x:auto;text-align:center;padding:4px 0;-webkit-overflow-scrolling:touch}
.maze-grid{display:inline-grid;gap:0;border:2px solid rgba(167,139,250,0.5);border-radius:3px}
.mc{display:flex;align-items:center;justify-content:center;transition:background 0.12s}
.mc.w{background:#0a0815}
.mc.p{background:#6b5ea0}
.mc.pl{background:#a88be8;box-shadow:inset 0 0 8px rgba(220,200,255,0.5)}
.mc.ex{background:#38a862}
.mc.vi{background:#574c85}
.mc.tr-on{background:#c43030;box-shadow:inset 0 0 6px rgba(255,100,100,0.5)}

.mc.tr-off{background:#6b5ea0}
.maze-legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:8px 0;font-size:12px;color:rgba(255,255,255,0.8)}
.maze-status{text-align:center;margin:8px 0;font-size:14px;color:rgba(255,255,255,0.8);min-height:22px}
.trap-timer{text-align:center;font-size:18px;font-weight:700;margin:6px 0;min-height:26px;font-family:'Cinzel',serif}
.dpad{display:flex;flex-direction:column;align-items:center;gap:4px;margin:10px 0}
.dpad-row{display:flex;gap:4px}
.dpad-btn{width:54px;height:48px;font-size:20px;background:rgba(167,139,250,0.15);border:2px solid rgba(167,139,250,0.35);border-radius:10px;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dpad-btn:hover{background:rgba(167,139,250,0.3);border-color:rgba(167,139,250,0.6)}
.dpad-btn:active{transform:scale(0.92)}
.reset-btn{position:fixed;bottom:16px;right:16px;padding:8px 14px;border-radius:8px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171;font-size:12px;cursor:pointer;z-index:100}
.reset-btn:hover{background:rgba(239,68,68,0.3)}
@media(max-width:700px){.hub-grid{grid-template-columns:1fr}.container{padding:16px 12px}.narrative-panel{padding:18px;font-size:16px}.match-container{flex-direction:column;gap:12px}.dpad-btn{width:48px;height:42px}}
/* CHARIOT BLUEPRINT PUZZLE */
.chariot-card{position:relative;min-height:68px;display:flex;align-items:center;padding:8px 12px 8px 76px;border-radius:10px;transition:transform 0.15s}
.chariot-card:hover{transform:scale(1.01)}
.chariot-card .chariot-img{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:60px;height:50px;background-size:contain;background-repeat:no-repeat;background-position:center;opacity:0.9}

.chariot-ornate .chariot-text{font-size:14px;line-height:1.35;color:rgba(255,200,220,0.9);font-style:italic}
.chariot-ornate .chariot-text .glow{color:#ff6b9d;font-weight:900;font-size:20px;text-shadow:0 0 8px rgba(255,107,157,0.6),0 0 16px rgba(255,107,157,0.3);display:inline}

/* VICTORY CELEBRATION */
@keyframes victoryPulse{0%,100%{text-shadow:0 0 10px rgba(255,215,0,0.4),0 0 20px rgba(255,215,0,0.2)}50%{text-shadow:0 0 20px rgba(255,215,0,0.8),0 0 40px rgba(255,215,0,0.4),0 0 60px rgba(255,215,0,0.2)}}
@keyframes victoryGlow{0%,100%{box-shadow:0 0 15px rgba(255,215,0,0.2),inset 0 0 15px rgba(255,215,0,0.05)}50%{box-shadow:0 0 30px rgba(255,215,0,0.4),0 0 60px rgba(255,215,0,0.15),inset 0 0 25px rgba(255,215,0,0.1)}}
@keyframes rewardReveal{0%{opacity:0;transform:scale(0.7) translateY(20px)}60%{transform:scale(1.05) translateY(-5px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes cardShine{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes fadeSlideUp{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-120px) scale(0.3)}}
.victory-title{animation:victoryPulse 2s ease-in-out infinite}
.victory-narrative{animation:fadeSlideUp 1s ease-out 0.3s both}
.reward-card{animation:rewardReveal 0.8s ease-out 1.5s both}
.reward-card-inner{animation:victoryGlow 2.5s ease-in-out infinite}
.reward-shine{background:linear-gradient(90deg,transparent 0%,rgba(255,215,0,0.15) 45%,rgba(255,215,0,0.3) 50%,rgba(255,215,0,0.15) 55%,transparent 100%);background-size:200% 100%;animation:cardShine 3s ease-in-out 2.5s infinite;position:absolute;top:0;left:0;right:0;bottom:0;border-radius:14px;pointer-events:none}
.particle-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden}
.particle{position:absolute;border-radius:50%;animation:floatUp 3s ease-out forwards}
.sparkle-star{position:absolute;font-size:16px;animation:sparkle 1.5s ease-in-out infinite}

const NODES={
'FA-HUB':{id:'FA-HUB',jid:'hub',type:'hub',title:'The Forbidden Archive',text:`Athena steps out of the shadows. Her grey eyes are sharp and serious.\n\n"I have a task for you. One my father Zeus would punish me for offering."\n\nShe kneels and draws three shapes in the dirt: a jar, a sun, and a feather.\n\n"Beneath Mount Olympus, there is a hidden archive. Three chambers, sealed by Zeus himself. Each one holds a story he never wanted you to learn."\n\nShe looks right at you.\n\n"Zeus thinks mortals are better off not knowing. I think he's wrong. I think you're ready."\n\nHer owl lands on your shoulder.\n\n"Which chamber first?"`,choices:[{text:'🏺 The Sealed Vault (Pandora)',next:'FA-A1'},{text:'☀️ The Sky Road (Phaethon)',next:'FA-B1'},{text:'🪶 The Workshop (Icarus)',next:'FA-C1'}]},
'FA-A1':{id:'FA-A1',jid:'pandora',type:'narrative',title:'The Entrance',text:`You walk down stone steps into a long hallway. Torches flicker. The air smells like clay and something sweet.\n\nShelves line both sides, packed with jars. Hundreds. Some cracked and leaking smoke. Others glowing.\n\nAthena: "Zeus hid Pandora's story here because he doesn't want you to understand temptation."\n\nAhead, two jars on stone pedestals.\n\nOne is gold. Glowing. Humming.\n\nThe other is plain clay. Quiet. Boring.\n\nBehind them, darkness.`,choices:[{text:'Open the gold jar',next:'FA-D1'},{text:'Open the clay jar',next:'FA-D2'},{text:'Walk past both jars',next:'FA-A2',ok:true}]},
'FA-D1':{id:'FA-D1',jid:'pandora',type:'death',title:'Curiosity Kills',cd:25,restart:'FA-A1',text:`You lift the gold lid. Golden mist wraps around your head, erasing your memory.\n\nYou can't remember your name. The mist pushes you back outside.\n\nAthena sighs: "The first shiny thing you saw, and you grabbed it. That jar is a test. It's ALWAYS a test."`,lesson:`You grabbed the first shiny thing. Pandora's jar was beautiful on purpose — that's how temptation works.`},
'FA-D2':{id:'FA-D2',jid:'pandora',type:'death',title:'Clever, But Still Wrong',cd:25,restart:'FA-A1',text:`"The plain one must be the real treasure!"\n\nA moth flies into your eye. Shelves shake. Jars crash, spilling misery — jealousy, boredom, stepping on LEGOs, loud chewing.\n\nAthena: "The smart choice wasn't WHICH jar — it was whether to open one at all."`,lesson:`Picking the less obvious temptation is still temptation. The smart move was not grabbing jars at all.`},
'FA-A2':{id:'FA-A2',jid:'pandora',type:'narrative',title:'The Whispering Hall',text:`You walk past both jars. Your hands itch. But you keep going.\n\nAthena: "Good. Pandora would have opened both."\n\nOn the wall, scratched into stone:\n\n"WHAT WAS THE LAST THING LEFT IN PANDORA'S JAR?"`,choices:[{text:'Foreboding',next:'FA-A2B',ok:true},{text:'Hope',next:'FA-D3'},{text:'Nothing',next:'FA-D3'}]},
'FA-D3':{id:'FA-D3',jid:'pandora',type:'death',title:'Know Your Myths',cd:18,restart:'FA-A1',text:`The floor tilts. You slide back to the entrance.\n\nAthena: "When Pandora opened the jar, every evil escaped. But one thing stayed: foreboding. It stayed because if it got out, it would destroy hope."`,lesson:`The last thing in the jar was foreboding — the power to see bad things coming. It stayed trapped so it wouldn't destroy hope.`},
'FA-A2B':{id:'FA-A2B',jid:'pandora',type:'puzzle_match',title:'The Matching Jars',text:`"Correct," Athena whispers.\n\nGlowing jars show Pandora's story — events and results, scrambled.\n\nAthena: "Match each event to what it caused. Hurry."`},
'FA-DM':{id:'FA-DM',jid:'pandora',type:'death',title:'Too Slow',cd:30,restart:'FA-A2B',text:`The jars go dark. The room shakes. The passage seals.\n\nAthena: "The archive doesn't wait forever. You needed to be faster — or make fewer mistakes."`,lesson:`Temperance isn't just about being careful — it's about being focused. Know the myth, stay calm, work quickly.`},
'FA-A3':{id:'FA-A3',jid:'pandora',type:'puzzle',title:'The Cipher Gate',text:`The jars glow. A door opens to heavy stone covered in Greek letters.\n\nAthena: "Decode the word."`,variants:{1:{prompt:'The door shows:\n\nΣ  Ο  Φ  Ι  Α\n\nWrite the English version.',answer:'SOPHIA',hint:'This means "wisdom" in Greek.'},2:{prompt:'The door shows:\n\nΕ  Λ  Π  Ι  Σ\n\nWrite the English version.',answer:'ELPIS',hint:'This means "hope" in Greek.'}},next:'FA-A4'},
'FA-A4':{id:'FA-A4',jid:'pandora',type:'narrative',title:'The Inner Vault',text:`A round room. Ceiling like the night sky.\n\nFancy jar covered in warnings. Beautiful.\n\nThree things:\n\n📜  A scroll on a stand\n🔧  A bronze lever in the wall\n🏺  The jar itself\n\nAthena goes quiet.`,choices:[{text:'📜 Read the scroll first',next:'FA-A5',ok:true},{text:'🔧 Pull the lever',next:'FA-D4'},{text:'🏺 Open the jar',next:'FA-D4B'}]},
'FA-D4':{id:'FA-D4',jid:'pandora',type:'death',title:'Read The Instructions',cd:30,restart:'FA-A4',text:`CLICK. Ceiling opens. Sand pours. Door seals.\n\nAthena: "Scroll with answers. Lever. Jar. You skipped the answers."`,lesson:`You skipped the information. Temperance means learning before acting.`},
'FA-D4B':{id:'FA-D4B',jid:'pandora',type:'death',title:'History Repeats',cd:30,restart:'FA-A4',text:`Empty. Then frozen solid.\n\nAthena: "A scroll to warn you. A lever to bury you. A cursed jar. You picked the interesting one."`,lesson:`Temperance means reaching for answers first.`},
'FA-A5':{id:'FA-A5',jid:'pandora',type:'puzzle_maze',title:'The Labyrinth of Choices',text:`The scroll: "The jar is a trap. The lever destroys the room. Only this scroll opens the way."\n\nThe floor shifts into a labyrinth.\n\nAthena: "Four dangers guard this maze — flames, sirens, monsters, poison. Each has its own rhythm. Watch. Learn each pattern. Then move."`},
'FA-A5B':{id:'FA-A5B',jid:'pandora',type:'narrative',title:'The Final Test',text:`You exit the maze. One last question:\n\n"A locked box in a temple. Warm. Humming. Sign says DO NOT OPEN. You hear something in pain.\n\nFriend 1: 'Open it! Something is trapped!'\nFriend 2: 'Walk away.'\n\nWhat do you do?"`,choices:[{text:'Open it now',next:'FA-D5'},{text:'Walk away completely',next:'FA-D6'},{text:'Look carefully first — find clues before deciding',next:'FA-A6',ok:true}]},
'FA-D5':{id:'FA-D5',jid:'pandora',type:'death',title:'Good Heart, Bad Choice',cd:25,restart:'FA-A5B',text:`Trick. The "pain" was bait. Temple crashes.\n\nAthena: "Your heart was right. Your brain was not."`,lesson:`Good intentions don't stop bad results. Temperance means pausing even when feelings scream at you.`},
'FA-D6':{id:'FA-D6',jid:'pandora',type:'death',title:'Fear Is Not Wisdom',cd:35,restart:'FA-A5B',text:`Someone else examines the box, opens it right. A cure saves a village. By someone else.\n\nAthena: "Temperance is NOT fear. Investigate. Understand. THEN decide."`,lesson:`Temperance does NOT mean "never act." Investigate, understand, THEN decide.`},
'FA-A6':{id:'FA-A6',jid:'pandora',type:'checkpoint',title:'The Tablet of Temperance',text:`You examine the box. Read tiny writing. Gather information. THEN open it safely.\n\nGolden light. A tablet on a glowing altar.\n\nAthena:\n\n"You held back without losing curiosity. Checked before acting.\n\nThis is Σωφροσύνη — Temperance.\n\nNot the absence of action. Not the absence of curiosity. The presence of THOUGHT before both."\n\nOne-third of the Archive is yours.`,choices:[{text:'🏛️ Return to the Archive Hub',next:'FA-HUB'}]},

// ============================
// PHAETHON NODES — THE SKY ROAD
// ============================
'FA-B1':{id:'FA-B1',jid:'phaethon',type:'narrative',title:'The Golden Stables',text:`You step through the second doorway. The heat hits you first — like opening an oven.\n\nThe room is made of gold. Not painted gold. Real gold. The walls, the floor, the ceiling. It's blinding.\n\nIn the corner, a man sits on a bench polishing a bronze bridle. He's massive — broad shoulders, dark skin that seems to glow from inside, like embers under ash.\n\nHe doesn't look up.\n\n"Another one. Athena keeps sending them." His voice is deep and tired. "You're here about my son."\n\nThis is Helios. The Titan who drives the sun across the sky every single day.\n\nBehind him, enormous golden doors lead to what sounds like stomping and snorting. The chariot stables.\n\nHe finally looks at you. His eyes are literally burning — tiny flames where pupils should be.\n\n"Before I tell you anything — why should I? What makes you think you deserve to hear this story?"`,choices:[{text:'"Because I\'m smart enough to handle it."',next:'FA-BD1'},{text:'"Because I want to understand what happened."',next:'FA-B1B',ok:true},{text:'"Because Athena said I\'m ready."',next:'FA-BD2'}]},
'FA-BD1':{id:'FA-BD1',jid:'phaethon',type:'death',title:'Pride Before the Fall',cd:25,restart:'FA-B1',text:`The flames in Helios's eyes flare white-hot. The room gets so bright you can't see.\n\n"Smart enough?" He stands. He's twelve feet tall. "My son said the same thing. Word for word. 'I'm smart enough, Father. I can handle the chariot.'"\n\nThe heat pushes you backward out of the room.\n\n"Come back when you've learned the difference between confidence and arrogance."`,lesson:`Phaethon believed he was smart enough too. Humility starts with admitting what you don't know.`},
'FA-BD2':{id:'FA-BD2',jid:'phaethon',type:'death',title:'Borrowed Authority',cd:25,restart:'FA-B1',text:`Helios's jaw tightens. "Athena said you're ready. So you're here on someone ELSE'S word? Not your own understanding?"\n\nThe golden walls start melting, dripping like honey.\n\n"My son came to me because someone TOLD him he was the son of a god. He never stopped to figure out what that meant for himself. He just repeated what he heard."`,lesson:`Repeating someone else's authority isn't the same as understanding for yourself. Phaethon demanded the chariot because others told him he deserved it.`},
'FA-B1B':{id:'FA-B1B',jid:'phaethon',type:'narrative',title:'Helios Speaks',text:`Helios stares at you for a long moment. Then he nods slowly.\n\n"You want to understand. Not prove something. Not show off. That's... different."\n\nHe sets down the bridle. "Sit."\n\nHe gestures to the bench across from him. You sit. The gold is warm but not burning.\n\n"I'll tell you what happened. All of it. But the archive will test whether you truly listened. It always does."\n\nHe takes a deep breath. The flames in his eyes dim to something softer — almost sad.\n\n"Listen carefully."`,choices:[{text:'Listen to Helios\'s story',next:'FA-B2'}]},

// READING COMP #1
'FA-B2':{id:'FA-B2',jid:'phaethon',type:'puzzle_reading',title:'The Son of the Sun',text:`Phaethon grew up in Ethiopia with his mother, Clymene. She told him his father was Helios, the god who pulled the sun across the sky. But the other kids didn't believe him. A boy named Epaphus laughed in front of everyone. "Prove it," he said. "You're nobody."\n\nPhaethon went home crying. His mother said: "Go east, to the palace where the sun rises. Your father will know you."\n\nSo Phaethon walked east for days. He found a palace made of gold, silver, and jewels. Helios sat on a throne of emeralds. When he saw Phaethon, he knew — this was his son.\n\n"Ask me for anything," Helios said. "I swear on the River Styx — whatever you want, it's yours." He swore this because he was so happy to see his son. An oath on the Styx can never be broken. Not even by a god.\n\nPhaethon didn't hesitate. "Let me drive your sun chariot. Just for one day."\n\nThe color drained from Helios's face. He begged Phaethon to choose something else. "The path is steep. The horses breathe fire. Even Zeus himself could not control them. Please — ask for anything else."\n\nBut Phaethon wouldn't budge.`,
reading_qs:[
{q:'Why did Phaethon go find Helios?',correct:'He was mocked and needed to prove his father was real',wrong:['He wanted to steal the sun chariot','His mother sent him to ask for a gift','Athena sent him on a quest']},
{q:'Why couldn\'t Helios refuse the request?',correct:'He had sworn an unbreakable oath on the River Styx',wrong:['Phaethon threatened him','The other gods forced him','He felt too guilty about being absent']},
{q:'How did Helios react when Phaethon asked for the chariot?',correct:'He begged him to choose something else',wrong:['He was proud and said yes right away','He laughed and called it impossible','He asked Zeus for permission first']}
],reading_death:'FA-BD3',next:'FA-B3'},

'FA-BD3':{id:'FA-BD3',jid:'phaethon',type:'death',title:'You Weren\'t Listening',cd:30,restart:'FA-B2',text:`The door stays locked. The walls hum, then go dark.\n\nHelios's voice from the shadows: "I just told you what happened. Every detail. And you still got it wrong."\n\n"My son didn't listen either. Not to me, not to anyone. That's what got him killed."`,lesson:`The archive tests whether you truly listened — not whether you can guess. Go back and read carefully.`},

// STAR MAP PUZZLE
'FA-B3':{id:'FA-B3',jid:'phaethon',type:'puzzle_spectrum',title:'The Sun\'s Spectrum',text:`The door opens into a round room. Six glass vials sit on a stone shelf, glowing with liquid sunlight. Each one is a different color and temperature.\n\nHelios touches one gently. "This is what sunlight looks like when you break it apart. Each color has a temperature. Each hour of the day has its own color and heat."\n\nHe points to the vials. Some labels have melted away.\n\n"The sun follows a pattern. It rises through the colors, peaks at white, and falls back down. Hotter light is closer to white. Cooler light is closer to red."\n\n"Figure out what Phaethon couldn't."`,
spectrum_death:'FA-BD4',next:'FA-B4'},

'FA-BD4':{id:'FA-BD4',jid:'phaethon',type:'death',title:'Flying Blind',cd:25,restart:'FA-B3',text:`The vials go dark. Wind howls through the room.\n\nHelios: "You couldn't read the spectrum from the ground. Imagine trying to read it while four fire-breathing horses drag you at the speed of light."\n\n"Phaethon saw these same colors. He didn't understand the pattern. That's why the Sahara is a desert now."`,lesson:`Phaethon didn't study the pattern before taking the reins. Humility means learning the pattern before you try to control it.`},

// READING COMP #2
'FA-B4':{id:'FA-B4',jid:'phaethon',type:'puzzle_reading',title:'The Ride',text:`The vials glow green. New golden letters appear on the wall. Helios narrates — his voice cracking.\n\nAt dawn, Helios rubbed magic oil on Phaethon's face to protect him from the heat. He placed the golden crown of sunlight on his son's head. But his hands were shaking.\n\n"Keep to the middle path," he said. "Not too high or you'll burn the heavens. Not too low or you'll set the earth on fire. And don't whip the horses — they run fast enough on their own."\n\nPhaethon grabbed the reins. The four horses — Pyrois, Aeos, Aethon, and Phlegon — burst into the sky. Right away, Phaethon felt the chariot was too light. The horses could tell a weaker hand held the reins. They ran wild.\n\nThe chariot climbed too high. The stars of Scorpius lunged at Phaethon with its stinger. He panicked and dropped the reins. The chariot dove toward Earth. Rivers boiled. Mountains caught fire. The Sahara became a desert.\n\nThe Earth herself cried out to Zeus: "Stop this or everything dies."\n\nZeus had no choice. He threw a thunderbolt. It struck Phaethon and knocked him from the chariot. He fell, burning, into the river Eridanus.\n\nHelios was so heartbroken that he refused to drive the sun the next day. The world sat in darkness until the other gods convinced him to ride again.`,
reading_qs:[
{q:'What was the FIRST thing that went wrong on the ride?',correct:'The horses sensed a weaker driver and ran wild',wrong:['Zeus threw a thunderbolt','Phaethon whipped the horses too hard','The chariot\'s wheels broke']},
{q:'Why did Zeus strike Phaethon with a thunderbolt?',correct:'The Earth begged him to stop the destruction',wrong:['He was jealous of Phaethon','Helios asked him to','Phaethon insulted the gods']},
{q:'What did Helios do after Phaethon died?',correct:'He refused to drive the sun the next day',wrong:['He attacked Zeus in revenge','He destroyed the chariot','He chose a new son to replace Phaethon']}
],reading_death:'FA-BD5',next:'FA-B5'},

'FA-BD5':{id:'FA-BD5',jid:'phaethon',type:'death',title:'Helios\'s Grief',cd:30,restart:'FA-B4',text:`The golden letters fade. Helios turns away from you.\n\n"I shared the worst day of my existence. The moment I lost my son. And you can't even tell me what happened."\n\nThe door stays sealed.\n\n"Read it again. Every word matters. My son's death matters."`,lesson:`When someone trusts you with a painful story, honor it by truly paying attention. Go back and read carefully.`},

// MATH CIPHER
'FA-B5':{id:'FA-B5',jid:'phaethon',type:'puzzle_math',title:'The Chariot Controls',text:`The next room holds the actual chariot. Massive. Gold and bronze, with scorch marks everywhere. The reins hang loose.\n\nHelios touches the dashboard — a panel of dials and numbers.\n\n"These are the controls. Speed, altitude, direction. Each dial has a math problem. Solve them, then use the code key to turn each answer into a letter."\n\nHe looks at the burned reins.\n\n"Decode the message. That's what the controls were trying to tell Phaethon the whole time."`,
math_variants:[
    {word:'STEADY',problems:[{a:8,b:5,op:'×'},{a:6,b:12,op:'×'},{a:7,b:8,op:'×'},{a:6,b:7,op:'×'},{a:8,b:6,op:'×'},{a:5,b:5,op:'×'}]},
    {word:'HUMBLE',problems:[{a:6,b:6,op:'×'},{a:8,b:0,op:'×'},{a:3,b:8,op:'×'},{a:10,b:2,op:'×'},{a:9,b:9,op:'×'},{a:7,b:8,op:'×'}]},
    {word:'LISTEN',problems:[{a:9,b:9,op:'×'},{a:8,b:8,op:'×'},{a:5,b:8,op:'×'},{a:8,b:9,op:'×'},{a:8,b:7,op:'×'},{a:4,b:2,op:'×'}]}
],
math_key:{42:'A',20:'B',9:'C',48:'D',56:'E',28:'F',32:'G',36:'H',64:'I',5:'J',14:'K',81:'L',24:'M',8:'N',3:'O',45:'P',35:'Q',16:'R',40:'S',72:'T',0:'U',7:'V',12:'W',21:'X',25:'Y',54:'Z'},
math_hint:'Solve each multiplication first. Then use the Alphabet Key to turn each answer into a letter.',
math_death:'FA-BD6',next:'FA-B5B'},

'FA-BD6':{id:'FA-BD6',jid:'phaethon',type:'death',title:'The Controls Are Not Optional',cd:25,restart:'FA-B5',text:`The dials spin out of control. The chariot lurches forward.\n\nHelios grabs you and pulls you back.\n\n"The math IS the message. Every number means something. If you can't decode six dials, what chance do you have with the actual sky?"`,lesson:`The chariot controls tried to tell Phaethon something important. He couldn't read them because he never learned. Take your time with the math.`},

// FINAL MORAL CHOICE
'FA-B5B':{id:'FA-B5B',jid:'phaethon',type:'narrative',title:'The Final Question',text:`The chariot controls light up green. The word STEADY glows across the dashboard.\n\nHelios stares at it. "That's what the controls were saying the whole time. Just... steady. Stay steady. Don't rush."\n\nHe closes his eyes.\n\n"Last question. Answer this wrong and this chamber stays sealed forever."\n\nHe turns to you.\n\n"If you were Phaethon — if your father offered you anything in the world — what would you ask for?"`,choices:[{text:'"I\'d ask to drive the chariot. But I\'d train first."',next:'FA-BD7'},{text:'"I\'d ask him to teach me something only he knows."',next:'FA-B6',ok:true},{text:'"I\'d ask for the chariot AND a backup plan."',next:'FA-BD8'}]},

'FA-BD7':{id:'FA-BD7',jid:'phaethon',type:'death',title:'Still About the Chariot',cd:30,restart:'FA-B5B',text:`Helios shakes his head slowly.\n\n"You'd train first. That's better than what Phaethon did. But you're still asking for the chariot. Still trying to control the sun."\n\n"The lesson isn't 'prepare better.' The lesson is: some things aren't yours to control. No matter how ready you think you are."`,lesson:`"I'd do it, but better" still misses the point. Some things are beyond you — not because you're weak, but because you're mortal. That's not failure. That's wisdom.`},
'FA-BD8':{id:'FA-BD8',jid:'phaethon',type:'death',title:'Power with a Safety Net',cd:30,restart:'FA-B5B',text:`"A backup plan." Helios almost laughs. "You think Zeus's thunderbolt was the backup plan? You think there's a safety net for flying the SUN?"\n\n"You're trying to have power AND avoid the consequences. That's not humility. That's just cleverness disguised as caution."`,lesson:`Wanting power but with a safety net isn't humility — it's still chasing power. Real humility means recognizing what isn't meant for you.`},

// CHECKPOINT
'FA-B6':{id:'FA-B6',jid:'phaethon',type:'checkpoint',title:'The Tablet of Humility',text:`Helios goes very still.\n\n"You'd ask me to teach you something." His voice breaks. "That's all I wanted Phaethon to say. 'Teach me, Father.' Two words. That's all it would have taken."\n\nA golden tablet rises from the chariot's dashboard.\n\nHelios places his hand on it.\n\n"This is Ταπεινοφροσύνη — Humility.\n\nNot thinking less of yourself. Thinking clearly about yourself. Knowing what you can do, what you can't, and having the courage to ask for help with the rest.\n\nMy son wasn't stupid. He wasn't evil. He just couldn't say four words: 'I don't know how.'\n\nThat's what killed him."\n\nTwo-thirds of the Forbidden Archive is yours.`,choices:[{text:'🏛️ Return to the Archive Hub',next:'FA-HUB'}]},

// ============================
// ICARUS — PLACEHOLDER
// ============================
// ============================
// ICARUS & DAEDALUS — PRUDENCE
// ============================
'FA-C1':{id:'FA-C1',jid:'icarus',type:'narrative',title:'The Workshop',text:`You step through the third doorway. It's cold. The room smells like sawdust and candle wax.\n\nEvery surface is covered with half-finished inventions — gears, pulleys, wooden models, sketches on papyrus. Contraptions hang from the ceiling on strings.\n\nA man sits at a workbench with his back to you. He's thin, old, with scarred hands. He's carefully gluing a tiny wooden bird together. His movements are impossibly precise.\n\nHe doesn't turn around.\n\n"Athena's owl has been watching me for weeks. I knew she'd send someone eventually."\n\nThis is Daedalus. The greatest inventor who ever lived. Builder of the Labyrinth. Builder of the wings.\n\nHe holds up the wooden bird. It's perfect — every feather carved individually.\n\n"Before I tell you anything, answer me this: why do you want to hear about my son?"`,choices:[{text:'"Because I want to learn from what happened."',next:'FA-C1B',ok:true},{text:'"I already know the story — I just need the tablet."',next:'FA-CD1'},{text:'"Athena says you could use someone to talk to."',next:'FA-CD2'}]},

'FA-CD1':{id:'FA-CD1',jid:'icarus',type:'death',title:'You Already Know',cd:25,restart:'FA-C1',text:`Daedalus sets down the bird. Very slowly.\n\n"You already know. You already know the story of my son."\n\nHe stands. He's taller than you expected.\n\n"Tell me then — what kind of wax did I use? What temperature does it melt? How many feathers per wing? What was the wind speed that morning?"\n\nYou can't answer any of these.\n\n"You know the ending. You don't know anything."`,lesson:`Knowing how a story ends isn't the same as understanding it. Prudence means knowing the details, not just the outcome.`},

'FA-CD2':{id:'FA-CD2',jid:'icarus',type:'death',title:'Pity',cd:25,restart:'FA-C1',text:`Daedalus's jaw tightens. The wooden bird in his hand snaps.\n\n"She says I need someone to talk to. Like I'm broken. Like this is therapy."\n\nHe sweeps an arm across the workbench. Tools crash to the floor.\n\n"I don't need your pity. I need someone who will LISTEN. Who will learn what my son refused to learn. Not someone doing Athena a favor."`,lesson:`Approaching someone's pain as a favor to someone else isn't respect — it's pity. Daedalus needs a student, not a visitor.`},

'FA-C1B':{id:'FA-C1B',jid:'icarus',type:'narrative',title:'Daedalus Speaks',text:`Daedalus looks at you for a long time. Then he nods once.\n\n"You want to learn. That's more than Icarus ever said."\n\nHe sets the wooden bird on the bench and pulls up a stool for you.\n\n"Sit. Don't touch anything — half the things in here are dangerous."\n\nHe takes a breath. His hands, which were rock-steady a moment ago, tremble slightly.\n\n"I'm going to tell you how we ended up in this place. How I built the most beautiful prison in history. And how I killed my son trying to escape it."\n\nHe looks at the shelves of inventions.\n\n"Listen carefully. The archive will know if you don't."`,choices:[{text:'Listen to Daedalus\'s story',next:'FA-C2'}]},

// READING COMP #1
'FA-C2':{id:'FA-C2',jid:'icarus',type:'puzzle_reading',title:'The Prisoner Inventor',text:`Daedalus was the most brilliant inventor in Athens. He could build anything — mechanical servants, collapsing bridges, puzzle boxes that took years to open. Kings begged for his work.\n\nBut Daedalus had a nephew named Perdix who was also gifted. When twelve-year-old Perdix invented the saw by studying a fish spine, Daedalus felt something he'd never felt before: jealousy. He pushed Perdix off the Acropolis. Athena saved the boy by turning him into a partridge. But Athens banished Daedalus for attempted murder.\n\nHe fled to Crete, where King Minos hired him to build the Labyrinth — an underground maze so complex that no one who entered could ever find their way out. It was built to contain the Minotaur, Minos's monstrous half-bull son.\n\nDaedalus built it perfectly. Too perfectly. When Minos discovered that Daedalus had helped the hero Theseus escape the Labyrinth using a ball of thread, the king was furious. He locked Daedalus and his young son Icarus inside a tower on the coast of Crete.\n\n"I could see the ocean from my window," Daedalus tells you quietly. "Ships sailed past every day. But Minos controlled every port, every dock, every boat. Escape by land was impossible. Escape by sea was impossible."\n\nHe pauses.\n\n"So I looked up."`,
reading_qs:[
{q:'Why was Daedalus banished from Athens?',correct:'He tried to kill his nephew Perdix out of jealousy',wrong:['He built a weapon for Athens\'s enemies','He stole gold from a temple','He refused to work for the king of Athens']},
{q:'What was the Labyrinth built to contain?',correct:'The Minotaur, Minos\'s half-bull son',wrong:['Treasure stolen from the gods','Prisoners of war from Athens','Daedalus\'s most dangerous inventions']},
{q:'Why couldn\'t Daedalus escape Crete by land or sea?',correct:'King Minos controlled every port and dock on the island',wrong:['The tower was surrounded by water on all sides','The Labyrinth blocked every exit from Crete','Poseidon had cursed the waters around the island']}
],reading_death:'FA-CD3',next:'FA-C3'},

'FA-CD3':{id:'FA-CD3',jid:'icarus',type:'death',title:'You Weren\'t Listening',cd:30,restart:'FA-C2',text:`Daedalus stops talking. He picks up a chisel and turns it over in his scarred hands.\n\n"I just told you the most important part. How I ended up here. Why we were trapped. And you can't tell me what happened."\n\n"My son had the same problem. I'd explain something once, carefully, precisely. And he'd nod and smile and not hear a single word."`,lesson:`Daedalus is an engineer — precision matters. If you can't remember how they got trapped, you'll never understand why the escape failed.`},

// CONSERVATION PUZZLE — WAX FORMULA

'FA-CD4':{id:'FA-CD4',jid:'icarus',type:'death',title:'The Wings Won\'t Hold',cd:25,restart:'FA-C3',text:`The bowls tip over. Wax spills across the table.\n\nDaedalus: "If you can't calculate the weight of a wing on a table, imagine trying to calculate it while falling."\n\n"I measured everything twice. Three times. I tested every ratio. Because if I was wrong by even five grams, my son would die."\n\nHe looks at the spilled wax.\n\n"I wasn't wrong about the math. I was wrong about something else."`,lesson:`Prudence means measuring twice. The wings weren't the problem — but if you can't get the formula right on paper, you're not ready for what comes next.`},

// READING COMP #2 — THE FLIGHT
'FA-C4':{id:'FA-C4',jid:'icarus',type:'puzzle_reading',title:'The Flight',text:`Daedalus built two pairs of wings. It took weeks. He collected feathers dropped by seagulls, sorted them by size, and layered them from smallest to largest — just like real wings. He bound them with thread and sealed them with wax.\n\nThe morning of the flight, Daedalus knelt in front of Icarus. His son was excited. Bouncing. Not scared at all.\n\n"Listen to me," Daedalus said. "There are only two rules. Fly too low, and the sea spray will soak the feathers — they'll get heavy and you'll fall. Fly too high, and the sun will melt the wax — the feathers will come apart."\n\nHe grabbed Icarus by the shoulders. "Stay with me. Follow my path. The middle way. Promise me."\n\nIcarus promised.\n\nThey jumped from the tower. At first, everything was perfect. The wings worked beautifully. Fishermen below looked up and thought they were gods.\n\nIcarus started to climb. Just a little at first. The air was warmer up high. The view was incredible — he could see the whole ocean, the islands scattered like stones. He climbed higher. Daedalus shouted but the wind carried his voice away.\n\nThe wax softened. Feathers peeled away one by one. By the time Icarus realized what was happening, it was too late. He beat his bare arms against the air and fell into the sea.\n\nDaedalus circled the water for hours, calling his son's name. He found only feathers floating on the surface.`,
reading_qs:[
{q:'What were the TWO dangers Daedalus warned Icarus about?',correct:'Too low and sea soaks the feathers; too high and sun melts the wax',wrong:['Wind could blow them off course; storms could break the wings','Eagles might attack them; lightning could strike','The thread might snap; the frame could crack']},
{q:'What was the first sign that something was going wrong?',correct:'Icarus started climbing higher because the view was incredible',wrong:['A storm hit them mid-flight over the ocean','The feathers were the wrong size from the start','Daedalus\'s wings broke first and he fell behind']},
{q:'What did Daedalus find when he searched the water?',correct:'Only feathers floating on the surface',wrong:['Icarus swimming and calling for help','The wings still intact floating on the waves','Nothing at all — the sea had swallowed everything']}
],reading_death:'FA-CD5',next:'FA-C5'},

'FA-CD5':{id:'FA-CD5',jid:'icarus',type:'death',title:'The Worst Part',cd:30,restart:'FA-C4',text:`Daedalus turns away from you. His shoulders shake.\n\n"That's the part I can never forget. Every detail. The sound of feathers tearing. The exact shade of blue the water was. The way he looked at me right before — confused. Not scared. Confused. Like he didn't understand what was happening."\n\n"And you can't even tell me what happened."`,lesson:`When someone shares the worst moment of their life with you, you honor it by truly hearing every detail. Go back and read carefully.`},

'FA-CD6':{id:'FA-CD6',jid:'icarus',type:'death',title:'Distracted by Gold',cd:25,restart:'FA-C5',text:`The golden sketches flash brightly, then burst into flame. The room fills with smoke.\n\nDaedalus pulls you back.\n\n"This is EXACTLY what happened. Icarus saw something beautiful and couldn't look away. The golden chariots are decoration — noise — distraction."\n\n"The real message was in the plain ones. The ones nobody looks at twice. That's where I always hid the important things."`,lesson:`Daedalus hid his real messages in plain designs, not golden ones. Icarus was always drawn to the flashiest thing in the room. Prudence means looking past what's shiny to find what matters.`},

// FINAL MORAL CHOICE
'FA-C5B':{id:'FA-C5B',jid:'icarus',type:'narrative',title:'The Final Question',text:`The plain sketches glow softly. The hidden word shimmers in the air between them.\n\nDaedalus stares at it for a long time.\n\n"You found it. You ignored the golden ones and read what actually mattered."\n\nHe sits down heavily on a stool. When he speaks again, his voice is barely a whisper.\n\n"One last question. I've asked myself this every single day since the flight."\n\nHe looks at you with red-rimmed eyes.\n\n"If you were Icarus — standing on that tower, wearing those wings, about to jump — what would you do differently?"`,choices:[{text:'"I\'d fly, but I\'d stay low where it\'s safe."',next:'FA-CD7'},{text:'"I\'d refuse to fly at all. It\'s too dangerous."',next:'FA-CD8'},{text:'"I\'d ask you to explain everything about the wings before we jumped."',next:'FA-C6',ok:true}]},

'FA-CD7':{id:'FA-CD7',jid:'icarus',type:'death',title:'Low Is Not Safe',cd:30,restart:'FA-C5B',text:`Daedalus shakes his head.\n\n"Stay low. That's what everyone says. But I told Icarus — too LOW and the sea spray soaks the feathers. You fall anyway."\n\n"You're picking the opposite extreme and calling it wisdom. It's not. The problem isn't high or low. The problem is Icarus didn't UNDERSTAND the wings. He didn't ask how they worked. He just jumped."`,lesson:`Choosing the opposite extreme isn't prudence — it's just a different kind of recklessness. Prudence means understanding WHY something is dangerous, not just avoiding it.`},

'FA-CD8':{id:'FA-CD8',jid:'icarus',type:'death',title:'Refusing To Act',cd:30,restart:'FA-C5B',text:`"You'd refuse to fly." Daedalus's voice goes flat.\n\n"So you'd stay in the tower. A prisoner forever. Minos would work you until you died building his weapons."\n\n"The wings WORKED. I flew all the way to Sicily. The design was perfect. The problem wasn't flying — the problem was flying without understanding."\n\n"Refusing to act isn't wisdom. It's fear with a better name."`,lesson:`The wings worked perfectly — Daedalus made it to Sicily safely. Refusing to fly isn't prudence — it's cowardice. Prudence means preparing properly, not refusing to act.`},

// CHECKPOINT
'FA-C6':{id:'FA-C6',jid:'icarus',type:'checkpoint',title:'The Tablet of Prudence',text:`Daedalus goes very still. His scarred hands grip the edge of the workbench.\n\n"You'd ask me to explain everything. Before you jumped."\n\nHis voice cracks.\n\n"That's all I needed him to say. 'Show me how they work, Father. Explain it again. I want to understand.' Five minutes. That's all it would have taken. Five minutes of questions and he'd be alive."\n\nA silver tablet rises from the workbench, glowing softly.\n\nDaedalus places his hand on it.\n\n"This is Φρόνησις — Prudence.\n\nNot refusing to act. Not being afraid. UNDERSTANDING before you act.\n\nMy son wasn't stupid. He wasn't reckless by nature. He was excited. The wings were incredible. Flying was incredible. And in that incredible moment, he forgot everything I told him.\n\nPrudence isn't the opposite of courage. It's what makes courage survive."\n\nThe Forbidden Archive is complete.`,choices:[{text:'🏛️ Return to the Archive Hub',next:'FA-HUB'}]}
};

// READING COMPREHENSION — SCRAMBLED per playthrough
// ============================
let rcAttempts=0,rcScramble=null;
function scrambleRC(qs){
    const letters=['A','B','C','D'];
    return qs.map(q=>{
        const all=[{text:q.correct,isCorrect:true},...q.wrong.map(w=>({text:w,isCorrect:false}))];
        // Fisher-Yates shuffle
        for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
        const correctLetter=letters[all.findIndex(a=>a.isCorrect)];
        return{q:q.q,opts:all.map((a,i)=>({letter:letters[i],text:a.text,isCorrect:a.isCorrect})),correctLetter};
    });
}
function renderReading(jid,n){
    rcAttempts=0;
    rcScramble=scrambleRC(n.reading_qs);
    const code=rcScramble.map(q=>q.correctLetter).join('');
    const qs=rcScramble.map((q,i)=>{
        const opts=q.opts.map(o=>`<label style="display:block;padding:8px 12px;margin:4px 0;border-radius:8px;cursor:pointer;border:2px solid rgba(167,139,232,0.15);transition:all 0.2s"><input type="radio" name="rq${i}" value="${o.letter}" style="margin-right:8px">${o.letter}) ${o.text}</label>`).join('');
        return`<div style="margin-bottom:18px"><div style="font-weight:600;color:#fcd34d;margin-bottom:8px;font-size:15px">Question ${i+1}: ${q.q}</div>${opts}</div>`;
    }).join('');
    app.innerHTML=`<div class="header"><div class="header-title">🔒 ${n.title}</div><div class="header-stats"><span class="stat-badge stat-deaths">💀 ${td()}</span></div></div><div class="narrative-panel" style="max-height:40vh">${n.text}</div><div class="puzzle-panel"><div class="puzzle-prompt">The door has a 3-letter lock. Answer each question — your answers form the code.</div>${qs}<div class="puzzle-input-row"><input type="text" class="puzzle-input" id="rc-code" placeholder="Enter 3-letter code..." maxlength="3" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:20px;font-family:'Cinzel',serif" onkeypress="if(event.key==='Enter')submitRC('${jid}','${n.id}')"><button class="puzzle-submit" onclick="submitRC('${jid}','${n.id}')">🔓 Unlock</button></div><div class="puzzle-feedback" id="rcf"></div><div style="margin-top:8px;font-size:12px;color:rgba(255,255,255,0.65);text-align:center">Select your answers, then type the 3-letter code</div></div>`;
    document.querySelectorAll('input[type=radio]').forEach(r=>{r.addEventListener('change',()=>{
        let c='';for(let i=0;i<rcScramble.length;i++){const sel=document.querySelector(`input[name="rq${i}"]:checked`);c+=sel?sel.value:'_'}
        document.getElementById('rc-code').value=c;
    })});
}
function submitRC(jid,nid){
    const n=NODES[nid];const input=document.getElementById('rc-code').value.trim().toUpperCase();
    const code=rcScramble.map(q=>q.correctLetter).join('');
    if(input.length!==3){document.getElementById('rcf').innerHTML='<span style="color:#fb923c">Enter a 3-letter code.</span>';return}
    if(input===code){
        document.getElementById('rcf').innerHTML='<span style="color:#4ade80;font-weight:700">🔓 The lock clicks open!</span>';
        setTimeout(()=>{S.j[jid].cn=n.next;saveS(S);render()},1500);
    }else{
        rcAttempts++;
        if(rcAttempts>=3){S.j[jid].d++;S.j[jid].cn=n.id;S.cd={did:n.reading_death,until:new Date(Date.now()+30000).toISOString(),jid};saveS(S);render()}
        else document.getElementById('rcf').innerHTML=`<span style="color:#f87171">🔒 Wrong code. Re-read the passage carefully. (${3-rcAttempts} attempt${3-rcAttempts!==1?'s':''} left)</span>`;
    }
}

        }
    }).join('');
    app.innerHTML=`<div class="header"><div class="header-title">📜 ${n.title}</div><div class="header-stats"><span class="stat-badge stat-deaths">💀 ${td()}</span><span class="stat-badge stat-hints">💡 ${j.h}</span></div></div><div class="puzzle-panel"><div style="font-size:14px;line-height:1.5;color:rgba(255,255,255,0.85);margin-bottom:10px;white-space:pre-line">${n.text}</div><div style="font-size:14px;margin-bottom:8px;color:#fbbf24;font-weight:600">Each chariot has a glowing letter. Only the <strong>plain</strong> ones matter — ignore the flashy ones. Collect the right letters to spell the hidden word.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${cardsHtml}</div><div class="puzzle-input-row" style="margin-top:10px"><input type="text" class="puzzle-input" id="bp-word" placeholder="Type the hidden word..." style="text-transform:uppercase;letter-spacing:3px;text-align:center;font-size:18px;font-family:'Cinzel',serif" onkeypress="if(event.key==='Enter')submitBP('${jid}','${n.id}')"><button class="puzzle-submit" onclick="submitBP('${jid}','${n.id}')">🔓 Decode</button></div><div class="puzzle-feedback" id="bpf"></div></div>${j.h>0?`<button class="hint-btn" onclick="bpHint('${jid}','${n.id}')">💡 Hint (${j.h} left)</button>`:''}<div id="bphd"></div>`;
}
function submitBP(jid,nid){
    const n=NODES[nid];let input=document.getElementById('bp-word').value.trim().toUpperCase();
    if(!input){document.getElementById('bpf').innerHTML='<span style="color:#fb923c">Type the hidden word.</span>';return}
    input=input.replace(/1/g,'I').replace(/0/g,'O');
    if(input===bpVariant.word){
        document.getElementById('bpf').innerHTML=`<span style="color:#4ade80;font-weight:700">🔓 "${bpVariant.word}" — The blueprints rearrange into a door!</span>`;
        setTimeout(()=>{S.j[jid].cn=n.next;saveS(S);render()},1500);
    }else{
        bpAttempts++;
        if(bpAttempts>=3){S.j[jid].d++;S.j[jid].cn=nid;S.cd={did:n.blueprint_death,until:new Date(Date.now()+25000).toISOString(),jid};saveS(S);render()}
        else{
            let hint='';
            // Check if they read the ornate letters instead
            const ornateWord=bpVariant.ornate.map(o=>o.letter).join('');
            if(input.length<=4||ornateWord.includes(input.charAt(0)))hint=' Are you sure you\'re reading the RIGHT sketches?';
            document.getElementById('bpf').innerHTML=`<span style="color:#f87171">That's not the message.${hint} (${3-bpAttempts} tries left)</span>`;
        }
    }
}
function bpHint(jid,nid){
    const j=S.j[jid];if(j.h<=0)return;j.h--;saveS(S);
    document.getElementById('bphd').innerHTML=`<div class="hint-display"><div style="font-size:12px;color:#93c5fd;font-weight:600;margin-bottom:4px">💡 HINT</div><div>${NODES[nid].blueprint_hint}</div></div>`;
    const b=document.querySelector('.hint-btn');if(b){if(j.h>0)b.textContent='💡 Hint ('+j.h+' left)';else b.remove()}
}

// FORMULA / CONSERVATION PUZZLE (Icarus — Wax Formula)
let fmAttempts=0;
function renderFormula(jid,n){
    fmAttempts=0;const j=S.j[jid];
    const rows=n.formula_rows;
    const rowsHtml=rows.map((r,i)=>{
        const aCell=r.showA?`<span style="color:#fbbf24;font-weight:700">${r.aVal}g</span>`:`<input type="number" id="fm${i}a" style="width:50px;padding:4px;text-align:center;font-size:16px;font-weight:700;background:rgba(0,0,0,0.5);border:2px solid rgba(251,191,36,0.3);border-radius:6px;color:#fbbf24;font-family:'Cinzel',serif" placeholder="?">`;
        const bCell=r.showB?`<span style="color:#93c5fd;font-weight:700">${r.bVal}g</span>`:`<input type="number" id="fm${i}b" style="width:50px;padding:4px;text-align:center;font-size:16px;font-weight:700;background:rgba(0,0,0,0.5);border:2px solid rgba(147,197,253,0.3);border-radius:6px;color:#93c5fd;font-family:'Cinzel',serif" placeholder="?">`;
        const tCell=r.showT?`<span style="color:#4ade80;font-weight:700">${r.total}g</span>`:`<input type="number" id="fm${i}t" style="width:50px;padding:4px;text-align:center;font-size:16px;font-weight:700;background:rgba(0,0,0,0.5);border:2px solid rgba(74,222,128,0.3);border-radius:6px;color:#4ade80;font-family:'Cinzel',serif" placeholder="?">`;
        const bg=i===0?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.2)';
        return`<div style="background:${bg};border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center"><div style="font-size:11px;color:rgba(255,255,255,0.5);width:100%;text-align:center;margin-bottom:2px">${r.label}${i===0?' (example)':''}</div><div style="font-size:14px;color:rgba(255,255,255,0.7)">${r.a}:</div>${aCell}<div style="font-size:18px;color:rgba(255,255,255,0.4);margin:0 2px">+</div><div style="font-size:14px;color:rgba(255,255,255,0.7)">${r.b}:</div>${bCell}<div style="font-size:18px;color:rgba(255,255,255,0.4);margin:0 2px">=</div>${tCell}</div>`;
    }).join('');
    app.innerHTML=`<div class="header"><div class="header-title">⚗️ ${n.title}</div><div class="header-stats"><span class="stat-badge stat-deaths">💀 ${td()}</span><span class="stat-badge stat-hints">💡 ${j.h}</span></div></div><div class="narrative-panel" style="max-height:18vh">${n.text}</div><div class="puzzle-panel"><div class="puzzle-prompt">Fill in the missing values. Each material always weighs the same amount.</div><div style="display:flex;flex-direction:column;gap:8px;margin:10px 0">${rowsHtml}</div><div style="text-align:center;margin-top:10px"><button class="puzzle-submit" onclick="checkFormula('${jid}','${n.id}')">⚖️ Check Formula</button></div><div class="puzzle-feedback" id="fmf"></div></div>${j.h>0?`<button class="hint-btn" onclick="fmHint('${jid}','${n.id}')">💡 Hint (${j.h} left)</button>`:'<div style="text-align:center;color:rgba(255,255,255,0.65);font-size:13px">No hints</div>'}<div id="fmhd"></div>`;
}
function checkFormula(jid,nid){
    const n=NODES[nid];const rows=n.formula_rows;
    let allCorrect=true;let feedback='';
    rows.forEach((r,i)=>{
        if(!r.showA){const v=parseInt(document.getElementById('fm'+i+'a')?.value);if(v!==r.aVal){allCorrect=false;feedback=`Row ${i+1}: Check your ${r.a} value.`}}
        if(!r.showB){const v=parseInt(document.getElementById('fm'+i+'b')?.value);if(v!==r.bVal){allCorrect=false;feedback=`Row ${i+1}: Check your ${r.b} value.`}}
        if(!r.showT){const v=parseInt(document.getElementById('fm'+i+'t')?.value);if(v!==r.total){allCorrect=false;feedback=`Row ${i+1}: Check the total.`}}
    });
    if(allCorrect){
        document.getElementById('fmf').innerHTML='<span style="color:#4ade80;font-weight:700">⚖️ Perfect! Every measurement is correct.</span>';
        setTimeout(()=>{S.j[jid].cn=n.next;saveS(S);render()},1500);
    }else{
        fmAttempts++;
        if(fmAttempts>=3){S.j[jid].d++;S.j[jid].cn=nid;S.cd={did:n.formula_death,until:new Date(Date.now()+25000).toISOString(),jid};saveS(S);render()}
        else document.getElementById('fmf').innerHTML=`<span style="color:#f87171">${feedback||'Some values are wrong.'} The parts must add up to the whole. (${3-fmAttempts} tries left)</span>`;
    }
}
function fmHint(jid,nid){
    const j=S.j[jid];if(j.h<=0)return;j.h--;saveS(S);
    document.getElementById('fmhd').innerHTML=`<div class="hint-display"><div style="font-size:12px;color:#93c5fd;font-weight:600;margin-bottom:4px">💡 HINT</div><div>${NODES[nid].formula_hint}</div></div>`;
    const b=document.querySelector('.hint-btn');if(b){if(j.h>0)b.textContent='💡 Hint ('+j.h+' left)';else b.remove()}
}

// MATCHING (Pandora — unchanged)
// ============================
let mSel=null,mDone={},mMist=0,mTmr=null,mTm=MT_S,matchJid=null;
function shNA(p){const e=[...p].sort(()=>Math.random()-0.5);let c,a=0;do{c=[...p].sort(()=>Math.random()-0.5);a++}while(c.some((x,i)=>x.id===e[i].id)&&a<200);return{e,c}}
function renderMatch(jid,n){mSel=null;mDone={};mMist=0;mTm=MT_S;matchJid=jid;if(mTmr)clearInterval(mTmr);const{e,c}=shNA(MPAIRS);app.innerHTML=`<div class="header"><div class="header-title">🏺 ${n.title}</div><div class="header-stats"><span class="stat-badge stat-deaths">💀 ${td()}</span></div></div><div class="narrative-panel" style="max-height:16vh">${n.text}</div><div class="puzzle-panel"><div class="puzzle-prompt">Match each event to its result. ${MT_S}s! Wrong = -${MT_P}s.</div><div class="timer-text" id="tt" style="color:#fbbf24">⏱️ ${mTm}s</div><div class="timer-bar"><div class="timer-fill" id="tf" style="width:100%;background:#fbbf24"></div></div><div class="match-container"><div class="match-column"><div class="match-col-title">Events</div>${e.map(p=>`<div class="match-item match-event" id="ev-${p.id}" onclick="mCl('event','${p.id}')">${p.event}</div>`).join('')}</div><div class="match-column"><div class="match-col-title">Results</div>${c.map(p=>`<div class="match-item match-consequence" id="co-${p.id}" onclick="mCl('consequence','${p.id}')">${p.consequence}</div>`).join('')}</div></div><div class="puzzle-feedback" id="mf"></div><div style="text-align:center;margin-top:8px;font-size:13px;color:rgba(255,255,255,0.6)" id="mp">0/${MPAIRS.length}</div></div>`;mTmr=setInterval(()=>{mTm--;const f=document.getElementById('tf'),t=document.getElementById('tt');if(!f){clearInterval(mTmr);return}f.style.width=(mTm/MT_S)*100+'%';if(mTm<=10){f.style.background='#f87171';t.style.color='#f87171'}else if(mTm<=20){f.style.background='#fb923c';t.style.color='#fb923c'}t.textContent=`⏱️ ${mTm}s`;if(mTm<=0){clearInterval(mTmr);matchFail()}},1000)}
function matchFail(){S.j[matchJid].d++;S.j[matchJid].cn='FA-A2B';S.cd={did:'FA-DM',until:new Date(Date.now()+30000).toISOString(),jid:matchJid};saveS(S);render()}
function mCl(type,id){if(mDone[id])return;document.querySelectorAll('.wrong').forEach(el=>el.classList.remove('wrong'));if(!mSel){mSel={type,id};document.getElementById(type==='event'?`ev-${id}`:`co-${id}`).classList.add('selected')}else if(mSel.type===type){document.getElementById(mSel.type==='event'?`ev-${mSel.id}`:`co-${mSel.id}`).classList.remove('selected');mSel={type,id};document.getElementById(type==='event'?`ev-${id}`:`co-${id}`).classList.add('selected')}else{const eI=type==='event'?id:mSel.id,cI=type==='consequence'?id:mSel.id;if(eI===cI){mDone[eI]=true;document.getElementById(`ev-${eI}`).className='match-item match-event matched';document.getElementById(`co-${cI}`).className='match-item match-consequence matched';const cnt=Object.keys(mDone).length;document.getElementById('mp').textContent=`${cnt}/${MPAIRS.length}`;document.getElementById('mf').innerHTML='<span style="color:#4ade80">✅ Correct!</span>';if(cnt===MPAIRS.length){clearInterval(mTmr);const b=mTm>=30?'⚡ Speed bonus!':mTm>=15?'Good timing.':'Just in time!';document.getElementById('mf').innerHTML=`<span style="color:#4ade80;font-weight:700">🏆 All matched! ${b}</span>`;setTimeout(()=>{S.j[matchJid].cn='FA-A3';saveS(S);render()},1800)}}else{mMist++;document.getElementById(`co-${cI}`).classList.add('wrong');mTm=Math.max(0,mTm-MT_P);document.getElementById('mf').innerHTML=`<span style="color:#f87171">✗ Wrong! -${MT_P}s (${mMist} mistake${mMist!==1?'s':''})</span>`;if(mTm<=0){clearInterval(mTmr);matchFail()}}mSel=null;document.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'))}}

// ============================
// MAZE (Pandora — unchanged)
// ============================
let mp={r:1,c:1},mv=new Set(),mFrz=false,mazeLoopId=null,mazeStart=0;
function isTrapActive(t,e){const c=TRAP_CYCLES[t];if(!c)return false;const o=TRAP_OFFSETS[t]||0;return(e+o)%(c.on+c.off)<c.on}
function renderMaze(jid,n){mp={r:1,c:1};mv=new Set(['1,1']);mFrz=false;if(mazeLoopId)cancelAnimationFrame(mazeLoopId);mazeStart=performance.now();app.innerHTML=`<div class="header"><div class="header-title">🏛️ ${n.title}</div><div class="header-stats"><span class="stat-badge stat-deaths">💀 ${td()}</span></div></div><div class="narrative-panel" style="max-height:14vh">${n.text}</div><div class="puzzle-panel" style="text-align:center;padding:14px"><div class="puzzle-prompt" style="margin-bottom:4px">Find 🚪. Each danger has its own rhythm!</div><div class="maze-legend"><span>🧑 You</span><span>🚪 Exit</span><span>🔥 Flames</span><span>🎵 Sirens</span><span>👹 Monsters</span><span>💀 Poison</span></div><div class="maze-wrap" id="mz-c"></div><div class="dpad"><div class="dpad-row"><button class="dpad-btn" onclick="mMv(-1,0)">▲</button></div><div class="dpad-row"><button class="dpad-btn" onclick="mMv(0,-1)">◀</button><button class="dpad-btn" onclick="mMv(1,0)">▼</button><button class="dpad-btn" onclick="mMv(0,1)">▶</button></div></div><div class="maze-status" id="mst">Watch the patterns, then move!</div></div>`;document.addEventListener('keydown',mKey);mazeLoop()}
function mazeLoop(){const e=performance.now()-mazeStart;drawMaze(e);const pv=MAZE[mp.r][mp.c];if(pv>=7&&pv<=10&&!mFrz&&isTrapActive(pv,e)){mFrz=true;const c=TRAP_CYCLES[pv];document.getElementById('mst').innerHTML=`<span style="color:#f87171">${c.icon} ${c.name} caught you! Back to start.</span>`;setTimeout(()=>{mp={r:1,c:1};mv=new Set(['1,1']);mFrz=false;document.getElementById('mst').innerHTML='<span style="color:rgba(255,255,255,0.65)">Watch the patterns!</span>'},1500)}mazeLoopId=requestAnimationFrame(mazeLoop)}
function drawMaze(e){const c=document.getElementById('mz-c');if(!c)return;const H=MAZE.length,W=MAZE[0].length;let h=`<div class="maze-grid" style="grid-template-columns:repeat(${W},${CS}px)">`;for(let r=0;r<H;r++){for(let co=0;co<W;co++){const v=MAZE[r][co];const isP=r===mp.r&&co===mp.c;const isV=mv.has(`${r},${co}`);let cls='mc w',icon='',bg='';const sz=`width:${CS}px;height:${CS}px;font-size:${CS<24?10:12}px;`;if(v===0)cls='mc w';else if(isP){cls='mc p pl';icon='🧑'}else if(v===3){cls='mc p ex';icon='🚪'}else if(v>=7&&v<=10){const cy=TRAP_CYCLES[v];if(isTrapActive(v,e)){cls='mc tr-on';icon=cy.icon;bg='background:'+cy.onColor+';'}else{cls='mc p';icon=''}}else if(isV)cls='mc p vi';else cls='mc p';h+=`<div class="${cls}" style="${sz}${bg}">${icon}</div>`}}h+='</div>';c.innerHTML=h}
function mKey(e){if(e.key==='ArrowUp'){e.preventDefault();mMv(-1,0)}else if(e.key==='ArrowDown'){e.preventDefault();mMv(1,0)}else if(e.key==='ArrowLeft'){e.preventDefault();mMv(0,-1)}else if(e.key==='ArrowRight'){e.preventDefault();mMv(0,1)}}
function mMv(dr,dc){if(mFrz)return;const nr=mp.r+dr,nc=mp.c+dc;if(nr<0||nr>=MAZE.length||nc<0||nc>=MAZE[0].length)return;const v=MAZE[nr][nc];if(v===0)return;const e=performance.now()-mazeStart;if(v>=7&&v<=10&&isTrapActive(v,e)){mFrz=true;const c=TRAP_CYCLES[v];document.getElementById('mst').innerHTML=`<span style="color:#f87171">${c.icon} Walked into ${c.name.toLowerCase()}! Back to start.</span>`;setTimeout(()=>{mp={r:1,c:1};mv=new Set(['1,1']);mFrz=false;document.getElementById('mst').innerHTML='<span style="color:rgba(255,255,255,0.65)">Watch the patterns!</span>'},1500);return}mp={r:nr,c:nc};mv.add(`${nr},${nc}`);if(v===3){cleanupMaze();document.getElementById('mst').innerHTML='<span style="color:#4ade80;font-weight:700">✅ You made it!</span>';const jid=Object.entries(S.j).find(([k,v])=>v.cn&&!v.done);if(jid)setTimeout(()=>{S.j[jid[0]].cn='FA-A5B';saveS(S);render()},1500);return}document.getElementById('mst').textContent=''}
function cleanupMaze(){document.removeEventListener('keydown',mKey);if(mazeLoopId)cancelAnimationFrame(mazeLoopId)}

// ============================
// CIPHER (Pandora — unchanged)
// ============================
function renderCipher(jid,n){const j=S.j[jid];const v=n.variants[S.pv];app.innerHTML=`<div class="header"><div class="header-title">🔐 ${n.title}</div><div class="header-stats"><span class="stat-badge stat-deaths">💀 ${td()}</span><span class="stat-badge stat-hints">💡 ${j.h}</span></div></div><div class="narrative-panel" style="max-height:20vh">${n.text}</div><div class="puzzle-panel"><div class="puzzle-prompt">${v.prompt}</div><div class="puzzle-input-row"><input type="text" class="puzzle-input" id="pi" placeholder="Type answer..." onkeypress="if(event.key==='Enter')solveC('${jid}','${n.id}')"><button class="puzzle-submit" onclick="solveC('${jid}','${n.id}')">Submit</button></div><div class="puzzle-feedback" id="pf"></div></div>${j.h>0?`<button class="hint-btn" onclick="useH('${jid}','${n.id}')">💡 Hint (${j.h} left)</button>`:'<div style="text-align:center;color:rgba(255,255,255,0.65);font-size:13px">No hints</div>'}<div id="hd"></div>`;setTimeout(()=>document.getElementById('pi')?.focus(),100)}
function solveC(jid,nid){const i=document.getElementById('pi');const a=i.value.trim().toUpperCase();if(!a)return;if(a===NODES[nid].variants[S.pv].answer){document.getElementById('pf').innerHTML='<span style="color:#4ade80;font-weight:700">✅ Correct!</span>';setTimeout(()=>{S.j[jid].cn=NODES[nid].next;saveS(S);render()},1200)}else{document.getElementById('pf').innerHTML='<span style="color:#f87171">Not right.</span>';i.value='';i.focus()}}
function useH(jid,nid){const j=S.j[jid];if(j.h<=0)return;j.h--;saveS(S);document.getElementById('hd').innerHTML=`<div class="hint-display"><div style="font-size:12px;color:#93c5fd;font-weight:600;margin-bottom:4px">💡 HINT</div><div>${NODES[nid].variants[S.pv].hint}</div></div>`;const b=document.querySelector('.hint-btn');if(b){if(j.h>0)b.textContent=`💡 Hint (${j.h} left)`;else b.remove()}}

// ============================
// DEATH + ACTIONS
// ============================
function renderDeath(cd){const n=NODES[cd.did];const end=new Date(cd.until).getTime();app.innerHTML=`<div class="death-overlay"><div class="death-skull">💀</div><div class="death-title">${n?.title||'Fallen'}</div><div class="death-narrative">${n?.text||''}</div><div class="death-lesson"><div class="death-lesson-label">📜 LESSON</div><div class="death-lesson-text">${n?.lesson||''}</div></div><div class="death-timer" id="dtm">Retry in...</div><button class="retry-btn" id="dbtn" onclick="retryD()">⏳ Wait...</button></div>`;const tick=setInterval(()=>{const rem=Math.max(0,Math.ceil((end-Date.now())/1000));const el=document.getElementById('dtm'),b=document.getElementById('dbtn');if(!el){clearInterval(tick);return}if(rem<=0){clearInterval(tick);el.textContent='Ready!';el.style.color='#4ade80';b.classList.add('ready');b.textContent='🔄 Try Again'}else el.textContent=`Retry in ${rem}s...`},250)}
function doChoice(jid,nid,ci){const n=NODES[nid];const ch=n.choices[ci];const nx=ch.next;if(nx==='FA-HUB'){goHub();return}const next=NODES[nx];if(!next)return;if(next.type==='death'){S.j[jid].d++;S.j[jid].cn=next.restart||nid;S.cd={did:nx,until:new Date(Date.now()+(next.cd||30)*1000).toISOString(),jid};saveS(S);render();return}S.j[jid].cn=nx;saveS(S);render()}
function retryD(){if(S.cd&&new Date(S.cd.until)>new Date())return;S.cd=null;saveS(S);render()}
function goHub(){cleanupMaze();if(mTmr)clearInterval(mTmr);saveS(S);renderHub()}
function launchCelebration(){
    // Remove any existing particles
    document.querySelectorAll('.particle-container').forEach(e=>e.remove());
    const pc=document.createElement('div');pc.className='particle-container';document.body.appendChild(pc);
    // Gold/amber/white particles burst
    const colors=['#ffd700','#ffb700','#ff8c00','#ffffff','#4ade80','#fbbf24','#f59e0b'];
    function burst(x,y,count){
        for(let i=0;i<count;i++){
            const p=document.createElement('div');p.className='particle';
            const size=Math.random()*8+3;const angle=Math.random()*Math.PI*2;const dist=Math.random()*200+50;
            const dx=Math.cos(angle)*dist;const dy=Math.sin(angle)*dist;
            p.style.cssText=`width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${x}px;top:${y}px;animation:floatUp ${Math.random()*2+2}s ease-out forwards;transform:translate(${dx}px,${dy}px);opacity:0.9;box-shadow:0 0 ${size*2}px currentColor`;
            pc.appendChild(p);
        }
    }
    // Sparkle stars scattered across screen
    function addSparkles(){
        for(let i=0;i<20;i++){
            const s=document.createElement('div');s.className='sparkle-star';
            s.textContent=['✦','✧','⭐','💫','✨'][Math.floor(Math.random()*5)];
            s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*80}%;animation-delay:${Math.random()*3}s;font-size:${Math.random()*14+10}px;color:${colors[Math.floor(Math.random()*colors.length)]}`;
            pc.appendChild(s);
        }
    }
    // Firework sequence
    const w=window.innerWidth,h=window.innerHeight;
    burst(w*0.5,h*0.3,40);
    addSparkles();
    setTimeout(()=>burst(w*0.25,h*0.4,30),600);
    setTimeout(()=>burst(w*0.75,h*0.35,30),1200);
    setTimeout(()=>burst(w*0.5,h*0.25,50),1800);
    setTimeout(()=>burst(w*0.3,h*0.5,25),2400);
    setTimeout(()=>burst(w*0.7,h*0.45,25),3000);
    // Cleanup after animations
    setTimeout(()=>pc.remove(),8000);
}
if(JWT_TOKEN){initGame()}else{render()}

</script>
